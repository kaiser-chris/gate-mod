l_korean:
 lesson_gate_magic_research_1: "[Concept('concept_gate_magic_technology', '$concept_gate_magic_technologies$')]이란 무엇입니까?"
 lesson_gate_magic_research_1_desc: "$concept_gate_magic_technologies$은(는) #v $gg_panel_base_title$#! 패널에서 별도로 진행되는 연구 유형입니다."
 lesson_gate_magic_research_1_continue: "#v $gg_panel_base_title$#! 패널을 열어 계속 진행하십시오."
 lesson_gate_magic_research_2: "$lesson_gate_magic_research_1$"
 lesson_gate_magic_research_2_desc: "[concept_gate_magic_innovation]은 사용되기 전까지 축적되거나 최대치에 도달할 때까지 누적된다는 점에서 일반적인 [concept_innovation]과 다릅니다. 현재 축적된 [concept_gate_magic_innovation]의 양은 $gg_panel_base_title$ 패널에서 확인할 수 있습니다."
 lesson_gate_magic_research_2_back: "#v $gg_panel_base_title$#! 패널을 닫아 이전 단계로 돌아가십시오."
 lesson_gate_magic_research_2_continue: "#v $gg_panel_base_title$#! 패널을 열어 보유한 [concept_gate_magic_innovation]을 확인하십시오."
 lesson_gate_magic_research_3: "$lesson_gate_magic_research_1$"
 lesson_gate_magic_research_3_desc: "[Concept('concept_gate_magic_technology', '$concept_gate_magic_technologies$')]은 세 가지 분야로 나뉩니다: #v $PRODUCTION_NO_CONCEPT$#!, #v $MILITARY$#! 및 #v $SOCIETY$#!."
 lesson_gate_magic_research_3_continue: "#v $gg_panel_base_title$#! 패널의 #v $PRODUCTION_NO_CONCEPT$#! 탭을 열어 계속 진행하십시오."
 lesson_gate_magic_research_4: "$lesson_gate_magic_research_1$"
 lesson_gate_magic_research_4_desc: "[Concept('concept_gate_magic_technology', '$concept_gate_magic_technologies$')]은 일반 기술과 동일한 비용 구조를 따르며 시대별로 구분됩니다. 일반 기술과 달리, [Concept('concept_gate_magic_technology', '$concept_gate_magic_technologies$')]은 축적된 [concept_gate_magic_innovation]을 사용해 잠금 해제해야 합니다."
 lesson_gate_magic_research_4_back: "뒤로 돌아가려면 #v $gg_panel_base_title$#! 패널의 #v $PRODUCTION_NO_CONCEPT$#! 탭을 닫으십시오"
 lesson_gate_magic_research_4_continue: "보유 기술을 확인하려면 #v $gg_panel_base_title$#! 패널에서 #v $PRODUCTION_NO_CONCEPT$#! 탭을 여십시오."
 lesson_gate_new_arcanist_1: "새로운 [concept_gate_magic_researcher](을)를 고용하는 방법은?"
 lesson_gate_new_arcanist_1_desc: "[Concept('concept_gate_magic_researcher','$concept_gate_magic_researchers$')](은)는 [concept_gate_magic_innovation]을 생성하고 [Concept('concept_gate_project', Localize('concept_gate_projects'))]을 수행하는 데 필수적입니다."
 lesson_gate_new_arcanist_1_continue: "계속하려면 #v $POPULATION$#! 패널의 #v $NATIONAL_CAST$#! 탭을 여십시오."
 lesson_gate_new_arcanist_2: "$lesson_gate_new_arcanist_1$"
 lesson_gate_new_arcanist_2_desc: "사용 가능한 [Concept('concept_gate_magic_researcher','$concept_gate_magic_researchers$')]을 찾는 가장 좋은 방법은 검색창을 이용하는 것입니다. '$concept_gate_magic_researcher$'을 입력하면 이용 가능한 모든 인물을 확인할 수 있습니다."
 lesson_gate_new_arcanist_2_back: "뒤로 돌아가려면 #v $POPULATION$#! 패널의 #v $NATIONAL_CAST$#! 탭을 닫으십시오."
 lesson_gate_new_arcanist_2_continue: "계속하려면 #v $POPULATION$#! 패널의 #v $NATIONAL_CAST$#! 탭을 유지하십시오."
 lesson_gate_new_arcanist_3: "$lesson_gate_new_arcanist_1$"
 lesson_gate_new_arcanist_3_desc: "이제 새로운 [concept_gate_magic_researcher](을)를 우클릭한 뒤, 인물 상호작용 메뉴에서 '$gate_promote_arcanist$'을 선택하십시오."
 lesson_gate_new_arcanist_3_finish: "튜토리얼을 완료하려면 새로운 [concept_gate_magic_researcher]를 고용하십시오."