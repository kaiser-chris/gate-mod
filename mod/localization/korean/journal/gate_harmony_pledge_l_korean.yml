 gate_harmony_pledge.1.t: "한계를 모르는 열정"
 gate_harmony_pledge.1.d: "[TopScope.sS('event_state').GetName]의 [GetCulture('gnomish').GetName] 사람이 대중의 분노를 불러일으켰습니다. 이 사태를 제대로 처리하지 못하면 [concept_assimilation]이 감소합니다."
 gate_harmony_pledge.1.f: "붐비는 광장에서 한 노움이 완전히 호기심에 사로잡힌 채, 불운한 손님에게 쉴 새 없이 질문을 퍼붓고 있습니다. 개인적인 것에서 기술적인 것, 철학적인 것에 이르기까지 질문은 점점 더 사적인 영역을 침범해 가며, 예의범절 따위는 전혀 아랑곳하지 않은 채 유쾌하고도 집요하게 이어집니다. 한쪽에게는 순수한 호기심일 뿐이지만, 다른 이들에게는 공개적인 불쾌감과 불편을 초래하는 무례한 행동으로 비칩니다."
 gate_harmony_pledge.1.a: "그저 호기심이 들었을 뿐이다."
 gate_harmony_pledge.1.b: "이러한 행동을 규탄하라."
 gate_harmony_pledge.2.t: "다시 쓰인 장부"
 gate_harmony_pledge.2.d: "새로운 관리 방식은 [concept_bureaucracy] 산출량을 향상시키지만, 동시에 [concept_innovation]을 저해합니다."
 gate_harmony_pledge.2.f: "우리의 관료 조직은 감독과 자원 배분을 위한 새롭고 고도로 정교한 체계를 성공적으로 도입했습니다. 행정 효율은 정점에 이르렀으며, 관료제의 낭비는 사실상 사라졌습니다. 그러나 학계와 문화계의 고문들은 이러한 끊임없는 구조적 최적화가 자발성과 창의성을 억누르고 있으며, 그 결과 전국적으로 독립적인 연구와 창작 활동이 정체되고 있다고 보고하고 있습니다."
 gate_harmony_pledge.2.a: "이러한 새로운 경영 방식을 금지해야 한다."
 gate_harmony_pledge.2.b: "최악의 영향을 완화하라."
 gate_harmony_pledge.2.c: "그 잠재력을 마음껏 발휘해보아라."
 gate_harmony_pledge.3.t: "끝없는 정교함"
 gate_harmony_pledge.3.d: "이러한 개선은 [GetBuildingType('building_trade_center').GetName]의 [concept_throughput]을 감소시키는 한편, [GetBuildingGroup('bg_light_industry').GetName]의 [concept_throughput]을 증가시킵니다."
 gate_harmony_pledge.3.f: "우리 제조업 부문에서 올라온 보고에 따르면 장인들의 생산 활동이 전례 없이 급증하고 있습니다. 작업장들은 최대 가동률로 운영되며 국내 생산량을 새로운 수준으로 끌어올리고 있습니다. 그러나 무역 담당관들은 이러한 생산 열풍 속에서 상품 유통이 소홀해지고 있다고 경고합니다. 완성된 상품들이 국내외 시장으로 유통되지 못한 채 창고에 쌓여가고 있습니다."
 gate_harmony_pledge.3.a: "최소한의 판매 인력을 배치하라."
 gate_harmony_pledge.3.b: "최악의 영향을 완화하라."
 gate_harmony_pledge.3.c: "그 잠재력을 마음껏 발휘해보아라."
 gate_harmony_pledge.4.t: "건설 박차"
 gate_harmony_pledge.4.d: "건설에 대한 관심이 급증함에 따라 [concept_construction]의 생산량은 증가하는 반면, 전국적으로 [GetBuildingGroup('bg_agriculture').GetName]의 생산량은 감소하고 있습니다."
 gate_harmony_pledge.4.f: "전국 각지에서 올라온 보고에 따르면 건축 및 공공사업이 일제히 급증하고 있습니다. 설계자와 건설업자들은 이례적일 정도의 열의를 보이며 대대적인 재설계에 나섰고, 그 결과 건설 산출량도 크게 증가했습니다. 그러나 이에 따른 평가에서는 농업에 대한 관심이 줄어들고 있다고 지적합니다. 농경지에 배치되는 노동자 수가 감소하면서 식량 비축량에도 이미 부담의 조짐이 나타나고 있습니다."
 gate_harmony_pledge.4.a: "그들을 밭으로 보내라."
 gate_harmony_pledge.4.b: "최악의 영향을 완화하라."
 gate_harmony_pledge.4.c: "그 잠재력을 마음껏 발휘해보아라."
 gate_harmony_pledge.5.t: "지나친 이론"
 gate_harmony_pledge.5.d: "이론적 지식에 중점을 두면 [concept_innovation]은 촉진되지만 [concept_construction]은 저해됩니다."
 gate_harmony_pledge.5.f: "우리 학술 기관에서 올라온 보고에 따르면 이론 연구와 새로운 발견이 폭발적으로 증가하고 있습니다. 학자들은 전례 없는 속도로 새로운 이론을 내놓으며 국가의 지식 기반을 빠르게 확장하고 있습니다. 그러나 지방 행정관들은 실질적인 적용이 소홀해지고 있다고 경고합니다. 학계의 관심이 지나치게 추상적인 연구에 집중되면서 주요 기반 시설과 공공사업이 심각하게 지연되고 있습니다."
 gate_harmony_pledge.5.a: "연구 자금을 실용적인 응용 분야로 재조정해야 한다."
 gate_harmony_pledge.5.b: "최악의 영향을 완화하라."
 gate_harmony_pledge.5.c: "그 잠재력을 마음껏 발휘해보아라."
 gate_harmony_pledge.6.t: "추상적인 부"
 gate_harmony_pledge.6.d: "새로운 금융 수단은 [concept_investment_pool] 기여도를 증가시키지만, 우리 산업의 최대 [concept_cash_reserves]를 감소시킵니다."
 gate_harmony_pledge.6.f: "금융 지구에서 올라온 보고에 따르면 복잡한 금융 수단에 대한 관심이 갑작스럽고도 강박적으로 급증하고 있습니다. 은행가와 길드 지도자들은 투기성 계약과 투자 상품을 현기증이 날 정도의 속도로 거래하며, 국가 수입과 자본의 흐름을 크게 증가시키고 있습니다. 그러나 실물 산업 부문에서는 심각한 자본 유출을 경고하고 있습니다. 자금이 장부상의 부에 지나치게 몰리면서 실제 제조업과 중공업이 정체되고 있습니다."
 gate_harmony_pledge.6.a: "의무 최저 지급준비금 적립 비율을 인상하라."
 gate_harmony_pledge.6.b: "최악의 영향을 완화하라."
 gate_harmony_pledge.6.c: "그 잠재력을 마음껏 발휘해보아라."
 gate_harmony_pledge.7.t: "지하에 대한 집착"
 gate_harmony_pledge.7.d: "[GetBuildingGroup('bg_extraction').GetName] 산업에 대한 집착은 [concept_throughput]을 증가시키지만, 동시에 [GetBuildingGroup('bg_plantations').GetName] 산업의 [concept_throughput] 감소를 초래합니다."
 gate_harmony_pledge.7.f: "변경 지역에서 올라온 보고에 따르면 자원 채굴이 대규모로, 그리고 조직적으로 가속되고 있습니다. 광부들과 기술자들은 공격적인 신형 굴착 기술을 도입해 원광과 광물을 우리의 비축고에 쏟아붓고 있습니다. 그러나 지방 행정관들은 이러한 무분별한 채굴이 지역 생태계를 교란하고 있다고 경고합니다. 경작지가 파헤쳐지고 수원이 다른 곳으로 돌려지면서, 플랜테이션의 농업 생산량이 급격히 감소하고 있습니다."
 gate_harmony_pledge.7.a: "우리의 자원 채굴 산업이 주변 경작지를 보존하도록 의무화해야 한다."
 gate_harmony_pledge.7.b: "최악의 영향을 완화하라."
 gate_harmony_pledge.7.c: "그 잠재력을 마음껏 발휘해보아라."
 gate_harmony_pledge.8.t: "수출용 작물 열풍"
 gate_harmony_pledge.8.d: "[GetBuildingGroup('bg_plantations').GetName] 산업에 대한 집착은 [concept_throughput]을 증가시키지만, 동시에 [GetBuildingGroup('bg_agriculture').GetName] 산업의 [concept_throughput] 감소를 초래합니다."
 gate_harmony_pledge.8.f: "농업 지역에서 올라온 보고에 따르면 수익성 높은 수출 작물에 대한 집착이 광범위하게 퍼지고 있습니다. 플랜테이션 농업이 막대한 부를 보장한다는 갑작스럽고 열광적인 믿음에 이끌린 지주들과 농촌 공동체들은 주식용 작물을 갈아엎고 향신료, 커피, 고무를 재배하는 데 열을 올리고 있습니다. 무역 담당관들은 수출 수입이 급증하고 있다고 보고하지만, 지방 행정관들은 마을 시장에서 식량이 점차 사라지고 있다며 심각한 식량 부족이 임박할 수 있다고 경고하고 있습니다."
 gate_harmony_pledge.8.a: "농장당 최소 식량 생산량을 설정하라."
 gate_harmony_pledge.8.b: "최악의 영향을 완화하라."
 gate_harmony_pledge.8.c: "그 잠재력을 마음껏 발휘해보아라."
 gate_harmony_pledge.9.t: "농업 안보"
 gate_harmony_pledge.9.d: "[GetBuildingGroup('bg_agriculture').GetName] 산업에 대한 집착은 [concept_throughput]을 증가시키지만, 동시에 [GetBuildingGroup('bg_plantations').GetName] 산업의 [concept_throughput] 감소를 초래합니다."
 gate_harmony_pledge.9.f: "농촌 지역 전반에 반동적인 움직임이 뿌리내리고 있으며, 식량 안보와 자급자족에 대한 강렬한 집단적 집착이 이를 이끌고 있습니다. 농민들과 지역 지도자들은 뿌리채소와 곡물의 수확량을 극대화하기 위해 상업용 플랜테이션의 생산을 체계적으로 줄이고 있습니다. 국가의 곡물 비축고는 넘쳐나고 국내 식량 사정도 개선되고 있지만, 플랜테이션 생산량은 급감했습니다."
 gate_harmony_pledge.9.a: "식량 생산에 대한 유인을 줄여 플랜테이션 생산량을 늘려라."
 gate_harmony_pledge.9.b: "최악의 영향을 완화하라."
 gate_harmony_pledge.9.c: "그 잠재력을 마음껏 발휘해보아라."
 gate_harmony_pledge.10.t: "직조된 기념비"
 gate_harmony_pledge.10.d: "문화적 기념비는 우리의 [concept_gate_harmony_pledge_society]를 향상시킵니다."
 gate_harmony_pledge.10.f: "우리 장인들 사이에서 아름답고 자발적인 협업이 이루어졌습니다. 인간 조각가들과 노움 기술자들은 새로운 대형 공공 누각을 건설하는 데 열정적으로 힘을 쏟았습니다. 이 건축물은 토착 인간 전통의 깊은 영성과 유려한 목공예를 노움식 설계의 정교하고 수학적인 태엽 장치와 완벽하게 조화시켰습니다. 이 경이로운 건축물은 조화 서약을 물질적으로 구현한 상징으로 우뚝 서며, 전국적으로 시민적 자긍심과 문화적 위신을 드높이고 있습니다."
 gate_harmony_pledge.10.a: "정말 멋지군."
 gate_harmony_pledge.11.t: "원치 않는 질문"
 gate_harmony_pledge.11.d: "이 문화적 사건을 신중하게 처리하지 않으면 [GetReligion('gate_harmony_pledge').GetNameNoIcon](으)로의 [concept_conversion]이 감소합니다."
 gate_harmony_pledge.11.f: "최근 거행된 조상 제례와 관련해 인간 종교 지도자들로부터 격렬한 항의가 들어왔습니다. 강렬하고 통제되지 않은 호기심에 이끌린 노움 학자 무리가 엄숙한 의식에 참석했지만, 이를 마치 풀어야 할 흥미로운 수수께끼처럼 다루었습니다. 이들은 기도 도중 쉴 새 없이 질문을 쏟아냈고, 신성한 유물의 치수를 재려 했으며, 의식용 불의 특성을 두고 큰 소리로 논쟁하기까지 했습니다. 악의에서 비롯된 행동은 아니었지만, 이러한 공격적인 세속적 호기심은 전통주의자들에게 깊은 모욕감을 안겼으며 사회적 조화를 훼손했습니다."
 gate_harmony_pledge.11.a: "이건 안 좋은데."
 gate_harmony_pledge.11.b: "이러한 행동을 규탄하라."
 gate_harmony_pledge.12.t: "서약의 포기"
 gate_harmony_pledge.12.d: "[TopScope.sL('atheism_law').GetName]을 제정하면 [concept_gate_harmony_pledge]을 포기하게 됩니다. 이는 파국적인 결과를 초래할 것입니다."
 gate_harmony_pledge.12.f: "의회에서 올라온 보고에 따르면, 조화 서약의 완전한 폐기를 요구하는 급진적 행정관들의 연합이 점차 세력을 키우고 있습니다. 이들은 우리의 세심한 사회 조율이 진정한 잠재력을 억누르는 족쇄에 불과하다고 주장하며, 타고난 극단적 성향들이 아무런 제약 없이 발현되도록 허용할 것을 요구하고 있습니다. 고문들은 이 제안을 논의하는 것만으로도 단기적으로 파국적인 결과를 초래할 수 있다고 경고하고 있습니다."
 gate_harmony_pledge.12.a: "포기하는 것이 최선이다."
 gate_harmony_pledge.12.b: "이 문제에 대해 한번 생각해 보겠다."
 gate_harmony_pledge.13.t: "서약의 회복"
 gate_harmony_pledge.13.d: "우리는 [concept_gate_harmony_pledge]의 가르침을 다시 받아들였습니다."
 gate_harmony_pledge.13.f: "통제되지 않은 극단으로 인한 피로가 마침내 국가를 휩쓴 열기를 가라앉혔습니다. 전국 각지에서 시민과 행정관 모두가 조화 서약이 추구하던 의도적이고 균형 잡힌 사회 설계로 돌아갈 것을 요구하고 있습니다."
 gate_harmony_pledge.13.a: "우리는 조화를 위해 최선을 다할 것이다."
 gate_harmony_pledge.14.t: "토지 쟁탈전"
 gate_harmony_pledge.14.d: "토지 쟁탈전은 [concept_pop_growth]을 증가시키지만, 동시에 [concept_generated_pollution]도 크게 증가시킵니다."
 gate_harmony_pledge.14.f: "고수익의 노움식 농업 도구를 손에 넣은 인간 농가들은 정글 깊숙한 곳까지 빠르게 농지를 확장하고 있습니다. 광대한 토지를 확보하고 대가족에게 상당한 유산을 남기려는 인간 특유의 욕망에 이끌려, 이들은 놀라운 속도로 울창한 땅을 개간하고 있습니다. 이러한 야심은 인구 증가와 원자원 채굴의 폭발적인 증가를 이끌고 있지만, 동시에 우리의 영토 계획을 크게 흐트러뜨리고 조화 서약이 유지하고자 하는 생태적 균형까지 위협하고 있습니다."
 gate_harmony_pledge.14.a: "자연 보호 구역을 지정하라."
 gate_harmony_pledge.14.b: "최악의 영향을 완화하라."
 gate_harmony_pledge.14.c: "그 잠재력을 마음껏 발휘해보아라."
 gate_harmony_pledge.15.t: "정령주의 공학"
 gate_harmony_pledge.15.d: "정령주의는 [GetReligion('gate_harmony_pledge').GetNameNoIcon](으)로의 [concept_conversion]을 감소시키고, 동시에 우리 [GetCulture('gnomish').GetName] 노동자들의 [Concept('concept_radical', '$concept_radicalism$')]을 증가시킵니다."
 gate_harmony_pledge.15.f: "인간 노동자들은 노움의 산업 기계를 자신들의 정령신앙 체계에 직접 받아들이기 시작했습니다. 거대한 증기기관과 태엽식 직조기를 강력한 지역 정령이 깃든 그릇으로 여기고 있는 것입니다. 공장 바닥은 이제 풍성한 꽃 공양물로 장식되고, 기계에는 신성한 기하학 문양이 정성스럽게 그려지고 있습니다. 이러한 아름다운 문화적 융합은 노동자들 사이에 강한 충성심과 결속력을 만들어냈습니다. 그러나 인간 작업자들이 \"불길한\" 날에는 기계를 가동하려 하지 않고, 정령의 노여움을 살 수 있다며 최적 속도로 운전하는 것조차 완강히 거부하면서 노움 기술자들은 골머리를 앓고 있습니다."
 gate_harmony_pledge.15.a: "해당 관행을 금지해야 한다."
 gate_harmony_pledge.15.b: "최악의 영향을 완화하라."
 gate_harmony_pledge.15.c: "그 잠재력을 마음껏 발휘해보아라."
 gate_harmony_pledge.16.t: "강제된 혼돈"
 gate_harmony_pledge.16.d: "[TopScope.sCha('event_character').GetFullName](이)가 [TopScope.sPM('event_movement').GetNameNoIcon]을 창설했습니다."
 gate_harmony_pledge.16.f: "새로 결성된 정치 운동에 관한 보고가 수도에 도착했습니다. 이 운동은 절대적 무정부 상태와 타협 없는 권위주의적 통제를 결합해야 한다고 공개적으로 주장하는 한 노움 사상가가 이끌고 있습니다. 이 세력은 공개 선언을 통해 국가와 모든 공식 제도의 완전한 해체를 요구하는 동시에, 이러한 \"순수한\" 무법 상태를 유지하기 위해 영구적이고 군사화된 강제 집행 기구가 필요하다고 주장하고 있습니다."
 gate_harmony_pledge.16.a: "뭐라고?"
