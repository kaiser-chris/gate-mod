 gate_harmony_pledge.1.t: "한계를 모르는 열정" #deepl:3398040805
 gate_harmony_pledge.1.d: "[TopScope.sS('event_state').GetName]에 등장한 ‘[GetCulture('gnomish').GetName]’ 캐릭터가 대중의 분노를 불러일으켰습니다. 이 분노는 제대로 대처하지 못할 경우 [concept_assimilation]의 인기가 떨어질 수 있습니다." #deepl:767208063
 gate_harmony_pledge.1.f: "붐비는 광장에서, 완전히 매료된 한 그놈이 불운한 방문객에게 쏟아지는 듯한 질문을 퍼붓는다. 사적인 것부터 기술적, 철학적 질문까지, 점점 더 사생활을 침해하는 방향으로 이어지는 이 질문들은 유쾌한 열기를 띠며 예의 따위는 아랑곳하지 않고 이어진다. 어떤 이에게는 순수한 호기심으로 비칠지 모르지만, 다른 이들에게는 공공장소에서 사생활을 침해하는 행위로 여겨진다." #deepl:978833871
 gate_harmony_pledge.1.a: "그저 호기심이 들었을 뿐이에요." #deepl:1356077208
 gate_harmony_pledge.1.b: "이러한 행동을 규탄하십시오." #deepl:2455540265
 gate_harmony_pledge.2.t: "『레저』 재구성" #deepl:686309308
 gate_harmony_pledge.2.d: "새로운 경영 방식은 [concept_bureaucracy]의 생산성을 높여주지만, 동시에 [concept_innovation]의 활기를 저해하기도 한다." #deepl:1040782432
 gate_harmony_pledge.2.f: "우리 공무원은 매우 정교한 새로운 감독 및 배분 시스템을 성공적으로 도입했습니다. 행정 효율성은 최고 수준에 달했으며, 관료적 낭비는 사실상 전무합니다. 그러나 학계 및 문화계 자문위원들은 이러한 끊임없는 구조적 최적화가 주도권을 억누르고 있어, 전국적으로 독립적인 연구와 창의적인 활동이 정체되고 있다고 보고하고 있습니다." #deepl:2507388011
 gate_harmony_pledge.2.a: "이러한 새로운 경영 방식을 금지해야 한다." #deepl:2819019753
 gate_harmony_pledge.2.b: "최악의 영향을 완화하십시오." #deepl:410557116
 gate_harmony_pledge.2.c: "그 잠재력을 마음껏 발휘해 보세요." #deepl:2727038369
 gate_harmony_pledge.3.t: "끝없는 정교함" #deepl:1065897276
 gate_harmony_pledge.3.d: "이러한 개선으로 [GetBuildingType('building_trade_center').GetName] [concept_throughput]의 성능이 향상되는 동시에 [GetBuildingGroup('bg_light_industry').GetName] [concept_throughput]의 성능도 향상됩니다." #deepl:2944350912
 gate_harmony_pledge.3.f: "제조업 현장의 보고에 따르면 장인 활동이 전례 없는 수준으로 급증하고 있는 것으로 나타났습니다. 작업장들은 최대 가동률을 기록하며 국내 생산량을 사상 최고 수준으로 끌어올리고 있습니다. 그러나 무역 장관들은 이러한 열기 속에서 상업적 유통이 소홀해지고 있다고 경고합니다. 완제품들이 국내외 시장에 유통되지 못하고 창고에 쌓여만 가고 있기 때문입니다." #deepl:1479994007
 gate_harmony_pledge.3.a: "판매 직원의 최소 배정 인원을 지정하십시오." #deepl:2053133893
 gate_harmony_pledge.3.b: "최악의 영향을 완화하십시오." #deepl:410557116
 gate_harmony_pledge.3.c: "그 잠재력을 마음껏 발휘해 보세요." #deepl:2727038369
 gate_harmony_pledge.4.t: "건설 캠페인" #deepl:1868878426
 gate_harmony_pledge.4.d: "건축에 대한 관심이 급증함에 따라 ‘[concept_construction]’의 생산량은 증가하는 반면, 전국적으로 ‘[GetBuildingGroup('bg_agriculture').GetName]’의 생산량은 감소하고 있다." #deepl:2253421195
 gate_harmony_pledge.4.f: "전국 각지에서 전해지는 보고에 따르면, 건축 및 공공 사업이 조직적으로 급증하고 있는 것으로 나타났습니다. 기획자와 건설업자들은 이례적으로 적극적인 태도로 대대적인 재설계를 추진하고 있으며, 그 결과 건설 생산량이 급격히 증가했습니다. 그러나 이와 함께 발표된 평가 보고서에 따르면 농업에 대한 관심이 줄어들면서 농장에 투입되는 노동자가 감소했고, 식량 비축량에 부담이 가해지기 시작한 초기 징후가 나타나고 있습니다." #deepl:2088678352
 gate_harmony_pledge.4.a: "그들을 밭으로 보내세요." #deepl:4018618871
 gate_harmony_pledge.4.b: "최악의 영향을 완화하십시오." #deepl:410557116
 gate_harmony_pledge.4.c: "그 잠재력을 마음껏 발휘해 보세요." #deepl:2727038369
 gate_harmony_pledge.5.t: "지나친 이론" #deepl:3548768388
 gate_harmony_pledge.5.d: "이론적 지식에 중점을 두는 것은 [concept_innovation]을 촉진하지만, [concept_construction]을 저해한다." #deepl:3715153279
 gate_harmony_pledge.5.f: "국내 학술 기관들의 보고에 따르면, 이론적 연구와 발견이 폭발적으로 증가하고 있는 것으로 나타났습니다. 학자들은 전례 없는 속도로 새로운 이론을 제시하며, 우리 국가의 지식 기반을 급속히 확장시키고 있습니다. 그러나 각 지방 자치단체장들은 실질적인 실행이 소홀히 다루어지고 있다고 경고하고 있습니다. 지적 관심이 전적으로 추상적인 영역으로 쏠리면서, 주요 인프라 및 공공 사업들이 심각한 지연을 겪고 있기 때문입니다." #deepl:1215646789
 gate_harmony_pledge.5.a: "연구 자금을 실용적인 응용 분야로 재조정해야 한다." #deepl:403732231
 gate_harmony_pledge.5.b: "최악의 영향을 완화하십시오." #deepl:410557116
 gate_harmony_pledge.5.c: "그 잠재력을 마음껏 발휘해 보세요." #deepl:2727038369
 gate_harmony_pledge.6.t: "추상적 부" #deepl:3374874366
 gate_harmony_pledge.6.d: "새로운 금융 상품은 ‘[concept_investment_pool]’ 기여도를 높이지만, 우리 업계의 ‘[concept_cash_reserves]’ 상한선을 낮춥니다." #deepl:805899902
 gate_harmony_pledge.6.f: "금융권에서 전해지는 소식에 따르면, 복잡한 금융 상품에 대한 갑작스럽고도 극심한 열풍이 불고 있는 것으로 나타났습니다. 은행가들과 금융계 지도자들은 어지러울 정도로 빠른 속도로 투기성 계약과 투자를 주고받으며, 국가 세수와 자본 유동을 급격히 늘리고 있습니다. 그러나 실물 산업계는 심각한 자본 유출을 경고하고 있습니다. 자금이 전적으로 명목상의 부로 유출되면서, 제조업과 중공업 등 실물 경제가 정체되고 있기 때문입니다." #deepl:2095828964
 gate_harmony_pledge.6.a: "법정 최소 적립금 납입액을 인상한다." #deepl:3977047276
 gate_harmony_pledge.6.b: "최악의 영향을 완화하십시오." #deepl:410557116
 gate_harmony_pledge.6.c: "그 잠재력을 마음껏 발휘해 보세요." #deepl:2727038369
 gate_harmony_pledge.7.t: "지하 집착" #deepl:101694213
 gate_harmony_pledge.7.d: "[GetBuildingGroup('bg_extraction').GetName] 산업에 대한 집착은 [concept_throughput]을 증가시키지만, 동시에 [GetBuildingGroup('bg_plantations').GetName] 산업에 대한 [concept_throughput]을 감소시키기도 한다." #deepl:927365228
 gate_harmony_pledge.7.f: "전선에서 전해지는 소식에 따르면, 자원 채굴이 대규모로, 조직적으로 가속화되고 있는 것으로 나타났습니다. 광부들과 엔지니어들은 공격적인 새로운 채굴 기법을 도입하여, 원광과 광물들이 비축 창고를 넘쳐나게 하고 있습니다. 그러나 지방 행정관들은 이러한 무분별한 채굴이 지역 생태계를 교란시키고 있다고 경고합니다. 경작지가 훼손되고 수원이 우회되면서, 우리 농장의 농작물 수확량이 급격히 감소하고 있습니다." #deepl:4159305287
 gate_harmony_pledge.7.a: "우리의 자원 채굴 산업이 주변 경작지를 보존하도록 의무화해야 한다." #deepl:77699677
 gate_harmony_pledge.7.b: "최악의 영향을 완화하십시오." #deepl:410557116
 gate_harmony_pledge.7.c: "그 잠재력을 마음껏 발휘해 보세요." #deepl:2727038369
 gate_harmony_pledge.8.t: "수출용 작물 열풍" #deepl:1069755938
 gate_harmony_pledge.8.d: "[GetBuildingGroup('bg_plantations').GetName] 산업에 대한 집착은 [concept_throughput]를 증가시키지만, 동시에 [GetBuildingGroup('bg_agriculture').GetName] 산업에 대한 [concept_throughput]을 감소시키기도 한다." #deepl:288115478
 gate_harmony_pledge.8.f: "농업 지역들의 보고에 따르면, 수익성이 높은 수출 작물에 대한 광범위한 집착이 나타나고 있다. 대규모 농장 경영이 막대한 부를 보장한다는 갑작스럽고 열광적인 믿음에 이끌려, 지주들과 농촌 공동체들은 주곡 작물을 서둘러 뽑아내고 향신료, 커피, 고무를 심고 있다. 무역 장관들은 수출 수입이 급증하고 있다고 보고하는 반면, 지역 행정관들은 마을 시장이 텅 비기 시작했다고 경고하며, 임박한 식량 부족에 대한 심각한 우려를 제기하고 있다." #deepl:2362294843
 gate_harmony_pledge.8.a: "농장당 최소 식량 생산량을 설정하십시오." #deepl:1576472696
 gate_harmony_pledge.8.b: "최악의 영향을 완화하십시오." #deepl:410557116
 gate_harmony_pledge.8.c: "그 잠재력을 마음껏 발휘해 보세요." #deepl:2727038369
 gate_harmony_pledge.9.t: "농업 안보" #deepl:288080293
 gate_harmony_pledge.9.d: "[GetBuildingGroup('bg_agriculture').GetName] 산업에 대한 집착은 [concept_throughput]을 증가시키지만, 동시에 [GetBuildingGroup('bg_plantations').GetName] 산업에 대한 [concept_throughput]을 감소시키기도 한다." #deepl:3228164820
 gate_harmony_pledge.9.f: "식량 안보와 자급자족에 대한 강렬하고 집단적인 집착에 힘입어, 농촌 전역에 반동적인 움직임이 확산되고 있다. 농민들과 지역 지도자들은 뿌리채소와 곡물의 수확량을 극대화하기 위해 상업용 농장의 생산량을 체계적으로 줄이고 있다. 국가 곡물 창고는 넘쳐나고 국내 식량 공급 상황은 개선되고 있지만, 농장 생산량은 급감했다." #deepl:3116472441
 gate_harmony_pledge.9.a: "식량 생산을 억제함으로써 농장 생산량을 늘린다." #deepl:2902570733
 gate_harmony_pledge.9.b: "최악의 영향을 완화하십시오." #deepl:410557116
 gate_harmony_pledge.9.c: "그 잠재력을 마음껏 발휘해 보세요." #deepl:2727038369
 gate_harmony_pledge.10.t: "엮인 기념비" #deepl:6943227
 gate_harmony_pledge.10.d: "문화유산은 우리의[concept_gate_harmony_pledge_society]을 높여줄 것입니다." #deepl:4054858405
 gate_harmony_pledge.10.f: "우리 장인들 사이에서 아름답고 자연스러운 협업이 이루어졌습니다. 인간 조각가들과 그놈 공학자들은 웅장한 새로운 공공 파빌리온을 짓기 위해 온 힘을 다해 매진해 왔습니다. 이 건축물은 인간 고유의 전통에서 비롯된 심오하고 영적인 유려한 목공예와, 그놈족 디자인 특유의 정교하고 수학적인 시계 장치가 완벽하게 조화를 이루고 있습니다. 이 건축적 경이로움은 ‘조화의 서약’을 물리적으로 구현한 것으로, 전국에 걸쳐 시민의 자부심과 문화적 위상을 고취시키고 있습니다." #deepl:548123886
 gate_harmony_pledge.10.a: "정말 멋지네요." #deepl:2942415708
 gate_harmony_pledge.11.t: "원치 않는 문의" #deepl:3472512289
 gate_harmony_pledge.11.d: "이 문화적 사태를 신중하게 다루지 않으면, ‘[concept_conversion]’는 ‘[GetReligion('gate_harmony_pledge').GetNameNoIcon]’로 전락할 것입니다." #deepl:1581847826
 gate_harmony_pledge.11.f: "최근 열린 조상 제사와 관련해 인간 영적 지도자들로부터 격렬한 항의를 받았습니다. 노미족 학자 일행이 지나치게 강렬하고 통제되지 않은 호기심에 이끌려 엄숙한 의식에 참석했으나, 이를 상호작용형 퍼즐처럼 취급했습니다. 그들은 기도가 진행되는 도중 연달아 쏟아지는 질문으로 의식을 방해하고, 신성한 유물을 측정하려 시도했으며, 의식용 불의 특성에 대해 큰 소리로 논쟁을 벌였습니다. 악의는 없었겠지만, 이러한 공격적인 세속적 호기심은 전통주의자들을 깊이 모욕시켰고 사회적 화합을 해쳤습니다." #deepl:489344487
 gate_harmony_pledge.11.a: "이건 안 좋은데." #deepl:2087564719
 gate_harmony_pledge.11.b: "이러한 행동을 규탄하십시오." #deepl:2455540265
 gate_harmony_pledge.12.t: "서약 포기" #deepl:3780230732
 gate_harmony_pledge.12.d: "‘[TopScope.sL('atheism_law').GetName]’ 법안이 제정되면 우리는 ‘[concept_gate_harmony_pledge]’를 포기하게 될 것입니다. 이는 재앙적인 결과를 초래할 것입니다." #deepl:3068637803
 gate_harmony_pledge.12.f: "의회에서 전해지는 보고에 따르면, ‘조화 서약’을 완전히 폐기할 것을 요구하는 급진적인 치안 판사들의 연합이 점점 확대되고 있는 것으로 드러났다. 이들은 우리의 세심한 사회적 조정이 진정한 잠재력을 억누르는 감옥과 다름없다고 주장하며, 우리의 타고난 극단적 성향이 아무런 제약 없이 마음껏 꽃피울 수 있도록 허용해야 한다고 요구하고 있다. 자문위원들은 이 안건을 검토하는 것만으로도 단기적으로 재앙적인 결과를 초래할 것이라고 경고하고 있다." #deepl:3395286884
 gate_harmony_pledge.12.a: "그것을 포기하는 것이 최선이다." #deepl:2265107712
 gate_harmony_pledge.12.b: "이 문제에 대해 한번 생각해 봅시다." #deepl:2399731022
 gate_harmony_pledge.13.t: "서약의 재확립" #deepl:1485235099
 gate_harmony_pledge.13.d: "우리는 ‘[concept_gate_harmony_pledge]’의 가르침을 다시 받아들였습니다." #deepl:2063420038
 gate_harmony_pledge.13.f: "통제되지 않은 극단주의로 인한 피로감이 마침내 이 나라의 열기를 가라앉혔다. 전국 각지에서 시민과 관리들이 모두 ‘조화 서약’이 제시한 신중한 구상으로의 회귀를 요구하고 있다." #deepl:2354966606
 gate_harmony_pledge.13.a: "우리는 조화를 위해 헌신합니다." #deepl:2290051607
 gate_harmony_pledge.14.t: "토지 쟁탈전" #deepl:4201529643
 gate_harmony_pledge.14.d: "토지 쟁탈전은 [concept_pop_growth]를 상승시킬 뿐만 아니라, [concept_generated_pollution]도 대폭 증가시킬 것입니다." #deepl:2567934868
 gate_harmony_pledge.14.f: "고수익을 내는 그놈족 농기구의 힘을 빌려, 인간 농경 가문들은 정글 깊숙한 곳까지 농장을 빠르게 확장하고 있다. 광활한 토지를 확보하고 대가족에게 막대한 유산을 남기려는 인간 특유의 욕구에 이끌려, 그들은 놀라운 속도로 울창한 땅을 개간하고 있습니다. 이러한 야망은 인구 증가와 원자재 채굴에 엄청난 호황을 가져오고 있지만, 동시에 우리의 영토 계획을 완전히 뒤흔들고 있으며, ‘서약’이 유지하고자 하는 생태적 균형을 위협하고 있습니다." #deepl:2383172291
 gate_harmony_pledge.14.a: "자연 보호 구역을 지정한다." #deepl:3058232922
 gate_harmony_pledge.14.b: "최악의 영향을 완화하십시오." #deepl:410557116
 gate_harmony_pledge.14.c: "그 잠재력을 마음껏 발휘해 보세요." #deepl:2727038369
 gate_harmony_pledge.15.t: "정령주의 공학" #deepl:1278909608
 gate_harmony_pledge.15.d: "애니미즘 신념은 ‘[concept_conversion]’을 ‘[GetReligion('gate_harmony_pledge').GetNameNoIcon]’로 낮추고, ‘[GetCulture('gnomish').GetName]’ 근로자들의 ‘[Concept('concept_radical', '$concept_radicalism$')]’을 증가시킵니다." #deepl:2042378649
 gate_harmony_pledge.15.f: "인간 노동자들은 거대한 증기 기관과 시계 태엽 직기를 강력한 지역 정령이 깃든 그릇으로 여기며, 그놈족의 산업 기계들을 자신들의 정령 숭배 체계에 직접 통합하기 시작했습니다. 이제 공장 바닥은 무성한 꽃 제물로 장식되어 있으며, 기계들에는 신성한 기하학적 문양이 정교하게 그려져 있다. 이러한 아름다운 문화적 융합은 노동자들 사이에 강한 충성심과 단결을 불러일으켰다. 그러나 인간 조작자들이 “불길한” 날이나 영혼을 화나게 할 수 있는 최적의 속도로 기계를 가동하는 것을 단호히 거부하고 있어, 그놈족 엔지니어들은 머리를 쥐어뜯고 있다." #deepl:196278460
 gate_harmony_pledge.15.a: "해당 관행을 금지해야 한다." #deepl:3854349238
 gate_harmony_pledge.15.b: "최악의 영향을 완화하십시오." #deepl:410557116
 gate_harmony_pledge.15.c: "그 잠재력을 마음껏 발휘해 보세요." #deepl:2727038369
 gate_harmony_pledge.16.t: "강제된 혼돈" #deepl:3726813281
 gate_harmony_pledge.16.d: "[TopScope.sCha('event_character').GetFullName] [TopScope.sPM('event_movement').GetNameNoIcon]를 설립했다." #deepl:1840134710
 gate_harmony_pledge.16.f: "절대적 무정부주의와 타협 없는 권위주의적 통제의 융합을 공개적으로 주창하는 그놈족 이데올로그가 이끄는 신생 정치 운동에 대한 보고가 수도에 전해졌다. 이 파벌은 공개 성명을 통해 국가와 모든 공식 기관의 완전한 해체를 촉구하는 한편, 이러한 “순수한” 무법 상태를 유지하기 위해 영구적이고 군사화된 집행 기구의 필요성을 강조하고 있다." #deepl:1348690011
 gate_harmony_pledge.16.a: "뭐라고요?" #deepl:1732307125
