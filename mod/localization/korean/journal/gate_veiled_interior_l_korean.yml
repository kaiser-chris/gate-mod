 je_gate_veiled_interior_phase_early_contact: "단계: #v 초기 접촉#!"
 je_gate_veiled_interior_phase_diplomacy: "단계: #v 협상#!"
 sb_gate_veiled_interior_expedition: "탐사 개시"
 sb_gate_veiled_interior_expedition_desc: "뉴기니 내륙으로 탐험을 떠나봅시다."
 sb_gate_veiled_interior_expedition_possible: "현재 현장에서 진행 중인 탐사 활동은 #bold 없음#!"
 sb_gate_veiled_interior_scout: "내부 둘러보기"
 sb_gate_veiled_interior_scout_desc: "이제 내부로 통하는 확실한 경로가 확보되었으니, 이 지역을 정찰해야 합니다."
 sb_gate_veiled_interior_scout_possible: "현재 현장에서 활동 중인 정찰대가 #bold 없습니다#!"
 je_gate_veiled_interior_diplomacy_title: "합병 협상"
 je_gate_veiled_interior_diplomacy_discussions: "토론"
 je_gate_veiled_interior_diplomacy_alignment: "성향"
 je_gate_veiled_interior_diplomacy_implementation: "실행"
 je_gate_veiled_interior_diplomacy_tooltip: "#header $je_gate_veiled_interior_diplomacy_title$#!\n이 협상은 #bold 단계#!와 #bold 국면#!을 거쳐 진행됩니다. 매주 단계 진행도가 상승하며, 진행도가 완료되면 일정 확률로 이벤트가 발생합니다. 이러한 이벤트는 협상을 다음 국면으로 진전시키거나, 논의를 몇 달간 교착 상태에 빠뜨리거나, 성공 확률과 교착 확률을 변경할 수 있습니다."
