 sb_gate_veiled_interior_expedition_desc: "뉴기니 내륙으로 탐험을 떠나보세요." #deepl:3655904432
 sb_gate_veiled_interior_expedition_possible: "현재 현장에서 진행 중인 탐사 활동은 #bold 에서 진행 중이며, #!에서는 진행되지 않습니다." #deepl:3909284354
