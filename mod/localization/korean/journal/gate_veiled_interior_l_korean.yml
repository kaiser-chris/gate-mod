l_korean:
 je_gate_veiled_interior: "가려진 내부"
 je_gate_veiled_interior_reason: "뉴 사마도레의 정착된 해안 너머에는 '장막의 내륙'이라 불리는 광대한 지역이 펼쳐져 있습니다. 울창한 밀림과 점차 높아지는 고지대로 이루어진 이곳은 지금까지 의미 있는 진출을 모두 막아내 왔습니다. 최초의 [GetCulture('gnomish').GetName] 이주민들은 해안의 [GetBuildingType('building_gate_eastern_new_guinea').GetName]을 통해 도착했으며, 이후 정착지는 항해가 가능한 해안과 강줄기를 따라 확산되었습니다. 그러나 더 깊은 내륙은 여전히 베일에 싸여 있습니다. 그 지형은 아직 지도에 제대로 기록되지 않았으며, 현지의 환경과 조건 역시 거의 알려져 있지 않습니다."
 je_gate_veiled_interior_lobby: "$je_gate_veiled_interior_reason$"
 je_gate_veiled_interior_tooltip: "#header $je_gate_veiled_interior$#!\n$je_gate_veiled_interior_reason$"
