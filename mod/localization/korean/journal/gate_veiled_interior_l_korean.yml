 je_gate_veiled_interior_reason: "뉴 사마도어의 정착지가 형성된 해안 너머에는 ‘베일드 인테리어’가 펼쳐져 있는데, 이곳은 울창한 정글과 솟아오른 고원 지대가 광활하게 펼쳐진 지역으로, 지금까지 그 어떤 실질적인 침입도 허용하지 않은 곳이다. [GetCulture('gnomish').GetName]의 첫 정착민들은 해안가의 [GetBuildingType('building_gate_eastern_new_guinea').GetName]를 통해 들어왔으며, 그곳에서부터 항해 가능한 해안과 강을 따라 정착지가 확산되었다. 그러나 내륙 깊숙한 곳은 여전히 베일에 싸여 있으며, 지형은 미개척 상태이고 그곳의 상황은 제대로 파악되지 않고 있다." #deepl:2120754377
