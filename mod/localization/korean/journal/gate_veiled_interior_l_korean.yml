 modifier_veiled_interior_diplomacy_appeasement_cost: "유화 정책의 대가"
 modifier_veiled_interior_diplomacy_speed_reduction: "교착 상태에 빠진 협상"
 modifier_veiled_interior_diplomacy_speed_increase: "협상 속도 향상"
 modifier_gate_veiled_interior_social_harmony: "개척적 조화"
