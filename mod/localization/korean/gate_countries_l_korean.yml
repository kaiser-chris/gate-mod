l_korean:
 GATE_AD: "아크투리안 연방"
 GATE_AD_ADJ: "아크투리안"
 GATE_AD_FLAVOR_TEXT: "잠비아의 문을 통해 등장한 엘프들은 $GATE_AD$에서 빠르고 강력한 세력으로 자리잡았습니다. 룬다의 왕국들은 계급 체계를 차용하여, 그들은 자신의 지배를 강화하기 위해 괴뢰 국가들의 질서를 구축했습니다. 그들의 영향력을 확장하면서, 그들은 츠와나 지역을 보호국으로 통합하며 외교와 복속을 결합했습니다. 포르투갈과 영국 식민지와의 국경 충돌은 그들의 결단력을 시험했지만, 동시에 그들의 교활하고 결단력 있는 이미지를 확립하는 데 기여했습니다."
 GATE_MK: "민 라이티아"
 GATE_MK_ADJ: "라이티아"
 GATE_ME: "임페리움 래티움"
 GATE_ME_ADJ: "라이티아"
 GATE_MK_FLAVOR_TEXT: "$GATE_MK$는 알프스에 정착한 드워프 국가로, $BAV$과 동군연합을 맺고 있습니다. $GATE_MK$는 알프스를 모두 지배하려는 목표를 가지고 있어서 갈등이 일고 있지만, 지구의 강대국들과의 통합 정책을 따르며 무역을 통한 관계 증진에 힘쓰고 있습니다."
 GATE_OK: "오크 패권국"
 GATE_OK_ADJ: "오크"
 GATE_OK_FLAVOR_TEXT: "$GATE_OK$는 아프리카에 위치한 잔혹하고 권위주의적인 국가로, 오크 지배층이 다른 모든 종족을 지배하고 노예화하고 있습니다. 이 나라의 정부는 오크를 최상위에 두는 인종 위계 질서 위에 세워져 있으며, 다른 모든 집단은 철저히 복종하도록 강요받습니다. $GATE_OK$는 $GATE_AD$와 적대적인 관계를 유지하고 있습니다."
 GATE_NS: "뉴 사마도레"
 GATE_NS_ADJ: "사마도레"
 GATE_NS_FLAVOR_TEXT: "뉴기니의 울창한 자연 속에 자리 잡은 $GATE_NS$국가는, 이주해 온 노움들과 토착 인간 공동체 사이의 공존을 위한 의도적이고 지속적인 실험의 장으로 존재하고 있습니다. 이들의 평화로운 통합은 [GetReligion('gate_harmony_pledge').GetNameNoFormatting]에 의해 뒷받침되고 있으며, 이는 본래 노움 특유의 눈부시지만 불안정한 극단적 성향을 완화하기 위해 설계된 근본적인 체계입니다."
 dwarf_army: "1. 산악 방위대"
 GATE_BN: "우르살리스 콩코드"
 GATE_BN_ADJ: "우르살리시아"
 GATE_BN_FLAVOR_TEXT: "한때 분열되어 있던 $gate_arctic_ogre$ 씨족들이 하나로 뭉쳐 탄생한 $GATE_BN$는, 역경 속에서 이루어진 통합의 상징입니다. 안카리스의 얼어붙은 황무지에서 단련되고, 생존을 위한 오랜 투쟁 속에서 다져진 이 곰인간들의 국가는 중앙집권적 구조 속에서도 씨족 전통을 깊이 간직하고 있습니다. 이들은 고대의 삶의 방식을 지키는 동시에, 마법이 지배하는 새로운 세계에서 자신들의 자리를 확고히 하려 하고 있습니다."
