l_korean:
 # Western Europe
 gate_dungeon_dunmorrach: "던모라크" #deepl:2031928291
 gate_dungeon_dunmorrach_desc: "회색빛 바다 호수 위로 솟은 곶 위에는, 어느 씨족도 세웠다는 기억이 없는 브로크의 잔해가 서 있는데, 그 마른 돌로 쌓은 벽은 사람의 키보다 조금 더 높을 뿐입니다. 하지만 그 낮고 유일한 출입구를 통과하면 벽은 거기서 끝나지 않는다. 던모라크는 아치형 홀과 경비실, 그리고 언덕 아래에 다 들어갈 수 없을 만큼 거대한 성채의 층층을 뚫고 내려가는 나선형 계단으로 이어진다. 탐험가들은 지칠 줄 모르는 갑옷을 입은 파수꾼들, 어느 부족의 색도 아닌 깃발들, 그리고 맨 아래층에 있는 거대한 홀에 대해 이야기한다. 그곳에는 차가운 화로가 항상 놓여 있지만, 결코 불이 피워진 적은 없다." #deepl:4281529389
 building_gate_dungeon_dunmorrach: "$gate_dungeon_dunmorrach$ $concept_gate_dungeon$" #deepl:2239800222
 gate_dungeon_oldewaard: "올데와르드" #deepl:3036865142
 gate_dungeon_oldewaard_desc: "썰물 때 제방에서 꽤 멀리 떨어진 와덴 갯벌 위, 살아있는 사람들의 기억 속에는 마을이 한 번도 서 있지 않았던 진흙 속에서 벽돌로 지어진 교회 첨탑의 끝이 솟아 있다. 썰물 때면 종탑 문이 진흙 위로 살짝 드러나는데, 그 문을 통해 올라간 사람들은 종실이 아니라, 박공 지붕의 집들과 물에 잠긴 골목길, 잡초로 뒤덮인 운하가 있는 침수된 마을로 뻗어 내려가는 나선형 계단을 발견하게 된다. 밀물은 그 안의 홀까지 닿지 않지만, 모든 거리는 물에 잠겨 있고, 물 아래에서는 무언가가 움직이고 있다. 갯벌을 가로질러 돌아오는 길을 잘못 잡은 이들은, 그 지하 감옥이 지닌 위험에 닿기도 훨씬 전에 바다의 위협에 직면하게 된다." #deepl:3116362586
 building_gate_dungeon_oldewaard: "$gate_dungeon_oldewaard$ $concept_gate_dungeon$" #deepl:2752632048

 # Southern Europe
 gate_dungeon_mongibello: "몽기벨로" #deepl:3300345789
 gate_dungeon_mongibello_desc: "에트나 산의 검은 산비탈 높은 곳, 오래된 용암 흐름들 사이에는 산 속으로 수십 걸음 정도만 이어질 법한 용암 동굴이 훨씬 더 깊숙이 뻗어 있다. 이 산의 옛 시칠리아어 이름에서 유래한 ‘몽지벨로’는 현무암 터널과 빛나는 마그마 통로로 이루어진 지하 감옥과도 같은 곳으로, 공기는 열기로 일렁이고 발밑의 돌은 결코 가만히 있지 않는다. 이곳의 주민들은 재와 슬래그로 이루어진 존재들이며, 아래층은 동굴이라기보다 대장간을 닮았다고 전해진다. 마치 결코 오지 않을 대장장이를 기다리는 듯, 흑요석으로 된 모루들이 줄지어 서 있다." #deepl:928496763
 building_gate_dungeon_mongibello: "$gate_dungeon_mongibello$ $concept_gate_dungeon$" #deepl:775273922
 gate_dungeon_grieta_blanca: "그리에타 블랑카" #deepl:3435846042
 gate_dungeon_grieta_blanca_desc: "아라곤 피레네 산맥의 높은 고개 근처, 몬테 페르디도 산의 산기슭 아래에는 석회암에 파인 좁은 틈이 있어 한여름에도 차가운 공기가 스며나온다. 목동들은 이곳을 고개가 눈이 녹은 지 한참이 지나도 눈이 오랫동안 남아 있는 곳으로 줄곧 알고 있었지만, 첫 번째 굽이를 지나면 ‘그리에타 블랑카(Grieta Blanca, 흰 틈)’는 산이 감당할 수 있을 법한 규모를 훨씬 뛰어넘는 얼어붙은 미로로 펼쳐진다: 얼어붙은 폭포, 푸른 얼음 방, 그리고 바닥이 투명한 얼음으로 덮인 동굴들이 펼쳐지는데, 탐험가들은 부츠 밑에 갇힌 형체들까지 훤히 볼 수 있을 정도다." #deepl:3994533572
 building_gate_dungeon_grieta_blanca: "$gate_dungeon_grieta_blanca$ $concept_gate_dungeon$" #deepl:679395740

 # Balkans
 gate_dungeon_cetatea_neagra: "체타테아 네아그라" #deepl:1396550911
 gate_dungeon_cetatea_neagra_desc: "남부 카르파티아 산맥의 숲이 우거진 산등성이에는 어떤 연대기에도 등장하지 않는 요새의 그을린 성벽이 서 있으며, 성문 탑은 온전하게 남아 있고 안뜰은 너도밤나무 묘목들로 가득 차 있다. 아래 계곡에 있는 마을 사람들은 이곳을 ‘체타테아 네아그라(Cetatea Neagra)’, 즉 ‘검은 성채’라고 부르며, 가축들을 이곳에서 멀리 떨어뜨려 둔다. 성문 탑을 지나면 전형적인 지하 감옥이 펼쳐진다. 횃불로 밝혀진 복도, 병영, 감방, 예배당이 층층이 쌓여 있으며, 갑옷을 입은 죽은 자들로 구성된 수비대와 살아있는 누구도 내린 적이 없는 명령을 따르는 사소한 공포들이 이곳을 순찰하고 있다." #deepl:1351207754
 building_gate_dungeon_cetatea_neagra: "$gate_dungeon_cetatea_neagra$ $concept_gate_dungeon$" #deepl:2608092798
 gate_dungeon_labyrinthos: "라비린토스" #deepl:982357348
 gate_dungeon_labyrinthos_desc: "메사라 평원 남쪽의 언덕에는 크레타 사람들이 오랫동안 ‘미로’라고 불러온 오래된 채석장 터널들이 자리 잡고 있는데, 이는 바위를 깎아 만든 통로들이 미로처럼 얽혀 있어 한때 전설 속의 바로 그 미로로 여겨지기도 했다. 그 통로 중 하나는 옛 지도에 표시된 끝 지점을 지나서도 계속 이어진다. 그 너머로 라비린토스는 창백한 석회암으로 이루어진 자연 동굴과 물방울이 떨어지는 통로, 그리고 다른 어떤 알려진 지하 감옥보다도 방문할 때마다 더 쉽게 형태를 바꾸는 갈래 터널들을 따라 구불구불 이어진다. 탐험가들은 더 깊은 층에서 뿔 달린 짐승들을 목격했다고 전하며, 반은 농담 삼아 이곳이 정확히 어떤 이야기를 모방하고 있는지 알고 있다고 주장한다." #deepl:992872001
 building_gate_dungeon_labyrinthos: "$gate_dungeon_labyrinthos$ $concept_gate_dungeon$" #deepl:2861721661

 # Central Europe
 gate_dungeon_tiefburg: "티프부르크" #deepl:1233845556
 gate_dungeon_tiefburg_desc: "[GetStateRegion('STATE_TYROL').GetName]에 위치한 [GetBuildingType('building_gate_tyrol').GetName] 위의 석회암 동굴 깊숙이 자리 잡은 #bold $gate_dungeon_tiefburg$#!은 게이트 자체와 함께 발생한 [concept_gate_mana_density]의 급증으로 인해 형성된 것으로 여겨집니다. 산비탈로 헤매던 염소를 쫓아가던 지역 목동들이 처음으로 입구를 발견했고, 그 너머에 무엇이 있는지 처음으로 보고했습니다. 동굴 입구로 들어서면 돌로 된 홀, 쇠창살이 쳐진 감방, 그리고 구불구불한 복도가 펼쳐지는데, 지상 어디에도 성의 유적은 없음에도 불구하고 마치 오래된 성의 본관처럼 보였습니다." #deepl:2659547242
 building_gate_dungeon_tiefburg: "$gate_dungeon_tiefburg$ $concept_gate_dungeon$" #deepl:3655843781
 gate_dungeon_silbergrund: "실버그룬트" #deepl:3109519749
 gate_dungeon_silbergrund_desc: "기록이 남아 있는 한 가장 오래전부터 은이 채굴되어 온 오어 산맥에서, 한 광산 마을 위쪽에 있는 버려진 갱도는 광부들의 손으로 파낸 터널을 따라 산비탈 속으로 이어진다. 마지막 도구 자국을 지나면 그 수로는 ‘실버그룬트(Silbergrund)’가 된다. 이곳은 반짝이는 광맥이 뻗어 있는 거대한 자연 동굴 군락으로, 지하 호수와 램프 빛이 닿을 수 있는 범위를 훨씬 넘어 어둠 속으로 뻗어 내려가는 수직 갱도들이 어우러져 있다. 노련한 광부들은 산이 자신에게서 빼앗긴 것을 되돌려주고 있다고 말하며, 이 지하 감옥의 상자들은 실제로 광석으로 가득 차 있지만, 그 상자들을 지키는 존재들은 그 어떤 광부 못지않게 잘 파고 터널을 더 잘 알고 있다." #deepl:1787057676
 building_gate_dungeon_silbergrund: "$gate_dungeon_silbergrund$ $concept_gate_dungeon$" #deepl:2817468898

 # Northern Europe
 gate_dungeon_surtsdjup: "수르츠듐" #deepl:2412711665
 gate_dungeon_surtsdjup_desc: "서부 고원의 용암 지대에는, 옛 사가들이 무스펠헤임에서 북쪽으로 내려온 불의 거인과, 그 거인의 그늘에 숨어 지내던 무법자들이 있던 동굴들에 대해 전하고 있다. ‘수르트의 심연’이라 불리는 수르츠듐(Surtsdjúp)은 바로 그런 용암 동굴 중 하나에서 시작되는데, 동굴 천장이 곳곳에서 무너져 내려 회색 하늘이 드러나 있다. 동굴 안쪽으로 더 들어가면, 이곳은 평범한 용암 동굴과는 달리 차가워지기보다는 점점 더 뜨거워지며, 결국 벽이 붉게 달아오르고 물이 흐를 법한 곳에는 녹아내린 암석의 강이 흐르게 된다. 탐험가들은 이곳을 북부 지역에서 가장 위험한 던전 중 하나로 꼽으며, 깊은 층으로 내려갈수록 불에서 태어난 생물들의 크기도 점점 더 커지는 듯하다." #deepl:959981999
 building_gate_dungeon_surtsdjup: "$gate_dungeon_surtsdjup$ $concept_gate_dungeon$" #deepl:338466721
 gate_dungeon_svartisgapet: "스바르티스가페트" #deepl:2712059456
 gate_dungeon_svartisgapet_desc: "오래된 얼음이 너무 조밀해 거의 검은색으로 보일 정도인 스바르티센(Svartisen)의 거대한 빙하 아래, 피오르드 위에 뻗어 있는 빙하 혀가 갈라져 현지인들이 ‘스바르티스가페트(Svartisgapet)’라고 부르는 어두운 틈이 생겼습니다. 그곳을 지나가는 어부들은 이 틈이 숨을 쉬는 것 같다고 말합니다. 해질 무렵에는 공기를 들이마시고, 새벽이 되면 내뱉는다고 합니다. 그 안에는 검은색과 파란색이 어우러진 얼음 동굴이 펼쳐져 있으며, 동굴 벽에는 돌과 통나무, 그리고 걸음을 멈추지 않은 채 얼어붙은 생물들의 윤곽이 박혀 있다. 그중 일부는 겉보기만큼 완전히 얼어붙지 않은 상태이기도 하다." #deepl:2957806218
 building_gate_dungeon_svartisgapet: "$gate_dungeon_svartisgapet$ $concept_gate_dungeon$" #deepl:1048494313

 # Russia
 gate_dungeon_ledyanoy_zev: "레디아노이 제브" #deepl:693399934
 gate_dungeon_ledyanoy_zev_desc: "우랄 산맥 서부의 실바 강을 따라 펼쳐진 석고 언덕들은 일 년 내내 얼음이 남아 있는 동굴들로 뚫려 있다. ‘얼음의 입’이라 불리는 레디아노이 제브(Ledyanoy Zev)는 이러한 언덕 중 하나에 위치해 있으며, 깨지면 한 시간도 채 되지 않아 다시 자라나는 고드름의 장막 뒤에 자리 잡고 있다. 동굴 내부에는 사람의 손바닥만 한 서리 결정들이 모든 표면에 자라나 있고, 동굴 곳곳은 얼어붙은 호수로 가득 차 있으며, 추위는 침입자들을 단순히 둘러싸기보다는 마치 그들을 쫓아오는 듯하다. 이곳의 주민들은 일행의 체온을 감지해 사냥하는 창백한 존재들이다." #deepl:3842498266
 building_gate_dungeon_ledyanoy_zev: "$gate_dungeon_ledyanoy_zev$ $concept_gate_dungeon$" #deepl:2479745820
 gate_dungeon_kitezh: "키테즈" #deepl:3987445434
 gate_dungeon_kitezh_desc: "스베틀로야르 호수는 작고 둥글며 깊는데, 이 지역 주민들이 기억하는 한 호수 밑에는 성스러운 도시가 잠들어 있다고 전해져 왔다. 그 도시는 물속 깊이 숨겨져 적들의 눈을 피하고 있으며, 고요한 밤이면 여전히 종소리가 울려 퍼진다고 한다. 키테즈는 순례자들이 예상치 못했던 지하 감옥과도 같은 곳이다. 호숫가에서 물속으로 곧장 이어지는 하얀 돌계단을 따라 내려가면, 일행은 발을 적시지 않고 호수 아래에 잠긴 교회와 성벽, 나무 거리로 이루어진 도시로 들어갈 수 있다. 종소리는 실제로 울려 퍼집니다. 그러나 돌아온 사람 중 그 종을 울리는 것이 무엇인지 명확히 본 사람은 아무도 없습니다." #deepl:1575134297
 building_gate_dungeon_kitezh: "$gate_dungeon_kitezh$ $concept_gate_dungeon$" #deepl:3484290287

 # Eastern Europe
 gate_dungeon_qara_qoba: "카라 코바" #deepl:968467120
 gate_dungeon_qara_qoba_desc: "크림 산맥의 높은 카르스트 고원 지대에 위치한 야일라 목초지에는 싱크홀과 수직 동굴이 곳곳에 흩어져 있는데, 대부분은 수심이 얕아 그곳에서 양 떼를 방목하는 목동들에게 잘 알려져 있다. ‘카라 코바(검은 동굴)’는 예전부터 존재해 왔지만, 이렇게 깊어진 적은 없었던 싱크홀이다. 동굴 입구 아래로 한 일행이 내려가자, 대리석처럼 하얀 동굴실과 커튼 모양의 석순, 끝없이 갈라져 나가는 물방울이 떨어지는 통로들이 펼쳐진 세계가 나타났다. 더 깊은 층에는 창백한 뱀들이 서식하며, 자신의 목소리가 아닌 다른 목소리로 메아리가 돌아온다고 전해진다." #deepl:2583201247
 building_gate_dungeon_qara_qoba: "$gate_dungeon_qara_qoba$ $concept_gate_dungeon$" #deepl:3751218621
 gate_dungeon_glebia_solna: "글레비아 솔나" #deepl:2214265771
 gate_dungeon_glebia_solna_desc: "크라쿠프 남쪽 지하에는 수 마일에 걸쳐 소금 광산이 뻗어 있으며, 여러 세대에 걸친 광부들이 회색빛이 도는 녹색 암염으로 채굴한 광실들은 예배당, 홀, 계단 등으로 조성되어 있다. ‘글레비아 솔나(Glebia Solna)’, 즉 ‘소금의 심연’은 그러한 광산 중 하나의 잊혀진 측갱에서 시작된다. 그곳의 홀들은 자연적으로 형성된 것보다는 조각된 듯한 모습을 띠고 있으며, 소금 기둥과 조각상, 수정 샹들리에가 놓여 있지만, 광부의 도구가 이를 건드린 흔적은 전혀 없다. 더 깊은 층은 광산이라기보다 거대한 소금 궁전을 닮았는데, 그곳에는 소금과 돌로 만들어진 형상들이 주둔하고 있는데, 이들은 때리면 부서지지만 내버려 두면 다시 제자리를 찾는다." #deepl:4231820527
 building_gate_dungeon_glebia_solna: "$gate_dungeon_glebia_solna$ $concept_gate_dungeon$" #deepl:4135015187

 # Nile Basin
 gate_dungeon_ta_djeser: "타-제세르" #deepl:4200652703
 gate_dungeon_ta_djeser_desc: "나일강 서안의 사막 언덕, 이집트의 옛 왕들이 바위를 깎아 무덤을 만들었던 그곳에, 어떤 측량사도 기록하지 않았고 어떤 도굴꾼도 훑어가지 않은 무덤 입구가 하나 있다. 그 입구에는 익숙한 신과 왕들의 형상이 새겨져 있지만, 그들의 이름이 적혀 있어야 할 카르투슈는 비어 있다. 고대 이집트어로 ‘신성한 묘지’를 뜻하는 이름에서 유래한 ‘타-제세르’는 별들로 장식된 복도와 기둥이 늘어선 홀, 봉인된 석관이 쌓여 있는 매장실, 그리고 구덩이로 끝나는 가짜 통로들을 따라 내려간다. 이곳을 지키는 수호자들은 천으로 감싸인 채 인내심 있게 기다리고 있으며, 관 속에만 머물러 있지는 않는다." #deepl:3216497228
 building_gate_dungeon_ta_djeser: "$gate_dungeon_ta_djeser$ $concept_gate_dungeon$" #deepl:3412278458
 gate_dungeon_deriba: "데리바" #deepl:941347023
 gate_dungeon_deriba_desc: "제벨 마라는 다르푸르의 메마른 평원 한가운데서 시원한 경사면과 개울, 계단식 논이 어우러진 푸른 섬처럼 솟아 있으며, 그 정상에는 쌍둥이 분화구 호수를 품은 데리바 칼데라가 자리 잡고 있다. 칼데라의 안쪽 벽에는, 따뜻한 공기 한 줄기 정도만 뿜어낼 법한 균열이 검은 바위와 연기가 피어오르는 통로로 이어지는 지하 감옥 같은 공간으로 열려 있다. 데리바는 주변 지역보다 훨씬 더 뜨겁고, 그 지층을 녹아내린 암석의 강과 끓어오르는 진흙 웅덩이가 가로지르며, 그 안의 생명체들은 살과 살갗만큼이나 재로 이루어져 있다." #deepl:235246290
 building_gate_dungeon_deriba: "$gate_dungeon_deriba$ $concept_gate_dungeon$" #deepl:1282355718

 # North Africa
 gate_dungeon_qabr_ar_raml: "카브르 아르-람르" #deepl:2955713711
 gate_dungeon_qabr_ar_raml_desc: "사하라의 광활한 모래 바다 깊은 곳에서는 모래 언덕이 바람에 따라 움직이며, 때로는 오랫동안 묻혀 있던 것들을 드러내기도 한다. ‘모래의 무덤’이라 불리는 카브르 아르-람르(Qabr ar-Raml)는 우뚝 솟은 모래 언덕 기슭에 위치한 사암으로 된 문으로, 양쪽에는 바람에 얼굴이 닳아 없어진 풍화된 조각상들이 서 있다. 이곳을 지나는 캐러밴들은 다른 곳에서 낙타에게 물을 먹인다. 문 뒤로는 모래로 반쯤 채워진 기둥 회랑, 매장실, 그리고 잊혀진 신들을 모신 신전을 지나 지하로 이어지는 매몰된 홀들의 미로가 펼쳐져 있으며, 그곳에서는 말만 한 크기의 전갈들이 보석으로 가득 찬 상자들을 지키고 있다." #deepl:2287891589
 building_gate_dungeon_qabr_ar_raml: "$gate_dungeon_qabr_ar_raml$ $concept_gate_dungeon$" #deepl:3934485644
 gate_dungeon_tazrout: "타즈루트" #deepl:3723949154
 gate_dungeon_tazrout_desc: "아틀라스 산맥의 높은 곳, 호두나무와 계단식 보리밭이 펼쳐진 계곡 위에는 붉은 벽의 카스바가 우뚝 서 있는데, 마을 사람들은 이곳이 그들의 할아버지의 할아버지가 태어나기도 전부터 버려진 곳이라고 말한다. 탑들은 무너져 내리고 안뜰은 텅 비어 있지만, 중앙 탑의 계단을 따라 내려가면 타즈루트(Tazrout)가 나타난다. 이곳은 돌로 된 복도, 경비실, 감방으로 이루어진 지하 감옥으로, 위쪽의 흙으로 지어진 요새보다 훨씬 더 크고 오래된 느낌을 준다. 갑옷을 입은 전사들로 구성된 주둔군은 상비군 못지않은 규율을 갖추고 싸우며, 이들을 과소평가하는 원정대는 두 번째 방어선을 넘기조차 드물다." #deepl:1903513982
 building_gate_dungeon_tazrout: "$gate_dungeon_tazrout$ $concept_gate_dungeon$" #deepl:3679621244

 # West Africa
 gate_dungeon_tellemkoro: "텔렘코로" #deepl:1595410917
 gate_dungeon_tellemkoro_desc: "반디아가라 절벽을 따라, 작은 주거지와 곡물 창고들이 절벽면에 매달려 있는데, 이는 현재 마을 주민들보다 먼저 이곳에 살았던 사람들이 남긴 것으로, ‘텔레름’이라는 이름으로만 기억되고 있다. 오래된 절벽 주거지들 중 한 곳의 출입구는 얕은 방으로 통하는 것이 아니라 바위 속으로 이어진다. 텔레메코로는 마른 사암 동굴과 좁은 굴뚝, 그리고 지하 깊숙이까지 닿아서는 안 될 햇살이 비추는 메아리 치는 거대한 방들을 지나 아래로 내려간다. 그 안의 생물들은 빠르고 민첩하게 기어오르는 능력을 지녔으며, 이 던전은 평평한 지형보다는 가파른 절벽을 선호한다." #deepl:3343970160
 building_gate_dungeon_tellemkoro: "$gate_dungeon_tellemkoro$ $concept_gate_dungeon$" #deepl:4199357389
 gate_dungeon_igbo_ojiji: "이그보 오지지" #deepl:2036664417
 gate_dungeon_igbo_ojiji_desc: "요루바족의 숲 속에는 신성한 숲이 따로 지정되어 손대지 않은 채로 남겨져 있으며, 그곳의 나무들은 결코 베어지지 않습니다. ‘그림자의 숲’이라는 뜻의 이그보 오지지(Igbo Ojiji)도 그런 숲 중 하나로, 나무들의 가지와 잎이 빽빽하게 얽혀 햇빛이 땅에 닿지 않을 정도이며, 두 그루의 거대한 이로코 나무 사이로 난 오솔길은 숲 자체가 이끄는 곳이 아닌 어딘가로 이어집니다. 그 안에는 습한 정글과 덩굴로 뒤덮인 신전, 고요하고 검은 물이 고인 웅덩이들이 있는 열대 지하 감옥 같은 곳이 펼쳐져 있는데, 이곳에서는 나무들조차 지켜보는 듯하고 동물들은 밖에서 보는 어떤 것보다 훨씬 더 거대하다." #deepl:3624009545
 building_gate_dungeon_igbo_ojiji: "$gate_dungeon_igbo_ojiji$ $concept_gate_dungeon$" #deepl:979097870

 # Equatorial Africa
 gate_dungeon_mokele: "모켈레" #deepl:305888647
 gate_dungeon_mokele_desc: "나무들이 너무나 빽빽하게 자라 여행자가 며칠을 걸어도 하늘을 볼 수 없는 이투리 숲에서, 숲의 주민들은 강물이 거꾸로 흐르는 곳에 대해 이야기한다. 모켈레가 바로 그곳이다. 느리게 흐르는 갈색 강의 한 구불구불한 구간에서, 물은 거대한 나무의 뿌리 쪽에서 멀어지는 대신 그 뿌리 아래의 움푹 패인 곳으로 흘러든다. 그 너머의 지하 감옥은 덥고 습한 정글의 층층이 얽힌 곳이자, 물에 잠긴 숲과 무성하게 자란 계단식 지대로 이루어져 있으며, 거대한 파충류와 우글거리는 곤충들, 그리고 시야에서 간신히 벗어난 수관층에서 움직이는 존재들이 서식하는 곳이다." #deepl:1052680998
 building_gate_dungeon_mokele: "$gate_dungeon_mokele$ $concept_gate_dungeon$" #deepl:1270369155
 gate_dungeon_shimo_la_shaba: "시모 라 샤바" #deepl:2537917738
 gate_dungeon_shimo_la_shaba_desc: "카탕가의 언덕들은 구리가 워낙 풍부하여, 곳곳에서 맨땅이 초록빛으로 물들어 있을 정도이며, 그곳 주민들은 외부인들이 구리를 찾아오기 훨씬 전부터 이 금속을 제련해 주괴로 만들어 왔습니다. ‘구리 광산’이라는 뜻의 시모 라 샤바는 언덕 중턱에 파인 갱도로, 벽면은 말라카이트로 뒤덮여 있으며, 깊은 곳으로는 녹색과 파란색 광맥이 뻗어 있는 동굴로 이어진다. 이곳의 주민들은 판갑옷처럼 칼날을 막아내는 피부를 지녔으며, 이 지하 감옥의 상자들은 구리와 그와 함께 발견되는 희귀 금속들로 인해 무엇보다도 귀중하게 여겨진다." #deepl:2227666926
 building_gate_dungeon_shimo_la_shaba: "$gate_dungeon_shimo_la_shaba$ $concept_gate_dungeon$" #deepl:2023524341

 # Southern Africa
 gate_dungeon_diepkloof: "디프클루프" #deepl:2379273050
 gate_dungeon_diepkloof_desc: "하이벨드의 돌로마이트 언덕에는 싱크홀과 동굴이 곳곳에 흩어져 있으며, 그중 다수는 오래전에 그곳으로 떨어진 동물들의 뼈로 가득 차 있다. ‘딥클루프(Diepkloof, 깊은 계곡)’는 숲이 우거진 협곡에서 시작되는데, 그곳의 동굴 입구는 어둠 속으로 뿌리를 뻗은 야생 무화과나무에 반쯤 가려져 있다. 동굴 안에는 부서지기 쉬운 유석으로 가득 찬 건조한 동굴과 뼈로 뒤덮인 방들, 그리고 어떤 밧줄로도 닿을 수 없을 만큼 깊게 뚫린 수직 통로들이 있다. 이 지하 감옥은 유난히 매복을 좋아하며, 탐험대원들은 램프의 불빛이 가장 희미해질 때까지 어둠 속에서 참을성 있게 기다리는 야수들에 대해 이야기한다." #deepl:676433498
 building_gate_dungeon_diepkloof: "$gate_dungeon_diepkloof$ $concept_gate_dungeon$" #deepl:3241779130
 gate_dungeon_bone_shoal: "본 쇼얼" #deepl:2122321929
 gate_dungeon_bone_shoal_desc: "나미브 사막이 차가운 대서양과 만나는, 안개가 자욱한 스켈레톤 해안에는 고래 뼈와 난파된 배의 목재들이 해변 곳곳에 흩어져 있다. 한 척의 난파선이 모래 언덕 사이 내륙 깊숙이 자리 잡고 있는데, 선체는 모래에 반쯤 파묻혀 있고 화물창은 ‘본 쇼얼’로 이어져 내려간다. 믿기 어려울 정도로 사막 아래에는 물에 잠긴 도시가 자리 잡고 있다. 물에 잠긴 거리, 가라앉은 홀, 그리고 어두운 물속에서 따개비가 붙은 돌기둥들이 솟아오른 조수 웅덩이들이 있다. 학자들은 이를 던전의 테마가 주변 지형과 전혀 무관하다는 가장 확실한 증거로 꼽는다." #deepl:746469498
 building_gate_dungeon_bone_shoal: "$gate_dungeon_bone_shoal$ $concept_gate_dungeon$" #deepl:2728653656

 # East Africa
 gate_dungeon_suswa: "수스와" #deepl:1121828613
 gate_dungeon_suswa_desc: "수스와 산은 그레이트 리프트 밸리의 바닥에서 이중 분화구를 가진 화산으로 솟아오르는데, 바깥쪽 분화구에는 초원이 고리 모양으로 펼쳐져 있고, 안쪽 분화구에는 깊은 해자로 둘러싸인 바위 섬이 자리 잡고 있다. 산 비탈면에는 바부들이 햇볕을 피하는 용암 동굴들이 뻗어 있으며, 그중 한 곳의 통로는 끝없이 아래로 뻗어 내려가며, 녹아내린 암석의 굉음과 함께 점점 더 뜨거워지고 시끄러워진다. 수스와 지하 감옥은 온통 검은 현무암과 불로 이루어져 있으며, 용암 폭포가 터널을 비추고, 마치 산 자체에서 빚어낸 듯한 생물들이 이곳을 순찰하고 있다." #deepl:3025099889
 building_gate_dungeon_suswa: "$gate_dungeon_suswa$ $concept_gate_dungeon$" #deepl:3314654564
 gate_dungeon_debre_sela: "데브레 셀라" #deepl:104059016
 gate_dungeon_debre_sela_desc: "라스타 고원지대에는 단단한 붉은 바위를 깎아내려 아래쪽으로 파낸 교회들이 있는데, 지붕은 지면과 수평을 이루고 벽은 깊은 도랑 속에 서 있다. ‘바위의 산’이라는 뜻의 데브레 셀라는, 그런 도랑 바닥에 새겨진 문으로, 어떤 석공도 만들 수 없었던 자연의 작품이다. 그 아래로는 바위를 깎아 만든 홀과 기둥이 서 있는 방, 믿기 힘들 정도로 정교하게 깎아낸 좁은 통로들로 이루어진 지하 감옥이 뻗어 있으며, 이곳은 침묵하는 돌로 된 파수꾼들이 지키고 있다. 층이 깊어질수록 그 조각들은 예배의 장소라기보다는 궁전을 더 닮아간다." #deepl:3118331721
 building_gate_dungeon_debre_sela: "$gate_dungeon_debre_sela$ $concept_gate_dungeon$" #deepl:2088913079

 # Indochina
 gate_dungeon_prasat_khmoch: "프라삿 크모치" #deepl:3101704102
 gate_dungeon_prasat_khmoch_desc: "거대한 호수 북쪽의 숲 속에는 고대 사원 도시의 유적들이 정글에 반쯤 삼켜진 채 놓여 있는데, 탑에는 고요한 얼굴들이 새겨져 있고 안뜰은 목매는 무화과나무에 갈라져 있다. ‘유령 사원’이라 불리는 프라삿 크모치는 내부 신전이 뿌리 속으로 내려가는 계단으로 이어지는 성소이다. 그 아래에는 무성하게 자란 통로와 정글로 뒤덮인 안뜰, 물에 잠긴 테라스로 이루어진 열대 지하 감옥이 펼쳐져 있으며, 모든 벽면에서는 돌로 조각된 얼굴들이 지켜보고 있다. 내부 정글은 바깥의 정글보다 더 생동감 넘치며, 일행이 지나온 길을 따라 다시 자라나 길을 덮어버린다." #deepl:531780270
 building_gate_dungeon_prasat_khmoch: "$gate_dungeon_prasat_khmoch$ $concept_gate_dungeon$" #deepl:1091091520
 gate_dungeon_hang_may: "항 메이" #deepl:2920479820
 gate_dungeon_hang_may_desc: "안남과 라오스 사이의 석회암 산맥에서 강물은 지하로 사라지며 세계에서 가장 거대한 동굴들 중 일부로 흘러들어갑니다. ‘행 마이(Hang May)’, 즉 ‘구름 동굴’은 그 규모가 워낙 방대하여 천장 아래에 구름이 형성되고, 무너져 내린 채광창을 통해 들어오는 빛 아래 정글이 자라날 정도인 강 동굴입니다. 마지막 채광구를 지나면 동굴은 거대한 동굴실과 지하 강, 그리고 논처럼 층층이 쌓인 방해석 테라스로 이루어진 지하 미로로 변한다. 이곳은 이 지역에서 가장 깊은 지하 미로이며, 이곳에 들어가는 탐험대는 지하에서 보낼 수 주간의 일정을 미리 계획한다." #deepl:2677258461
 building_gate_dungeon_hang_may: "$gate_dungeon_hang_may$ $concept_gate_dungeon$" #deepl:1971472896

 # Indonesia
 gate_dungeon_kawah_biru: "카와 비루" #deepl:2341330508
 gate_dungeon_kawah_biru_desc: "자바 동부의 이젠 고원에서는 유황 채굴자들이 연기가 자욱한 분화구 속으로 내려가, 산성 녹색 호수 옆의 분출구에서 노란색 껍질을 떼어냅니다. 밤이 되면 분출구에서 섬뜩한 푸른 불꽃이 타오르는데, 그중에는 ‘카와 비루(Kawah Biru, 푸른 분화구)’라고 불리는 균열이 있으며, 이곳의 불은 결코 꺼지지 않습니다. 푸른 불꽃 너머에는 화산암과 유황 웅덩이, 숨 막히는 연기가 가득한 지하 감옥 같은 곳이 펼쳐져 있는데, 그곳의 열기는 공기 중에 떠도는 독기와 맞먹을 정도다. 그곳에서 살아남은 광부들은 일행이 들어올 때마다 푸른 불꽃이 더욱 밝게 타오른다고 단언한다." #deepl:3351373770
 building_gate_dungeon_kawah_biru: "$gate_dungeon_kawah_biru$ $concept_gate_dungeon$" #deepl:739126202
 gate_dungeon_rimba_sunyi: "림바 수이" #deepl:1410927264
 gate_dungeon_rimba_sunyi_desc: "보르네오 내륙 깊숙한 곳의 열대우림은 결코 고요하지 않습니다. 곤충과 새, 유인원들이 밤낮으로 이곳을 소음으로 가득 채웁니다. ‘림바 수니(Rimba Sunyi)’, 즉 ‘고요한 숲’은 유일하게 그들이 잠잠해지는 곳으로, 움푹 패인 빈터를 둘러싼 고대의 디프테로카르프 나무들이 원형으로 서 있는 이곳에서는 어떤 소리도 들리지 않고 아무것도 움직이지 않습니다. 빈터로 내려가는 오솔길은 거대한 양치식물, 통만큼이나 큰 파리잡이풀, 그리고 걸을 수 있을 만큼 굵은 덩굴이 우거진 열대 밀림의 지하 감옥으로 이어진다. 그 침묵은 일행을 따라 내려가는 내내 함께한다." #deepl:1962332652
 building_gate_dungeon_rimba_sunyi: "$gate_dungeon_rimba_sunyi$ $concept_gate_dungeon$" #deepl:4045363020

 # South China
 gate_dungeon_jiulong_dong: "지우롱 동" #deepl:2357239086
 gate_dungeon_jiulong_dong_desc: "광시(廣西)의 강을 따라 석회암 봉우리들이 논밭 위로 이빨처럼 솟아 있는데, 거의 모든 봉우리가 속이 비어 있다. ‘구룡동(九龍洞)’이라 불리는 이 동굴은 이러한 봉우리 중 하나의 수면 선에서 시작되며, 배를 타야만 들어갈 수 있다. 동굴의 첫 번째 방들에는 뱃사공들이 말하길, 몸을 웅크린 용을 닮았다는 종유석들이 매달려 있다. 그곳을 지나면 광활한 동굴과 석림, 지하 호수가 펼쳐진 미로 같은 공간이 나타나는데, 이곳을 가로지르는 아홉 개의 갈래 통로는 두 번 다시 같은 길로 이어지지 않는다." #deepl:255988436
 building_gate_dungeon_jiulong_dong: "$gate_dungeon_jiulong_dong$ $concept_gate_dungeon$" #deepl:3983717192
 gate_dungeon_wuliang_lin: "우량 린" #deepl:1368735261
 gate_dungeon_wuliang_lin_desc: "윈난성 최남단에서는 열대 우림이 라오스와 미얀마 국경 쪽으로 이어지는 언덕을 타고 올라가며, 야생 코끼리와 무수한 새들에게 안식처를 제공하고 있다. ‘끝없는 숲’이라는 뜻의 우량림(Wuliang Lin)은 공중 뿌리가 살아있는 문처럼 뻗어 있는 거대한 반얀나무 아래에서 시작된다. 안으로 들어서면 숲은 사방으로 끝없이 펼쳐져 있으며, 아직까지 그 끝을 찾아낸 탐험대는 없다. 습한 정글과 대나무 덤불, 물이 불어난 개울이 층층이 이어진다. 원숭이들이 탐험가들을 따라 나무 꼭대기 사이를 지나가는데, 그들 모두가 원숭이는 아니다." #deepl:932280328
 building_gate_dungeon_wuliang_lin: "$gate_dungeon_wuliang_lin$ $concept_gate_dungeon$" #deepl:1477959205

 # North China
 gate_dungeon_khara_khoto: "카라-코토" #deepl:2406890691
 gate_dungeon_khara_khoto_desc: "고비 사막의 가장자리에 위치한 ‘검은 도시’ 카라코토의 흙벽은, 이곳에 물을 공급하던 강이 흐름을 바꾸면서 오래전에 버려진 채 사막 한가운데 홀로 서 있다. 폐허가 된 도시 안, 서쪽 성벽 근처에 있는 한 사리탑에는 사리탑 안으로 통하는 것이 아니라 모래 밑으로 이어지는 문이 있다. 그 아래에는 모래에 파묻힌 홀과 보물 창고, 그리고 모래에 깎여 닳은 조각상들로 가득 찬 무덤들이 있는 지하 감옥이 펼쳐져 있으며, 여행자들은 고요한 밤이면 모래 언덕 아래에서 옛 도시의 시장 소리가 들린다고 말한다." #deepl:1097299249
 building_gate_dungeon_khara_khoto: "$gate_dungeon_khara_khoto$ $concept_gate_dungeon$" #deepl:24012338
 gate_dungeon_dixia_gong: "디샤 공" #deepl:86106098
 gate_dungeon_dixia_gong_desc: "옛 수도 시안 주변의 평원에는 황제와 왕자들의 무덤인 풀이 무성한 고분들이 점점이 흩어져 있는데, 대부분은 한 번도 발굴된 적이 없다. ‘지하 궁전’이라 불리는 딕시아공(Dixia Gong)은 비교적 작은 고분 중 하나 아래, 고분 측면에 새겨진 문을 통해 들어갈 수 있다. 그 뒤로는 황궁처럼 배치된 전각들이 펼쳐져 있다. 안뜰, 왕좌의 방, 무기고, 그리고 점토와 청동으로 만든 병사들이 줄지어 서 있는 긴 복도들이 있는데, 이 병사들은 항상 제자리에 서 있는 것은 아니다. 가장 깊은 층에는 수은의 강이 흐르고 있다고 전해진다." #deepl:536929319
 building_gate_dungeon_dixia_gong: "$gate_dungeon_dixia_gong$ $concept_gate_dungeon$" #deepl:3617567429

 # Northeast Asia
 gate_dungeon_ognennaya_past: "오그네나야의 과거" #deepl:2773138320
 gate_dungeon_ognennaya_past_desc: "캄차카는 연기를 뿜는 화산과 간헐천 지대, 김이 모락모락 피어오르는 강이 있는 땅으로, 이곳의 곰들은 다른 어느 곳보다 더 큽니다. ‘오그네나야 파스트(Ognennaya Past)’, 즉 ‘불타는 입’은 활화산 기슭의 간헐천 계곡에 자리 잡고 있습니다. 이곳의 분출구에서는 증기가 솟아오르지 않고, 오직 반짝이는 열기만이 뿜어져 나옵니다. 그 아래에는 알려진 가장 깊은 화산 동굴 중 하나가 자리 잡고 있으며, 이곳으로 내려가면 타는 듯한 열기를 뿜어내는 터널과 마그마 호수, 그리고 수정처럼 투명한 흑요석으로 이루어진 방들을 지나게 된다. 두려움을 거의 모르는 현지 사냥꾼들조차도 이곳이 보이는 곳에서는 야영을 하지 않는다." #deepl:3939716489
 building_gate_dungeon_ognennaya_past: "$gate_dungeon_ognennaya_past$ $concept_gate_dungeon$" #deepl:818426959
 gate_dungeon_hyoketsu: "효켓츠" #deepl:127812062
 gate_dungeon_hyoketsu_desc: "후지산 북쪽 기슭에는 오래된 용암류 위로 우거진 울창한 숲이 펼쳐져 있으며, 그 땅속에는 여름 내내 얼음이 남아 있는 동굴들이 파여 있다. ‘히오케츠(氷窟)’라고 불리는 이 얼음 동굴은 이러한 용암 동굴 중 하나로 시작되었지만, 그 안의 얼음은 다른 동굴들에서 끝나는 지점까지 그치지 않는다. 동굴 내부에서는 신사의 기둥처럼 얼음 기둥들이 바닥에서 솟아오르고, 얼어붙은 호수들은 등불 빛을 받아 끝없는 저 멀리까지 비추며, 탐험가들은 아무리 두꺼운 양모나 모피를 입어도 뚫고 들어오는 듯한 추위를 느낀다고 전한다. 동굴 위의 숲은 고요하며, 지역 주민들은 방문객들에게 길을 벗어나지 말라고 조언한다." #deepl:2591675358
 building_gate_dungeon_hyoketsu: "$gate_dungeon_hyoketsu$ $concept_gate_dungeon$" #deepl:1507204179

 # Siberia
 gate_dungeon_buus_khaya: "부스 카야" #deepl:848832724
 gate_dungeon_buus_khaya_desc: "시베리아 최북단에서는 땅이 깊은 곳까지 얼어붙어 있으며, 강둑에서는 때때로 매머드의 엄니나 오래전에 멸종한 짐승들의 시체가 발견되기도 한다. ‘부스 카야(Buus Khaya)’, 즉 ‘얼음 바위’는 강 테라스 위에 위치한 얼어붙은 절벽으로, 그곳의 동굴은 영구동토층 속으로 이어져 있다. 동굴 내부의 벽은 고대 얼음과 검은 흙으로 이루어져 있으며, 뼈와 상아, 그리고 제자리에 얼어붙은 온전한 생물들의 시체가 곳곳에 박혀 있다. 그중 일부는 온기가 닿으면 깨어나기도 한다. 더 깊은 층은 시베리아의 그 어떤 겨울보다도 더 차갑다." #deepl:188674913
 building_gate_dungeon_buus_khaya: "$gate_dungeon_buus_khaya$ $concept_gate_dungeon$" #deepl:1876216868
 gate_dungeon_shamanka: "샤만카" #deepl:279338067
 gate_dungeon_shamanka_desc: "바이칼 호수의 올혼 섬에는 ‘샤만카’라고 불리는 두 개의 봉우리가 물속으로 뻗어 있는 바위가 있는데, 이 바위는 수 세대에 걸쳐 부랴트족에게 신성한 장소로 여겨져 왔다. 바위 기슭에는 수면 바로 위에 동굴이 열려 있으며, 그곳에서 세계에서 가장 깊은 호수의 수면 아래로 이어지는 통로가 내려간다. 그 아래에는 돌과 나무로 지어진 수몰된 도시가 자리 잡고 있는데, 그 거리는 물속이 너무 맑고 차가워 탐험가들이 발밑을 한참 아래까지 볼 수 있을 정도이며, 더 깊은 곳의 탑들은 어둠 속에 사라져 버렸다. 바이칼 호수 심연에 서식하는 생명체들이 이곳으로 들어온 듯하다." #deepl:4084631959
 building_gate_dungeon_shamanka: "$gate_dungeon_shamanka$ $concept_gate_dungeon$" #deepl:2125098252

 # Oceania
 gate_dungeon_grose_hollow: "그로스 할로우" #deepl:3286345539
 gate_dungeon_grose_hollow_desc: "시드니 서쪽에 위치한 블루 마운틴은 사암 절벽과 깊은 계곡이 미로처럼 얽혀 있는 곳으로, 유칼립투스 숲 덕분에 푸른 안개가 자욱하게 깔려 있으며, 수많은 협곡 속에는 동굴들이 숨어 있습니다. 그로스 할로우(Grose Hollow)는 가장 외진 계곡 중 한 곳의 폭포 기슭, 쏟아지는 물의 장막 너머에 자리 잡고 있습니다. 그 안에는 수정으로 뒤덮인 방들, 지하 강, 그리고 좁은 통로들이 이어져 있다가 갑자기 반짝이는 석회암 홀로 뚫려 나오는 동굴 던전이 펼쳐져 있다. 이곳의 주민들은 던전 기준으로도 기이한 존재들로, 유대류의 모습이 훨씬 더 위험한 형태로 뒤틀려 있다." #deepl:1094261557
 building_gate_dungeon_grose_hollow: "$gate_dungeon_grose_hollow$ $concept_gate_dungeon$" #deepl:96398301
 gate_dungeon_ketetahi: "케테타히" #deepl:1590309770
 gate_dungeon_ketetahi_desc: "북섬의 화산 지대 한가운데, 재와 투삭 풀로 뒤덮인 황량한 고원 위로 세 개의 거대한 산이 솟아 있으며, 산비탈에서는 온천과 분출구에서 증기가 피어오르고 있다. 케테타히는 연기를 뿜어내는 화산뿔의 측면에 위치한 분출구 중 하나로, 이곳에서는 끓어오르는 온천수가 솟아나고 땅이 갈라져 빛나는 균열이 드러나 있다. 그 아래의 지하 동굴은 용암 강과 유황이 섞인 물웅덩이, 재로 가득 찬 동굴들이 가로지르고 있으며, 일행이 지나갈 때면 그곳의 주민들이 마치 바위 속에서 솟아오르는 듯하다." #deepl:2193902739
 building_gate_dungeon_ketetahi: "$gate_dungeon_ketetahi$ $concept_gate_dungeon$" #deepl:1126126978

 # Canada
 gate_dungeon_nunataq: "누나탁" #deepl:3167975985
 gate_dungeon_nunataq_desc: "먼 북극의 높은 빙원 위에서는, 때때로 검은 바위 봉우리들이 마치 땅속에 묻힌 산의 봉우리처럼 얼음을 뚫고 솟아오르곤 한다. 그중 하나는 기슭에 입구를 숨기고 있는데, 그곳은 얼음이 바위에서 떨어져 나간 곳으로, 누나탁(Nunataq)으로 이어지는 통로다. 이 던전은 바위와 얼음 사이에 자리 잡은 미로와도 같다. 얼어붙은 심연, 얼음으로 봉쇄된 통로, 그리고 푸른 벽 너머로 얼음 아래의 오래된 산이 여전히 보이는 방들이 있다. 도움의 손길이 닿기 이토록 먼 던전은 드물며, 여정 중에 동료를 잃지 않고 이곳에 도달하는 파티도 거의 없다." #deepl:1462753696
 building_gate_dungeon_nunataq: "$gate_dungeon_nunataq$ $concept_gate_dungeon$" #deepl:990057393
 gate_dungeon_red_deer_hollow: "레드 디어 할로우" #deepl:2232841744
 gate_dungeon_red_deer_hollow_desc: "레드 디어 강을 따라 대초원은 갑자기 배드랜드로 급격히 떨어지는데, 이곳은 줄무늬가 있는 언덕과 후두, 그리고 바위에서 거대한 짐승의 뼈가 풍화되어 드러나는 마른 협곡들이 뒤엉킨 험준한 지형이다. 레드 디어 할로우(Red Deer Hollow)는 후두들이 모여 있는 기슭에 위치한 동굴로, 입구는 마치 거대한 짐승의 갈비뼈처럼 화석화된 뼈들로 둘러싸여 있다. 내부에는 줄무늬가 있는 바위로 이루어진 메마른 동굴과 무너진 통로, 뼈로 가득 찬 방들이 있으며, 탐험가들에 따르면 그 안의 해골들이 항상 가만히 있는 것은 아니라고 한다." #deepl:2419040958
 building_gate_dungeon_red_deer_hollow: "$gate_dungeon_red_deer_hollow$ $concept_gate_dungeon$" #deepl:2264227238

 # Pacific Coast
 gate_dungeon_tahoma_vent: "타호마 벤트" #deepl:1426624704
 gate_dungeon_tahoma_vent_desc: "캐스케이드 산맥의 거대한 백색 산인 타호마는 전나무와 삼나무로 우거진 울창한 숲 위로 솟아 있으며, 정상에는 빙하가 덮여 있다. 하지만 얼음 아래에서 이 산은 여전히 생동감 넘치는 생명력을 뿜어내고 있다. 타호마 분출구는 산 중턱 높은 곳에 있는 김이 모락모락 피어오르는 균열로 열려 있으며, 그곳에서 용암 터널이 빙하 아래의 화산 속으로 이어져 들어간다. 그 너머의 지하 세계는 얼음이라기보다는 불의 세계다. 현무암 터널, 용암 강, 마그마실 등이 펼쳐져 있으며, 위쪽 빙하에서 녹은 물이 스며들어오는 통로들은 증기로 자욱하다." #deepl:9148477
 building_gate_dungeon_tahoma_vent: "$gate_dungeon_tahoma_vent$ $concept_gate_dungeon$" #deepl:1698568113
 gate_dungeon_kaibab_vault: "카이밥 볼트" #deepl:2191790283
 gate_dungeon_kaibab_vault_desc: "카이밥 고원 아래, 콜로라도 강은 깊이 1마일에 달하는 협곡을 깎아냈으며, 협곡 벽은 붉은색, 황토색, 회색의 줄무늬를 띠고 있다. 그 옆 협곡 중 하나를 따라 내려가다 보면, 가파른 암벽에 낯선 형상이 새겨진 문이 서 있고, 그 양쪽에는 협곡 벽에서 깎아낸 기둥들이 자리 잡고 있다. 카이밥 볼트는 사암으로 된 홀과 석관, 보물실이 있는 던전으로, 모래로 가득 찬 봉인된 방들과 함정이 설치된 복도들로 이루어져 있다. 그 양식은 이 지역 주민들이 지금까지 지어온 그 어떤 건축물과도 닮지 않아, 던전의 테마가 어디서 비롯되었는지에 대한 논쟁을 더욱 부추기는 요인이 되었다." #deepl:3893723199
 building_gate_dungeon_kaibab_vault: "$gate_dungeon_kaibab_vault$ $concept_gate_dungeon$" #deepl:1409315727

 # Great Plains
 gate_dungeon_paha_sapa: "파하 사파" #deepl:714600479
 gate_dungeon_paha_sapa_desc: "블랙 힐스는 그레이트 플레인스에서 솟아오른, 짙은 소나무 숲으로 이루어진 섬과도 같은 곳으로, 라코타족에게 신성한 장소이며, 지하에는 땅속으로 바람이 드나드는 동굴들이 곳곳에 뚫려 있다. 파하 사파는 화강암 노두 사이의 작은 틈새로 시작되는 동굴로, 그 안의 공기는 따뜻하고 철 냄새가 난다. 동굴 안으로 들어가면 수정으로 뒤덮인 통로, 박스워크 지형, 그리고 방해석으로 반짝이는 방들이 미로처럼 뻗어 있는데, 그 구조가 워낙 복잡해서 탐험대가 분필로 경로를 표시해 두어도 돌아오는 길에는 그 표시가 사라져 버리곤 한다." #deepl:2728802150
 building_gate_dungeon_paha_sapa: "$gate_dungeon_paha_sapa$ $concept_gate_dungeon$" #deepl:4294375650
 gate_dungeon_ville_engloutie: "물속에 잠긴 도시" #deepl:2561322453
 gate_dungeon_ville_engloutie_desc: "미시시피 강 남쪽의 바유(늪지대)에는 사이프러스 나무들이 무릎 높이까지 차오른 고요한 갈색 물속에 서 있고, 나뭇가지에는 스페인 이끼가 드리워져 있다. 그런 늪 한가운데 깊은 곳에서는, 주변에 땅이 전혀 없는 채로 돌로 지어진 건물의 지붕이 물 위로 솟아 있으며, 위쪽 창문들은 수면 바로 위에 위치해 있다. 이 건물을 발견한 사냥꾼들은 이곳을 ‘빌 앙글루티(Ville Engloutie)’, 즉 ‘삼켜진 마을’이라고 부른다. 창문 너머로는 물에 잠긴 거리, 가라앉은 광장, 이끼가 드리워진 홀들이 펼쳐진 침수된 도시가 보이며, 이곳은 거대한 악어와 검은 물속에서 사냥을 하는 그보다 더 무시무시한 존재들의 서식지이다." #deepl:1577041779
 building_gate_dungeon_ville_engloutie: "$gate_dungeon_ville_engloutie$ $concept_gate_dungeon$" #deepl:2786524121

 # Atlantic Coast
 gate_dungeon_echo_deep: "에코 딥" #deepl:257355966
 gate_dungeon_echo_deep_desc: "켄터키의 푸른 언덕 아래에는 세계에서 가장 긴 것으로 알려진 동굴들이 자리 잡고 있는데, 이곳은 아직 완전히 지도에 표시되지 않은 통로와 지하 강이 얽힌 미로와도 같은 곳입니다. 『에코 딥』은 이 동굴들을 가로지르는 강 근처, 플라타너스 나무들에 가려진 싱크홀에서 시작됩니다. 그 아래에 펼쳐진 던전은 지하 강, 석고로 덮인 통로, 돔형 홀이 어우러진 거대한 동굴 시스템으로, 어떤 소리든 사라져야 할 시간이 지났음에도 오랫동안 메아리쳐 돌아옵니다. 그 메아리 중 일부는 한 번도 말해진 적 없는 말들을 실어오기도 합니다." #deepl:2610133049
 building_gate_dungeon_echo_deep: "$gate_dungeon_echo_deep$ $concept_gate_dungeon$" #deepl:2200786166
 gate_dungeon_pahayokee: "파하요키" #deepl:3531991831
 gate_dungeon_pahayokee_desc: "플로리다 남부의 에버글레이즈는 경목 나무로 이루어진 숲, 맹그로브 섬, 악어 굴이 곳곳에 흩어져 있는, 풀로 뒤덮인 느린 강과도 같습니다. 풀이 무성한 물길을 뜻하는 옛 이름에서 유래한 ‘파하요키’는 톱풀 숲 깊숙한 곳에 위치한 숲으로, 나무들이 너무 빽빽하게 자라나 나무 꼭대기들이 터널을 이루고 있습니다. 이 터널은 늪지대 숲과 얽힌 맹그로브, 김이 모락모락 피어오르는 웅덩이로 이루어진 열대 지하 감옥으로 이어지는데, 그곳의 공기는 곤충들로 가득 차 있고 물은 겉보기만큼 얕지 않다." #deepl:3755633439
 building_gate_dungeon_pahayokee: "$gate_dungeon_pahayokee$ $concept_gate_dungeon$" #deepl:2945348969

 # Central America
 gate_dungeon_chen_ha: "천하" #deepl:524183836
 gate_dungeon_chen_ha_desc: "유카탄 반도의 평평한 석회암 지대에는 지표면에 강이 없으며, 물은 지하로 흘러가다가 덩굴이 드리워진 맑고 푸른 물이 고인 둥근 싱크홀인 세노테에서만 모습을 드러낸다. ‘첸 하(Ch’en Ha)’라고 불리는 이 ‘물의 동굴’은 수면 아래로 이어지는 돌계단이 정글 아래 물에 잠긴 도시 속으로, 발이 젖지 않은 채로 계속 내려가는 세노테이다. 계단식 사원들은 물에 잠긴 광장 위로 솟아 있고, 조각된 비석들은 허리까지 물에 잠겨 서 있으며, 세노테에 물을 공급하는 지하 강은 살아있는 기억 속에서는 그 누구도 걸어본 적 없는 거리들을 흐르고 있다." #deepl:1648991414
 building_gate_dungeon_chen_ha: "$gate_dungeon_chen_ha$ $concept_gate_dungeon$" #deepl:2711618012
 gate_dungeon_uxwitz: "우크스비츠" #deepl:3043730104
 gate_dungeon_uxwitz_desc: "페텐의 저지대 숲속에서는, 정글이 유럽인들이 도착하기 수 세기 전에 버려진 도시들의 계단식 피라미드들을 감추고 있으며, 그 정상들은 마치 섬처럼 나무 꼭대기 위로 솟아 있다. ‘세 개의 언덕’이라는 뜻의 우크스비츠는 잡초가 무성하게 자란 세 개의 피라미드로 이루어져 있는데, 그중 가장 큰 피라미드의 정상에는 사원 입구가 있지만, 안으로 들어가는 대신 아래로 내려가는 구조로 되어 있다. 그 아래에는 매몰된 광장, 정글에 뒤덮인 안뜰, 풀이 무성하게 자란 궁전들이 있는 열대 밀림의 지하 감옥이 펼쳐져 있으며, 이곳은 재규어와 뱀, 그리고 고대 조각상에 등장하는 생물들의 서식지이다." #deepl:4091535095
 building_gate_dungeon_uxwitz: "$gate_dungeon_uxwitz$ $concept_gate_dungeon$" #deepl:1353317249

 # Brazil
 gate_dungeon_igapo_escuro: "이가포 에스쿠로" #deepl:2731923193
 gate_dungeon_igapo_escuro_desc: "매년 아마존의 강들이 범람하면 물은 수 마일에 걸쳐 숲 속으로 밀려들어와 나무 줄기를 물에 잠기게 하고, 정글을 어두운 검은 물의 미로로 바꿔 놓는다. ‘이가포 에스쿠로(Igapó Escuro)’, 즉 ‘어두운 침수림’은 건기에도 물이 결코 빠지지 않는 그런 숲이 펼쳐진 곳이다. 강에서 카누를 타고 그 안으로 들어갈 수 있는데, 어느 지점을 지나면 숲은 마치 지하 감옥처럼 변한다. 물에 잠긴 정글과 썩어가는 나무, 거대한 수련이 층층이 쌓여 있고, 카이만과 아나콘다, 그리고 배 아래 어두운 물속에서 사냥하는 미지의 생물들이 도사리고 있다." #deepl:33343186
 building_gate_dungeon_igapo_escuro: "$gate_dungeon_igapo_escuro$ $concept_gate_dungeon$" #deepl:2904494393
 gate_dungeon_gruta_diamantina: "그루타 디아만티나" #deepl:1012437778
 gate_dungeon_gruta_diamantina_desc: "바이아 내륙의 고원 지대인 차파다 디아만티나에서는, 다이아몬드 채굴자들이 오랫동안 절벽 아래의 강과 자갈밭에서 일해 왔습니다. 이 고원의 동굴들 중에는 그루타 디아만티나가 있는데, 이곳 입구를 지나면 햇빛이 비칠 때 마치 빛을 발하는 듯할 정도로 맑고 푸른 물웅덩이가 나타납니다. 그 물웅덩이를 지나면 동굴은 반짝이는 동굴실과 수정으로 뒤덮인 통로, 지하 강이 어우러진 미로 같은 공간으로 변하며, 이곳의 보물 상자들은 무엇보다 보석으로 유명합니다." #deepl:1958878348
 building_gate_dungeon_gruta_diamantina: "$gate_dungeon_gruta_diamantina$ $concept_gate_dungeon$" #deepl:2008378812

 # Andes
 gate_dungeon_chamak_uta: "차막 우타" #deepl:979974205
 gate_dungeon_chamak_uta_desc: "티티카카 호수는 안데스 산맥의 매우 높은 곳에 위치해 있어 공기가 희박하고 빛이 강렬하며, 이 지역의 주민들은 오랫동안 호수에 삼켜진 한 도시에 대한 이야기를 전해 내려오고 있다. ‘차막 우타(Ch'amak Uta)’, 즉 ‘어두운 집’은 호숫가에서 갈대 배를 타고 갈 수 있는 곳이다. 얕은 물 위에 조각된 돌들이 원형으로 서 있고, 그 사이로 호수 속으로 내려가는 돌계단이 있다. 수면 아래로 이어지는 이 계단은 거대한 정교하게 다듬어진 돌로 지어진 침수된 도시, 물에 잠긴 사원, 가라앉은 테라스로 이어지는데, 이곳은 호수만큼이나 차갑고, 마치 물이 공기인 양 거리를 헤엄쳐 다니는 생물들이 서식하고 있다." #deepl:3986697350
 building_gate_dungeon_chamak_uta: "$gate_dungeon_chamak_uta$ $concept_gate_dungeon$" #deepl:1536922227
 gate_dungeon_nina_uchku: "니나 우치쿠" #deepl:3545270842
 gate_dungeon_nina_uchku_desc: "하얀 돌로 지어진 아레키파 도시 위로 세 개의 거대한 화산이 솟아 있는데, 그중 가장 완벽한 화산은 대칭을 이루는 눈 덮인 원뿔 모양이다. 화산 기슭의 고지대 사막, 용암 흐름과 경석 지대 사이에는 ‘니나 우치쿠(Nina Uchku, 불의 구멍)’라고 불리는 균열이 차가운 산 공기에 열기를 불어넣고 있다. 그 아래에는 빛나는 터널과 마그마 방으로 이루어진 화산 지하 감옥이 자리 잡고 있으며, 그곳의 주민들은 옛 산악 전설에 등장하는 불타는 영혼들을 닮았다고 전해진다." #deepl:4040138457
 building_gate_dungeon_nina_uchku: "$gate_dungeon_nina_uchku$ $concept_gate_dungeon$" #deepl:948099002

 # La Plata
 gate_dungeon_glaciar_del_silencio: "글라시아르 델 실렌시오" #deepl:1088691401
 gate_dungeon_glaciar_del_silencio_desc: "파타고니아 최남단에서는 거대한 남부 빙원이 빙하를 청록색 호수로 쏟아내리는데, 빙하의 끝부분이 물속으로 무너져 내릴 때면 대포가 터지는 듯한 소리가 난다. 하지만 ‘글라시아르 델 실렌시오(Glaciar del Silencio)’라는 한 빙하만은 결코 빙산이 떨어져 나오지도 않고, 어떤 소리도 내지 않는다. 호수와 만나는 지점에는 빙하 표면에 터널이 뚫려 있어, 푸른 얼음과 얼어붙은 동굴, 그리고 빙하의 두께보다 더 깊게 파인 크레바스로 이루어진 지하 감옥으로 이어집니다. 이곳은 알려진 가장 깊은 얼음 지하 감옥 중 하나이며, 내부의 침묵은 너무나도 완벽하여 탐험대원들은 말을 할 위험을 감수하기보다는 손짓으로 의사소통을 나눕니다." #deepl:2344302738
 building_gate_dungeon_glaciar_del_silencio: "$gate_dungeon_glaciar_del_silencio$ $concept_gate_dungeon$" #deepl:3980058371
 gate_dungeon_tavarangue: "타바랑게" #deepl:896395181
 gate_dungeon_tavarangue_desc: "파라나 강 상류 인근의 숲속에는 나무들 사이로 오래된 선교 마을의 붉은 사암 유적들이 서 있다. 오래전에 버려진 정착지의 교회 벽, 기둥 회랑, 그리고 석조 주택들이 그것이다. 과라니족은 이러한 유적을 ‘타바랑게(tavarangue)’, 즉 ‘한때 존재했던 마을’이라고 부른다. 폐허가 된 교회 아래에는 지하 묘지로 이어지는 계단이 있는데, 그곳은 선교 기지라기보다는 성에 더 어울릴 법한 돌로 된 복도, 회랑, 아치형 방들로 이루어진 지하 감옥으로 이어진다. 그곳의 깊은 층은 갑옷을 입은 인물들이 침묵 속에서 지키고 있다." #deepl:441691601
 building_gate_dungeon_tavarangue: "$gate_dungeon_tavarangue$ $concept_gate_dungeon$" #deepl:2706676765

 # Gran Colombia
 gate_dungeon_mawari_sima: "마와리 시마" #deepl:3603358698
 gate_dungeon_mawari_sima_desc: "과야나 남부에는 ‘테푸이’라고 불리는 평평한 꼭대기를 가진 산들이 열대우림에서 가파르게 솟아 있으며, 그 정상은 기이한 식물들과 끊임없는 비가 내리는 고립된 세계입니다. 그중 한 산의 정상에는 거대한 둥근 싱크홀이 산 속으로 깊게 파여 있으며, 그 바닥은 숲으로 뒤덮여 있다. 페몬족은 마와리, 즉 산의 정령들이 그곳에 산다고 말한다. 마와리 시마는 그 구덩이 바닥에 위치한 던전으로, 길을 잃은 숲과 폭포, 그리고 다른 곳에서는 볼 수 없는 생물들이 어우러진 열대 미로와 같다." #deepl:279977156
 building_gate_dungeon_mawari_sima: "$gate_dungeon_mawari_sima$ $concept_gate_dungeon$" #deepl:462756322
 gate_dungeon_guatavita: "과타비타" #deepl:1311597427
 gate_dungeon_guatavita_desc: "보고타 위의 고지대에는 구아타비타 호수가 자리 잡고 있는데, 이 호수는 푸른 분화구 안에 둥글게 자리 잡은 호수로, 한때 무이스카족이 족장들에게 금가루를 뒤집어씌우고 물 위로 보내 제물을 바치게 하며 즉위식을 거행하던 곳이다. 보물 사냥꾼들은 이 호수의 물을 빼내려고 한 번 이상 시도한 바 있다. 구아타비타의 지하 감옥은 호숫가에 있는 조각된 돌 플랫폼에서 들어갈 수 있는데, 그곳의 계단을 따라 내려가면 황금빛으로 빛나는 홀, 물에 잠긴 의식 광장, 그리고 수면 아래에 가라앉은 사원들이 있는 물에 잠긴 도시가 펼쳐지며, 그곳의 상자에는 금광석이 가득 들어 있다고 전해진다." #deepl:4020230537
 building_gate_dungeon_guatavita: "$gate_dungeon_guatavita$ $concept_gate_dungeon$" #deepl:1095309562

 # Near East
 gate_dungeon_malakopi: "말라코피" #deepl:2797063239
 gate_dungeon_malakopi_desc: "아나톨리아 고원의 응회암 계곡에서 사람들은 수천 년 동안 부드러운 화산암을 깎아 집과 교회, 그리고 지하 도시 전체를 만들어 왔습니다. 말라코피는 그런 지하 도시 중 하나로, 굴곡진 돌문과 환기구는 주변의 다른 도시들과 매우 비슷하지만, 그 누구도 깎아낸 적 없는 수많은 층을 갖추고 있다는 점이 다릅니다. 가장 오래된 지하실 아래부터 본격적인 지하 감옥이 시작된다. 홀, 예배당, 창고, 경비 초소 등이 살아있는 암반에 정교하게 파여 있으며, 모든 터널을 훤히 꿰뚫고 있는 듯한 주둔군이 이곳을 지키고 있다." #deepl:1880647761
 building_gate_dungeon_malakopi: "$gate_dungeon_malakopi$ $concept_gate_dungeon$" #deepl:2855843058
 gate_dungeon_khaznat_al_layl: "카즈나트 알-라일" #deepl:3035859481
 gate_dungeon_khaznat_al_layl_desc: "와디 아라바 동쪽 산악 지대에서 나바테아인들은 좁고 구불구불한 협곡을 통해서만 들어갈 수 있는 숨겨진 도시의 장미빛 붉은 절벽에 무덤과 사원을 새겨 넣었다. ‘밤의 보물창고’라는 뜻의 카즈나트 알-라일(Khaznat al-Layl)은 어느 여행자의 기록에도 등장하지 않는 옆 협곡에 위치한 조각된 외관으로, 기둥과 페디먼트는 마치 태양을 삼켜버릴 듯한 짙은 색의 돌로 조각되어 있다. 그 뒤편에는 바위를 깎아 만든 복도, 매장실, 보물 저장실로 이루어진 지하 감옥이 자리 잡고 있는데, 절벽 깊숙한 곳의 복도에는 모래가 휘날리고, 고대 갑옷을 입은 수호자들이 어둠 속에서 기다리고 있다." #deepl:2813340196
 building_gate_dungeon_khaznat_al_layl: "$gate_dungeon_khaznat_al_layl$ $concept_gate_dungeon$" #deepl:111339467

 # Arabia
 gate_dungeon_ubar: "우바르" #deepl:2065902691
 gate_dungeon_ubar_desc: "도파르의 유향 무역로를 따라 전해지는 전설에 따르면, 모래 속에 우뚝 솟아 자랑스러워하던 탑들의 도시가 사막에 삼켜졌다고 한다. 우바르는 그 이름을 딴 던전이다. 텅 빈 사막(Empty Quarter) 가장자리에 위치한 이 무너진 싱크홀은 쓰러진 탑들의 잔해로 둘러싸여 있으며, 모래 속으로 내려가는 계단이 있다. 그 아래에는 기둥이 늘어선 홀과 모래로 가득 찬 거리, 왕릉이 있는 묻힌 도시가 자리 잡고 있는데, 가장 깊은 곳에서도 바람이 울부짖는 소리가 들리고, 일행의 발 주변으로 모래가 물처럼 흐릅니다." #deepl:2814921195
 building_gate_dungeon_ubar: "$gate_dungeon_ubar$ $concept_gate_dungeon$" #deepl:940335479
 gate_dungeon_bir_barhut: "비르 바르후트" #deepl:3019918405
 gate_dungeon_bir_barhut_desc: "알마흐라 사막에는 땅속에 거대한 둥근 구덩이가 하나 있는데, 현지 전승에 따르면 이 구덩이는 오랫동안 ‘바르후트 우물’로 불리며 악령들이 갇혀 있는 감옥으로 여겨져 왔다. 이 구덩이 속으로 내려간 사람은 거의 없다. ‘비르 바르후트’라 불리는 이 지하 감옥은 구덩이 바닥에서 시작되는데, 그곳에는 동굴이 열려 있어 마른 동굴들의 미로, 계단식 트라버틴, 그리고 유황 냄새가 진동하는 방들로 이어진다. 그곳의 주민들은 뱀과 무수한 군집, 그리고 더 기이한 존재들로, 이들은 탐험대를 빠져나가게 내버려 두기보다는 오히려 더 깊은 곳으로 몰아넣는 듯하다." #deepl:1772188491
 building_gate_dungeon_bir_barhut: "$gate_dungeon_bir_barhut$ $concept_gate_dungeon$" #deepl:2037786510

 # Greater Persia
 gate_dungeon_takht_e_tariki: "타크트-에 타리키" #deepl:983947611
 gate_dungeon_takht_e_tariki_desc: "고대 페르시아 왕도의 유적지 근처에는 옛 왕들의 무덤이 절벽 높은 곳에 새겨져 있으며, 그 정면은 궁전의 정면처럼 만들어져 있다. ‘어둠의 왕좌’라 불리는 타크트-에 타리키(Takht-e Tariki)는 다른 무덤들보다 절벽 아래쪽에 파여 있는 무덤 정면으로, 입구는 지면 높이에 있으며, 부조에는 얼굴이 깎여 나간 왕의 모습이 새겨져 있다. 내부에는 기둥이 늘어선 홀, 왕실 묘실, 모래가 휘날리는 보물실이 있는 지하 감옥이 자리 잡고 있으며, 이곳은 아무도 지켜보지 않을 때 움직이는 날개 달린 돌로 된 괴물들이 지키고 있다." #deepl:443077534
 building_gate_dungeon_takht_e_tariki: "$gate_dungeon_takht_e_tariki$ $concept_gate_dungeon$" #deepl:2738862469
 gate_dungeon_zendan_e_damavand: "젠단-에 다마반드" #deepl:4242474242
 gate_dungeon_zendan_e_damavand_desc: "다마반드는 알보르즈 산맥 위로 홀로 솟아오른 화산뿔로, 이 땅에서 가장 높은 산이며, 정상에서는 유황 분출구에서 증기가 피어오른다. 『샤나메』에 따르면, 영웅 페레이둔은 뱀 어깨를 가진 폭군 자하크를 이 산 아래 동굴에 쇠사슬로 묶어두었는데, 전설에 따르면 자하크는 여전히 그곳에 갇혀 있다고 한다. ‘젠단-에 다마반드(Zendan-e Damavand)’, 즉 다마반드 감옥은 산 비탈의 김이 모락모락 피어오르는 동굴 속에서 시작된다. 이곳은 불길과 사슬, 유황이 가득한 화산 지하 감옥으로, 그 층층이 깊은 곳에서 철을 덜거덕거리게 하는 무언가를 향해 내려가고 있다." #deepl:1906854928
 building_gate_dungeon_zendan_e_damavand: "$gate_dungeon_zendan_e_damavand$ $concept_gate_dungeon$" #deepl:1382969325

 # Central Asia
 gate_dungeon_muz_tor: "무즈-토르" #deepl:1964349998
 gate_dungeon_muz_tor_desc: "높은 천산 산맥에서는 빙하가 봉우리들 사이의 계곡을 가득 메우고 있으며, 키르기스 목동들은 여름철에만 양 떼를 이끌고 빙하 아래로 내려온다. ‘얼음의 전당’이라 불리는 무즈-토르(Muz-Tör)는 빙하가 절벽을 넘어 높은 계곡으로 쏟아져 내리는 지점에 위치하며, 그 입구는 여름 목초지 위에 우뚝 솟은 얼어붙은 아치 형태를 띠고 있다. 내부로 들어서면 빙하는 얼어붙은 복도, 얼음 다리, 푸른 방들로 이루어진 지하 감옥과도 같은 공간이 펼쳐지는데, 이곳의 추위는 지하에서 불어올 리가 없는 울부짖는 바람과 어우러져 더욱 매서워진다." #deepl:3171877613
 building_gate_dungeon_muz_tor: "$gate_dungeon_muz_tor$ $concept_gate_dungeon$" #deepl:3260048074
 gate_dungeon_kara_kala: "카라 칼라" #deepl:3161947558
 gate_dungeon_kara_kala_desc: "메르브의 오아시스 주변에는 수천 년에 걸쳐 나란히 세워진 도시들의 유적이 사막 곳곳에 흩어져 있다. 무너진 성벽, 진흙 벽돌로 지어진 요새, 그리고 모래 위에 홀로 서 있는 묘소들이 그것이다. ‘검은 요새’ 카라 칼라는 흙벽돌로 지어진 폐허 중 하나로, 그 홈이 파인 성벽은 주변의 다른 성벽들보다 더 짙은 색을 띠고 있다. 안뜰 안쪽에는 계단이 내려가는데, 그 아래에는 매몰된 홀과 영묘의 지하실, 모래로 메워진 거리들이 있는 지하 감옥이 펼쳐져 있으며, 그곳에는 오래전에 죽은 왕들의 보물이, 그들과 마찬가지로 죽은 신하들의 경비 아래 잠들어 있다." #deepl:2116268795
 building_gate_dungeon_kara_kala: "$gate_dungeon_kara_kala$ $concept_gate_dungeon$" #deepl:2165035252

 # South India
 gate_dungeon_simhagiri: "심하기리" #deepl:3476010703
 gate_dungeon_simhagiri_desc: "실론 중부의 숲속에는 정글에서 가파르게 솟아오른 거대한 바위가 있는데, 그 정상에는 한때 하늘에서 통치했던 왕이 지은 궁전의 유적이 자리 잡고 있다. 그 오래된 정문은 거대한 사자의 형상을 띠고 있었는데, 지금은 돌로 된 발만 남아 있다. ‘심하기리(Simhagiri)’, 즉 사자 바위(Lion Rock)로 들어가는 길은 바로 그 발 사이를 지나간다. 바위 속으로 이어지는 이 통로는 왕실의 연회장, 벽화가 그려진 갤러리, 계단식 정원, 경비실로 이어지는 지하 공간으로, 이곳은 돌로 된 사자들과 갑옷을 입은 수호자들이 지키고 있다." #deepl:697420212
 building_gate_dungeon_simhagiri: "$gate_dungeon_simhagiri$ $concept_gate_dungeon$" #deepl:4061293534
 gate_dungeon_irul_kaavu: "이룰 카부" #deepl:1444447066
 gate_dungeon_irul_kaavu_desc: "트라반코어 전역의 마을들에는 ‘카부(kaavu)’라고 불리는 신성한 숲이 있는데, 이는 뱀과 숲의 정령을 모신 신전 주변에 손대지 않은 채 남겨둔 고대 숲의 일부입니다. ‘어둠의 숲’이라 불리는 이룰 카부(Irul Kaavu)는 서부 가트 산맥 높은 곳에 위치한 카부로, 나무 뿌리 사이로 돌로 만든 뱀 형상이 서 있고, 나무들의 빽빽한 수관 사이로 햇빛이 전혀 들어오지 않습니다. 신전 뒤편에는 열대 우림과 이끼 낀 계단식 지형, 폭포가 어우러진 열대 밀림의 지하 감옥 같은 공간이 펼쳐져 있으며, 온갖 크기의 뱀들이 우글거리고, 이곳을 탐험한 이들은 숲이 층을 거듭할수록 더욱 울창하고 어두워진다고 전한다." #deepl:433137994
 building_gate_dungeon_irul_kaavu: "$gate_dungeon_irul_kaavu$ $concept_gate_dungeon$" #deepl:1783136410

 # Himalayas
 gate_dungeon_nagpo_dzong: "나그포 종" #deepl:730909342
 gate_dungeon_nagpo_dzong_desc: "티베트 서부의 메마른 협곡에는, 사라진 왕국의 유적들이 침식된 점토 절벽에 매달려 있으며, 산등성이에 직접 지어진 요새 성벽과 사원들이 자리 잡고 있다. ‘검은 요새’로 불리는 나그포 종(Nagpo Dzong)은 바로 그런 산등성이 꼭대기에 위치한 폐허가 된 성채로, 성벽 곳곳에 동굴 방들이 뚫려 있다. 이 중 한 곳을 통해 터널이 산등성이 안으로 이어지며, 산의 심장부를 따라 오르내리는 돌로 된 복도, 사원 방, 그리고 망루로 이루어진 지하 감옥으로 내려간다. 이곳은 옻칠한 갑옷을 입은 전사들이 완벽한 침묵 속에서 싸우며 지키고 있다." #deepl:1795647749
 building_gate_dungeon_nagpo_dzong: "$gate_dungeon_nagpo_dzong$ $concept_gate_dungeon$" #deepl:2071833542
 gate_dungeon_gangri_phug: "강리 푸그" #deepl:1766939087
 gate_dungeon_gangri_phug_desc: "세계에서 가장 높은 봉우리들 아래 깊은 계곡에서, 빙하들은 눈 덮인 산 정상에서 서서히 아래로 밀려 내려와 셰르파족의 마을과 그들의 수도원 쪽으로 다가오고 있다. ‘눈 덮인 산의 동굴’이라는 뜻의 강리 푸그(Gangri Phug)는 거대한 봉우리 중 하나 아래 빙하 높은 곳에 위치해 있으며, 등반가와 목동들 모두 피하는 푸른 심연이다. 이곳은 알려진 가장 깊은 얼음 지하 감옥으로, 얼어붙은 복도와 크레바스, 빙폭이 층층이 쌓인 곳을 내려가야 하는데, 그곳의 추위와 희박한 공기는 그곳에 서식하는 어떤 생명체만큼이나 치명적이다." #deepl:574718635
 building_gate_dungeon_gangri_phug: "$gate_dungeon_gangri_phug$ $concept_gate_dungeon$" #deepl:4110322777

 # North India
 gate_dungeon_andheri_baori: "안데리 바오리" #deepl:3212517751
 gate_dungeon_andheri_baori_desc: "건조한 라지푸타나 지방의 마을들은 사막 아래 숨겨진 물에 닿기 위해 여러 층으로 이어지는 계단을 파내어 거대한 계단식 우물을 만들었습니다. ‘어두운 계단식 우물’이라는 뜻의 안데리 바오리(Andheri Baori)도 그중 하나입니다. 이 우물은 지그재그로 뻗은 계단이 늘어선 거대한 정사각형 수직 구덩이로, 지하수면이 있을 법한 곳을 훨씬 지나 아래로 뻗어 있습니다. 우물 바닥에서 물은 단순한 연못으로 끝나지 않고, 기둥이 서 있는 홀과 물에 잠긴 복도, 물에 잠긴 궁전들로 이루어진 수몰된 도시로 이어진다. 그곳에서는 물속에서 그림자가 움직이고, 계단은 계속해서 아래로 이어진다." #deepl:1714488120
 building_gate_dungeon_andheri_baori: "$gate_dungeon_andheri_baori$ $concept_gate_dungeon$" #deepl:2569428448
 gate_dungeon_krem_ksuid: "크렘 크수이드" #deepl:4001011506
 gate_dungeon_krem_ksuid_desc: "지구상에서 가장 비가 많이 오는 지역 중 하나인 카시 산지에서는, 강물이 고원에서 쏟아져 내려 열대우림으로 뒤덮인 협곡으로 흘러들어가며, 마을 주민들은 고무나무의 뿌리를 개울 위로 뻗게 하여 살아있는 다리를 만들어 냅니다. ‘영혼의 동굴’이라 불리는 크렘 크수이드(Krem Ksuid)는 바로 그런 뿌리 다리를 통해 도달할 수 있는데, 이 다리는 협곡을 가로질러 양치류와 폭포로 둘러싸인 동굴 입구로 이어진다. 동굴 안으로 들어서면 곧 습한 정글, 뿌리가 뒤엉킨 방들, 그리고 굉음을 내는 개울이 어우러진 열대 지하 감옥 같은 공간이 펼쳐지는데, 이곳에서는 살아있는 뿌리들이 스스로 움직여 탐험대가 지나간 뒤 길을 막아버리곤 한다." #deepl:3388093854
 building_gate_dungeon_krem_ksuid: "$gate_dungeon_krem_ksuid$ $concept_gate_dungeon$" #deepl:379488277
