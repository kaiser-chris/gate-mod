# Decision
 decision_gate_germanic: "Convert to the [GetReligion('gate_germanic').GetName] religion"
 decision_gate_germanic_desc: "As the old gods are coming back we need to make a decision on whether we want to embrace them."
 decision_gate_germanic_conversion_tooltip: "Around #v 20%#! of our country will convert to the old [GetReligion('gate_germanic').GetName] faith"
 decision_gate_germanic_heretic_tooltip: "Most #v $heritage_group_abrahamic$#! [Concept('concept_country','$concept_countries|q$')] in Europe will treat us as #v;r heretics#!"
# Journal Entry
 je_gate_germanic_religion: "Converting our Brothers"
 je_gate_germanic_religion_reason: "The halls of power in Germany echo with ancient hymns long thought silenced. Where crosses once stood, oak leaves now adorn the banners of the faithful. The old gods have returned to the heartland, and their priests speak with voices that shake stone and stir soul. Now, eyes turn northward—to the Low Countries, where the thunder has not yet been heard."
 #je_gate_germanic_religion_goal: ""