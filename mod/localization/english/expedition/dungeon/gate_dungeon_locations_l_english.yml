l_english:
 gate_dungeon_alpine_caves: "Tiefburg"
 gate_dungeon_alpine_caves_desc: "Nestled in the limestone caves above the [GetBuildingType('building_gate_tyrol').GetName] in [GetStateRegion('STATE_TYROL').GetName], the #bold $gate_dungeon_alpine_caves$#! is believed to owe their formation to the surge in [concept_gate_mana_density] that came with the Gate itself. Local herders, following a stray goat into the hillside, were the first to find the entrance and the first to report what lay beyond it: a cave mouth opening onto stone halls, barred cells, and winding corridors that would look at home in any old castle keep, despite there being no ruin of a castle anywhere above ground."
