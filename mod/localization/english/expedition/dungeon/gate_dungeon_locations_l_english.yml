l_english:
 gate_dungeon_tiefburg: "Tiefburg"
 gate_dungeon_tiefburg_desc: "Nestled in the limestone caves above the [GetBuildingType('building_gate_tyrol').GetName] in [GetStateRegion('STATE_TYROL').GetName], the #bold $gate_dungeon_tiefburg$#! is believed to owe their formation to the surge in [concept_gate_mana_density] that came with the Gate itself. Local herders, following a stray goat into the hillside, were the first to find the entrance and the first to report what lay beyond it: a cave mouth opening onto stone halls, barred cells, and winding corridors that would look at home in any old castle keep, despite there being no ruin of a castle anywhere above ground."

 # Western Europe
 gate_dungeon_dunmorrach: "Dunmorrach"
 gate_dungeon_dunmorrach_desc: "On a headland above a grey sea loch stands the stump of a broch that no clan remembers raising, its dry-stone walls barely taller than a man. Step through its single low doorway, however, and the walls do not end: Dunmorrach opens onto vaulted halls, guardrooms, and spiral stairs that descend through floor after floor of a keep far too large to fit beneath the hill. Delvers speak of armoured sentinels that never tire, of banners in colours that belong to no clan, and of a great hall at the bottom where a cold hearth is always laid but never lit."
 gate_dungeon_oldewaard: "Oldewaard"
 gate_dungeon_oldewaard_desc: "Out on the Wadden mudflats, a long walk from the dikes at low tide, the tip of a brick church tower rises from the silt where no village has stood within living memory. When the tide is out its belfry door stands just above the mud, and those who climb through it find not a bell chamber but a stair winding down into a drowned town of gabled houses, flooded lanes, and canals choked with weed. The tide never reaches the halls within, yet every street is under water, and things move beneath it. Parties who mistime the walk back across the flats risk the sea long before they reach the dungeon's own dangers."

 # Southern Europe
 gate_dungeon_mongibello: "Mongibello"
 gate_dungeon_mongibello_desc: "High on the black flanks of Etna, among old lava flows, a lava tube that ought to run a few dozen paces into the mountain runs far deeper. Mongibello, named for the mountain's old Sicilian name, is a dungeon of basalt galleries and glowing magma channels where the air shimmers with heat and the stone underfoot is never quite still. Its denizens are creatures of cinder and slag, and the lower layers are said to resemble a forge more than a cave, with anvils of obsidian standing in rows as though awaiting smiths who never arrive."
 gate_dungeon_grieta_blanca: "Grieta Blanca"
 gate_dungeon_grieta_blanca_desc: "Near the high passes of the Aragonese Pyrenees, beneath the shoulder of Monte Perdido, a narrow crevice in the limestone breathes cold air even in the height of summer. Herders have always known it as a place where snow lingers long after the passes clear, but beyond its first bend the Grieta Blanca, the White Crevice, opens into a frozen labyrinth far larger than the mountain should hold: frozen waterfalls, blue ice chambers, and galleries floored with ice so clear that delvers can see shapes trapped in it below their boots."

 # Balkans
 gate_dungeon_cetatea_neagra: "Cetatea Neagra"
 gate_dungeon_cetatea_neagra_desc: "On a wooded spur of the southern Carpathians stand the blackened walls of a fortress that appears in no chronicle, its gate tower intact and its courtyard choked with beech saplings. The villages in the valley below call it Cetatea Neagra, the Black Citadel, and keep their flocks well away from it. Through the gate tower lies a dungeon of the classic kind: torchlit corridors, barracks, prisons, and chapels stacked layer upon layer, patrolled by garrisons of armoured dead and lesser horrors that follow orders no one alive has given."
 gate_dungeon_labyrinthos: "Labyrinthos"
 gate_dungeon_labyrinthos_desc: "In the hills south of the Messara plain lie old quarry galleries that Cretans have long called the Labyrinth, a maze of rock-cut passages once thought to be the very one of legend. One of those passages continues where the old maps say it ends. Beyond it the Labyrinthos twists through natural caverns of pale limestone, dripping galleries, and branching tunnels that rearrange themselves between visits more readily than in any other known dungeon. Delvers report horned beasts in the deeper layers and insist, half in jest, that the place knows exactly which story it is imitating."

 # Central Europe
 gate_dungeon_silbergrund: "Silbergrund"
 gate_dungeon_silbergrund_desc: "In the Ore Mountains, where silver has been dug for longer than anyone has kept records, an abandoned adit above a mining village leads back into the hillside along a gallery cut by miners' hands. Past the last tool marks the gallery becomes Silbergrund: a sprawl of natural caverns veined with glittering ore, underground lakes, and shafts that drop into darkness further than any lamp can reach. Old miners say the mountain is paying back what was taken from it, and the dungeon's chests are indeed rich in ore, but the things that guard them dig as well as any miner and know the tunnels better."
 gate_dungeon_firnschlund: "Firnschlund"
 gate_dungeon_firnschlund_desc: "Where a glacier tongue ends in the high valleys of the Grisons, meltwater pours from a blue ice cave like those found beneath many alpine glaciers. Firnschlund looks no different from its neighbours from the outside, but its meltwater never stops, even in the depths of winter, and its entrance never moves as the ice advances and retreats around it. Inside, the ice deepens into vaulted halls of blue and white, crevasses bridged by frozen arches, and chambers so cold that breath freezes before it leaves the lips. Mountain guides who lead parties to its mouth refuse to go one step beyond it."

 # Northern Europe
 gate_dungeon_surtsdjup: "Surtsdjúp"
 gate_dungeon_surtsdjup_desc: "In the lava fields of the western highlands, old sagas tell of a fire giant who came north from Muspelheim and of caves where outlaws hid in his shadow. Surtsdjúp, the Deep of Surtr, begins in one such lava cave, its roof fallen in places to open on the grey sky. Further in, the cave does what no ordinary lava tube can: it grows hotter rather than colder, until the walls glow and rivers of molten rock flow where water should. Delvers count it among the most dangerous dungeons of the north, and the fire-born creatures of its lower layers seem to grow larger the deeper a party goes."
 gate_dungeon_svartisgapet: "Svartisgapet"
 gate_dungeon_svartisgapet_desc: "Beneath the great icecap of Svartisen, whose old ice is so dense it looks almost black, a glacier tongue above a fjord has split open into a dark gap the locals call Svartisgapet. Fishermen rowing past say the gap breathes, drawing air in at dusk and letting it out at dawn. Within lies an ice cavern of black and blue, its walls holding stones, timbers, and the outlines of creatures frozen in mid-stride. Some of them are not as frozen as they appear."

 # Russia
 gate_dungeon_ledyanoy_zev: "Ledyanoy Zev"
 gate_dungeon_ledyanoy_zev_desc: "Along the Sylva river in the western Urals, the gypsum hills are honeycombed with caves where ice lingers year round. Ledyanoy Zev, the Icy Maw, opens in one of these hills behind a curtain of icicles that regrows within the hour whenever it is broken. Inside, frost crystals as large as a man's hand grow on every surface, grottos fill with frozen lakes, and the cold seems to follow intruders rather than simply surround them. Its denizens are pale things that hunt by the warmth of a party's bodies."
 gate_dungeon_kitezh: "Kitezh"
 gate_dungeon_kitezh_desc: "Lake Svetloyar is small, round, and deep, and for as long as anyone in the region can remember it has been said that a holy city lies beneath it, hidden from its enemies by the water, its bells still ringing on quiet nights. Kitezh is the dungeon the pilgrims did not expect: a flight of white stone steps descending from the lakeshore straight into the water, down which a party can walk dry-shod into a drowned city of churches, walls, and wooden streets beneath the lake. The bells do ring. No one who has returned has seen clearly what rings them."

 # Eastern Europe
 gate_dungeon_qara_qoba: "Qara Qoba"
 gate_dungeon_qara_qoba_desc: "On the high karst plateaus of the Crimean mountains, the yayla pastures are pocked with sinkholes and shafts, most of them shallow and well known to the herders who graze their flocks there. Qara Qoba, the Black Cave, is a sinkhole that was always there but was never this deep. Below its lip a party descends into a world of marble-white chambers, curtain formations, and dripping galleries that branch endlessly. The deeper layers are said to be home to pale serpents and to echoes that answer back in voices other than one's own."
 gate_dungeon_glebia_solna: "Glebia Solna"
 gate_dungeon_glebia_solna_desc: "South of Krakow, the salt mines run for miles underground, their chambers carved by generations of miners into chapels, halls, and staircases of grey-green rock salt. Glebia Solna, the Salt Deep, opens off a forgotten side gallery of one such mine. Its halls look carved rather than natural, with salt pillars, statues, and chandeliers of crystal, yet no miner's tools ever touched them. The deeper layers resemble a great salt palace more than a mine, garrisoned by figures of salt and stone that crumble when struck and reassemble when ignored."

 # Nile Basin
 gate_dungeon_ta_djeser: "Ta-Djeser"
 gate_dungeon_ta_djeser_desc: "In the desert hills on the west bank of the Nile, where the old kings of Egypt cut their tombs into the rock, there is a tomb entrance no surveyor has listed and no robber has emptied. Its doorway is carved with the familiar figures of gods and kings, but the cartouches that should hold their names are blank. Ta-Djeser, named for the old Egyptian term for the sacred necropolis, descends through corridors and pillared halls painted with stars, burial chambers stacked with sealed sarcophagi, and false passages that end in pits. Its guardians are wrapped and patient, and they do not stay in their coffins."
 gate_dungeon_deriba: "Deriba"
 gate_dungeon_deriba_desc: "Jebel Marra rises out of the dry plains of Darfur as a green island of cool slopes, streams, and terraced fields, and at its summit lies the Deriba caldera with its twin crater lakes. On the inner wall of the caldera, a fissure that should release nothing more than a breath of warm air opens into a dungeon of black rock and smouldering vents. Deriba is hotter than its surroundings by far, its layers crossed by rivers of molten stone and pools of boiling mud, and the creatures within are made as much of ash as of flesh."

 # North Africa
 gate_dungeon_qabr_ar_raml: "Qabr ar-Raml"
 gate_dungeon_qabr_ar_raml_desc: "Deep in the great sand seas of the Sahara, the dunes move with the wind and sometimes uncover what they have kept buried. Qabr ar-Raml, the Tomb of the Sand, is a sandstone gateway at the foot of a towering dune, flanked by weathered statues whose faces the wind has scoured away. Caravans that pass it water their camels elsewhere. Behind the gate a dungeon of buried halls descends through colonnades half-filled with sand, burial vaults, and shrines to forgotten powers, where scorpions the size of horses guard chests heavy with gemstones."
 gate_dungeon_tazrout: "Tazrout"
 gate_dungeon_tazrout_desc: "High in the Atlas mountains, above a valley of walnut trees and terraced barley, stands a red-walled kasbah that the villagers say was abandoned before their grandfathers' grandfathers were born. Its towers are crumbling and its courtyards empty, but a stair in its central tower leads down into Tazrout, a dungeon of stone halls, guardrooms, and prison cells, far larger and older-looking than the earthen fortress above. Its garrison of armoured warriors fights with the discipline of a standing army, and parties that underestimate them seldom make it past the second layer."

 # West Africa
 gate_dungeon_tellemkoro: "Tellemkoro"
 gate_dungeon_tellemkoro_desc: "Along the Bandiagara escarpment, small dwellings and granaries cling to the cliff face, left by a people who lived there before the present villagers and are remembered only as the Tellem. Among the old cliff dwellings, one doorway leads not into a shallow chamber but into the rock itself. Tellemkoro descends through dry sandstone caverns, narrow chimneys, and great echoing chambers lit by shafts of sunlight that should not reach so far underground. The creatures within are quick and agile climbers, and the dungeon favours sheer drops over level ground."
 gate_dungeon_igbo_ojiji: "Igbo Ojiji"
 gate_dungeon_igbo_ojiji_desc: "In the forests of the Yoruba country, sacred groves are set aside and left untouched, their trees never felled. Igbo Ojiji, the Grove of Shadows, is one such grove, where the canopy closes so tightly that no daylight reaches the ground and a path between two great iroko trees leads somewhere the grove itself does not. Within lies a tropical dungeon of humid jungle, vine-choked shrines, and pools of still black water, where the trees themselves seem to watch and the animals are far larger than any outside."

 # Equatorial Africa
 gate_dungeon_mokele: "Mokele"
 gate_dungeon_mokele_desc: "In the Ituri forest, where the trees grow so densely that a traveller can walk for days without seeing the sky, the forest people speak of a place where the river runs backwards. Mokele is that place: a bend of a slow brown river where the water flows into a hollow under the roots of a colossal tree rather than away from it. The dungeon beyond is a sweltering tangle of jungle layers, flooded forest, and overgrown terraces, home to great reptiles, swarming insects, and things that move in the canopy just out of sight."
 gate_dungeon_shimo_la_shaba: "Shimo la Shaba"
 gate_dungeon_shimo_la_shaba_desc: "The hills of Katanga are so rich in copper that in places the bare ground is stained green, and the people there have smelted the metal into ingots since long before outsiders came looking for it. Shimo la Shaba, the Copper Pit, is a hillside shaft whose walls are crusted with malachite and whose depths open into caverns veined with green and blue ore. Its denizens have hides that turn aside blades like plate armour, and the dungeon's chests are prized above all for copper and the rarer metals found alongside it."

 # Southern Africa
 gate_dungeon_diepkloof: "Diepkloof"
 gate_dungeon_diepkloof_desc: "In the dolomite hills of the highveld, sinkholes and caves riddle the ground, many of them filled with the bones of animals that fell in long ago. Diepkloof, the Deep Ravine, begins in a wooded gully where a cave mouth is half-hidden by wild figs whose roots pour down into the dark. Inside are dry caverns full of brittle flowstone, bone-choked chambers, and shafts that drop out of reach of any rope. The dungeon is unusually fond of ambushes, and parties speak of beasts that wait patiently in the dark until the lamps are at their dimmest."
 gate_dungeon_bone_shoal: "Bone Shoal"
 gate_dungeon_bone_shoal_desc: "On the fog-bound Skeleton Coast, where the Namib desert meets the cold Atlantic, the beaches are littered with whale bones and the timbers of wrecked ships. One wreck lies far inland among the dunes, its hull half-buried in sand and its hold leading down into Bone Shoal. Beneath the desert, impossibly, lies a drowned city: flooded streets, sunken halls, and tidal pools where barnacled stone columns rise from dark water. Scholars cite it as the clearest evidence that a dungeon's theme owes nothing to the land around it."

 # East Africa
 gate_dungeon_suswa: "Suswa"
 gate_dungeon_suswa_desc: "Mount Suswa rises from the floor of the Great Rift Valley as a double-rimmed volcano, its outer crater holding a ring of grassland and its inner crater an island of rock surrounded by a deep moat. The mountain's flanks are threaded with lava tubes where baboons shelter from the sun, and in one of them the passage goes down and down, growing hot and loud with the rumble of molten rock. The Suswa dungeon is all black basalt and fire, its galleries lit by lava falls and patrolled by creatures that seem to be shaped from the mountain itself."
 gate_dungeon_debre_sela: "Debre Sela"
 gate_dungeon_debre_sela_desc: "In the highlands of Lasta, churches have been carved downwards out of solid red rock, their roofs level with the ground and their walls standing in deep trenches. Debre Sela, the Mountain of Rock, is a carved doorway in the floor of one such trench that no stonemason ever made. Beneath it runs a dungeon of rock-hewn halls, pillared chambers, and narrow passages cut with impossible precision, guarded by silent sentinels of stone. The deeper the layers go, the more the carvings resemble a palace rather than a place of worship."

 # Indochina
 gate_dungeon_prasat_khmoch: "Prasat Khmoch"
 gate_dungeon_prasat_khmoch_desc: "In the forests north of the great lake, the ruins of ancient temple cities lie half-swallowed by the jungle, their towers carved with serene faces and their courtyards split by strangler figs. Prasat Khmoch, the Ghost Temple, is a sanctuary whose inner shrine opens onto a stairway that descends into the roots. Below is a tropical dungeon of overgrown galleries, jungle courtyards, and flooded terraces where stone faces watch from every wall. The jungle inside is more alive than the one outside, and it grows back over the path a party has cut behind them."
 gate_dungeon_hang_may: "Hang May"
 gate_dungeon_hang_may_desc: "In the limestone mountains between Annam and Laos, the rivers vanish underground into some of the largest caves in the world. Hang May, the Cloud Cave, is a river cave so vast that clouds form beneath its roof and a jungle grows in the light of its collapsed skylights. Past the last skylight the cave becomes a dungeon of enormous caverns, underground rivers, and calcite terraces stacked like rice paddies. It is the deepest dungeon of the region, and parties that enter it plan for weeks underground."

 # Indonesia
 gate_dungeon_kawah_biru: "Kawah Biru"
 gate_dungeon_kawah_biru_desc: "In the Ijen highlands of eastern Java, sulphur miners descend into a smoking crater to break yellow crusts from the vents beside an acid-green lake. At night the vents burn with an eerie blue flame, and among them is a fissure called Kawah Biru, the Blue Crater, whose fire never goes out. Beyond the blue flames lies a dungeon of volcanic rock, sulphur pools, and choking fumes, where the heat is matched by poison in the air. Delvers who have survived it insist that the blue fire burns brighter whenever a party enters."
 gate_dungeon_rimba_sunyi: "Rimba Sunyi"
 gate_dungeon_rimba_sunyi_desc: "Deep in the interior of Borneo the rainforest is never silent: insects, birds, and apes fill it with noise day and night. Rimba Sunyi, the Silent Forest, is the one place where they fall quiet, a ring of ancient dipterocarps around a sunken clearing where nothing calls and nothing moves. A path down into the clearing leads into a tropical dungeon of giant ferns, pitcher plants as large as barrels, and lianas thick enough to walk on. The silence follows a party all the way down."

 # South China
 gate_dungeon_jiulong_dong: "Jiulong Dong"
 gate_dungeon_jiulong_dong_desc: "Along the rivers of Guangxi, limestone peaks rise like teeth from the rice fields, and nearly every one is hollow. Jiulong Dong, the Nine Dragons Cave, opens at the waterline of one of these peaks and can be reached only by boat. Its first chambers are hung with formations that the boatmen say resemble coiled dragons; past them lies a dungeon of vast caverns, stone forests, and underground lakes, threaded by nine branching passages that never lead the same way twice."
 gate_dungeon_wuliang_lin: "Wuliang Lin"
 gate_dungeon_wuliang_lin_desc: "In the far south of Yunnan, tropical forests climb the hills toward the borders of Laos and Burma, sheltering wild elephants and countless birds. Wuliang Lin, the Boundless Forest, is entered beneath a great banyan whose aerial roots have grown into a living gateway. Inside, the forest goes on in every direction with no end that any party has found, layer after layer of humid jungle, bamboo thickets, and swollen streams. Monkeys follow delvers through the canopy, and not all of them are monkeys."

 # North China
 gate_dungeon_khara_khoto: "Khara-Khoto"
 gate_dungeon_khara_khoto_desc: "On the edge of the Gobi, the earthen walls of Khara-Khoto, the Black City, stand alone in the desert, abandoned long ago when the river that fed it changed its course. Within the ruined city, a stupa near the western wall has a doorway that leads not into the stupa but beneath the sand. Below lies a dungeon of buried halls, treasure vaults, and tombs filled with sand-scoured statues, and travellers say that on still nights the old city's market can be heard below the dunes."
 gate_dungeon_dixia_gong: "Dixia Gong"
 gate_dungeon_dixia_gong_desc: "Around the old capital of Xi'an the plain is dotted with grassy mounds, the burial hills of emperors and princes, most of them never opened. Dixia Gong, the Underground Palace, opens beneath one of the smaller mounds, through a carved gate set into its flank. Behind it stretch halls laid out like an imperial palace: courtyards, throne rooms, armouries, and long corridors lined with ranks of soldiers in clay and bronze, which do not always stay in their ranks. Its deepest layers are said to hold rivers of quicksilver."

 # Northeast Asia
 gate_dungeon_ognennaya_past: "Ognennaya Past"
 gate_dungeon_ognennaya_past_desc: "Kamchatka is a land of smoking volcanoes, geyser fields, and steaming rivers, where the bears grow larger than anywhere else. Ognennaya Past, the Fiery Maw, opens in a valley of geysers at the foot of an active cone: a vent from which no steam rises, only shimmering heat. Below lies one of the deepest volcanic dungeons known, a descent through scorching galleries, magma lakes, and chambers of crystalline obsidian. Even the local hunters, who fear little, will not camp within sight of it."
 gate_dungeon_hyoketsu: "Hyoketsu"
 gate_dungeon_hyoketsu_desc: "At the northern foot of Mount Fuji lies a dense forest grown over old lava flows, its ground hollowed by caves where ice survives through the summer. Hyoketsu, the Ice Cave, begins as one of these lava caves, but its ice does not stop where the others do. Within, columns of ice rise from the floor like the pillars of a shrine, frozen lakes reflect lantern light into endless distances, and delvers report a cold that bites through any amount of wool or fur. The forest above it is quiet, and the locals advise visitors not to stray from the path."

 # Siberia
 gate_dungeon_buus_khaya: "Buus Khaya"
 gate_dungeon_buus_khaya_desc: "In the far north of Siberia the ground is frozen to great depths, and the riverbanks sometimes give up mammoth tusks and the bodies of beasts long extinct. Buus Khaya, the Ice Rock, is a frozen bluff on a river terrace where a cavern opens into the permafrost itself. Inside, the walls are made of ancient ice and black earth, studded with bones, tusks, and whole creatures frozen in place, some of which wake when warmth reaches them. The deeper layers are colder than any Siberian winter."
 gate_dungeon_shamanka: "Shamanka"
 gate_dungeon_shamanka_desc: "On Olkhon island in Lake Baikal, a twin-peaked rock called Shamanka juts into the water and has been held sacred by the Buryat people for generations. At the rock's foot a cave opens just above the waterline, and from it a passage descends below the surface of the deepest lake in the world. Beneath lies a drowned city of stone and wood, its streets submerged in water so clear and cold that delvers can see far below their feet, and its towers lost in darkness further down. The things that live in Baikal's depths seem to have found their way in."

 # Oceania
 gate_dungeon_grose_hollow: "Grose Hollow"
 gate_dungeon_grose_hollow_desc: "West of Sydney, the Blue Mountains are a maze of sandstone cliffs and deep valleys hazed blue by the eucalyptus forest, with caves hidden in many of their gorges. Grose Hollow opens at the foot of a waterfall in one of the most remote valleys, behind the curtain of falling water. Inside lies a cavern dungeon of crystal-hung chambers, underground rivers, and tight passages that open suddenly onto halls of glittering limestone. Its denizens are strange even by dungeon standards, with marsupial forms twisted into something far more dangerous."
 gate_dungeon_ketetahi: "Ketetahi"
 gate_dungeon_ketetahi_desc: "In the volcanic heart of the North Island, three great mountains rise from a desert plateau of ash and tussock, and their slopes steam with hot springs and vents. Ketetahi is one such vent on the flank of a smouldering cone, where the springs run boiling and the ground opens into a glowing fissure. The dungeon below is crossed by rivers of lava, pools of sulphurous water, and ash-choked caverns, and its denizens seem to rise from the very rock as a party passes."

 # Canada
 gate_dungeon_nunataq: "Nunataq"
 gate_dungeon_nunataq_desc: "On the high ice caps of the far Arctic, black rock peaks sometimes pierce the ice like the tips of buried mountains. One of them hides an opening at its base, where the ice has pulled away from the rock, leading down into Nunataq. The dungeon is a labyrinth between rock and ice: frozen chasms, ice-locked galleries, and chambers where the old mountain beneath the ice is still visible through walls of blue. Few dungeons are as far from help, and few parties reach it without losing someone to the journey."
 gate_dungeon_red_deer_hollow: "Red Deer Hollow"
 gate_dungeon_red_deer_hollow_desc: "Along the Red Deer River the prairie drops suddenly into badlands, a broken country of striped hills, hoodoos, and dry gullies where the bones of giant beasts weather out of the rock. Red Deer Hollow is a cave at the foot of a cluster of hoodoos, its mouth framed by fossil bones like the ribs of a great beast. Inside lie dry caverns of banded rock, collapsed galleries, and chambers full of bone, and delvers report that the skeletons within do not always stay still."

 # Pacific Coast
 gate_dungeon_tahoma_vent: "Tahoma Vent"
 gate_dungeon_tahoma_vent_desc: "Tahoma, the great white mountain of the Cascades, rises above dense forests of fir and cedar, its summit crowned with glaciers. Beneath the ice, though, the mountain is very much alive. Tahoma Vent opens in a steaming fissure high on its flanks, where a lava tube runs back into the volcano beneath the glaciers. The dungeon beyond is one of fire rather than ice: basalt galleries, lava rivers, and magma chambers, their passages wreathed in steam where meltwater seeps in from the glaciers above."
 gate_dungeon_kaibab_vault: "Kaibab Vault"
 gate_dungeon_kaibab_vault_desc: "Below the Kaibab plateau, the Colorado River has carved a canyon a mile deep, its walls banded red, ochre, and grey. Partway down one of its side canyons, a doorway carved with unfamiliar figures stands in the sheer rock, flanked by columns cut from the canyon wall. Kaibab Vault is a dungeon of sandstone halls, sarcophagi, and treasure vaults, sealed rooms full of sand and corridors guarded by traps. Its style resembles nothing that any people of the region has ever built, which has done much to fuel the debate about where dungeon themes come from."

 # Great Plains
 gate_dungeon_paha_sapa: "Paha Sapa"
 gate_dungeon_paha_sapa_desc: "The Black Hills rise from the Great Plains as an island of dark pine forest, sacred to the Lakota and riddled beneath with caves whose wind breathes in and out of the ground. Paha Sapa opens in a small cleft among granite outcrops, a cave whose breath is warm and smells of iron. Inside it branches into a maze of crystal-lined passages, boxwork formations, and chambers glittering with calcite, so complex that parties mark their path in chalk only to find the marks gone on the way back."
 gate_dungeon_ville_engloutie: "Ville Engloutie"
 gate_dungeon_ville_engloutie_desc: "In the bayous south of the Mississippi, cypress trees stand knee-deep in still brown water, their branches draped with Spanish moss. Deep in one such swamp, the roof of a stone building rises from the water with no land around it, its upper windows just above the surface. The trappers who found it call it the Ville Engloutie, the Swallowed Town. Through the windows lies a drowned city of flooded streets, sunken plazas, and moss-hung halls, home to great alligators and worse things that hunt beneath the black water."

 # Atlantic Coast
 gate_dungeon_echo_deep: "Echo Deep"
 gate_dungeon_echo_deep_desc: "Beneath the green hills of Kentucky lie the longest known caves in the world, a labyrinth of passages and underground rivers that has never been fully mapped. Echo Deep opens near the river that runs through them, in a sinkhole hidden by sycamores. The dungeon below is a vast cave system of underground rivers, gypsum-crusted passages, and domed halls, where every sound echoes back long after it should have faded. Some of the echoes come back with words that were never spoken."
 gate_dungeon_pahayokee: "Pahayokee"
 gate_dungeon_pahayokee_desc: "The Everglades of southern Florida are a slow river of grass broken by hammocks of hardwood trees, mangrove islands, and alligator holes. Pahayokee, from the old name for the grassy waters, is a hammock deep in the sawgrass where the trees grow so densely that their canopy closes into a tunnel. The tunnel leads down into a tropical dungeon of swamp forest, mangrove tangles, and steaming pools, where the air is thick with insects and the water is never as shallow as it looks."

 # Central America
 gate_dungeon_chen_ha: "Ch'en Ha"
 gate_dungeon_chen_ha_desc: "The flat limestone of the Yucatan has no rivers on its surface; its water runs underground and comes to light only in cenotes, round sinkholes of clear blue water hung with vines. Ch'en Ha, the Water Cave, is a cenote whose stone stair descends past the waterline and keeps going, dry-shod, into a drowned city beneath the jungle. Stepped temples rise from flooded plazas, carved stelae stand waist-deep in water, and the underground river that feeds the cenote runs through streets no one has walked in living memory."
 gate_dungeon_uxwitz: "Uxwitz"
 gate_dungeon_uxwitz_desc: "In the lowland forests of the Peten, the jungle conceals the stepped pyramids of cities abandoned centuries before any European arrived, their summits rising above the canopy like islands. Uxwitz, the Three Hills, is a group of three overgrown pyramids, the largest with a temple doorway at its summit that leads downward rather than in. Below is a tropical dungeon of buried plazas, jungle-choked courts, and overgrown palaces, home to jaguars, serpents, and creatures out of the old carvings."

 # Brazil
 gate_dungeon_igapo_escuro: "Igapó Escuro"
 gate_dungeon_igapo_escuro_desc: "When the rivers of the Amazon flood each year, they spread for miles into the forest, drowning the trunks of the trees and turning the jungle into a dim maze of black water. Igapó Escuro, the Dark Flooded Forest, is a stretch of such forest where the water never recedes, even in the dry season. Canoes can paddle into it from the river, and beyond a certain point the forest becomes a dungeon: layer upon layer of drowned jungle, rotting wood, and giant lilies, haunted by caimans, anacondas, and things that hunt in the dark water beneath the boats."
 gate_dungeon_gruta_diamantina: "Gruta Diamantina"
 gate_dungeon_gruta_diamantina_desc: "In the Chapada Diamantina, the tablelands of the Bahian interior, diamond hunters have long worked the rivers and gravels below the cliffs. Among the caves of the plateau is the Gruta Diamantina, whose entrance leads to a pool of water so clear and blue that it seems to glow when sunlight falls into it. Past the pool, the cave becomes a dungeon of sparkling caverns, crystal-encrusted galleries, and underground rivers, and its chests are known above all for gemstones."

 # Andes
 gate_dungeon_chamak_uta: "Ch'amak Uta"
 gate_dungeon_chamak_uta_desc: "Lake Titicaca lies so high in the Andes that the air is thin and the light hard and bright, and its people have long told of a city that the lake swallowed. Ch'amak Uta, the Dark House, is reached by reed boat from the shore: a ring of carved stones standing in the shallows, with a stone stairway descending between them into the lake. Below the surface, the stair leads to a drowned city of massive fitted stone, flooded temples, and sunken terraces, cold as the lake itself and inhabited by creatures that swim through the streets as though the water were air."
 gate_dungeon_nina_uchku: "Nina Uchku"
 gate_dungeon_nina_uchku_desc: "Above the white stone city of Arequipa rise three great volcanoes, the most perfect of them a symmetrical snow-capped cone. On the high desert at their feet, among lava flows and fields of pumice, a fissure called Nina Uchku, the Fire Hole, breathes heat into the cold mountain air. Beneath it lies a volcanic dungeon of glowing galleries and magma chambers, and its denizens are said to resemble the burning spirits of old mountain legends."

 # La Plata
 gate_dungeon_glaciar_del_silencio: "Glaciar del Silencio"
 gate_dungeon_glaciar_del_silencio_desc: "In the far south of Patagonia, the great southern ice field pours glaciers down into turquoise lakes, their fronts collapsing into the water with a sound like cannon fire. One glacier, however, never calves and never makes a sound: the Glaciar del Silencio. Where it meets the lake, a tunnel opens in its face into a dungeon of blue ice, frozen caverns, and crevasses that plunge deeper than the glacier is thick. It is one of the deepest ice dungeons known, and the silence inside is so complete that parties communicate by hand signals rather than risk speaking."
 gate_dungeon_tavarangue: "Tavarangue"
 gate_dungeon_tavarangue_desc: "In the forests near the upper Parana, the red sandstone ruins of an old mission town stand among the trees: church walls, colonnades, and the stone houses of a settlement long abandoned. The Guarani call such ruins tavarangue, the town that was. Beneath the ruined church, a crypt stair leads into a dungeon of stone halls, cloisters, and vaulted chambers that seem to belong to a castle rather than a mission, garrisoned by armoured figures who guard the deeper layers in silence."

 # Gran Colombia
 gate_dungeon_mawari_sima: "Mawari Sima"
 gate_dungeon_mawari_sima_desc: "In the south of Guayana, flat-topped mountains called tepuis rise sheer from the rainforest, their summits isolated worlds of strange plants and constant rain. On the summit of one, a great round sinkhole plunges into the mountain, its floor covered in forest. The Pemon say the mawari, the mountain spirits, live there. Mawari Sima is the dungeon at the bottom of the pit: a tropical labyrinth of lost forest, waterfalls, and creatures found nowhere else."
 gate_dungeon_guatavita: "Guatavita"
 gate_dungeon_guatavita_desc: "In the highlands above Bogota lies Lake Guatavita, a round lake in a green crater where the Muisca once crowned their chiefs by covering them in gold dust and sending them out onto the water to make offerings. Treasure hunters have tried to drain it more than once. The dungeon of Guatavita is entered from a carved stone platform on the shore; its stair descends into a drowned city of gold-lit halls, flooded ceremonial plazas, and submerged temples, and its chests are said to be heavy with gold ore."

 # Near East
 gate_dungeon_malakopi: "Malakopi"
 gate_dungeon_malakopi_desc: "In the tuff valleys of the Anatolian plateau, people have carved homes, churches, and entire underground towns into the soft volcanic rock for millennia. Malakopi is one such underground town, its rolling stone doors and ventilation shafts much like those of its neighbours, except that it has more levels than anyone ever carved. Below the oldest cellars the dungeon proper begins: halls, chapels, storerooms, and guard posts cut with precision into living rock, defended by garrisons that seem to know every tunnel."
 gate_dungeon_khaznat_al_layl: "Khaznat al-Layl"
 gate_dungeon_khaznat_al_layl_desc: "In the mountains east of the Wadi Araba, the Nabataeans carved tombs and temples into the rose-red cliffs of their hidden city, reached only through a narrow winding gorge. Khaznat al-Layl, the Treasury of Night, is a carved facade in a side gorge that does not appear in any traveller's account, its columns and pediments cut in dark stone that seems to swallow the sun. Behind it lies a dungeon of rock-cut halls, burial chambers, and treasure vaults, where sand drifts through corridors far beneath the cliffs and guardians in ancient armour wait in the dark."

 # Arabia
 gate_dungeon_ubar: "Ubar"
 gate_dungeon_ubar_desc: "Along the frankincense routes of Dhofar, legend tells of a city of towers in the sands that grew proud and was swallowed by the desert. Ubar is the dungeon that bears its name: a collapsed sinkhole at the edge of the Empty Quarter, ringed by the stumps of fallen towers, with a stair leading down into the sand. Below lies a buried city of pillared halls, sand-filled streets, and royal tombs, where the wind can be heard howling even in the deepest layers and the sand moves like water around a party's feet."
 gate_dungeon_bir_barhut: "Bir Barhut"
 gate_dungeon_bir_barhut_desc: "In the desert of al-Mahra lies a huge round pit in the ground, which local tradition has long called the Well of Barhut and held to be the prison of evil spirits. Few have ever climbed down into it. Bir Barhut, the dungeon, begins at the bottom of the pit, where a cave opens into a labyrinth of dry caverns, cascading travertine, and chambers thick with the smell of sulphur. Its denizens are serpents, swarms, and stranger things, and they seem to drive parties downward rather than let them leave."

 # Greater Persia
 gate_dungeon_takht_e_tariki: "Takht-e Tariki"
 gate_dungeon_takht_e_tariki_desc: "Near the ruins of the ancient Persian royal capital, the tombs of the old kings are carved high into a cliff face, their facades shaped like the fronts of palaces. Takht-e Tariki, the Throne of Darkness, is a tomb facade cut lower in the cliff than the others, its doorway at ground level and its reliefs showing a king whose features have been chiselled away. Inside lies a dungeon of pillared halls, royal burial vaults, and sand-swept treasuries, guarded by winged beasts of stone that move when no one is watching."
 gate_dungeon_zendan_e_damavand: "Zendan-e Damavand"
 gate_dungeon_zendan_e_damavand_desc: "Damavand rises above the Alborz range as a lone volcanic cone, the highest mountain in the land, its summit steaming with sulphur vents. In the Shahnameh, the hero Fereydun chained the serpent-shouldered tyrant Zahhak in a cave beneath the mountain, where he is said to remain. Zendan-e Damavand, the Prison of Damavand, opens in a steaming cave on the mountain's flank: a volcanic dungeon of fire, chains, and brimstone, its layers descending toward something that rattles iron in the deep."

 # Central Asia
 gate_dungeon_muz_tor: "Muz-Tör"
 gate_dungeon_muz_tor_desc: "In the high Tian Shan, glaciers fill the valleys between peaks, and the Kyrgyz herders bring their flocks beneath them only in summer. Muz-Tör, the Hall of Ice, opens where a glacier spills over a cliff into a high valley, its entrance a frozen arch above the summer pastures. Within, the glacier becomes a dungeon of frozen halls, ice bridges, and blue chambers where the cold is matched by howling winds that have no business blowing underground."
 gate_dungeon_kara_kala: "Kara Kala"
 gate_dungeon_kara_kala_desc: "Around the oasis of Merv, the ruins of cities built one beside another over millennia spread across the desert: fallen walls, mud-brick fortresses, and mausoleums standing alone in the sand. Kara Kala, the Black Fortress, is one of the ruined mud-brick keeps, its fluted walls darker than those of its neighbours. Inside its courtyard a stair leads down into a dungeon of buried halls, mausoleum vaults, and sand-choked streets, where the treasures of long-dead kings lie under the guard of their equally dead retainers."

 # South India
 gate_dungeon_simhagiri: "Simhagiri"
 gate_dungeon_simhagiri_desc: "In the forests of central Ceylon, a great rock rises sheer from the jungle, and on its summit lie the ruins of a palace built by a king who once ruled from the sky. Its old gateway was shaped as an enormous lion, of which only the stone paws remain. Simhagiri, the Lion Rock, is entered between those paws: a passage into the rock that leads to a dungeon of royal halls, painted galleries, terraced gardens, and guardrooms, held by a garrison of stone lions and armoured guardians."
 gate_dungeon_irul_kaavu: "Irul Kaavu"
 gate_dungeon_irul_kaavu_desc: "Across Travancore, villages keep sacred groves called kaavu, patches of ancient forest left untouched around shrines to serpents and forest spirits. Irul Kaavu, the Dark Grove, is a kaavu high in the Western Ghats where stone serpent idols stand among the roots and the canopy never lets the sun through. Behind the shrine lies a tropical dungeon of rainforest, mossy terraces, and waterfalls, crawling with serpents of every size, and parties report that the forest grows thicker and darker with each layer."

 # Himalayas
 gate_dungeon_nagpo_dzong: "Nagpo Dzong"
 gate_dungeon_nagpo_dzong_desc: "In the arid canyons of western Tibet, the ruins of a vanished kingdom cling to eroded clay cliffs, fortress walls and temples built into the very ridges. Nagpo Dzong, the Black Fortress, is a ruined citadel atop one such ridge, its walls riddled with cave chambers. Through one of these a tunnel leads into the ridge and down into a dungeon of stone halls, temple chambers, and guard towers rising and falling through the heart of the mountain, defended by warriors in lacquered armour who fight in perfect silence."
 gate_dungeon_gangri_phug: "Gangri Phug"
 gate_dungeon_gangri_phug_desc: "In the high valleys below the world's tallest peaks, glaciers grind slowly down from the snows toward the villages of the Sherpa and their monasteries. Gangri Phug, the Snow Mountain Cave, opens high on a glacier beneath one of the great peaks, a blue chasm that climbers and herders alike avoid. It is the deepest ice dungeon known, a descent through layer after layer of frozen halls, crevasses, and icefalls, where the cold and the thin air are as deadly as anything that lives there."

 # North India
 gate_dungeon_andheri_baori: "Andheri Baori"
 gate_dungeon_andheri_baori_desc: "In the dry country of Rajputana, villages dug great stepwells, carving staircases down through many storeys to reach the water hidden below the desert. Andheri Baori, the Dark Stepwell, is one of these: a vast square shaft lined with zigzagging steps that descend far past where any water table should lie. At its bottom the water does not end in a pool but opens into a drowned city of pillared halls, submerged galleries, and flooded palaces, where shadows move beneath the water and the steps keep descending."
 gate_dungeon_krem_ksuid: "Krem Ksuid"
 gate_dungeon_krem_ksuid_desc: "In the Khasi hills, among the wettest places on earth, rivers pour off the plateau into gorges choked with rainforest, and villagers train the roots of rubber trees across streams to grow living bridges. Krem Ksuid, the Spirit Cave, is reached by such a root bridge, spanning a gorge to a cave mouth curtained by ferns and falling water. Inside, the cave soon gives way to a tropical dungeon of humid jungle, root-tangled chambers, and roaring streams, where living roots move by themselves to close the way behind a party."
