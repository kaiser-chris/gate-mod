# Shared Tooltips
 gate_dungeon_tooltip_cohesion_check: "\n@information! This is a [Concept('concept_gate_dungeon_party_cohesion','$concept_gate_dungeon_party_cohesion_medium$')] check. We currently have [TopScope.GetLocalVariable('expedition').ScriptValue('gate_dungeon_party_cohesion_value')|1v] [Concept('concept_gate_dungeon_party_cohesion','$concept_gate_dungeon_party_cohesion_medium$')]."
 gate_dungeon_tooltip_condition_check: "\n@information! This is a [Concept('concept_gate_dungeon_party_condition','$concept_gate_dungeon_party_condition_medium$')] check. We currently have [TopScope.GetLocalVariable('expedition').ScriptValue('gate_dungeon_party_condition_value')|1v] [Concept('concept_gate_dungeon_party_condition','$concept_gate_dungeon_party_condition_medium$')]."
 gate_dungeon_tooltip_renown_check: "\n@information! This is a [Concept('concept_gate_dungeon_party_renown','$concept_gate_dungeon_party_renown_medium$')] check. We currently have [TopScope.GetLocalVariable('expedition').ScriptValue('gate_dungeon_party_renown_value')|1v] [Concept('concept_gate_dungeon_party_renown','$concept_gate_dungeon_party_renown_medium$')]."
 gate_dungeon_tooltip_other_route: "The [concept_gate_dungeon_party] will search for another way around the obstacle"
# Events
 gate_dungeon_delve_1_t: "Something Underfoot"
 gate_dungeon_delve_1_d: "The [concept_gate_dungeon_party] scouts have detected a trap. How are we going to deal with it?"
 gate_dungeon_delve_1_f: "The corridor ahead looked no different from the last twenty stretches of it, until our scout raised a fist and the column stopped without a word passing between them. She'd found the tripwire first, then the pressure plate beneath a shift in the dust that shouldn't have been there. Spears, from the look of the housing cut into the walls, old work but not decayed, the way nothing in a dungeon decays until something walks through it again."
 gate_dungeon_delve_1_a: "Our experienced scouts can disarm it."
 gate_dungeon_delve_1_b: "Send someone to trigger it and dodge the spears."
 gate_dungeon_delve_1_c: "Use some of our equipment to disable the trap."
 gate_dungeon_delve_2_t: "The Way Is Shut"
 gate_dungeon_delve_2_d: "The passage ahead has collapsed, leaving the [concept_gate_dungeon_party] facing a wall of broken stone. How do we get past it?"
 gate_dungeon_delve_2_f: "The rubble was fresh. Dust still hung in the lantern light and some of the stones had edges sharp enough to cut a glove. Nobody had heard it come down, which was the part that bothered the men most. Behind the pile, faint but unmistakable, a draft was blowing from somewhere deeper in the layer."
 gate_dungeon_delve_2_a: "Put our tools to work and dig through."
 gate_dungeon_delve_2_b: "There is a gap near the ceiling. Squeeze through one by one."
 gate_dungeon_delve_2_c: "We have seen collapses like this before. There is always a way around."
 gate_dungeon_delve_3_t: "A Fall in the Dark"
 gate_dungeon_delve_3_d: "One of the [concept_gate_dungeon_party] has taken a bad fall and can barely walk. What should we do with them?"
 gate_dungeon_delve_3_f: "A loose step, a short cry, and then the sound every delver learns to dread: a body landing wrong. By the time the others had climbed down, the ankle was already swelling past the boot. He insisted he could walk. He could not, and everyone standing around him knew it."
 gate_dungeon_delve_3_a: "Nobody gets left behind. We carry them."
 gate_dungeon_delve_3_b: "Splint the leg with what we have and keep moving."
 gate_dungeon_delve_3_c: "Leave them at a marked spot. We will collect them on the way back."
 gate_dungeon_delve_4_t: "Footsteps Ahead"
 gate_dungeon_delve_4_d: "A pack of the [concept_gate_dungeon]'s denizens is moving through the chamber ahead of the [concept_gate_dungeon_party]. How should we respond?"
 gate_dungeon_delve_4_f: "They heard the creatures before they saw them: claws on stone, a low rhythm of breathing that did not quite match any animal the party had a name for. Lanterns were shuttered at once. In the dark, the column pressed itself against the wall and counted the shapes passing through the chamber below. There were more of them than anyone liked."
 gate_dungeon_delve_4_a: "Set an ambush and strike first."
 gate_dungeon_delve_4_b: "Stay hidden and wait for them to move on."
 gate_dungeon_delve_4_c: "Walk out in the open. They know better than to challenge us."
 gate_dungeon_delve_5_t: "Too Easy"
 gate_dungeon_delve_5_d: "The [concept_gate_dungeon_party] has found a chest sitting unguarded in the middle of an empty room. Should we open it?"
 gate_dungeon_delve_5_f: "It sat in the middle of the floor like it had been placed there for them, iron-banded and without a speck of dust on the lid. Chests were the reason anyone came down here at all, and every man in the party wanted to be the one to open it. The older hands were the only ones who hung back, eyeing the corners of the room instead."
 gate_dungeon_delve_5_a: "Open it carefully and see what is inside."
 gate_dungeon_delve_5_b: "Let our most experienced delver inspect it first."
 gate_dungeon_delve_5_c: "Nothing down here is free. Leave it."
 gate_dungeon_delve_6_t: "The Corridor Moved"
 gate_dungeon_delve_6_d: "The path the [concept_gate_dungeon_party] took only an hour ago no longer leads where it did. How do we find our bearings?"
 gate_dungeon_delve_6_f: "The chalk marks were still there on the wall, their own marks, in their own hand. But the corridor beyond them now bent left where it had run straight, and a door stood where there had been solid rock. Scholars back home argued about whether a dungeon could think. None of the scholars had ever stood in a hallway that had rearranged itself behind them."
 gate_dungeon_delve_6_a: "Stop, survey the layout again and map it properly."
 gate_dungeon_delve_6_b: "Trust our instincts and push forward before it changes again."
 gate_dungeon_delve_7_t: "Tempers in the Dark"
 gate_dungeon_delve_7_d: "A quarrel has broken out within the [concept_gate_dungeon_party] and threatens to turn into something worse. How do we handle it?"
 gate_dungeon_delve_7_f: "It started over something small, a misplaced ration or a watch shift someone swore they had already taken. Days without sunlight make small things large. By the time the leader stepped in, two of the men had their hands on their weapons, and the rest of the party had quietly picked sides."
 gate_dungeon_delve_7_a: "Our leader's word is enough to settle this."
 gate_dungeon_delve_7_b: "Let them talk it out. They need each other down here."
 gate_dungeon_delve_7_c: "Break out the good rations and give everyone a proper rest."
 gate_dungeon_delve_8_t: "Spoiled Stores"
 gate_dungeon_delve_8_d: "Part of the [concept_gate_dungeon_party]'s supplies has spoiled overnight. What should we do?"
 gate_dungeon_delve_8_f: "The bread had gone green in a single night and the water skins smelled of copper. Something in the air of this layer ate at everything they had carried in. The quartermaster turned over sack after sack, and with each one his expression grew a little more grim."
 gate_dungeon_delve_8_a: "Cut the rations and make do with what is left."
 gate_dungeon_delve_8_b: "Throw out everything that is spoiled and press on."
 gate_dungeon_delve_8_c: "Search the layer for clean water and anything edible."
 gate_dungeon_delve_9_t: "The Bridge Across"
 gate_dungeon_delve_9_d: "A deep chasm splits the layer, spanned only by an old and narrow bridge. How should the [concept_gate_dungeon_party] cross?"
 gate_dungeon_delve_9_f: "Stones dropped over the edge never made a sound. The bridge was a single span of carved rock no wider than a man's shoulders, without rails, and it hummed faintly when the scout set a boot on it. On the far side, the passage continued as if a chasm in the middle of it were the most natural thing in the world."
 gate_dungeon_delve_9_a: "Cross one at a time, slowly and steadily."
 gate_dungeon_delve_9_b: "Rig safety lines and anchor them on both sides."
 gate_dungeon_delve_9_c: "Not worth the risk. Look for another way."
 gate_dungeon_delve_10_t: "Humming Stones"
 gate_dungeon_delve_10_desc: "A ring of glowing stones blocks the way forward, thick with mana. How should the [concept_gate_dungeon_party] proceed?"
 gate_dungeon_delve_10_f: "The stones stood in a half circle across the passage, each one taller than a man and pulsing with a slow pale light. The air between them was heavy enough to taste. A rat that wandered too close simply stopped, and did not start again. Whatever this was, it had not been built by any hand the party knew of."
 gate_dungeon_delve_10_a: "Brace ourselves and force our way through."
 gate_dungeon_delve_10_b: "We have seen wards like this before. We know how to pass them."
 gate_dungeon_delve_10_c: "Watch the pulse and slip through between the flashes."
 gate_dungeon_delve_10_d: "Leave it be and search for a route around."
 gate_dungeon_delve_11_t: "Those Who Came Before"
 gate_dungeon_delve_11_d: "The [concept_gate_dungeon_party] has found the remains of an earlier party. What do we do with them?"
 gate_dungeon_delve_11_f: "There were five of them, or what was left of five, huddled against a wall as though they had been waiting for something. Their packs were still strapped to their backs and one of them clutched a leather journal to his chest. Nothing in a dungeon decays until something walks through it again. They had been waiting a long time."
 gate_dungeon_delve_11_a: "Search their packs. They will not need the supplies anymore."
 gate_dungeon_delve_11_b: "Give them a proper burial and a moment of silence."
 gate_dungeon_delve_11_c: "Take the journal and follow the notes they left."
