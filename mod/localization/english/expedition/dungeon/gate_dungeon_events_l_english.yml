# Events
 gate_dungeon_delve.1.t: "Something Underfoot"
 gate_dungeon_delve.1.d: "The [concept_gate_dungeon_party] scouts have detected a trap. How are we going to deal with it?"
 gate_dungeon_delve.1.f: "The corridor ahead looked no different from the last twenty stretches of it, until our scout raised a fist and the column stopped without a word passing between them. She'd found the tripwire first, then the pressure plate beneath a shift in the dust that shouldn't have been there. Spears, from the look of the housing cut into the walls, old work but not decayed, the way nothing in a dungeon decays until something walks through it again."
 gate_dungeon_delve.1.a: "Our experienced scouts can disarm it."
 gate_dungeon_delve.1.b: "Send someone to trigger it and dodge the spears."
 gate_dungeon_delve.1.c: "Use some of our equipment to disable the trap."