l_english:
 gate_investigate_gate_closed_forever: "#r This will close the gate forever.#!"
 gate_investigate_gate.1.t: "Successful Investigation"
 gate_investigate_gate.1.d: "Our investigation of the [GetBuildingType('building_gate_alxa').GetName] has resulted in [GetTechnology('gate_expeditions').GetName]."
 gate_investigate_gate.1.f: "After months of relentless study and guarded whispers, our scholars finally unlocked the secrets of the captured magic gate. The ancient runes that once defied understanding now pulsed with life, revealing knowledge long lost to time. As the gate’s mysteries unfolded, streams of arcane energy flowed into our hands, reshaping our understanding of the world. With this newfound power, our country stands on the brink of a magical renaissance, poised to harness the forces that had eluded us for generations."
 gate_investigate_gate.1.a: "A whole new World to Explore."
 gate_investigate_gate.2.t: "Contact with the other Side"
 gate_investigate_gate.2.d: "Our investigation of the [GetBuildingType('building_gate_tyrol').GetName] has resulted in contact with [GetCulture('dwarven').GetName] representatives from [concept_gate_planet]."
 gate_investigate_gate.2.f: "For years the [GetBuildingType('building_gate_tyrol').GetNameNoFormatting] of Tyrol held its silence, its seals unbroken since the dwarves last controlled it. Our scholars measured every rune, tested every ward, until at last the old stone yielded and cold air breathed up from the dark beyond.\n\nThey were waiting for us.\n\nA delegation from Ankaris, bearing gifts of worked silver and sealed scrolls, offering words in careful, accented common tongue. They speak of no grievance for what was taken in war, only opportunity: a treaty of migration, a measured flow of their people to walk among us, and with them, knowledge, the shaping of magic long denied to Earth. Whether this is a ploy, or simply the dwarven way of turning conquest into commerce, our envoys cannot say. But the gate stands open, and the dwarves of $gate_planet$ stand ready to talk."
 gate_investigate_gate.2.a: "They could be helpful."
 gate_investigate_gate.2.b: "We don't want them."
