 gate_investigate_gate.5.t: "The Gate That Would Not Open"
 gate_investigate_gate.5.d: "Our investigation of the [GetBuildingType('building_gate_equateur').GetName] has resulted in contact with [GetCulture('orcish').GetName] representatives from [concept_gate_planet]."
 gate_investigate_gate.5.f: "The orks had not simply sealed this gate, they had fought it shut, wedging iron and bone into every crack, binding the stone with crude but stubborn magic before the last of them fell back from the line. It took our researchers longer than any of the others to break.\n\nWhen it finally gave, there was no ceremony waiting on the other side. Only silence, and then movement in the dark — wary, armed, watching.\n\nThey did not come as petitioners. A warlord's banner-bearers stood at the threshold, scarred and unsmiling, sizing up the people who had taken their gate by force. There was no pretense between either side about what this was: a conquered people, looking for a place to stand in a world that had already beaten them once. What they offer is blunt, labor, muscle, numbers, and what they want in return is just as plain: enough grain and fruit to fill bellies that have gone empty too long, and enough weapons to protect their people on $gate_planet$."
 gate_investigate_gate.5.a: "They could be helpful."
 gate_investigate_gate.5.b: "We don't want them."
 gate_investigate_gate.6.t: "Voices Beyond the Silent Gate"
 gate_investigate_gate.6.d: "Our investigation of the [GetBuildingType('building_gate_eastern_new_guinea').GetName] has resulted in contact with [GetCulture('gnomish').GetName] representatives from [concept_gate_planet]."
 gate_investigate_gate.6.f: "For years the Gate on the eastern shore of New Guinea stood exactly as the gnomes had left it: warded shut, its runes cold, a monument to a nation whose leaders chose exile over our flag. Our mages called it a dead thing, not worth further study, until a persistent researcher proved the sealing spell was not eternal, only patient.\nWhen the wardstone finally cracked, we expected to find silence on the other side. Instead we found a delegation already waiting, composed and unsurprised, as if they had been watching the gate from $gate_planet$ for longer than we care to guess.\nOur envoys report the meeting was not hostile. If anything, it was more hopeful than our advisors expected. The exiles have not given up on Earth. They speak of the coast they raised and the harbors they built, and they are willing to bargain hard for the chance to see them again.\nOur military planners have already made their position clear. The gate is a chokepoint, heavily warded and heavily defended, and forcing it open by the sword would cost more blood than the prize is worth. Whatever we want from these gnomes, it will be won at the negotiating table, not on the battlefield."
 gate_investigate_gate.6.a: "They could be helpful."
 gate_investigate_gate.6.b: "We don't want them."