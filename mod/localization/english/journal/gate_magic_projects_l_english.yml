# Generic Events
 gate_arcanist_project.1.t: "Magical Experiment"
 gate_arcanist_project.1.d: "Our [concept_gate_magic_researcher] has proposed a risky experiment as part of his current [concept_gate_project]."
 gate_arcanist_project.1.f: "[SCOPE.sCharacter('gate_project_researcher').GetFullNameNoFormatting] came to the ministry with a request and a thick folder of notes. The work had stalled, [SCOPE.sCharacter('gate_project_researcher').GetSheHe] said, and the safe methods had nothing more to give. One more test, at higher yields and with fewer safeguards, would either settle the matter or show that it couldn’t be settled."
 gate_arcanist_project.1.a: "Progress demands it."
 gate_arcanist_project.1.a.result_tooltip: "The experiment will either #g succeed#! or #r fail#!"
 gate_arcanist_project.1.a.fail.t: "$gate_arcanist_project.1.t$: Failure"
 gate_arcanist_project.1.a.fail.d: "The experiment was a failure.\n[GetScriptedGui('gate_arcanist_project_1_fail').ExecuteTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).End)]"
 gate_arcanist_project.1.a.success.t: "$gate_arcanist_project.1.t$: Success"
 gate_arcanist_project.1.a.success.d: "The experiment was a success.\n[GetScriptedGui('gate_arcanist_project_1_success').ExecuteTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).End)]"
 gate_arcanist_project.1.b: "It's too risky."
 # Generic Events: Positive
 gate_arcanist_project.2.t: "A Sudden Insight"
 gate_arcanist_project.2.d: "Our [concept_gate_magic_researcher] has found a far simpler way to approach part of the current [concept_gate_project]."
 gate_arcanist_project.2.f: "[SCOPE.sCharacter('gate_project_researcher').GetFullNameNoFormatting] had been stuck on the same problem for weeks. The answer came over breakfast, and [SCOPE.sCharacter('gate_project_researcher').GetSheHe] wrote the first half of it on the tablecloth. By evening the assistants had checked it three times and found nothing wrong. A whole stage of #bold [SCOPE.sJournalEntry('gate_project_je').GetName]#! can now be skipped."
 gate_arcanist_project.2.a: "Put it to use at once."
 gate_arcanist_project.2.b: "Have it written up properly first."
 gate_arcanist_project.3.t: "A Gifted Assistant"
 gate_arcanist_project.3.d: "One of the assistants working on our [concept_gate_project] has turned out to be far more capable than expected."
 gate_arcanist_project.3.f: "The young assistant was hired to copy notes and clean instruments. Last week [SCOPE.sCharacter('gate_project_researcher').GetLastName] found a correction in the margin of the notes, and the correction was right. Since then the assistant has been given real work and has finished all of it early. [SCOPE.sCharacter('gate_project_researcher').GetLastNameNoFormatting] asks how such talent should be used."
 gate_arcanist_project.3.a: "Give them more of the work."
 gate_arcanist_project.3.b: "[SCOPE.sCharacter('gate_project_researcher').GetLastName] should teach them personally."
 gate_arcanist_project.4.t: "Notes From the Archive"
 gate_arcanist_project.4.d: "Old records have been found that bear directly on our current [concept_gate_project]."
 gate_arcanist_project.4.f: "A clerk looking for something else found a crate of unsigned notebooks in the cellar of the archive. Someone had worked on a problem very close to #bold [SCOPE.sJournalEntry('gate_project_je').GetName]#! years ago, and had got further than anyone knew. [SCOPE.sCharacter('gate_project_researcher').GetFullNameNoFormatting] spent two nights reading them and says that most of it holds up."
 gate_arcanist_project.4.a: "Use whatever helps the project."
 gate_arcanist_project.4.b: "Have the whole crate catalogued."
 # Generic Events: Negative
 gate_arcanist_project.5.t: "A Flawed Premise"
 gate_arcanist_project.5.d: "An assumption that part of our [concept_gate_project] rests on has turned out to be wrong."
 gate_arcanist_project.5.f: "The figures had refused to agree for a month. [SCOPE.sCharacter('gate_project_researcher').GetFullNameNoFormatting] finally traced the fault to a value that everyone had taken from the same textbook, and the textbook was wrong. Every result that was built on it since has to be thrown out. [SCOPE.sCharacter('gate_project_researcher').GetSheHe|U] delivered the news in person and didn't try to soften it."
 gate_arcanist_project.5.a: "Redo the work and move on."
 gate_arcanist_project.5.b: "Find out exactly why it was wrong."
 gate_arcanist_project.6.t: "Mana Discharge"
 gate_arcanist_project.6.d: "An uncontrolled discharge of [GetGoods('gate_mana').GetName] has destroyed equipment that our [concept_gate_project] depends on."
 gate_arcanist_project.6.f: "Nobody was hurt, which [SCOPE.sCharacter('gate_project_researcher').GetLastNameNoFormatting] mentions first and often. The discharge lasted less than a second. It melted the brass fittings and cracked every lens in the room, and the wallpaper has turned a colour that nobody can name. The instruments were built for #bold [SCOPE.sJournalEntry('gate_project_je').GetName]#! and can't simply be borrowed from elsewhere."
 gate_arcanist_project.6.a: "Rebuild with what the institute has."
 gate_arcanist_project.6.b: "Buy replacements at once."
 gate_arcanist_project.7.t: "An Exhausted Arcanist"
 gate_arcanist_project.7.d: "Our [concept_gate_magic_researcher] has been working without rest and it has begun to show."
 gate_arcanist_project.7.f: "[SCOPE.sCharacter('gate_project_researcher').GetFullNameNoFormatting] was found asleep at the workbench for the third morning in a row. The assistants say that [SCOPE.sCharacter('gate_project_researcher').GetSheHe] forgets meals and repeats [SCOPE.sCharacter('gate_project_researcher').GetHerHis] instructions, and yesterday [SCOPE.sCharacter('gate_project_researcher').GetSheHe] signed a requisition with the wrong name. [SCOPE.sCharacter('gate_project_researcher').GetSheHe|U] insists that [SCOPE.sCharacter('gate_project_researcher').GetSheHe] is perfectly well."
 gate_arcanist_project.7.a: "A few weeks of rest. That's an order."
 gate_arcanist_project.7.b: "The work can't wait."
 # Generic Events: Choice
 gate_arcanist_project.8.t: "Drawing on the Reserves"
 gate_arcanist_project.8.d: "Our [concept_gate_magic_researcher] proposes to spend stored [concept_gate_magic_innovation] to speed up the current [concept_gate_project]."
 gate_arcanist_project.8.f: "The institute keeps a stock of finished studies, prepared reagents and half-tested ideas for later use. [SCOPE.sCharacter('gate_project_researcher').GetFullNameNoFormatting] wants to use a good part of it now. With it, [SCOPE.sCharacter('gate_project_researcher').GetSheHe] says, months of preparation for #bold [SCOPE.sJournalEntry('gate_project_je').GetName]#! could be skipped. The stock would take a long time to build up again."
 gate_arcanist_project.8.a: "That's what the reserves are for."
 gate_arcanist_project.8.b: "The reserves stay where they are."
 gate_arcanist_project.9.t: "An Interesting Detour"
 gate_arcanist_project.9.d: "Work on our [concept_gate_project] has produced a result that nobody was looking for."
 gate_arcanist_project.9.f: "The result has nothing to do with #bold [SCOPE.sJournalEntry('gate_project_je').GetName]#!, and [SCOPE.sCharacter('gate_project_researcher').GetFullNameNoFormatting] admits as much. It is also the most interesting thing the institute has seen all year. [SCOPE.sCharacter('gate_project_researcher').GetSheHe|U] asks for a few weeks to follow it up before the trail goes cold. The project would have to wait in the meantime."
 gate_arcanist_project.9.a: "Follow it and see where it leads."
 gate_arcanist_project.9.b: "Make a note of it and stay with the project."
 gate_arcanist_project.10.t: "Request for Additional Funds"
 gate_arcanist_project.10.d: "Our [concept_gate_magic_researcher] asks for more money than was budgeted for the current [concept_gate_project]."
 gate_arcanist_project.10.f: "The request came with an itemised list four pages long. [SCOPE.sCharacter('gate_project_researcher').GetFullName] wants better instruments, two more assistants and a supplier who delivers on time. With all of that, #bold [SCOPE.sJournalEntry('gate_project_je').GetName]#! would be finished noticeably sooner. The treasury points out that the project already has a budget and that the budget was approved for a reason."
 gate_arcanist_project.10.a: "Grant the request in full."
 gate_arcanist_project.10.b: "The institute can pay for it from its own means."
 gate_arcanist_project.10.c: "The budget stands."
 gate_arcanist_project.11.t: "A Public Demonstration"
 gate_arcanist_project.11.d: "There are calls to show the public what our current [concept_gate_project] has achieved so far."
 gate_arcanist_project.11.f: "The newspapers have been asking what the institute does with its money, and several ministers would like to have an answer. They suggest a public demonstration of #bold [SCOPE.sJournalEntry('gate_project_je').GetName]#! with invited guests and the press. [SCOPE.sCharacter('gate_project_researcher').GetFullNameNoFormatting] replies that the preparations would cost weeks, and that half-finished work rarely looks like much."
 gate_arcanist_project.11.a: "Let the people see what we can do."
 gate_arcanist_project.11.b: "They can see it when it's finished."
 gate_arcanist_project.12.t: "Foreign Correspondence"
 gate_arcanist_project.12.d: "A scholar from [SCOPE.sCountry('other_country').GetName] offers to trade findings that would help our current [concept_gate_project]."
 gate_arcanist_project.12.f: "The letter is polite and well informed. Its author has been working on a related problem and has solved a part of it that still troubles #bold [SCOPE.sJournalEntry('gate_project_je').GetName]#!. In return the author asks for some of our own unpublished results. [SCOPE.sCharacter('gate_project_researcher').GetFullNameNoFormatting] would like to accept, but notes that we can't control where those results go afterwards."
 gate_arcanist_project.12.a: "A fair trade. Send them what they ask for."
 gate_arcanist_project.12.b: "Our findings stay in the country."
