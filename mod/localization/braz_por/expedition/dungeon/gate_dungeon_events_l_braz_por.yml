 gate_dungeon_tooltip_cohesion_check: "\n@information! This is a [Concept('concept_gate_dungeon_party_cohesion','$concept_gate_dungeon_party_cohesion_medium|q$')] check. We currently have [TopScope.GetLocalVariable('expedition').ScriptValue('gate_dungeon_party_cohesion_value')|1v] [Concept('concept_gate_dungeon_party_cohesion','$concept_gate_dungeon_party_cohesion_medium|q$')]."
 gate_dungeon_tooltip_condition_check: "\n@information! This is a [Concept('concept_gate_dungeon_party_condition','$concept_gate_dungeon_party_condition_medium|q$')] check. We currently have [TopScope.GetLocalVariable('expedition').ScriptValue('gate_dungeon_party_condition_value')|1v] [Concept('concept_gate_dungeon_party_condition','$concept_gate_dungeon_party_condition_medium|q$')]."
 gate_dungeon_tooltip_renown_check: "\n@information! This is a [Concept('concept_gate_dungeon_party_renown','$concept_gate_dungeon_party_renown_medium|q$')] check. We currently have [TopScope.GetLocalVariable('expedition').ScriptValue('gate_dungeon_party_renown_value')|1v] [Concept('concept_gate_dungeon_party_renown','$concept_gate_dungeon_party_renown_medium|q$')]."
 gate_dungeon_tooltip_other_route: "The [concept_gate_dungeon_party] will search for another way around the obstacle"
# Events
 gate_dungeon_delve_1_t: "Something Underfoot"
 gate_dungeon_delve_1_d: "The [concept_gate_dungeon_party] scouts have detected a trap. How are we going to deal with it?"
 gate_dungeon_delve_1_f: "The corridor ahead looked no different from the last twenty stretches of it, until our scout raised a fist and the column stopped without a word passing between them. She'd found the tripwire first, then the pressure plate beneath a shift in the dust that shouldn't have been there. Spears, from the look of the housing cut into the walls, old work but not decayed, the way nothing in a dungeon decays until something walks through it again."
 gate_dungeon_delve_1_a: "Our experienced scouts can disarm it."
 gate_dungeon_delve_1_b: "Send someone to trigger it and dodge the spears."
 gate_dungeon_delve_1_c: "Use some of our equipment to disable the trap."
 gate_dungeon_delve_2_t: "The Way Is Shut"
 gate_dungeon_delve_2_d: "The passage ahead has collapsed, leaving the [concept_gate_dungeon_party] facing a wall of broken stone. How do we get past it?"
 gate_dungeon_delve_2_f: "The rubble was fresh. Dust still hung in the lantern light and some of the stones had edges sharp enough to cut a glove. Nobody had heard it come down, which was the part that bothered the men most. Behind the pile, faint but unmistakable, a draft was blowing from somewhere deeper in the layer."
 gate_dungeon_delve_2_a: "Put our tools to work and dig through."
 gate_dungeon_delve_2_b: "There is a gap near the ceiling. Squeeze through one by one."
 gate_dungeon_delve_2_c: "We have seen collapses like this before. There is always a way around."
 gate_dungeon_delve_3_t: "A Fall in the Dark"
 gate_dungeon_delve_3_d: "One of the [concept_gate_dungeon_party] has taken a bad fall and can barely walk. What should we do with them?"
 gate_dungeon_delve_3_f: "A loose step, a short cry, and then the sound every delver learns to dread: a body landing wrong. By the time the others had climbed down, the ankle was already swelling past the boot. He insisted he could walk. He could not, and everyone standing around him knew it."
 gate_dungeon_delve_3_a: "Nobody gets left behind. We carry them."
 gate_dungeon_delve_3_b: "Splint the leg with what we have and keep moving."
 gate_dungeon_delve_3_c: "Leave them at a marked spot. We will collect them on the way back."
 gate_dungeon_delve_4_t: "A Quiet Spring"
 gate_dungeon_delve_4_d: "The [concept_gate_dungeon_party] has stumbled upon a clear spring in a chamber that seems untouched by the rest of the [concept_gate_dungeon]. How should we make use of it?"
 gate_dungeon_delve_4_f: "Nobody trusted it at first. Clean water, a ceiling of pale moss giving off a soft light, and not a single track in the sand around the pool. The scout spent the better part of an hour checking the walls before she would let anyone drink. When she finally waved them in, the relief that passed through the column was almost loud enough to hear."
 gate_dungeon_delve_4_a: "Refill the water skins and clean our gear."
 gate_dungeon_delve_4_b: "Make camp here and let everyone rest."
 gate_dungeon_delve_4_c: "Carve our company's mark above the spring for those who come after."
 gate_dungeon_delve_5_t: "Out of the Ceiling"
 gate_dungeon_delve_5_d: "Creatures have dropped onto the [concept_gate_dungeon_party] from the darkness above. There is no avoiding this fight, only choosing how to survive it."
 gate_dungeon_delve_5_f: "The first warning was a scream from the back of the column. By the time the lanterns swung upward, the ceiling was moving: pale, many-legged things that had been clinging to the rock all along, waiting for the party to pass beneath them. They came down in a rain of claws and chitin, and in the narrow corridor there was nowhere to run."
 gate_dungeon_delve_5_a: "Hold the line and fight them off, whatever it costs our gear."
 gate_dungeon_delve_5_b: "Scatter and regroup further down the corridor."
 gate_dungeon_delve_5_c: "Our veterans take the brunt of it. They have done this before."
 gate_dungeon_delve_6_t: "A Sleeping Giant"
 gate_dungeon_delve_6_d: "Something enormous is asleep across the only path forward. How should the [concept_gate_dungeon_party] get past it?"
 gate_dungeon_delve_6_f: "At first they took it for a rockslide. Then the rockslide breathed. The creature filled the hall from wall to wall, its sides rising and falling slow as a tide, each breath stirring the dust along the floor. A gap the width of a man ran between its back and the ceiling. Beyond it, the passage continued downward."
 gate_dungeon_delve_6_a: "Climb over it, quietly and one at a time."
 gate_dungeon_delve_6_b: "Kill it while it sleeps."
 gate_dungeon_delve_6_c: "Wait for it to wake and wander off, however long it takes."
 gate_dungeon_delve_7_t: "The Whispering Hall"
 gate_dungeon_delve_7_d: "The walls of this hall whisper to the [concept_gate_dungeon_party], and the voices know things they should not. How do we get through?"
 gate_dungeon_delve_7_f: "It began as a murmur at the edge of hearing, like a conversation in the next room. Then a name was spoken, a man's name, in his mother's voice. Then another. The walls knew who was afraid of the dark and who had lied about their debts back home, and they were telling everyone. Scholars still argue whether a dungeon can think. Nobody in that hall was arguing."
 gate_dungeon_delve_7_a: "Our veterans have heard worse. Follow them and ignore the voices."
 gate_dungeon_delve_7_b: "Run through it as fast as we can."
 gate_dungeon_delve_7_c: "Stuff our ears with wax and cloth and go slowly."
 gate_dungeon_delve_8_t: "Thieves in the Night"
 gate_dungeon_delve_8_d: "Something crept into the [concept_gate_dungeon_party]'s camp overnight and made off with a good share of our supplies. What now?"
 gate_dungeon_delve_8_f: "The sentry swore he had not slept. Yet the morning found the packs slit open, the ration tins gnawed through, and a trail of crumbs and torn canvas leading into a crack in the wall far too small for any of them to follow. Somewhere in the dark, something small and clever was having a feast at the party's expense."
 gate_dungeon_delve_8_a: "Let it go and tighten our belts."
 gate_dungeon_delve_8_b: "Punish the sentry as an example to the others."
 gate_dungeon_delve_8_c: "Widen the crack and try to recover what we can."
 gate_dungeon_delve_9_t: "Rising Water"
 gate_dungeon_delve_9_desc: "The passage ahead is flooded, and the water is still rising. How should the [concept_gate_dungeon_party] proceed?"
 gate_dungeon_delve_9_f: "The water was black and cold enough to make the teeth ache. It filled the corridor to the height of a man's chest and crept higher with every minute, fed from somewhere unseen. On the far side, maybe forty paces off, the floor climbed out of the water again. Forty paces is not far. It is a long way in the dark with a pack on your back."
 gate_dungeon_delve_9_a: "Lash the packs together and wade through."
 gate_dungeon_delve_9_b: "Wait on higher ground for the water to drop."
 gate_dungeon_delve_9_c: "We have crossed worse. Our best swimmers will run a line across."
 gate_dungeon_delve_9_d: "Turn back and find another way down."
 gate_dungeon_delve_10_t: "Fresh Tracks"
 gate_dungeon_delve_10_d: "The [concept_gate_dungeon_party] has found the trail of another party that passed through recently. Their markings are still clear. How do we make use of them?"
 gate_dungeon_delve_10_f: "Chalk arrows on the wall, a spent torch in a bracket, a neat little cairn of stones at every junction. Whoever had come through here had known what they were doing, and had taken the trouble to leave the way marked behind them. It was the closest thing to a kindness anyone had seen since the barrier closed behind them."
 gate_dungeon_delve_10_a: "Follow their trail."
 gate_dungeon_delve_10_b: "They left a supply cache behind. Help ourselves."
 gate_dungeon_delve_10_c: "Those are guild markings. We know exactly where they lead."
 gate_dungeon_delve_11_t: "The Mirror Pool"
 gate_dungeon_delve_11_d: "A still pool thick with mana reflects the [concept_gate_dungeon_party], though not quite as they are. What should we do with it?"
 gate_dungeon_delve_11_f: "The surface did not ripple when a stone was tossed in. It simply took the stone, and showed back the faces of the men standing around it: older in some cases, scarred in others, and in one case wearing a crown. The air above the pool tasted of copper and lightning. Everyone who had ever heard a story about a dungeon knew they ought to leave it alone. Nobody moved to leave."
 gate_dungeon_delve_11_a: "Drink from it and see what it shows us."
 gate_dungeon_delve_11_b: "Fill a few flasks. The mana might restore our gear."
 gate_dungeon_delve_11_c: "Our veterans know pools like this. Let them tell us what it means."
