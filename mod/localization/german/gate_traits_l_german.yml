 gate_arcanist_magic_sight: "Arkane Augen" #deepl:819776185
 gate_arcanist_magic_sight_desc: "Dieser Charakter hat sein normales Sehvermögen mit „[concept_gate_magic]“ zerstört. Seine Augen wirken auf andere zutiefst beunruhigend, ermöglichen es ihnen jedoch, Strömungen von „[concept_gate_magic]“ wahrzunehmen." #deepl:1310620690
 gate_arcanist_magic_voice: "Aschefarbene Stimme" #deepl:2242472114
 gate_arcanist_magic_voice_desc: "Dieser Charakter hat sich durch das wiederholte Anrufen verbotener Formeln die Kehle verbrannt. Dafür hat jedes Wort, das er ausspricht, einen unnatürlichen Nachhall, wodurch sich seine Zaubersprüche leichter formen lassen und seine Befehle schwerer zu ignorieren sind." #deepl:3141797067
 gate_arcanist_bound_name: "Name mit Siegel" #deepl:2665726043
 gate_arcanist_bound_name_desc: "Dieser Charakter hat einen Teil seines wahren Namens versiegelt, um sich vor feindseligen „[concept_gate_magic]“ zu schützen. Dies verleiht ihm Widerstandskraft gegen Flüche, Zwangsmaßnahmen und Beschwörungsrituale, schwächt ihn jedoch in sozialer Hinsicht, als könne ein wesentlicher Teil seiner Identität andere nicht mehr vollständig erreichen." #deepl:1622693922
 gate_arcanist_split_mind: "Gespaltener Geist" #deepl:1445802388
 gate_arcanist_split_mind_desc: "Diese Figur hat ihren Geist mithilfe von „[concept_gate_magic]“ in mehrere Teile aufgespalten. Das hilft ihr zwar dabei, komplexe Zusammenhänge zu verstehen, führt aber auch zu einer Form von Psychose, die andere Menschen von ihr fernhält." #deepl:2247299808
