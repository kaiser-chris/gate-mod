# Tutorial: Magic Research
 lesson_gate_magic_research_1: "Was sind „[Concept('concept_gate_magic_technology', '$concept_gate_magic_technologies$')]“?" #deepl:1847102770
 lesson_gate_magic_research_1_desc: "$concept_gate_magic_technologies$ Es handelt sich um eine eigenständige Forschungsart, die im Rahmen des „#v “ $gg_panel_base_title$ #! Panel durchgeführt wird." #deepl:3679376867
 lesson_gate_magic_research_1_continue: "Öffnen Sie das Fenster „#v “ unter $gg_panel_base_title$#!, um fortzufahren." #deepl:4138712577
 lesson_gate_magic_research_2: "$lesson_gate_magic_research_1$" #deepl:2949434703
 lesson_gate_magic_research_2_desc: "[concept_gate_magic_innovation] unterscheidet sich von der normalen „[concept_innovation]“ dadurch, dass sie so lange angesammelt wird, bis sie verbraucht ist oder ein Höchstwert erreicht ist. Den aktuellen Stand der angesammelten „[concept_gate_magic_innovation]“ finden Sie im Bereich „$gg_panel_base_title$“." #deepl:3876638969
 lesson_gate_magic_research_2_back: "Schließen Sie das Fenster „#v “ $gg_panel_base_title$ #!, um den Vorgang rückgängig zu machen." #deepl:417893798
 lesson_gate_magic_research_2_continue: "Öffnen Sie das Fenster „#v “ unter $gg_panel_base_title$#!, um Ihre „[concept_gate_magic_innovation]“ anzuzeigen." #deepl:4269335926
 lesson_gate_magic_research_3: "$lesson_gate_magic_research_1$" #deepl:2949434703
 lesson_gate_magic_research_3_desc: "[Concept('concept_gate_magic_technology', '$concept_gate_magic_technologies$')] gibt es in drei verschiedenen Varianten: #v  $PRODUCTION_NO_CONCEPT$ #!, #v  $MILITARY$ #! und #v  $SOCIETY$ #!" #deepl:4143362110
 lesson_gate_magic_research_3_continue: "Öffnen Sie die Registerkarte „#v “ $PRODUCTION_NO_CONCEPT$ #! im Bereich „#v “ $gg_panel_base_title$ #!, um fortzufahren." #deepl:1637637452
 lesson_gate_magic_research_4: "$lesson_gate_magic_research_1$" #deepl:2949434703
 lesson_gate_magic_research_4_desc: "[Concept('concept_gate_magic_technology', '$concept_gate_magic_technologies$')] Sie folgen der üblichen Kostenstruktur herkömmlicher Technologien und sind nach Epochen unterteilt. Im Gegensatz zu herkömmlichen „[Concept('concept_gate_magic_technology', '$concept_gate_magic_technologies$')]“ müssen sie mit deinen gesammelten „[concept_gate_magic_innovation]“ freigeschaltet werden." #deepl:3105305795
 lesson_gate_magic_research_4_back: "Schließen Sie die Registerkarte „#v “ $PRODUCTION_NO_CONCEPT$ #! im Bereich „#v “ $gg_panel_base_title$ #!, um zurückzugehen." #deepl:827980859
 lesson_gate_magic_research_4_continue: "Öffnen Sie die Registerkarte „#v “ $PRODUCTION_NO_CONCEPT$ #! im Bereich „#v “ $gg_panel_base_title$ #!, um die verfügbaren Technologien anzuzeigen." #deepl:1142172126
 # Tutorial: Magic Research
 lesson_gate_new_arcanist_1: "Wie stellt man einen neuen „[concept_gate_magic_researcher]“ ein?" #deepl:1110175922
 lesson_gate_new_arcanist_1_desc: "[Concept('concept_gate_magic_researcher','$concept_gate_magic_researchers$')] sind für die Erstellung von [concept_gate_magic_innovation] und den Betrieb von [Concept('concept_gate_project', Localize('concept_gate_projects'))] unerlässlich." #deepl:4061657130
 lesson_gate_new_arcanist_1_continue: "Öffnen Sie das Fenster „#v “ ($POPULATION$) unter „#!“ auf der Registerkarte „#v “ ($NATIONAL_CAST$) (#!), um fortzufahren." #deepl:609087637
 lesson_gate_new_arcanist_2: "$lesson_gate_new_arcanist_1$" #deepl:2853067706
 lesson_gate_new_arcanist_2_desc: "Am besten findest du deine verfügbaren „[Concept('concept_gate_magic_researcher','$concept_gate_magic_researchers$')]“, indem du die Suchleiste nutzt. Gib einfach „$concept_gate_magic_researcher$“ ein, um alle verfügbaren Charaktere anzuzeigen." #deepl:777100825
 lesson_gate_new_arcanist_2_back: "Schließen Sie das Fenster „#v “ $POPULATION$ #! auf der Registerkarte „#v “ $NATIONAL_CAST$ #!, um zurückzugehen." #deepl:2590980237
 lesson_gate_new_arcanist_2_continue: "Lassen Sie das Fenster „#v “ $POPULATION$ #! auf der Registerkarte „#v “ $NATIONAL_CAST$ #! geöffnet, um fortzufahren." #deepl:1103833130
 lesson_gate_new_arcanist_3: "$lesson_gate_new_arcanist_1$" #deepl:2853067706
 lesson_gate_new_arcanist_3_desc: "Klicke nun mit der rechten Maustaste auf den neuen „[concept_gate_magic_researcher]“ und wähle im Menü „Charakterinteraktionen“ die Option „$gate_promote_arcanist$“ aus." #deepl:3524670738
 lesson_gate_new_arcanist_3_finish: "Stelle einen neuen „[concept_gate_magic_researcher]“ ein, um das Tutorial abzuschließen." #deepl:295942492
