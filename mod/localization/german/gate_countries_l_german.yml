l_german:
 GATE_AD: "Arkturianische Herrschaft" #deepl:1296118789
 GATE_AD_ADJ: "Arcturian" #deepl:2809276789
 GATE_AD_FLAVOR_TEXT: "Die Elfen von $GATE_AD$, die durch ein Tor in Sambia auftauchten, etablierten sich schnell als eine beeindruckende Macht. Sie übernahmen das hierarchische System der Lunda-Königreiche und schufen ein Netzwerk von Marionettenstaaten, um ihre Herrschaft zu festigen. Sie dehnten ihren Einfluss weiter aus und integrierten die Tswana-Länder als Protektorat, wobei sie Diplomatie und Unterwerfung miteinander verbanden. Grenzkonflikte mit den portugiesischen und britischen Kolonien stellten ihre Entschlossenheit auf die Probe, festigten aber auch ihren Ruf als gerissene und entschlossene Macht." #deepl:1408892873
 GATE_AD_EMPIRE: "Das Hohe Reich der Arkturianer" #deepl:607692530
 GATE_AD_EMPIRE_ADJ: "Arkturianer" #deepl:2809276789
 GATE_MK: "Min Rätien" #deepl:2898985503
 GATE_MK_ADJ: "Raetisch" #deepl:112390768
 GATE_ME: "Imperium Raetium" #deepl:2114092892
 GATE_ME_ADJ: "Raetisch" #deepl:112390768
 GATE_MK_FLAVOR_TEXT: "$GATE_MK$ ist ein Zwergenvolk, das sich in den Alpen niedergelassen hat und in einer Personalunion mit $BAV$ steht. Obwohl $GATE_MK$ die Kontrolle über die gesamten Alpen anstrebt und es zu Konflikten kommt, verfolgen sie eine Politik der Integration mit den Mächten der Erde und fördern die Beziehungen durch Handel." #deepl:2628926738
 GATE_OK: "Orkische Vorherrschaft" #deepl:254170490
 GATE_OK_ADJ: "Orkisch" #deepl:1416554163
 GATE_OK_ELVEN_LANDS: "Das Obsidian-Reich" #deepl:1195100718
 GATE_OK_ELVEN_LANDS_ADJ: "Orkisch" #deepl:1416554163
 GATE_OK_CENTRAL_AFRICA: "Die Vorherrschaft des Großen Verdant" #deepl:246701650
 GATE_OK_CENTRAL_AFRICA_ADJ: "Orkisch" #deepl:1416554163
 GATE_OK_FLAVOR_TEXT: "$GATE_OK$ ist eine brutale und autoritäre Nation in Afrika, in der die orkischen Herrscher alle anderen Ethnien beherrschen und versklaven. Die Regierung des Landes ist auf einer Rassenhierarchie aufgebaut, wobei die Orks an der Spitze stehen und alle anderen Gruppen unterdrückt werden. Die $GATE_OK$ hat eine feindliche Beziehung zu den $GATE_AD$." #deepl:3874971185
 GATE_NS: "Neu Samadore" #deepl:1169746213
 GATE_NS_ADJ: "Samadorianer" #deepl:3183931075
 GATE_NS_FLAVOR_TEXT: "Eingebettet in die üppige Landschaft Neuguineas stellt die Nation „$GATE_NS$“ ein bewusstes, fortlaufendes Experiment zum Zusammenleben zwischen neu angekommenen Gnomen und einheimischen menschlichen Gemeinschaften dar. Ihre friedliche Integration wird durch die „[GetReligion('gate_harmony_pledge').GetNameNoFormatting]“ gestützt, eine grundlegende Architektur, die ursprünglich dazu entworfen wurde, die brillanten, unberechenbaren Extreme der gnomenhaften Natur zu mildern." #deepl:1686820699
 GATE_NS_EMPIRE: "Samadore Concord" #deepl:234736918
 GATE_NS_EMPIRE_ADJ: "Samadorianer" #deepl:3183931075
 GATE_BN: "Ursalith-Konkordie" #deepl:1791319644
 GATE_BN_ADJ: "Ursalithen" #deepl:3046312838
 GATE_BN_FLAVOR_TEXT: "Forged from the once-fractured clans of the $gate_arctic_ogre$, the $GATE_BN$ stands as a testament to unity in adversity. Hardened by the frozen wastes of Ankaris and tempered by the long struggle for survival, this centralized but clan-rooted nation of bearfolk seeks to protect its ancient ways while asserting its place in the world’s new magical age."
