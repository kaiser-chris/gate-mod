l_german:
 gate_investigate_gate_closed_forever: "#r Dadurch wird das Tor für immer geschlossen.#!" #deepl:243458715
 gate_investigate_gate.1.t: "Erfolgreiche Ermittlungen" #deepl:2127363984
 gate_investigate_gate.1.d: "Unsere Untersuchung der [GetBuildingType('building_gate_alxa').GetName] hat zu [GetTechnology('gate_expeditions').GetName] geführt." #deepl:3486419204
 gate_investigate_gate.1.f: "Nach monatelangem, unermüdlichem Studium und geheimnisvollem Geflüster haben unsere Gelehrten endlich die Geheimnisse des erbeuteten magischen Tores gelüftet. Die uralten Runen, die sich einst dem Verständnis entzogen, pulsierten nun vor Leben und enthüllten ein Wissen, das lange Zeit verloren war. Als sich die Geheimnisse des Tores entfalteten, flossen Ströme arkaner Energie in unsere Hände und formten unser Verständnis der Welt neu. Mit dieser neu gewonnenen Macht steht unser Land an der Schwelle zu einer magischen Renaissance und ist bereit, sich die Kräfte zunutze zu machen, die uns seit Generationen entgangen sind." #deepl:2693459441
 gate_investigate_gate.1.a: "Eine ganz neue Welt zu erkunden." #deepl:4008939930
 gate_investigate_gate.2.t: "Kontakt mit der anderen Seite" #deepl:3372465699
 gate_investigate_gate.2.d: "Unsere Untersuchung von [GetBuildingType('building_gate_tyrol').GetName] hat dazu geführt, dass wir Kontakt zu Vertretern von [GetCulture('dwarven').GetName] aus [concept_gate_planet] aufgenommen haben." #deepl:2796463179
 gate_investigate_gate.2.f: "Jahrelang hüllte sich das [GetBuildingType('building_gate_tyrol').GetNameNoFormatting] von Tirol in Schweigen, seine Siegel waren ungebrochen, seit die Zwerge es zuletzt beherrscht hatten. Unsere Gelehrten vermassen jede Rune, prüften jeden Schutzzauber, bis der alte Stein schließlich nachgab und kalte Luft aus der dunklen Welt dahinter heraufströmte.\nEine Delegation aus Ankaris, die Geschenke aus bearbeitetem Silber und versiegelte Schriftrollen mitbrachte und sich in sorgfältiger, akzentuierter Allgemeinsprache äußerte. Sie sprechen nicht von Groll über das, was im Krieg genommen wurde, sondern nur von einer Chance: einem Migrationsvertrag, einem dosierten Zustrom ihres Volkes, das unter uns leben soll, und mit ihm Wissen sowie die Gestaltung von Magie, die der Erde lange verwehrt war. Ob dies ein Trick ist oder einfach die Art der Zwerge, Eroberung in Handel zu verwandeln, können unsere Gesandten nicht sagen. Doch das Tor steht offen, und die Zwerge von $gate_planet$ sind bereit zum Gespräch." #deepl:678047869
 gate_investigate_gate.2.a: "Das könnte hilfreich sein." #deepl:3678068422
 gate_investigate_gate.2.b: "Wir wollen sie nicht." #deepl:1435844639
 gate_investigate_gate.3.t: "Das vergoldete Schweigen" #deepl:3230941023
 gate_investigate_gate.3.d: "Unsere Untersuchung von [GetBuildingType('building_gate_zambia').GetName] hat dazu geführt, dass wir Kontakt zu Vertretern von [GetCulture('elven').GetName] aus [concept_gate_planet] aufgenommen haben." #deepl:4260922901
 gate_investigate_gate.3.f: "Was uns auf der anderen Seite erwartete, war nicht der verzweifelte Rest, mit dem wir gerechnet hatten. Die Elfen, die unsere Gesandten empfingen, traten so auf, wie es ihrem Volk seit jeher eigen ist: geduldig, ohne Eile, fest davon überzeugt, dass die Zeit auf ihrer Seite ist und ein ganzes Reich hinter ihnen steht. Sie haben ihren Anspruch auf das Plateau nicht aufgegeben. Wenn überhaupt, scheint das Exil diesen Anspruch noch geschärft zu haben.\n\nSie bieten weder eine Armee noch ein Ultimatum an. Nur einen Tausch: den Heimweg für ihr Volk, Rat bei der Erforschung des Manas, mit dem unsere eigenen Gelehrten noch immer zu kämpfen haben, und im Gegenzug das Recht, ihre Priester zurück unter die Bevölkerung zu schicken, die wir nun regieren, um den Goldenen Segen offen und ohne Einschränkungen zu predigen.\n\nUnsere Berater sind sich zumindest in einem Punkt einig. Das Tor ist eine Engstelle, geschützt und schmal, und keine Streitmacht, die wir aufbieten könnten, würde es mit Gewalt zurückerobern, sollten die Elfen beschließen, es zu halten. Was auch immer daraus wird, wird an dem Tisch entschieden, den die Elfen gedeckt haben, und nicht auf einem Schlachtfeld unserer Wahl." #deepl:3539908948
 gate_investigate_gate.3.a: "Das könnte hilfreich sein." #deepl:3678068422
 gate_investigate_gate.3.b: "Wir wollen sie nicht." #deepl:1435844639
 gate_investigate_gate.4.t: "Das lange Tauwetter" #deepl:3706078847
 gate_investigate_gate.4.d: "Unsere Untersuchung von [GetBuildingType('building_gate_yukon').GetName] hat dazu geführt, dass wir Kontakt zu Vertretern von [GetCulture('gate_arctic_ogre').GetName] aus [concept_gate_planet] aufgenommen haben." #deepl:85472930
 gate_investigate_gate.4.f: "Jahrelang hielt das Siegel stand. Das Gebiet um das Siegel herum war und ist für uns in jeder praktischen Hinsicht wertlos: unwegsames Gelände, keine nennenswerten Ernten, nichts, was die Kosten für eine Garnison rechtfertigen würde. Wir setzten unsere Magier darauf an, die von den Ankarene hinterlassenen Schutzzauber zu knacken.\n\nEs erforderte Jahre geduldiger, wenig glamouröser Forschung, bis wir den Yukon-Schutzstein entschlüsseln konnten. Was durch das wiedergeöffnete Tor kam, war keine Armee. Es waren Gesandte der Ursalith-Konföderation, die nicht um die Rückgabe ihres alten Landes baten – wohl wissend, dass sie besiegt waren –, sondern um etwas Geringeres und Seltsameres: die Erlaubnis für ihr Volk, zu uns zu kommen und als unsere Untertanen unter uns zu leben, sowie Getreide, Obst und Waffen in ausreichender Menge, um die zurückbleibenden Clans auf ihrem unwirtlichen Stück $gate_planet$ am Leben zu erhalten.\nUnsere Generäle sind sich ausnahmsweise einmal einig. Es gibt keine Armee, die wir durch dieses Tor schicken könnten, die es wert wäre, entsandt zu werden – nicht in ein so feindliches Gebiet für einen so geringen Gewinn." #deepl:3224725366
 gate_investigate_gate.4.a: "Das könnte hilfreich sein." #deepl:3678068422
 gate_investigate_gate.4.b: "Wir wollen sie nicht." #deepl:1435844639
 gate_investigate_gate.5.t: "Das Tor, das sich nicht öffnen ließ" #deepl:564381052
 gate_investigate_gate.5.d: "Unsere Untersuchung von [GetBuildingType('building_gate_equateur').GetName] hat dazu geführt, dass wir Kontakt zu Vertretern von [GetCulture('orcish').GetName] aus [concept_gate_planet] aufgenommen haben." #deepl:679937690
 gate_investigate_gate.5.f: "Die Orks hatten dieses Tor nicht einfach versiegelt, sie hatten es im Kampf verschlossen, Eisen und Knochen in jeden Spalt geklemmt und den Stein mit primitiver, aber hartnäckiger Magie gefesselt, bevor sich der Letzte von ihnen aus der Reihe zurückzog. Unsere Forscher brauchten länger als alle anderen, um es zu durchbrechen.\n\nAls es schließlich nachgab, erwartete uns auf der anderen Seite keine Zeremonie. Nur Stille, und dann Bewegung in der Dunkelheit – vorsichtig, bewaffnet, beobachtend.\n\nSie kamen nicht als Bittsteller. Die Fahnenträger eines Kriegsherrn standen an der Schwelle, vernarbte und ernste Gesichter, und musterten die Menschen, die ihr Tor mit Gewalt eingenommen hatten. Keine der beiden Seiten machte sich etwas vor, worum es hier ging: ein unterworfenes Volk, das nach einem Platz suchte in einer Welt, die es bereits einmal besiegt hatte. Was sie anbieten, ist unverblümt: Arbeit, Muskelkraft, zahlenmäßige Überlegenheit, und was sie im Gegenzug wollen, ist ebenso klar: genug Getreide und Obst, um Mägen zu füllen, die schon viel zu lange leer sind, und genug Waffen, um ihr Volk auf $gate_planet$ zu schützen." #deepl:1878112218
 gate_investigate_gate.5.a: "Das könnte hilfreich sein." #deepl:3678068422
 gate_investigate_gate.5.b: "Wir wollen sie nicht." #deepl:1435844639
 gate_investigate_gate.6.t: "Stimmen jenseits des stillen Tores" #deepl:3310024461
 gate_investigate_gate.6.d: "Unsere Untersuchung von [GetBuildingType('building_gate_eastern_new_guinea').GetName] hat dazu geführt, dass wir Kontakt zu Vertretern von [GetCulture('gnomish').GetName] aus [concept_gate_planet] aufgenommen haben." #deepl:3062735215
 gate_investigate_gate.6.f: "Jahrelang stand das Tor am Ostufer Neuguineas genau so da, wie die Gnome es zurückgelassen hatten: durch einen Schutzzauber verschlossen, seine Runen kalt – ein Denkmal für eine Nation, deren Anführer das Exil unserer Flagge vorgezogen hatten. Unsere Magier bezeichneten es als lebloses Ding, das keiner weiteren Untersuchung wert sei, bis ein beharrlicher Forscher bewies, dass der Versiegelungszauber nicht ewig, sondern nur langwierig war.\nAls der Schutzstein schließlich barst, erwarteten wir, auf der anderen Seite Stille vorzufinden. Stattdessen trafen wir auf eine Delegation, die bereits wartete – gefasst und unbeeindruckt, als hätten sie das Tor von $gate_planet$ aus schon länger beobachtet, als wir uns vorstellen können.\nUnsere Gesandten berichten, dass das Treffen nicht feindselig verlief. Wenn überhaupt, war es hoffnungsvoller, als unsere Berater erwartet hatten. Die Verbannten haben die Erde noch nicht aufgegeben. Sie sprechen von der Küste, die sie erschlossen haben, und den Häfen, die sie erbaut haben, und sie sind bereit, hart zu verhandeln, um die Chance zu erhalten, diese wiederzusehen.\nUnsere Militärstrategen haben ihren Standpunkt bereits klar gemacht. Das Tor ist eine Engstelle, stark bewacht und schwer verteidigt, und es mit Waffengewalt aufzubrechen würde mehr Blut kosten, als der Gewinn wert ist. Was auch immer wir von diesen Gnomen wollen, es wird am Verhandlungstisch errungen werden, nicht auf dem Schlachtfeld." #deepl:3069336491
 gate_investigate_gate.6.a: "Das könnte hilfreich sein." #deepl:3678068422
 gate_investigate_gate.6.b: "Wir wollen sie nicht." #deepl:1435844639
