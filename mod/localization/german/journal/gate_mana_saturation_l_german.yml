## Mana Saturation Events
 gate_mana_saturation.1.t: "Eine Welt voller Magie" #deepl:4128974867
 gate_mana_saturation.1.d: "[concept_gate_mana_saturation] hat sein Maximum erreicht." #deepl:4252459974
 gate_mana_saturation.1.f: "Die Welt vibriert jetzt mit einer konstanten, niedrigen Vibration, die Luft ist dick mit dem Schimmer unsichtbarer Kräfte. Jeder Stein, jedes Blatt, jeder Atemzug summt mit der rohen, pulsierenden Energie des Manas. Die Ozeane glühen in einem unheimlichen Licht, und der Himmel tanzt in Farben, die Menschen noch nie gesehen haben. Die Erde ist zu einem lebendigen Kanal der Macht geworden, ihr Innerstes ist von Magie durchdrungen." #deepl:2147041176
 gate_mana_saturation.1.a: "Nichts wird mehr so sein, wie es einmal war." #deepl:1335579824
 gate_mana_saturation.2.t: "Schreckliches Ritual" #deepl:2873681427
 gate_mana_saturation.2.d: "Steigere die „[concept_gate_mana_density]“ durch rituelle Opfer." #deepl:3486189141
 gate_mana_saturation.2.f: "Im Schatten der hoch aufragenden Türme flüsterte man von dunklen Ritualen. Der Rat verfügte, dass das Blut der Versklavten vergossen werden sollte, um die Erde mit Mana zu sättigen. Unter dem blutroten Mond wurden die Verurteilten zu uralten Altären geführt und ihr Leben gegen das Versprechen arkaner Macht eingetauscht. Die Erde trank tief, ihre Adern pulsierten mit neuer Energie, als der Preis der Macht mit der Währung der Verzweiflung bezahlt wurde." #deepl:3821037183
 gate_mana_saturation.2.a: "Diese Welt braucht mehr Magie, egal zu welchem Preis." #deepl:1164052970
 gate_mana_saturation.2.a_progress_tt: "Erhöht die „[concept_gate_mana_density]“ in „[SCOPE.sStateRegion('ritual_state_region').GetName]“ um 50 %." #deepl:2801956465
 gate_mana_saturation.2.b: "Wir müssen diesen Wahnsinn stoppen." #deepl:2329030879
 gate_mana_saturation.3.t: "Mana-Blüte" #deepl:1564168140
 gate_mana_saturation.3.d: "Durch die erhöhte [concept_gate_mana_density] wachsen die Pflanzen in [SCOPE.sState('magic_growing_state').GetName] schneller." #deepl:560652977
 gate_mana_saturation.3.f: "Als sich der Schleier zwischen den Welten lichtete, sickerte das Mana wie ein geflüstertes Geheimnis in die Erde. Über Nacht blühten die Samen auf, die Reben schraubten sich in den Himmel und uralte Bäume entfalteten ihre Blätter in strahlendem Grün. Das Land summte vor neu gefundenem Leben, ein pulsierender Puls in jeder Wurzel und jedem Zweig, während die Natur in dieser verzauberten Dämmerung gedieh." #deepl:2192891470
 gate_mana_saturation.3.a: "Das wird die Art und Weise verändern, wie wir Nutzpflanzen anbauen." #deepl:3474751687
 gate_mana_saturation.3.b: "Schickt unsere „[concept_gate_magic_researcher]“." #deepl:2091786985
 gate_mana_saturation.4.t: "Kristallisierende Luft" #deepl:666326349
 gate_mana_saturation.4.d: "Der „[concept_gate_mana_density]“ unter [SCOPE.sState('mana_crystalizing_state').GetName] hat einen kritischen Wert erreicht und erhöht nun nicht nur [Concept('concept_pop_growth', '$concept_pop_growth_mortality$')], sondern steigert auch unsere [GetBuildingType('building_gate_mana_extractor').GetBuildingGroupName]-Produktion." #deepl:137319954
 gate_mana_saturation.4.f: "In „[SCOPE.sState('mana_crystalizing_state').GetNameNoFormatting]“ hat die Luft selbst begonnen, sich zu Manakristallen zu verdichten, die sich an Dachvorsprüngen, auf Feldern und sogar unter freiem Himmel bilden – ganz ohne Rituale oder Anleitung. Was einst die sorgfältige Arbeit ausgebildeter Magier war, geschieht nun von selbst – ein Zeichen für eine magische Sättigung, die alles bisher Bekannte übertrifft. Das wirtschaftliche Potenzial ist immens, und die Gewinnung hat bereits in vollem Umfang begonnen. Doch dieser Überfluss hat seinen Preis: Arbeiter und Einwohner berichten gleichermaßen von einer hartnäckigen Erkrankung, da sich feine kristalline Partikel in der Lunge ablagern. Ärzte haben sie als „Kristalllunge“ bezeichnet, eine langsam fortschreitende und kräftezehrende Erkrankung, die sich mit jedem Atemzug weiter ausbreitet. Vorerst fließen die Manakristalle weiter – und nur wenige sind bereit, diesen Fluss zu stoppen." #deepl:4237277904
 gate_mana_saturation.4.a: "Ein Segen oder eine Katastrophe?" #deepl:414915665
 gate_mana_saturation.4.b: "Schickt unsere „[concept_gate_magic_researcher]“." #deepl:2091786985

## Ley Line Events
 gate_ley_line.1.t: "Stonehenge rührt sich" #deepl:445825544
 gate_ley_line.1.d: "Ein Anstieg der lokalen „[concept_gate_mana_density]“ hat zur Aktivierung des uralten „[Concept('concept_gate_ley_lines','$concept_gate_ley_line$')]“-Nexus in Stonehenge geführt." #deepl:1360371605
 gate_ley_line.1.f: "Im stillen Nebel des West Country #v  haben uralte Steine, die lange Zeit als stumm galten, begonnen zu summen #!. Während die Mana-Dichte in der Region ansteigt, erwacht Stonehenge – einst ein feierliches Denkmal vergessener Riten –#v  im Einklang mit den geheimnisvollen Energien unter der Erde #!. \n \n Leuchtende Runen pulsieren nun schwach über seiner verwitterten Oberfläche, und seltsame Phänomene breiten sich über die Landschaft aus: Getreide blüht außerhalb der Saison, Kranke genesen mit unheimlicher Geschwindigkeit, und Tiere versammeln sich in unheimlicher Stille um die Steine. \n \n Druiden, #v  strömen zu dieser Stätte #! und erklären sie zu einem heiligen Knotenpunkt natürlicher Kraft. Mit jedem Tag wird das umliegende Land magisch reichhaltiger – ein Leuchtfeuer urzeitlicher Energie in einer sich rasch verändernden Welt." #deepl:1767941998
 gate_ley_line.1.a: "Das kommt unerwartet." #deepl:1647802493
 gate_ley_line.2.t: "Erwachen in Ise" #deepl:3766031496
 gate_ley_line.2.d: "Ein Anstieg der lokalen „[concept_gate_mana_density]“ hat zum Erwachen des uralten „[Concept('concept_gate_ley_lines','$concept_gate_ley_line$')]“-Nexus unter dem Ise-Schrein geführt." #deepl:1867384725
 gate_ley_line.2.f: "Der Ley-Linien-Knotenpunkt unter dem Ise-Schrein erwacht mit uralter Kraft zum Leben, während die Manadichte in ganz Kansai ansteigt. In einer blendenden Kaskade himmlischen Lichts erscheint Amaterasu selbst für einen kurzen Moment im Allerheiligsten. Vor den Augen von Priestern und Pilgern verkündet sie, dass die Zeit des göttlichen Schlummers vorbei ist – und dass Toyouke-hime, die Göttin der Landwirtschaft und Industrie, fortan die Hände der Handwerker und Arbeiter durch das Zeitalter von Magie und Maschinen führen wird. So schnell, wie sie erschienen war, verschwindet Amaterasu wieder und hinterlässt eine geheiligte Stille – und Industriezweige, die bereits von seltsamen, inspirierten Fortschritten berichten." #deepl:3491136693
 gate_ley_line.2.a: "Das ist wunderbar!" #deepl:3289732063
 gate_ley_line.3.t: "Flüstern unter dem Ersten Kaiser" #deepl:2384536619
 gate_ley_line.3.d: "Ein Anstieg der lokalen „[concept_gate_mana_density]“ hat zum Erwachen des uralten „[Concept('concept_gate_ley_lines','$concept_gate_ley_line$')]“-Nexus unter dem Mausoleum von Qin Shi Huang geführt." #deepl:1231881397
 gate_ley_line.3.f: "In der antiken Stadt Xian sind die Ley-Linien in Wallung geraten – und haben den lange schlummernden Knotenpunkt unter dem Mausoleum von Qin Shi Huang erweckt. Bauern, die in der Nähe arbeiten, berichten von einem seltsamen Druck in der Luft, einem Zwang, ohne Pause zu schuften, und dem leisen, rhythmischen Klang ferner Marschschritte, der aus den Tiefen des Untergrunds heraufhallt. Kultivierende in der gesamten Region spüren eine tiefgreifende Störung, ein Aufwühlen von etwas Unermesslichem und Vergrabenem, doch ihre Wahrsagungen liefern keine Antworten." #deepl:1909395410
 gate_ley_line.3.a: "Das ist besorgniserregend." #deepl:2714219379
 gate_ley_line.4.t: "Das singende Herz von Uluru" #deepl:322475842
 gate_ley_line.4.d: "Ein Anstieg der lokalen „[concept_gate_mana_density]“ hat zum Erwachen des uralten „[Concept('concept_gate_ley_lines','$concept_gate_ley_line$')]“-Nexus unter dem Uluru geführt." #deepl:792567701
 gate_ley_line.4.f: "Während Mana durch die Ley-Linien der Northern Territories strömt, erwacht Uluru – der heilige rote Monolith – in stiller Erhabenheit. Von seinem Fuß aus beginnt kristallklares Wasser zu fließen und bildet eine Oase, wo zuvor keine existierte. Das Land erblüht trotzig gegen die Wüste und blüht voller Erinnerungen der Ahnen. Nachts schweben leuchtende Lichtfetzen über dem Wasser und pulsieren in überirdischen Farben – von den Einheimischen als Geister des Dreaming angesehen. Diese Lichter der Ahnen rühren etwas tief in der Seele, und Künstler in der ganzen Region beginnen, Werke zu schaffen, die von Visionen, Ehrfurcht und dem Echo uralter Lieder durchdrungen sind. Das Herz des Landes singt wieder." #deepl:1325170655
 gate_ley_line.4.a: "Das ist wunderbar!" #deepl:3289732063
 gate_ley_line.5.t: "Die Rückkehr der Donner-Eiche" #deepl:3427693426
 gate_ley_line.5.d: "Ein Anstieg der lokalen „[concept_gate_mana_density]“ hat zum Erwachen des uralten „[Concept('concept_gate_ley_lines','$concept_gate_ley_line$')]“-Nexus unter der Donareiche geführt." #deepl:55014399
 gate_ley_line.5.f: "Im Herzen Hessens, wo einst die uralte Donareiche stand, bebt die Erde – und die große Eiche erhebt sich von Neuem. Genährt von den erwachten Ley-Linien, spalten ihre Wurzeln den Stein, und ihr Blätterdach breitet sich weit aus, pulsierend vor roher, uralter Kraft. Doch obwohl die Luft um sie herum von einem tiefen Gefühl des Verrats erfüllt ist, gedeiht das Land: Die Ernten fallen üppiger aus, die Tiere kommen kräftig zur Welt, und der Regen fällt genau dann, wenn er gebraucht wird. Die Einheimischen versammeln sich in andächtiger Stille und spüren das Gewicht vergessener Eide und uralter Präsenz. Das Flüstern der alten Götter regt sich, und Gebete, die einst unter Jahrhunderten des Schweigens begraben waren, erheben sich erneut. Der Donner kehrt zurück – nicht in Zorn, sondern als Urteil." #deepl:3215896656
 gate_ley_line.5.a: "Das ist besorgniserregend." #deepl:2714219379
 gate_ley_line.6.t: "Flüstern aus Stein und Flamme" #deepl:2358393724
 gate_ley_line.6.d: "Ein Anstieg der lokalen „[concept_gate_mana_density]“ hat zum Erwachen des uralten „[Concept('concept_gate_ley_lines','$concept_gate_ley_line$')]“-Knotenpunkts unter dem Rök-Runenstein geführt." #deepl:935157396
 gate_ley_line.6.f: "Während sich das Mana in der Luft von Götaland verdichtet, breitet sich eine Welle arkaner Resonanz nach Norden aus – und weckt den Ley-Linien-Knotenpunkt unter dem uralten Rök-Runenstein in Götaland. Die eingravierten Runen schimmern vor strahlender Energie und tauchen die Landschaft in flackerndes Licht. Bald beginnen Runensteine in ganz Skandinavien zu leuchten und summen leise mit längst schlummernden Zaubersprüchen. Gelehrte bemühen sich eifrig, die arkanen Muster zu entschlüsseln und längst vergessene Prinzipien der Runenmagie zu entschlüsseln. In Götaland werden lokale Runenschnitzer zu gefragten Kunsthandwerkern, deren kraftvolle Inschriften industrielle Arbeitsabläufe beschleunigen und die Integration der Magie vorantreiben. Die alten Steine sprechen erneut, nicht mit Worten – sondern mit Macht." #deepl:2052796929
 gate_ley_line.6.a: "Gut." #deepl:3593588592
 gate_ley_line.7.t: "Die Jagd geht weiter" #deepl:2942528049
 gate_ley_line.7.d: "Ein Anstieg der lokalen „[concept_gate_mana_density]“ hat zum Erwachen des uralten „[Concept('concept_gate_ley_lines','$concept_gate_ley_line$')]“-Knotenpunkts unter den Steinen von Carnac geführt." #deepl:3172764843
 gate_ley_line.7.f: "Während Mana über das Land strömt, erwachen die Ley-Linien unter den Carnac-Steinen zum Leben und hüllen die uralten Monolithen in einen gespenstischen Schein. In ihrem Gefolge regt sich etwas – Urtümliches und Wildes. Die Einheimischen berichten von lebhaften Träumen voller Verfolgungsjagden und Schatten sowie von einem neu entdeckten Drang, die Wälder und Küsten zu durchstreifen. Lange verschüttete, von Generation zu Generation weitergegebene Instinkte erwachen wieder, und mit ihnen der stille Ruf der Jäger und Sammler ihrer Vorfahren. Die Jagd ist in die Bretagne zurückgekehrt." #deepl:676709762
 gate_ley_line.7.a: "Das kommt unerwartet." #deepl:1647802493
 gate_ley_line.8.t: "Das Herz des Drachen erwacht" #deepl:554626291
 gate_ley_line.8.d: "Ein Anstieg der lokalen „[concept_gate_mana_density]“ hat zum Erwachen des uralten „[Concept('concept_gate_ley_lines','$concept_gate_ley_line$')]“-Nexus unter den St.-Beatus-Höhlen geführt." #deepl:1186389360
 gate_ley_line.8.f: "Tief im Inneren der nebelverhüllten St.-Beatus-Höhlen, die lange Zeit als Stoff für Legenden und fromme Volksüberlieferungen galten, hat die Erde selbst vor neu entdecktem Mana gebebt. Im Schatten der erwachten Ley-Linie entdeckten Forscher ein pulsierendes Relikt, eingebettet in Stein – einen kristallinen Kern, der sich warm anfühlt und vor uralter Kraft summt. Gelehrte glauben nun, dass es sich um das Herz eines Drachen handelt, das seit einem vergessenen Zeitalter im Schlaf bewahrt wurde. Während es wieder schwach schlägt, durchflutet es die Höhlen mit roher arkaner Energie und gewährt Einblicke in urzeitliche Magie. Eine Wahrheit wird deutlich: Die Mythen der Drachen enthielten vielleicht mehr als nur Feuer und Furcht – sie enthielten Wissen." #deepl:375314086
 gate_ley_line.8.a: "Ein Nationalheiligtum." #deepl:3066318378
 gate_ley_line.9.t: "Die brennende Ader" #deepl:3153890219
 gate_ley_line.9.d: "Eine Zunahme der lokalen „[concept_gate_mana_density]“ hat zum Erwachen des uralten „[Concept('concept_gate_ley_lines','$concept_gate_ley_line$')]“-Nexus unter der Ewigen Flamme von Baba Gurgur geführt." #deepl:3091549453
 gate_ley_line.9.f: "Während die Manadichte in ganz Mesopotamien sprunghaft ansteigt, lodert die uralte Ewige Flamme von Baba Gurgur immer höher, und ihre blau-goldenen Farbtöne flackern mit arkaner Intensität. Im Schatten ihrer ewig brennenden Präsenz entdecken Geologen und Mystiker gleichermaßen voller Staunen verborgene Ölquellen, die sowohl von schwarzem Gold als auch von magischer Resonanz pulsieren. Die Fördermengen steigen ins Unermessliche und ziehen die Aufmerksamkeit von Industriellen und Elementaristen gleichermaßen auf sich. Manche flüstern, dass die Erde selbst geweckt worden sei – und nun Kraft ausblute." #deepl:3807472037
 gate_ley_line.9.a: "Das wird unsere Branche voranbringen." #deepl:648939038
 gate_ley_line.10.t: "Das siebenfache Feuer" #deepl:1662656748
 gate_ley_line.10.d: "Ein Anstieg der lokalen „[concept_gate_mana_density]“ hat zum Erwachen des uralten „[Concept('concept_gate_ley_lines','$concept_gate_ley_line$')]“-Nexus unter dem Ateshgah von Baku geführt." #deepl:1851211583
 gate_ley_line.10.f: "Im uralten Tempel von Ateshgah, wo das heilige Feuer seit Jahrhunderten lodert, nährt die mana-reiche Luft die Flammen nun mit übernatürlicher Kraft. Die sieben ewigen Feuer lodern höher, als es sich irgendeine lebende Seele erinnern kann, und tauchen den Himmel über Baku in strahlendes Licht. Seltsamerweise brennen in der gesamten Region die Feuer in Schmieden und Öfen heißer und effizienter und versorgen die örtlichen Stahlwerke mit einer fast göttlichen Hitze. Manche sprechen davon, dass sich die Feuergötter regen, andere davon, dass vergessene Gebete erhört werden. Was auch immer die Wahrheit sein mag – die Schmiedegötter scheinen zufrieden zu sein." #deepl:3228369857
 gate_ley_line.10.a: "Das ist besorgniserregend." #deepl:2714219379
 gate_ley_line.11.t: "Gewässer von strahlender Reinheit" #deepl:817308417
 gate_ley_line.11.d: "Ein Anstieg der lokalen „[concept_gate_mana_density]“ hat zum Erwachen des uralten „[Concept('concept_gate_ley_lines','$concept_gate_ley_line$')]“-Knotenpunkts unter dem Ganges geführt." #deepl:930891478
 gate_ley_line.11.f: "Die antike Stadt Varanasi, seit jeher durch Tradition und Zeit geheiligt, erwacht nun zu neuem, geheimnisvollem Leben. Während die Ley-Linie unter dem Ganges erwacht, leuchtet der heilige Fluss schwach im Mondlicht, und sein Wasser ist von sanfter, heilender Magie durchdrungen. Die Einheimischen berichten, dass alte Leiden nachlassen und ein Gefühl tiefer Ruhe zu denen zurückkehrt, die an den Ghats baden. Mit Ehrfurcht und Staunen versammeln sich Pilger und Gelehrte gleichermaßen, um die Wiedergeburt des Ganges mitzuerleben – nicht nur als spirituelle Lebensader, sondern nun auch als Kanal lebendigen Manas." #deepl:3597646721
 gate_ley_line.11.a: "Das ist wunderbar!" #deepl:3289732063
 gate_ley_line.12.t: "Der Segen des Herrn der sieben Hügel" #deepl:4278179392
 gate_ley_line.12.d: "Ein Anstieg der lokalen „[concept_gate_mana_density]“ hat zum Erwachen des uralten „[Concept('concept_gate_ley_lines','$concept_gate_ley_line$')]“-Nexus unter dem Venkateswara-Tempel geführt." #deepl:996572562
 gate_ley_line.12.f: "Das Erwachen der Ley-Linie unter dem Venkateswara-Tempel hat uralte Göttlichkeit mit modernen Geheimnissen verwoben. Sowohl Pilger als auch Gelehrte berichten von Visionen, Offenbarungen und einer unglaublichen Klarheit, wenn sie sich im Schatten des Tempels aufhalten. Es heißt, dass Lord Venkateswara nun Wahrheiten durch die Ley-Ströme flüstert – und denen Einsicht schenkt, die es wagen, zuzuhören." #deepl:779027456
 gate_ley_line.12.a: "Das ist wunderbar!" #deepl:3289732063
