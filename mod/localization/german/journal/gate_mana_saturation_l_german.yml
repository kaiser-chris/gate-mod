 je_gate_mana_saturation_reason: "Während sich der Schleier zwischen den Welten lichtet, beginnt das Mana in unsere Welt zu sickern, und seine Präsenz wird mit jedem Tag stärker. Die Luft summt vor neu gewonnener Energie, und das Gewebe der Realität scheint vor Potenzial zu schimmern. Dieser stetige Zustrom von Mana verspricht, unser Verständnis von Magie und Macht neu zu gestalten, und läutet eine Ära nie dagewesener Veränderungen und Möglichkeiten ein." #deepl:455482982
 je_gate_mana_saturation_low_progress: "Die durchschnittliche „[concept_gate_mana_density]“ ist weltweit gering." #deepl:1289296367
 je_gate_mana_saturation_medium_progress: "Die Durchschnitts[concept_gate_mana_density]n steigen weltweit." #deepl:1707466708
 je_gate_mana_saturation_high_progress: "Die durchschnittliche Luftfeuchtigkeit weltweit ist hoch." #deepl:3024880114
 je_gate_mana_saturation_button_slave_ritual: "Sklaven opfern" #deepl:2127545356
 je_gate_mana_saturation_button_slave_ritual_desc: "Opfer „[GetPopType('slaves').GetName]“, um „[concept_gate_mana_density]“ in einem unserer Bundesstaaten zu erhöhen." #deepl:3207125767
 je_gate_mana_saturation_button_slave_ritual_infamy: "Infamie von [SCOPE.sCountry('loc_country_scope').GetName] ist weniger als 100." #deepl:2238047500
 je_gate_mana_saturation_button_slave_ritual_mana_density: "[concept_gate_mana_density] eines unserer Bundesländer liegt unter 100 %." #deepl:2301164875
