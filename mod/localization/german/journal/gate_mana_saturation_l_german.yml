 gate_mana_saturation_mages_progress_bar_balance: "[GetPopType('gate_mages').GetName]" #deepl:3794746929
 gate_mana_saturation_ritual_progress_bar_balance: "Rituale" #deepl:100301908
 decision_gate_germanic: "Konvertieren Sie zur Religion [GetReligion('gate_germanic').GetName] " #deepl:2103356438
 decision_gate_germanic_desc: "Da die alten Götter zurückkehren, müssen wir eine Entscheidung treffen, ob wir sie annehmen wollen." #deepl:1553253038
 decision_gate_germanic_conversion_tooltip: "Rund #v 20%#! unseres Landes werden zum alten [GetReligion('gate_germanic').GetName] Glauben konvertieren." #deepl:1380263498
