 je_gate_veiled_interior: "Das verborgene Innere" #deepl:2486240553
 je_gate_veiled_interior_reason: "Hinter den besiedelten Küsten von New Samadore liegt das „Veiled Interior“, eine riesige Weite aus dichtem Dschungel und hoch aufragendem Hochland, die sich bislang jedem nennenswerten Eindringen widersetzt hat. Die ersten „[GetCulture('gnomish').GetName]“ gelangten über die Küstenregion „[GetBuildingType('building_gate_eastern_new_guinea').GetName]“ hierher, und von dort aus breitete sich die Besiedlung entlang der schiffbaren Küsten und Flussläufe aus. Doch das tiefere Landesinnere bleibt im Dunkeln, sein Gelände ist unerforscht und seine Gegebenheiten kaum bekannt." #deepl:2120754377
