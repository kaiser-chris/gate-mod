# Events
 gate_harmony_pledge.1.t: "Begeisterung ohne Grenzen" #deepl:3398040805
 gate_harmony_pledge.1.d: "Eine Person aus „[GetCulture('gnomish').GetName]“ in „[TopScope.sS('event_state').GetName]“ hat für öffentliche Empörung gesorgt. Diese öffentliche Empörung wird [concept_assimilation] nachlassen, wenn nicht richtig damit umgegangen wird." #deepl:767208063
 gate_harmony_pledge.1.f: "Auf einem überfüllten Platz unterzieht ein völlig faszinierter Gnom einen unglücklichen Besucher einer Flut von Fragen. Die Fragen – persönliche, fachliche, philosophische und zunehmend indiskrete – werden mit fröhlicher Intensität und ohne Rücksicht auf Anstand gestellt. Was für den einen echte Faszination ist, wird für andere zu einer öffentlichen Verletzung der Privatsphäre." #deepl:978833871
 gate_harmony_pledge.1.a: "Sie waren einfach nur neugierig." #deepl:1356077208
 gate_harmony_pledge.1.b: "Verurteilen Sie dieses Verhalten." #deepl:2455540265
 gate_harmony_pledge.2.t: "Das Ledger neu geschrieben" #deepl:686309308
 gate_harmony_pledge.2.d: "Ein neuer Führungsstil steigert zwar die Produktivität unter [concept_bureaucracy], schränkt aber auch die [concept_innovation] ein." #deepl:1040782432
 gate_harmony_pledge.2.f: "Unser öffentlicher Dienst hat erfolgreich neue, hochentwickelte Kontroll- und Verteilungssysteme eingeführt. Die Verwaltungseffizienz hat ihren Höhepunkt erreicht, und bürokratische Verschwendung gibt es praktisch nicht mehr. Akademische und kulturelle Berater berichten jedoch, dass diese unerbittliche strukturelle Optimierung Eigeninitiative erstickt und dazu führt, dass unabhängige Forschung und kreative Bestrebungen im ganzen Land ins Stocken geraten." #deepl:2507388011
 gate_harmony_pledge.2.a: "Verbieten Sie diesen neuen Führungsstil." #deepl:2819019753
 gate_harmony_pledge.2.b: "Die schlimmsten Auswirkungen abmildern." #deepl:410557116
 gate_harmony_pledge.2.c: "Nutzen Sie das Potenzial." #deepl:2727038369
 gate_harmony_pledge.3.t: "Unendliche Verfeinerung" #deepl:1065897276
 gate_harmony_pledge.3.d: "Diese Verfeinerung verringert [GetBuildingType('building_trade_center').GetName] [concept_throughput] und erhöht gleichzeitig [GetBuildingGroup('bg_light_industry').GetName] [concept_throughput]." #deepl:2944350912
 gate_harmony_pledge.3.f: "Berichte aus unseren Produktionssektoren deuten auf einen beispiellosen Aufschwung im Handwerk hin. Die Werkstätten arbeiten mit voller Kapazität und treiben die inländische Produktion auf neue Höchststände. Die Handelsminister warnen jedoch davor, dass in dieser Euphorie der kommerzielle Vertrieb vernachlässigt wird; Fertigwaren stapeln sich in den Lagern, anstatt lokale oder ausländische Märkte zu erreichen." #deepl:1479994007
 gate_harmony_pledge.3.a: "Bestellen Sie eine Mindestanzahl an Vertriebsmitarbeitern." #deepl:2053133893
 gate_harmony_pledge.3.b: "Die schlimmsten Auswirkungen abmildern." #deepl:410557116
 gate_harmony_pledge.3.c: "Nutzen Sie das Potenzial." #deepl:2727038369
 gate_harmony_pledge.4.t: "Bauoffensive" #deepl:1868878426
 gate_harmony_pledge.4.d: "Ein Anstieg des Interesses an Architektur führt zu Produktionssteigerungen bei „[concept_construction]“, während die Produktion von „[GetBuildingGroup('bg_agriculture').GetName]“ landesweit zurückgeht." #deepl:2253421195
 gate_harmony_pledge.4.f: "Berichte aus dem ganzen Land deuten auf einen koordinierten Aufschwung im Architektur- und Tiefbau hin. Planer und Bauunternehmer treiben umfassende Umgestaltungsmaßnahmen mit ungewöhnlicher Intensität voran, wodurch die Bautätigkeit stark zugenommen hat. Begleitende Einschätzungen weisen jedoch auf eine nachlassende Aufmerksamkeit für die Landwirtschaft hin, wobei weniger Arbeitskräfte auf den Feldern eingesetzt werden und erste Anzeichen für eine Belastung der Nahrungsmittelreserven zu erkennen sind." #deepl:2088678352
 gate_harmony_pledge.4.a: "Schickt sie auf die Felder." #deepl:4018618871
 gate_harmony_pledge.4.b: "Die schlimmsten Auswirkungen abmildern." #deepl:410557116
 gate_harmony_pledge.4.c: "Nutzen Sie das Potenzial." #deepl:2727038369
 gate_harmony_pledge.5.t: "Ein Übermaß an Theorie" #deepl:3548768388
 gate_harmony_pledge.5.d: "Die Konzentration auf theoretisches Wissen fördert [concept_innovation], hemmt jedoch [concept_construction]." #deepl:3715153279
 gate_harmony_pledge.5.f: "Berichte unserer akademischen Einrichtungen deuten auf einen massiven Anstieg der theoretischen Forschung und wissenschaftlichen Entdeckungen hin. Wissenschaftler entwickeln in beispiellosem Tempo neue Theorien und erweitern damit unsere nationale Wissensbasis rasant. Die Gouverneure der Provinzen warnen jedoch davor, dass die praktische Umsetzung vernachlässigt wird; wichtige Infrastruktur- und öffentliche Bauprojekte verzeichnen erhebliche Verzögerungen, da sich der intellektuelle Fokus vollständig auf abstrakte Themen verlagert." #deepl:1215646789
 gate_harmony_pledge.5.a: "Die Forschungsmittel auf praktische Anwendungen ausrichten." #deepl:403732231
 gate_harmony_pledge.5.b: "Die schlimmsten Auswirkungen abmildern." #deepl:410557116
 gate_harmony_pledge.5.c: "Nutzen Sie das Potenzial." #deepl:2727038369
 gate_harmony_pledge.6.t: "Abstrakter Reichtum" #deepl:3374874366
 gate_harmony_pledge.6.d: "Neue Finanzinstrumente erhöhen den Beitrag von „[concept_investment_pool]“, verringern jedoch die maximale „[concept_cash_reserves]“ unserer Branche." #deepl:805899902
 gate_harmony_pledge.6.f: "Berichte aus den Finanzzentren zeugen von einer plötzlichen, intensiven Begeisterung für komplexe Finanzinstrumente. Banker und Zunftführer handeln in schwindelerregendem Tempo mit spekulativen Kontrakten und Anlagen, wodurch die staatlichen Einnahmen und der Kapitalfluss drastisch steigen. Die Realwirtschaft warnt jedoch vor einem gravierenden Kapitalabfluss; die Mittel fließen vollständig in Papiervermögen, was dazu führt, dass die verarbeitende Industrie und die Schwerindustrie ins Stocken geraten." #deepl:2095828964
 gate_harmony_pledge.6.a: "Die gesetzlich vorgeschriebenen Mindestreservebeiträge erhöhen." #deepl:3977047276
 gate_harmony_pledge.6.b: "Die schlimmsten Auswirkungen abmildern." #deepl:410557116
 gate_harmony_pledge.6.c: "Nutzen Sie das Potenzial." #deepl:2727038369
 gate_harmony_pledge.7.t: "Unterirdische Fixierung" #deepl:101694213
 gate_harmony_pledge.7.d: "Eine Fixierung auf die [GetBuildingGroup('bg_extraction').GetName]-Branche steigert [concept_throughput], führt aber auch zu einem Rückgang bei [concept_throughput] der [GetBuildingGroup('bg_plantations').GetName]-Branche." #deepl:927365228
 gate_harmony_pledge.7.f: "Berichte aus den Grenzgebieten deuten auf eine massive, koordinierte Zunahme der Rohstoffgewinnung hin. Bergleute und Ingenieure haben aggressive neue Abbauverfahren eingeführt, wodurch unsere Lager mit Roherz und Mineralien überflutet werden. Provinzrichter warnen jedoch davor, dass dieser unkontrollierte Abbau die lokalen Ökosysteme stört; Ackerland wird zerstört und Wasserquellen umgeleitet, was zu einem starken Rückgang der Erträge auf unseren Plantagen führt." #deepl:4159305287
 gate_harmony_pledge.7.a: "Wir müssen unsere Rohstoffindustrie dazu verpflichten, die umliegenden Ackerflächen zu erhalten." #deepl:77699677
 gate_harmony_pledge.7.b: "Die schlimmsten Auswirkungen abmildern." #deepl:410557116
 gate_harmony_pledge.7.c: "Nutzen Sie das Potenzial." #deepl:2727038369
 gate_harmony_pledge.8.t: "Das Fieber um die Cash Crops" #deepl:1069755938
 gate_harmony_pledge.8.d: "Eine Fixierung auf die [GetBuildingGroup('bg_plantations').GetName]-Branche steigert [concept_throughput], führt aber auch zu einem Rückgang bei [concept_throughput] der [GetBuildingGroup('bg_agriculture').GetName]-Branche." #deepl:288115478
 gate_harmony_pledge.8.f: "Berichte aus den landwirtschaftlichen Provinzen deuten auf eine weit verbreitete Besessenheit von lukrativen Exportkulturen hin. Angetrieben von der plötzlichen, leidenschaftlichen Überzeugung, dass Plantagenwirtschaft immensen Reichtum garantiert, reißen Landbesitzer und ländliche Gemeinden eifrig ihre Grundnahrungsmittelkulturen aus, um stattdessen Gewürze, Kaffee und Kautschuk anzubauen. Während die Handelsminister berichten, dass unsere Exporteinnahmen in die Höhe schnellen, warnen lokale Amtsträger, dass sich die Dorfmärkte allmählich leeren, was ernsthafte Bedenken hinsichtlich drohender Nahrungsmittelknappheit aufkommen lässt." #deepl:2362294843
 gate_harmony_pledge.8.a: "Legen Sie ein Mindestniveau für die Nahrungsmittelproduktion pro landwirtschaftlichem Betrieb fest." #deepl:1576472696
 gate_harmony_pledge.8.b: "Die schlimmsten Auswirkungen abmildern." #deepl:410557116
 gate_harmony_pledge.8.c: "Nutzen Sie das Potenzial." #deepl:2727038369
 gate_harmony_pledge.9.t: "Agrarsicherheit" #deepl:288080293
 gate_harmony_pledge.9.d: "Eine Fixierung auf die [GetBuildingGroup('bg_agriculture').GetName]-Branche steigert [concept_throughput], führt aber auch zu einem Rückgang bei [concept_throughput] der [GetBuildingGroup('bg_plantations').GetName]-Branche." #deepl:3228164820
 gate_harmony_pledge.9.f: "In den ländlichen Gebieten hat sich eine reaktionäre Bewegung etabliert, die von einer intensiven, kollektiven Fixierung auf Ernährungssicherheit und Selbstversorgung angetrieben wird. Landwirte und lokale Führungskräfte reduzieren systematisch die Erträge kommerzieller Plantagen, um die Erträge von Wurzelgemüse und Getreide zu maximieren. Während unsere nationalen Getreidespeicher überquellen und sich die Ernährungslage im Inland verbessert, sind die Erträge der Plantagen eingebrochen." #deepl:3116472441
 gate_harmony_pledge.9.a: "Steigerung des Ertrags der Plantagen durch die Einschränkung der Nahrungsmittelproduktion." #deepl:2902570733
 gate_harmony_pledge.9.b: "Die schlimmsten Auswirkungen abmildern." #deepl:410557116
 gate_harmony_pledge.9.c: "Nutzen Sie das Potenzial." #deepl:2727038369
 gate_harmony_pledge.10.t: "Gewebtes Denkmal" #deepl:6943227
 gate_harmony_pledge.10.d: "Ein Kulturdenkmal wird unser „[concept_gate_harmony_pledge_society]“ stärken." #deepl:4054858405
 gate_harmony_pledge.10.f: "Unter unseren Handwerkern ist eine wundervolle, spontane Zusammenarbeit entstanden. Menschliche Schnitzer und gnomische Ingenieure haben sich mit ganzer Leidenschaft dem Bau eines großartigen neuen öffentlichen Pavillons gewidmet. Das Bauwerk verbindet auf perfekte Weise die zutiefst spirituelle, fließende Holzarbeit einheimischer menschlicher Traditionen mit dem komplexen, mathematischen Uhrwerk gnomischen Designs. Dieses architektonische Wunderwerk ist eine greifbare Verkörperung des Harmonie-Gelöbnisses und weckt landesweit eine Welle von Bürgerstolz und kulturellem Prestige." #deepl:548123886
 gate_harmony_pledge.10.a: "Wunderbar." #deepl:2942415708
 gate_harmony_pledge.11.t: "Unerwünschte Anfrage" #deepl:3472512289
 gate_harmony_pledge.11.d: "Wenn man bei diesem kulturellen Vorfall nicht mit Bedacht vorgeht, wird „[concept_conversion]“ zu „[GetReligion('gate_harmony_pledge').GetNameNoIcon]“ verkommen." #deepl:1581847826
 gate_harmony_pledge.11.f: "Wir haben heftige Beschwerden von spirituellen Führern der Menschen bezüglich eines kürzlich abgehaltenen Ahnenritus erhalten. Eine Gruppe von Gnomen-Gelehrten, getrieben von ihrer intensiven und ungezügelten Neugier, nahm an der feierlichen Zeremonie teil, behandelte diese jedoch wie ein interaktives Rätsel. Sie unterbrachen die Gebete mit einer Flut von Fragen, versuchten, heilige Reliquien zu vermessen, und diskutierten lautstark über die Eigenschaften der zeremoniellen Feuer. Auch wenn dies nicht böswillig gemeint war, hat diese aggressive weltliche Faszination Traditionalisten zutiefst gekränkt und die gesellschaftliche Harmonie belastet." #deepl:489344487
 gate_harmony_pledge.11.a: "Das ist schlimm." #deepl:2087564719
 gate_harmony_pledge.11.b: "Verurteilen Sie dieses Verhalten." #deepl:2455540265
 gate_harmony_pledge.12.t: "Die Abkehr vom Gelöbnis" #deepl:3780230732
 gate_harmony_pledge.12.d: "Die Verabschiedung des „[TopScope.sL('atheism_law').GetName]“ wird dazu führen, dass wir das „[concept_gate_harmony_pledge]“ aufgeben. Dies wird katastrophale Folgen haben." #deepl:3068637803
 gate_harmony_pledge.12.f: "Berichte aus der Versammlung deuten auf eine wachsende Koalition radikaler Richter hin, die eine vollständige Abschaffung des Harmonie-Gelöbnisses fordern. Mit dem Argument, dass unsere akribische gesellschaftliche Abstimmung ein Käfig sei, der das wahre Potenzial ersticke, verlangen sie, dass wir unseren natürlichen Extremen freien Lauf lassen. Berater warnen davor, dass schon allein die Erwägung dieses Antrags kurzfristig katastrophale Folgen haben werde." #deepl:3395286884
 gate_harmony_pledge.12.a: "Es aufzugeben ist das Beste." #deepl:2265107712
 gate_harmony_pledge.12.b: "Denken wir einmal darüber nach." #deepl:2399731022
 gate_harmony_pledge.13.t: "Das Versprechen zurückgewinnen" #deepl:1485235099
 gate_harmony_pledge.13.d: "Wir haben uns erneut die Lehren der „[concept_gate_harmony_pledge]“ zu eigen gemacht." #deepl:2063420038
 gate_harmony_pledge.13.f: "Die Erschöpfung durch ungebremste Extreme hat das Fieber der Nation endlich gebrochen. In allen Provinzen fordern Bürger und Amtsträger gleichermaßen eine Rückkehr zu den wohlüberlegten Grundsätzen des Harmonie-Gelöbnisses." #deepl:2354966606
 gate_harmony_pledge.13.a: "Wir bekennen uns zur Harmonie." #deepl:2290051607
 gate_harmony_pledge.14.t: "Landrausch" #deepl:4201529643
 gate_harmony_pledge.14.d: "Der Ansturm auf Grundstücke wird zu höheren „[concept_pop_growth]“ führen, aber auch die „[concept_generated_pollution]“ massiv in die Höhe treiben." #deepl:2567934868
 gate_harmony_pledge.14.f: "Dank der ertragreichen landwirtschaftlichen Werkzeuge der Gnome dehnen menschliche Bauernfamilien ihre Gehöfte rasch immer tiefer in den Dschungel hinein aus. Angetrieben von dem einzigartigen menschlichen Wunsch, sich riesige Landbesitze zu sichern und ihren großen Familien ein beträchtliches Erbe zu hinterlassen, roden sie üppiges Land in atemberaubendem Tempo. Während dieser Ehrgeiz einen massiven Boom beim Bevölkerungswachstum und bei der Rohstoffgewinnung auslöst, bringt er unsere Raumplanung völlig aus dem Gleichgewicht und bedroht das ökologische Gleichgewicht, das der „Pledge“ zu bewahren sucht." #deepl:2383172291
 gate_harmony_pledge.14.a: "Naturschutzgebiete einrichten." #deepl:3058232922
 gate_harmony_pledge.14.b: "Die schlimmsten Auswirkungen abmildern." #deepl:410557116
 gate_harmony_pledge.14.c: "Nutzen Sie das Potenzial." #deepl:2727038369
 gate_harmony_pledge.15.t: "Animistische Technik" #deepl:1278909608
 gate_harmony_pledge.15.d: "Animistische Überzeugungen reduzieren [concept_conversion] auf die [GetReligion('gate_harmony_pledge').GetNameNoIcon] und steigern zudem [Concept('concept_radical', '$concept_radicalism$')] für unsere [GetCulture('gnomish').GetName] Mitarbeiter." #deepl:2042378649
 gate_harmony_pledge.15.f: "Die menschlichen Arbeiter haben begonnen, die industriellen Maschinen der Gnome direkt in ihre animistischen Glaubenssysteme zu integrieren und betrachten riesige Dampfmaschinen und Uhrwerk-Webstühle als Gefäße für mächtige lokale Geister. Die Fabrikhallen sind nun mit üppigen Blumenopfern geschmückt, und die Maschinen werden sorgfältig mit heiligen geometrischen Mustern bemalt. Diese wunderschöne kulturelle Synthese hat zu einer starken Loyalität und Einheit unter den Arbeitern geführt. Die gnomenhaften Ingenieure raufen sich jedoch die Haare, da die menschlichen Bediener sich strikt weigern, die Maschinen an „ungünstigen“ Tagen oder mit optimalen, die Geister verärgernden Geschwindigkeiten zu betreiben." #deepl:196278460
 gate_harmony_pledge.15.a: "Diese Praxis verbieten." #deepl:3854349238
 gate_harmony_pledge.15.b: "Die schlimmsten Auswirkungen abmildern." #deepl:410557116
 gate_harmony_pledge.15.c: "Nutzen Sie das Potenzial." #deepl:2727038369
 gate_harmony_pledge.16.t: "Vorgeschriebenes Chaos" #deepl:3726813281
 gate_harmony_pledge.16.d: "[TopScope.sCha('event_character').GetFullName] hat die „[TopScope.sPM('event_movement').GetNameNoIcon]“ gegründet." #deepl:1840134710
 gate_harmony_pledge.16.f: "In der Hauptstadt sind Berichte über eine neu gegründete politische Bewegung eingegangen, die von einem gnomenhaften Ideologen angeführt wird, der offen für eine Verschmelzung von absoluter Anarchie und kompromissloser autoritärer Kontrolle eintritt. In öffentlichen Erklärungen fordert die Fraktion die vollständige Auflösung des Staates und aller formellen Institutionen, betont jedoch gleichzeitig die Notwendigkeit eines permanenten, militarisierten Durchsetzungsapparats zur Aufrechterhaltung dieser „reinen“ Gesetzlosigkeit." #deepl:1348690011
 gate_harmony_pledge.16.a: "Was?" #deepl:1732307125
