l_german:
 # Western Europe
 gate_dungeon_dunmorrach: "Dunmorrach" #deepl:2031928291
 gate_dungeon_dunmorrach_desc: "Auf einer Landzunge über einem grauen Meeresarm steht der Stumpf eines Brochs, an dessen Errichtung sich kein Clan mehr erinnert; seine Trockenmauern sind kaum höher als ein Mann. Tritt man jedoch durch seine einzige niedrige Tür, enden die Mauern nicht: Dunmorrach öffnet sich zu gewölbten Sälen, Wachräumen und Wendeltreppen, die Stockwerk für Stockwerk durch einen Bergfried hinabführen, der viel zu groß ist, um unter dem Hügel Platz zu finden. Erforscher berichten von gepanzerten Wächtern, die niemals müde werden, von Fahnen in Farben, die keinem Clan gehören, und von einer großen Halle ganz unten, in der stets ein kalter Herd aufgeschichtet, aber niemals angezündet ist." #deepl:4281529389
 building_gate_dungeon_dunmorrach: "$gate_dungeon_dunmorrach$ $concept_gate_dungeon$" #deepl:2239800222
 gate_dungeon_oldewaard: "Oldewaard" #deepl:3036865142
 gate_dungeon_oldewaard_desc: "Draußen auf dem Wattenmeer, bei Ebbe einen langen Fußmarsch von den Deichen entfernt, ragt die Spitze eines Backsteinturms aus dem Schlamm empor, wo seit Menschengedenken kein Dorf mehr stand. Bei Ebbe ragt die Tür des Glockenturms knapp über den Schlamm hinaus, und wer durch sie hindurchsteigt, findet keine Glockenstube vor, sondern eine Treppe, die hinabführt in eine versunkene Stadt mit Giebelhäusern, überfluteten Gassen und mit Unkraut verstopften Kanälen. Die Flut erreicht die Hallen im Inneren nie, doch jede Straße steht unter Wasser, und unter der Wasseroberfläche regt sich Leben. Wer den Rückweg über die Wattflächen falsch einplant, riskiert schon lange vor den Gefahren des Verlieses selbst, vom Meer erfasst zu werden." #deepl:3116362586
 building_gate_dungeon_oldewaard: "$gate_dungeon_oldewaard$ $concept_gate_dungeon$" #deepl:2752632048

 # Southern Europe
 gate_dungeon_mongibello: "Mongibello" #deepl:3300345789
 gate_dungeon_mongibello_desc: "Hoch oben an den schwarzen Hängen des Ätna, inmitten alter Lavaströme, erstreckt sich ein Lavatunnel, der eigentlich nur ein paar Dutzend Schritte in den Berg hineinführen sollte, doch weit tiefer reicht. Mongibello, benannt nach dem alten sizilianischen Namen des Berges, ist ein Labyrinth aus Basaltgalerien und glühenden Magmakanälen, in dem die Luft vor Hitze flimmert und der Stein unter den Füßen niemals ganz still steht. Seine Bewohner sind Geschöpfe aus Asche und Schlacke, und die unteren Schichten sollen eher einer Schmiede als einer Höhle ähneln, mit Reihen von Obsidian-Ambossen, die dort stehen, als würden sie auf Schmiede warten, die niemals eintreffen." #deepl:928496763
 building_gate_dungeon_mongibello: "$gate_dungeon_mongibello$ $concept_gate_dungeon$" #deepl:775273922
 gate_dungeon_grieta_blanca: "Grieta Blanca" #deepl:3435846042
 gate_dungeon_grieta_blanca_desc: "In der Nähe der hohen Pässe der aragonesischen Pyrenäen, unterhalb des Ausläufers des Monte Perdido, strömt aus einer schmalen Spalte im Kalkstein selbst im Hochsommer kalte Luft. Hirten kennen diesen Ort seit jeher als einen, an dem der Schnee noch lange nach dem Schmelzen auf den Pässen liegen bleibt, doch hinter ihrer ersten Biegung öffnet sich die „Grieta Blanca“, die Weiße Spalte, zu einem gefrorenen Labyrinth, das weitaus größer ist, als es der Berg eigentlich fassen dürfte: gefrorene Wasserfälle, blaue Eiskammern und Galerien mit einem Boden aus Eis, das so klar ist, dass die Erforscher unter ihren Stiefeln die darin eingeschlossenen Formen erkennen können." #deepl:3994533572
 building_gate_dungeon_grieta_blanca: "$gate_dungeon_grieta_blanca$ $concept_gate_dungeon$" #deepl:679395740

 # Balkans
 gate_dungeon_cetatea_neagra: "Cetatea Neagra" #deepl:1396550911
 gate_dungeon_cetatea_neagra_desc: "Auf einem bewaldeten Ausläufer der südlichen Karpaten ragen die geschwärzten Mauern einer Festung empor, die in keiner Chronik erwähnt wird; ihr Torwachturm ist intakt, und ihr Innenhof ist mit jungen Buchen bewachsen. Die Dörfer im Tal darunter nennen sie „Cetatea Neagra“, die Schwarze Zitadelle, und halten ihre Herden in sicherer Entfernung davon. Hinter dem Torturm verbirgt sich ein Kerker klassischer Art: von Fackeln beleuchtete Gänge, Kasernen, Gefängnisse und Kapellen, die sich Schicht um Schicht übereinander türmen und von Garnisonen gepanzerter Toter sowie kleinerer Schrecken bewacht werden, die Befehle befolgen, die kein Lebender erteilt hat." #deepl:1351207754
 building_gate_dungeon_cetatea_neagra: "$gate_dungeon_cetatea_neagra$ $concept_gate_dungeon$" #deepl:2608092798
 gate_dungeon_labyrinthos: "Labyrinthos" #deepl:982357348
 gate_dungeon_labyrinthos_desc: "In den Hügeln südlich der Messara-Ebene liegen alte Steinbruchstollen, die die Kreter seit jeher „das Labyrinth“ nennen – ein Gewirr aus in den Fels gehauenen Gängen, von denen man einst glaubte, es handele sich um das legendäre Labyrinth. Einer dieser Gänge setzt sich dort fort, wo er laut alten Karten eigentlich endet. Dahinter schlängelt sich das Labyrinthos durch natürliche Höhlen aus blassem Kalkstein, tropfende Stollen und verzweigte Tunnel, die sich zwischen den Besuchen schneller neu anordnen als in jedem anderen bekannten Verlies. Höhlenforscher berichten von gehörnten Bestien in den tieferen Schichten und behaupten – halb im Scherz –, dass der Ort genau weiß, welche Geschichte er nachahmt." #deepl:992872001
 building_gate_dungeon_labyrinthos: "$gate_dungeon_labyrinthos$ $concept_gate_dungeon$" #deepl:2861721661

 # Central Europe
 gate_dungeon_tiefburg: "Tiefburg" #deepl:1233845556
 gate_dungeon_tiefburg_desc: "Eingebettet in die Kalksteinhöhlen oberhalb des [GetBuildingType('building_gate_tyrol').GetName] in [GetStateRegion('STATE_TYROL').GetName] soll das #bold $gate_dungeon_tiefburg$#! seine Entstehung dem Anstieg der [concept_gate_mana_density] verdanken, der mit dem Tor selbst einherging. Lokale Hirten, die einer verirrten Ziege den Hang hinauf folgten, waren die Ersten, die den Eingang entdeckten und berichteten, was sich dahinter verbarg: eine Höhlenöffnung, die zu steinernen Sälen, vergitterten Zellen und gewundenen Gängen führte, die in jeden alten Burgfried passen würden – obwohl es oberirdisch nirgendwo die Ruine einer Burg gab." #deepl:2659547242
 building_gate_dungeon_tiefburg: "$gate_dungeon_tiefburg$ $concept_gate_dungeon$" #deepl:3655843781
 gate_dungeon_silbergrund: "Silbergrund" #deepl:3109519749
 gate_dungeon_silbergrund_desc: "Im Erzgebirge, wo schon seit jeher Silber abgebaut wird – länger, als es Aufzeichnungen gibt –, führt ein verlassener Stollen oberhalb eines Bergbaudorfes entlang eines von Bergleuten von Hand gegrabenen Stollens zurück in den Berghang. Hinter den letzten Werkzeugspuren geht der Stollen in den „Silbergrund“ über: ein weitläufiges Labyrinth aus natürlichen Höhlen, durchzogen von glitzerndem Erz, unterirdischen Seen und Schächten, die tiefer in die Dunkelheit führen, als jede Lampe leuchten kann. Alte Bergleute sagen, der Berg zahle zurück, was ihm genommen wurde, und die Truhen in den Verliesen sind tatsächlich reich an Erz, doch die Wesen, die sie bewachen, graben genauso gut wie jeder Bergmann und kennen die Stollen besser." #deepl:1787057676
 building_gate_dungeon_silbergrund: "$gate_dungeon_silbergrund$ $concept_gate_dungeon$" #deepl:2817468898

 # Northern Europe
 gate_dungeon_surtsdjup: "Surtsdjúp" #deepl:2412711665
 gate_dungeon_surtsdjup_desc: "In den Lavafeldern des westlichen Hochlands erzählen alte Sagen von einem Feuerriesen, der aus Muspelheim nach Norden kam, und von Höhlen, in denen sich Gesetzlose in seinem Schatten versteckten. Surtsdjúp, die Tiefe von Surtr, beginnt in einer solchen Lavahöhle, deren Decke an einigen Stellen eingestürzt ist und den Blick auf den grauen Himmel freigibt. Weiter im Inneren tut die Höhle etwas, was kein gewöhnlicher Lavatunnel vermag: Es wird dort immer heißer statt kälter, bis die Wände glühen und Flüsse aus geschmolzenem Gestein dort fließen, wo eigentlich Wasser sein sollte. Höhlenforscher zählen sie zu den gefährlichsten Dungeons des Nordens, und die aus dem Feuer geborenen Kreaturen in ihren unteren Schichten scheinen umso größer zu werden, je tiefer eine Gruppe vordringt." #deepl:959981999
 building_gate_dungeon_surtsdjup: "$gate_dungeon_surtsdjup$ $concept_gate_dungeon$" #deepl:338466721
 gate_dungeon_svartisgapet: "Svartisgapet" #deepl:2712059456
 gate_dungeon_svartisgapet_desc: "Unterhalb der großen Eiskappe des Svartisen, deren uraltes Eis so dicht ist, dass es fast schwarz erscheint, hat sich eine Gletscherzunge über einem Fjord zu einer dunklen Spalte aufgespalten, die die Einheimischen „Svartisgapet“ nennen. Fischer, die daran vorbeirudern, sagen, die Spalte atme: In der Abenddämmerung sauge sie Luft ein und atme sie im Morgengrauen wieder aus. Im Inneren befindet sich eine schwarz-blaue Eishöhle, in deren Wänden Steine, Holzstücke und die Umrisse von Lebewesen zu sehen sind, die mitten im Lauf eingefroren sind. Einige von ihnen sind nicht so gefroren, wie sie scheinen." #deepl:2957806218
 building_gate_dungeon_svartisgapet: "$gate_dungeon_svartisgapet$ $concept_gate_dungeon$" #deepl:1048494313

 # Russia
 gate_dungeon_ledyanoy_zev: "Ledyanoy Zev" #deepl:693399934
 gate_dungeon_ledyanoy_zev_desc: "Entlang des Flusses Sylva im westlichen Ural sind die Gipsfelsen von Höhlen durchzogen, in denen das ganze Jahr über Eis liegt. Ledyanoy Zev, der „Eisige Schlund“, öffnet sich in einem dieser Felsen hinter einem Vorhang aus Eiszapfen, der innerhalb einer Stunde nachwächst, sobald er zerbrochen wird. Im Inneren wachsen auf jeder Oberfläche Frostkristalle, die so groß sind wie eine Männerhand, Grotten füllen sich mit gefrorenen Seen, und die Kälte scheint Eindringlinge eher zu verfolgen, als sie einfach nur zu umgeben. Seine Bewohner sind blasse Wesen, die anhand der Körperwärme einer Gruppe jagen." #deepl:3842498266
 building_gate_dungeon_ledyanoy_zev: "$gate_dungeon_ledyanoy_zev$ $concept_gate_dungeon$" #deepl:2479745820
 gate_dungeon_kitezh: "Kitež" #deepl:3987445434
 gate_dungeon_kitezh_desc: "Der Svetloyar-See ist klein, rund und tief, und seit jeher, solange sich die Menschen in der Region erinnern können, heißt es, dass unter ihm eine heilige Stadt liegt, die durch das Wasser vor ihren Feinden verborgen ist und deren Glocken in stillen Nächten noch immer läuten. Kitezh ist der Kerker, mit dem die Pilger nicht gerechnet haben: eine Treppe aus weißem Stein, die vom Seeufer direkt ins Wasser hinabführt und über die eine Gruppe trockenen Fußes in eine versunkene Stadt aus Kirchen, Mauern und hölzernen Straßen unter dem See gelangen kann. Die Glocken läuten tatsächlich. Doch niemand, der zurückgekehrt ist, hat deutlich gesehen, was sie läuten lässt." #deepl:1575134297
 building_gate_dungeon_kitezh: "$gate_dungeon_kitezh$ $concept_gate_dungeon$" #deepl:3484290287

 # Eastern Europe
 gate_dungeon_qara_qoba: "Qara Qoba" #deepl:968467120
 gate_dungeon_qara_qoba_desc: "Auf den hohen Karstplateaus des Krimgebirges sind die Yayla-Weiden mit Dolinen und Schächten übersät, von denen die meisten flach sind und den Hirten, die dort ihre Herden weiden lassen, gut bekannt sind. Qara Qoba, die „Schwarze Höhle“, ist eine Doline, die schon immer da war, aber noch nie so tief war. Unterhalb ihres Randes steigt eine Gruppe hinab in eine Welt aus marmorweißen Kammern, Vorhangformationen und tropfenden Gängen, die sich endlos verzweigen. In den tieferen Schichten soll es blasse Schlangen geben und Echos, die mit anderen Stimmen als der eigenen antworten." #deepl:2583201247
 building_gate_dungeon_qara_qoba: "$gate_dungeon_qara_qoba$ $concept_gate_dungeon$" #deepl:3751218621
 gate_dungeon_glebia_solna: "Glebia Solna" #deepl:2214265771
 gate_dungeon_glebia_solna_desc: "Südlich von Krakau erstrecken sich die Salzbergwerke kilometerweit unter der Erde; ihre Kammern wurden von Generationen von Bergleuten zu Kapellen, Sälen und Treppen aus graugrünem Steinsalz ausgehöhlt. Glebia Solna, die „Salztiefe“, öffnet sich von einem vergessenen Seitengang eines solchen Bergwerks aus. Ihre Säle wirken eher gemeißelt als natürlich, mit Salzsäulen, Statuen und Kristallkronleuchtern, doch kein Bergmannwerkzeug hat sie jemals berührt. Die tieferen Schichten ähneln eher einem großen Salzpalast als einem Bergwerk, bewacht von Figuren aus Salz und Stein, die zerbröckeln, wenn man sie berührt, und sich wieder zusammensetzen, wenn man sie ignoriert." #deepl:4231820527
 building_gate_dungeon_glebia_solna: "$gate_dungeon_glebia_solna$ $concept_gate_dungeon$" #deepl:4135015187

 # Nile Basin
 gate_dungeon_ta_djeser: "Ta-Djeser" #deepl:4200652703
 gate_dungeon_ta_djeser_desc: "In den Wüstenhügeln am Westufer des Nils, wo die alten Könige Ägyptens ihre Gräber in den Fels hauen ließen, befindet sich ein Grabeingang, den kein Vermessungsingenieur verzeichnet und den kein Grabräuber geplündert hat. Sein Eingangsportal ist mit den bekannten Figuren von Göttern und Königen verziert, doch die Kartuschen, in denen ihre Namen stehen sollten, sind leer. Ta-Djeser, benannt nach dem altägyptischen Begriff für die heilige Nekropole, führt hinab durch Gänge und Säulenhallen, die mit Sternen bemalt sind, durch Grabkammern, in denen versiegelte Sarkophage aufgestapelt sind, und durch Scheingänge, die in Gruben enden. Seine Wächter sind in Bandagen gehüllt und geduldig, und sie bleiben nicht in ihren Särgen." #deepl:3216497228
 building_gate_dungeon_ta_djeser: "$gate_dungeon_ta_djeser$ $concept_gate_dungeon$" #deepl:3412278458
 gate_dungeon_deriba: "Deriba" #deepl:941347023
 gate_dungeon_deriba_desc: "Der Jebel Marra erhebt sich aus den trockenen Ebenen Darfurs wie eine grüne Insel mit kühlen Hängen, Bächen und Terrassenfeldern, und auf seinem Gipfel liegt die Deriba-Caldera mit ihren beiden Kraterseen. An der Innenwand der Caldera mündet ein Spalt, aus dem eigentlich nichts weiter als ein Hauch warmer Luft entweichen sollte, in einen Kerker aus schwarzem Gestein und schwelenden Schloten. Deriba ist weitaus heißer als seine Umgebung; seine Schichten werden von Flüssen aus geschmolzenem Gestein und Tümpeln aus kochendem Schlamm durchzogen, und die Wesen, die dort leben, bestehen ebenso sehr aus Asche wie aus Fleisch." #deepl:235246290
 building_gate_dungeon_deriba: "$gate_dungeon_deriba$ $concept_gate_dungeon$" #deepl:1282355718

 # North Africa
 gate_dungeon_qabr_ar_raml: "Qabr ar-Raml" #deepl:2955713711
 gate_dungeon_qabr_ar_raml_desc: "Tief in den weiten Sandmeeren der Sahara bewegen sich die Dünen im Wind und legen manchmal frei, was sie verborgen gehalten haben. Qabr ar-Raml, das „Grab des Sandes“, ist ein Tor aus Sandstein am Fuße einer hoch aufragenden Düne, flankiert von verwitterten Statuen, deren Gesichter der Wind abgetragen hat. Karawanen, die daran vorbeiziehen, tränken ihre Kamele an anderer Stelle. Hinter dem Tor erstreckt sich ein Labyrinth aus verschütteten Sälen, das durch halb mit Sand gefüllte Säulengänge, Grabkammern und Schreine vergessener Mächte hinabführt, wo pferdegroße Skorpione Truhen bewachen, die schwer beladen sind mit Edelsteinen." #deepl:2287891589
 building_gate_dungeon_qabr_ar_raml: "$gate_dungeon_qabr_ar_raml$ $concept_gate_dungeon$" #deepl:3934485644
 gate_dungeon_tazrout: "Tazrout" #deepl:3723949154
 gate_dungeon_tazrout_desc: "Hoch im Atlasgebirge, über einem Tal mit Walnussbäumen und terrassierten Gerstenfeldern, steht eine Kasbah mit roten Mauern, von der die Dorfbewohner sagen, sie sei schon vor der Geburt der Großväter ihrer Großväter verlassen worden. Ihre Türme sind verfallen und ihre Innenhöfe leer, doch eine Treppe in ihrem zentralen Turm führt hinab nach Tazrout, einem Labyrinth aus Steinhallen, Wachräumen und Gefängniszellen, das weitaus größer und älter wirkt als die Lehmfestung darüber. Ihre Garnison aus gepanzerten Kriegern kämpft mit der Disziplin einer stehenden Armee, und Gruppen, die sie unterschätzen, schaffen es selten über die zweite Ebene hinaus." #deepl:1903513982
 building_gate_dungeon_tazrout: "$gate_dungeon_tazrout$ $concept_gate_dungeon$" #deepl:3679621244

 # West Africa
 gate_dungeon_tellemkoro: "Tellemkoro" #deepl:1595410917
 gate_dungeon_tellemkoro_desc: "Entlang der Bandiagara-Steilwand schmiegen sich kleine Behausungen und Getreidespeicher an die Felswand – Überreste eines Volkes, das dort lebte, bevor die heutigen Dorfbewohner kamen, und an das man sich nur noch als die Tellem erinnert. Unter den alten Felsbehausungen führt eine Tür nicht in eine flache Kammer, sondern direkt in den Felsen hinein. Tellemkoro führt hinab durch trockene Sandsteinhöhlen, enge Kaminpassagen und große, hallende Kammern, die von Sonnenstrahlen beleuchtet werden, die eigentlich nicht so tief unter die Erde vordringen sollten. Die Kreaturen darin sind schnelle und wendige Kletterer, und der Kerker bevorzugt steile Abgründe gegenüber ebenem Boden." #deepl:3343970160
 building_gate_dungeon_tellemkoro: "$gate_dungeon_tellemkoro$ $concept_gate_dungeon$" #deepl:4199357389
 gate_dungeon_igbo_ojiji: "Igbo Ojiji" #deepl:2036664417
 gate_dungeon_igbo_ojiji_desc: "In den Wäldern des Yoruba-Landes werden heilige Haine ausgewiesen und unberührt gelassen; ihre Bäume werden niemals gefällt. Igbo Ojiji, der Hain der Schatten, ist ein solcher Hain, in dem das Blätterdach so dicht ist, dass kein Tageslicht den Boden erreicht, und ein Pfad zwischen zwei großen Iroko-Bäumen an einen Ort führt, den der Hain selbst nicht erreicht. Darin verbirgt sich ein tropischer Kerker aus feuchtem Dschungel, von Lianen überwucherten Schreinen und Tümpeln mit stillstehendem schwarzem Wasser, wo die Bäume selbst zu beobachten scheinen und die Tiere weitaus größer sind als alle außerhalb." #deepl:3624009545
 building_gate_dungeon_igbo_ojiji: "$gate_dungeon_igbo_ojiji$ $concept_gate_dungeon$" #deepl:979097870

 # Equatorial Africa
 gate_dungeon_mokele: "Mokele" #deepl:305888647
 gate_dungeon_mokele_desc: "Im Ituri-Regenwald, wo die Bäume so dicht wachsen, dass ein Reisender tagelang wandern kann, ohne den Himmel zu sehen, erzählen die Waldbewohner von einem Ort, an dem der Fluss rückwärts fließt. Mokele ist dieser Ort: eine Biegung eines trägen, braunen Flusses, an der das Wasser nicht vom Baum weg, sondern in eine Mulde unter den Wurzeln eines kolossalen Baumes fließt. Der dahinter liegende Dschungel ist ein schwül-stickendes Gewirr aus Dschungelschichten, überschwemmtem Wald und überwucherten Terrassen, Heimat großer Reptilien, schwärmender Insekten und Wesen, die sich im Blätterdach bewegen, gerade außerhalb des Blickfelds." #deepl:1052680998
 building_gate_dungeon_mokele: "$gate_dungeon_mokele$ $concept_gate_dungeon$" #deepl:1270369155
 gate_dungeon_shimo_la_shaba: "Shimo la Shaba" #deepl:2537917738
 gate_dungeon_shimo_la_shaba_desc: "Die Hügel von Katanga sind so reich an Kupfer, dass der nackte Boden an manchen Stellen grün verfärbt ist, und die Menschen dort haben das Metall schon lange bevor Außenstehende auf der Suche danach kamen, zu Barren geschmolzen. Shimo la Shaba, die „Kupfergrube“, ist ein Bergschacht, dessen Wände mit Malachit überzogen sind und dessen Tiefen sich zu Höhlen öffnen, die von grünem und blauem Erz durchzogen sind. Seine Bewohner haben eine Haut, die Klingen wie eine Plattenrüstung abprallen lässt, und die Truhen des Verlieses werden vor allem wegen des Kupfers und der selteneren Metalle, die daneben gefunden werden, hoch geschätzt." #deepl:2227666926
 building_gate_dungeon_shimo_la_shaba: "$gate_dungeon_shimo_la_shaba$ $concept_gate_dungeon$" #deepl:2023524341

 # Southern Africa
 gate_dungeon_diepkloof: "Diepkloof" #deepl:2379273050
 gate_dungeon_diepkloof_desc: "In den Dolomithügeln des Highvelds ist der Boden von Dolinen und Höhlen durchzogen, von denen viele mit den Knochen von Tieren gefüllt sind, die vor langer Zeit hineingefallen sind. Diepkloof, die „Tiefe Schlucht“, beginnt in einer bewaldeten Schlucht, wo der Höhleneingang halb von wilden Feigenbäumen verdeckt wird, deren Wurzeln in die Dunkelheit hinabreichen. Im Inneren befinden sich trockene Höhlen voller brüchiger Tropfsteine, mit Knochen übersäte Kammern und Schächte, die so tief sind, dass kein Seil bis hinunterreicht. In diesem Verlies werden besonders häufig Hinterhalte gelegt, und Abenteurer berichten von Bestien, die geduldig in der Dunkelheit lauern, bis das Licht ihrer Lampen am schwächsten ist." #deepl:676433498
 building_gate_dungeon_diepkloof: "$gate_dungeon_diepkloof$ $concept_gate_dungeon$" #deepl:3241779130
 gate_dungeon_bone_shoal: "Knochenbank" #deepl:2122321929
 gate_dungeon_bone_shoal_desc: "An der nebelverhangenen Skelettküste, wo die Namib-Wüste auf den kalten Atlantik trifft, sind die Strände übersät mit Walknochen und Holzresten von Schiffswracks. Ein Wrack liegt weit im Landesinneren zwischen den Dünen, sein Rumpf ist zur Hälfte im Sand vergraben und sein Laderaum führt hinab zum „Bone Shoal“. Unter der Wüste liegt, so unglaublich es auch scheinen mag, eine versunkene Stadt: überflutete Straßen, versunkene Säle und Gezeitentümpel, aus denen mit Seepocken bewachsene Steinsäulen aus dem dunklen Wasser ragen. Wissenschaftler führen dies als den deutlichsten Beweis dafür an, dass das Thema eines Dungeons nichts mit der umgebenden Landschaft zu tun hat." #deepl:746469498
 building_gate_dungeon_bone_shoal: "$gate_dungeon_bone_shoal$ $concept_gate_dungeon$" #deepl:2728653656

 # East Africa
 gate_dungeon_suswa: "Suswa" #deepl:1121828613
 gate_dungeon_suswa_desc: "Der Suswa erhebt sich aus dem Grund des Großen Afrikanischen Grabenbruchs als Vulkan mit doppeltem Kraterrand; sein äußerer Krater beherbergt einen Ring aus Grasland, sein innerer Krater eine Felseninsel, die von einem tiefen Graben umgeben ist. Die Flanken des Berges sind von Lavaröhren durchzogen, in denen Paviane Schutz vor der Sonne suchen, und in einer davon führt der Gang immer tiefer hinab, wobei es immer heißer wird und das Grollen geschmolzenen Gesteins immer lauter wird. Der Suswa-Kerker besteht ganz aus schwarzem Basalt und Feuer; seine Gänge werden von Lavafällen beleuchtet und von Kreaturen bewacht, die aus dem Berg selbst geformt zu sein scheinen." #deepl:3025099889
 building_gate_dungeon_suswa: "$gate_dungeon_suswa$ $concept_gate_dungeon$" #deepl:3314654564
 gate_dungeon_debre_sela: "Debre Sela" #deepl:104059016
 gate_dungeon_debre_sela_desc: "Im Hochland von Lasta wurden Kirchen aus massivem rotem Fels nach unten hin herausgemeißelt, deren Dächer auf Bodenniveau liegen und deren Mauern in tiefen Gräben stehen. Debre Sela, der Felsenberg, ist ein in den Boden eines solchen Grabens gemeißelter Durchgang, den kein Steinmetz je geschaffen hat. Darunter erstreckt sich ein Labyrinth aus in den Fels gehauenen Sälen, Säulenkammern und engen Gängen, die mit unglaublicher Präzision gehauen wurden und von stillen Wächtern aus Stein bewacht werden. Je tiefer man vordringt, desto mehr ähneln die Ausgrabungen einem Palast als einem Ort der Anbetung." #deepl:3118331721
 building_gate_dungeon_debre_sela: "$gate_dungeon_debre_sela$ $concept_gate_dungeon$" #deepl:2088913079

 # Indochina
 gate_dungeon_prasat_khmoch: "Prasat Khmoch" #deepl:3101704102
 gate_dungeon_prasat_khmoch_desc: "In den Wäldern nördlich des großen Sees liegen die Ruinen alter Tempelstädte, halb vom Dschungel verschlungen, ihre Türme mit ruhigen Gesichtern verziert und ihre Innenhöfe von Würgefeigen durchzogen. Prasat Khmoch, der Geistertempel, ist ein Heiligtum, dessen innerer Schrein sich zu einer Treppe öffnet, die hinab in die Wurzeln führt. Darunter erstreckt sich ein tropischer Kerker aus überwucherten Gängen, Dschungelhöfen und überfluteten Terrassen, wo von jeder Wand her Steingesichter herabblicken. Der Dschungel im Inneren ist lebendiger als der draußen, und er wächst bereits wieder über den Pfad hinweg, den eine Gruppe hinter sich gebahnt hat." #deepl:531780270
 building_gate_dungeon_prasat_khmoch: "$gate_dungeon_prasat_khmoch$ $concept_gate_dungeon$" #deepl:1091091520
 gate_dungeon_hang_may: "Hang May" #deepl:2920479820
 gate_dungeon_hang_may_desc: "In den Kalksteinbergen zwischen Annam und Laos verschwinden die Flüsse unterirdisch in einigen der größten Höhlen der Welt. Hang May, die „Wolkenhöhle“, ist eine Flusshöhle, die so gewaltig ist, dass sich unter ihrem Dach Wolken bilden und im Licht ihrer eingestürzten Oberlichter ein Dschungel wächst. Hinter dem letzten Oberlicht verwandelt sich die Höhle in ein Labyrinth aus riesigen Kammern, unterirdischen Flüssen und Kalzit-Terrassen, die wie Reisfelder übereinanderliegen. Es ist das tiefste Höhlensystem der Region, und Gruppen, die es betreten, planen wochenlange Aufenthalte unter der Erde." #deepl:2677258461
 building_gate_dungeon_hang_may: "$gate_dungeon_hang_may$ $concept_gate_dungeon$" #deepl:1971472896

 # Indonesia
 gate_dungeon_kawah_biru: "Kawah Biru" #deepl:2341330508
 gate_dungeon_kawah_biru_desc: "Im Ijen-Hochland im Osten Javas steigen Schwefelbergleute in einen rauchenden Krater hinab, um gelbe Krusten aus den Schloten neben einem säuregrünen See abzubrechen. Nachts lodern die Schlote mit einer unheimlichen blauen Flamme, und unter ihnen befindet sich eine Spalte namens Kawah Biru, der Blaue Krater, dessen Feuer niemals erlischt. Hinter den blauen Flammen verbirgt sich ein Labyrinth aus Vulkangestein, Schwefelbecken und erstickenden Dämpfen, in dem die Hitze nur noch von den Giftstoffen in der Luft übertroffen wird. Bergleute, die dies überlebt haben, behaupten, dass das blaue Feuer immer heller lodert, sobald eine Gruppe den Krater betritt." #deepl:3351373770
 building_gate_dungeon_kawah_biru: "$gate_dungeon_kawah_biru$ $concept_gate_dungeon$" #deepl:739126202
 gate_dungeon_rimba_sunyi: "Rimba Sunyi" #deepl:1410927264
 gate_dungeon_rimba_sunyi_desc: "Tief im Inneren von Borneo ist der Regenwald niemals still: Insekten, Vögel und Affen erfüllen ihn Tag und Nacht mit Lärm. Rimba Sunyi, der „Stille Wald“, ist der einzige Ort, an dem sie verstummen – ein Ring aus uralten Dipterokarp-Bäumen, der eine versunkene Lichtung umgibt, auf der nichts ruft und sich nichts bewegt. Ein Pfad hinunter in die Lichtung führt in einen tropischen Kerker aus riesigen Farnen, Kannenpflanzen, die so groß wie Fässer sind, und Lianen, die dick genug sind, um darauf zu laufen. Die Stille begleitet eine Gruppe den ganzen Weg hinunter." #deepl:1962332652
 building_gate_dungeon_rimba_sunyi: "$gate_dungeon_rimba_sunyi$ $concept_gate_dungeon$" #deepl:4045363020

 # South China
 gate_dungeon_jiulong_dong: "Jiulong Dong" #deepl:2357239086
 gate_dungeon_jiulong_dong_desc: "Entlang der Flüsse von Guangxi ragen Kalksteinfelsen wie Zähne aus den Reisfeldern empor, und fast jeder einzelne ist hohl. Jiulong Dong, die „Höhle der neun Drachen“, öffnet sich an der Wasserlinie eines dieser Felsen und ist nur mit dem Boot erreichbar. In ihren ersten Kammern hängen Tropfsteinformationen, die laut den Bootsführern an gewundene Drachen erinnern; dahinter erstreckt sich ein Labyrinth aus riesigen Höhlen, Steinwäldern und unterirdischen Seen, durchzogen von neun verzweigten Gängen, die niemals zweimal denselben Weg führen." #deepl:255988436
 building_gate_dungeon_jiulong_dong: "$gate_dungeon_jiulong_dong$ $concept_gate_dungeon$" #deepl:3983717192
 gate_dungeon_wuliang_lin: "Wuliang Lin" #deepl:1368735261
 gate_dungeon_wuliang_lin_desc: "Im äußersten Süden von Yunnan erstrecken sich tropische Wälder die Hügel hinauf bis an die Grenzen zu Laos und Myanmar und bieten wilden Elefanten und unzähligen Vögeln Schutz. Der Eintritt in den „Wuliang Lin“, den „grenzenlosen Wald“, erfolgt unter einem riesigen Banyanbaum, dessen Luftwurzeln zu einem lebendigen Tor gewachsen sind. Im Inneren erstreckt sich der Wald in alle Richtungen, ohne dass bisher jemand sein Ende gefunden hat – Schicht um Schicht aus feuchtem Dschungel, Bambusdickicht und angeschwollenen Bächen. Affen folgen den Entdeckern durch das Blätterdach, und nicht alle von ihnen sind Affen." #deepl:932280328
 building_gate_dungeon_wuliang_lin: "$gate_dungeon_wuliang_lin$ $concept_gate_dungeon$" #deepl:1477959205

 # North China
 gate_dungeon_khara_khoto: "Khara-Khoto" #deepl:2406890691
 gate_dungeon_khara_khoto_desc: "Am Rande der Wüste Gobi stehen die Lehmwände von Khara-Khoto, der „Schwarzen Stadt“, einsam in der Wüste – längst verlassen, seit der Fluss, der sie einst versorgte, seinen Lauf geändert hat. Innerhalb der Ruinenstadt befindet sich nahe der Westmauer ein Stupa, dessen Tür nicht in den Stupa selbst, sondern unter den Sand führt. Darunter erstreckt sich ein Labyrinth aus verschütteten Hallen, Schatzkammern und Gräbern, gefüllt mit vom Sand abgeschliffenen Statuen, und Reisende berichten, dass man in stillen Nächten unter den Dünen den Markt der alten Stadt hören kann." #deepl:1097299249
 building_gate_dungeon_khara_khoto: "$gate_dungeon_khara_khoto$ $concept_gate_dungeon$" #deepl:24012338
 gate_dungeon_dixia_gong: "Dixia Gong" #deepl:86106098
 gate_dungeon_dixia_gong_desc: "Rund um die alte Hauptstadt Xi’an ist die Ebene mit grasbewachsenen Hügeln übersät – den Grabhügeln von Kaisern und Prinzen, von denen die meisten nie geöffnet wurden. Dixia Gong, der unterirdische Palast, öffnet sich unter einem der kleineren Hügel durch ein in dessen Flanke eingemeißeltes Tor. Dahinter erstrecken sich Säle, die wie ein kaiserlicher Palast angelegt sind: Innenhöfe, Thronsäle, Waffenkammern und lange Korridore, gesäumt von Reihen von Soldaten aus Ton und Bronze, die nicht immer in ihren Reihen bleiben. In seinen tiefsten Schichten sollen sich Flüsse aus Quecksilber befinden." #deepl:536929319
 building_gate_dungeon_dixia_gong: "$gate_dungeon_dixia_gong$ $concept_gate_dungeon$" #deepl:3617567429

 # Northeast Asia
 gate_dungeon_ognennaya_past: "Die Vergangenheit von Ognennaya" #deepl:2773138320
 gate_dungeon_ognennaya_past_desc: "Kamtschatka ist ein Land der rauchenden Vulkane, Geysirfelder und dampfenden Flüsse, in dem die Bären größer werden als irgendwo sonst. Ognennaya Past, der „Feuerrachen“, öffnet sich in einem Tal voller Geysire am Fuße eines aktiven Vulkankegels: eine Öffnung, aus der kein Dampf aufsteigt, sondern nur schimmernde Hitze. Darunter liegt einer der tiefsten bekannten vulkanischen Kerker – ein Abstieg durch glühend heiße Stollen, Magmaseen und Kammern aus kristallinem Obsidian. Selbst die einheimischen Jäger, die vor kaum etwas Angst haben, würden nicht in Sichtweite davon ihr Lager aufschlagen." #deepl:3939716489
 building_gate_dungeon_ognennaya_past: "$gate_dungeon_ognennaya_past$ $concept_gate_dungeon$" #deepl:818426959
 gate_dungeon_hyoketsu: "Hyoketsu" #deepl:127812062
 gate_dungeon_hyoketsu_desc: "Am nördlichen Fuß des Fuji liegt ein dichter Wald, der auf alten Lavaströmen gewachsen ist; sein Boden ist von Höhlen durchzogen, in denen das Eis den ganzen Sommer über bestehen bleibt. Hyoketsu, die Eishöhle, beginnt als eine dieser Lavahöhlen, doch ihr Eis endet nicht dort, wo das der anderen aufhört. Im Inneren ragen Eissäulen wie die Säulen eines Schreins aus dem Boden empor, gefrorene Seen reflektieren das Licht der Laternen in endlose Weiten, und Erforscher berichten von einer Kälte, die jede Menge Wolle oder Pelz durchdringt. Der Wald darüber ist still, und die Einheimischen raten Besuchern, nicht vom Weg abzuweichen." #deepl:2591675358
 building_gate_dungeon_hyoketsu: "$gate_dungeon_hyoketsu$ $concept_gate_dungeon$" #deepl:1507204179

 # Siberia
 gate_dungeon_buus_khaya: "Buus Khaya" #deepl:848832724
 gate_dungeon_buus_khaya_desc: "Im hohen Norden Sibiriens ist der Boden bis in große Tiefen gefroren, und an den Flussufern kommen manchmal Mammutstoßzähne und die Überreste längst ausgestorbener Tiere zum Vorschein. Buus Khaya, der „Eisfelsen“, ist eine gefrorene Steilwand auf einer Flussterrasse, an der sich eine Höhle direkt in den Permafrost hinein öffnet. Im Inneren bestehen die Wände aus uraltem Eis und schwarzer Erde, übersät mit Knochen, Stoßzähnen und ganzen, an Ort und Stelle eingefrorenen Lebewesen, von denen einige erwachen, wenn Wärme sie erreicht. Die tieferen Schichten sind kälter als jeder sibirische Winter." #deepl:188674913
 building_gate_dungeon_buus_khaya: "$gate_dungeon_buus_khaya$ $concept_gate_dungeon$" #deepl:1876216868
 gate_dungeon_shamanka: "Shamanka" #deepl:279338067
 gate_dungeon_shamanka_desc: "Auf der Insel Olchon im Baikalsee ragt ein Felsen mit zwei Gipfeln namens Shamanka ins Wasser und wird vom Volk der Burjaten seit Generationen als heilig verehrt. Am Fuße des Felsens öffnet sich knapp über der Wasserlinie eine Höhle, von der aus ein Gang unter die Oberfläche des tiefsten Sees der Welt hinabführt. Darunter liegt eine versunkene Stadt aus Stein und Holz, deren Straßen in Wasser getaucht sind, das so klar und kalt ist, dass die Erforscher weit unter ihre Füße blicken können, während sich die Türme weiter unten in der Dunkelheit verlieren. Die Wesen, die in den Tiefen des Baikalsees leben, scheinen ihren Weg dorthin gefunden zu haben." #deepl:4084631959
 building_gate_dungeon_shamanka: "$gate_dungeon_shamanka$ $concept_gate_dungeon$" #deepl:2125098252

 # Oceania
 gate_dungeon_grose_hollow: "Grose Hollow" #deepl:3286345539
 gate_dungeon_grose_hollow_desc: "Westlich von Sydney liegen die Blue Mountains, ein Labyrinth aus Sandsteinfelsen und tiefen Tälern, die durch den Eukalyptuswald in ein bläuliches Licht getaucht sind und in deren Schluchten sich zahlreiche Höhlen verbergen. Grose Hollow öffnet sich am Fuße eines Wasserfalls in einem der abgelegensten Täler, hinter dem Vorhang aus herabstürzendem Wasser. Im Inneren verbirgt sich ein höhlenartiger Dungeon mit Kristallen behangenen Kammern, unterirdischen Flüssen und engen Gängen, die sich plötzlich zu Hallen aus glitzerndem Kalkstein öffnen. Seine Bewohner sind selbst für Dungeon-Verhältnisse seltsam – Beuteltiergestalten, die zu etwas weitaus Gefährlicherem verzerrt sind." #deepl:1094261557
 building_gate_dungeon_grose_hollow: "$gate_dungeon_grose_hollow$ $concept_gate_dungeon$" #deepl:96398301
 gate_dungeon_ketetahi: "Ketetahi" #deepl:1590309770
 gate_dungeon_ketetahi_desc: "Im vulkanischen Herzen der Nordinsel ragen drei gewaltige Berge aus einem wüstenartigen Plateau aus Asche und Tussockgras empor, und an ihren Hängen dampfen heiße Quellen und Schlote. Ketetahi ist ein solcher Schlot am Hang eines schwelenden Kegels, wo die Quellen kochend sprudeln und sich der Boden zu einer glühenden Spalte öffnet. Der darunter liegende Kerker wird von Lavaströmen, Schwefelwasserbecken und mit Asche verstopften Höhlen durchzogen, und seine Bewohner scheinen direkt aus dem Fels zu emporsteigen, wenn eine Gruppe vorbeizieht." #deepl:2193902739
 building_gate_dungeon_ketetahi: "$gate_dungeon_ketetahi$ $concept_gate_dungeon$" #deepl:1126126978

 # Canada
 gate_dungeon_nunataq: "Nunataq" #deepl:3167975985
 gate_dungeon_nunataq_desc: "Auf den hohen Eiskappen der fernen Arktis ragen manchmal schwarze Felsgipfel wie die Spitzen versunkener Berge aus dem Eis hervor. Einer von ihnen verbirgt an seinem Fuß eine Öffnung, an der sich das Eis vom Fels gelöst hat und die hinab nach Nunataq führt. Der Dungeon ist ein Labyrinth zwischen Fels und Eis: gefrorene Abgründe, von Eis verschlossene Gänge und Kammern, in denen der alte Berg unter dem Eis noch immer durch blaue Wände hindurch sichtbar ist. Nur wenige Dungeons liegen so weit entfernt von jeglicher Hilfe, und nur wenige Gruppen erreichen ihn, ohne auf der Reise jemanden zu verlieren." #deepl:1462753696
 building_gate_dungeon_nunataq: "$gate_dungeon_nunataq$ $concept_gate_dungeon$" #deepl:990057393
 gate_dungeon_red_deer_hollow: "Red Deer Hollow" #deepl:2232841744
 gate_dungeon_red_deer_hollow_desc: "Entlang des Red Deer River geht die Prärie plötzlich in Badlands über, eine zerklüftete Landschaft aus gestreiften Hügeln, Hoodoos und ausgetrockneten Schluchten, in denen die Knochen riesiger Tiere aus dem Gestein herausragen. Red Deer Hollow ist eine Höhle am Fuße einer Gruppe von Hoodoos, deren Eingang von fossilen Knochen eingerahmt wird, die wie die Rippen eines riesigen Tieres aussehen. Im Inneren befinden sich trockene Höhlen aus gebändertem Gestein, eingestürzte Stollen und Kammern voller Knochen, und Höhlenforscher berichten, dass die Skelette darin nicht immer stillhalten." #deepl:2419040958
 building_gate_dungeon_red_deer_hollow: "$gate_dungeon_red_deer_hollow$ $concept_gate_dungeon$" #deepl:2264227238

 # Pacific Coast
 gate_dungeon_tahoma_vent: "Tahoma Vent" #deepl:1426624704
 gate_dungeon_tahoma_vent_desc: "Der Tahoma, der große weiße Berg der Cascades, ragt über dichte Tannen- und Zedernwälder empor, sein Gipfel ist von Gletschern gekrönt. Unter dem Eis jedoch ist der Berg voller Leben. Der Tahoma Vent mündet in einen dampfenden Spalt hoch oben an seinen Flanken, wo ein Lavakanal unter den Gletschern zurück in den Vulkan führt. Der dahinter liegende unterirdische Raum ist eher ein Reich des Feuers als des Eises: Basaltgalerien, Lavaströme und Magmakammern, deren Gänge von Dampf umhüllt sind, in den das Schmelzwasser aus den darüber liegenden Gletschern sickert." #deepl:9148477
 building_gate_dungeon_tahoma_vent: "$gate_dungeon_tahoma_vent$ $concept_gate_dungeon$" #deepl:1698568113
 gate_dungeon_kaibab_vault: "Kaibab-Tresorraum" #deepl:2191790283
 gate_dungeon_kaibab_vault_desc: "Unterhalb des Kaibab-Plateaus hat der Colorado River einen eine Meile tiefen Canyon geformt, dessen Wände rot, ockerfarben und grau gestreift sind. Auf halber Höhe einer seiner Seitenschluchten ragt aus dem steilen Fels ein mit unbekannten Figuren verzierter Durchgang hervor, flankiert von Säulen, die aus der Canyonwand gehauen wurden. Kaibab Vault ist ein Verlies aus Sandsteinhallen, Sarkophagen und Schatzkammern, versiegelten Räumen voller Sand und von Fallen bewachten Gängen. Sein Stil ähnelt nichts, was die Völker der Region jemals erbaut haben, was die Debatte darüber, woher die Themen für Dungeons stammen, erheblich angeheizt hat." #deepl:3893723199
 building_gate_dungeon_kaibab_vault: "$gate_dungeon_kaibab_vault$ $concept_gate_dungeon$" #deepl:1409315727

 # Great Plains
 gate_dungeon_paha_sapa: "Paha Sapa" #deepl:714600479
 gate_dungeon_paha_sapa_desc: "Die Black Hills erheben sich aus den Great Plains wie eine Insel aus dunklem Kiefernwald, die den Lakota heilig ist und unter der sich Höhlen befinden, durch die der Wind in den Boden hinein- und wieder hinausweht. Paha Sapa beginnt in einer kleinen Spalte zwischen Granitfelsen – eine Höhle, deren Luft warm ist und nach Eisen riecht. Im Inneren verzweigt sie sich in ein Labyrinth aus mit Kristallen gesäumten Gängen, Kastenformationen und mit Kalzit glitzernden Kammern, das so komplex ist, dass Gruppen ihren Weg mit Kreide markieren, nur um festzustellen, dass die Markierungen auf dem Rückweg verschwunden sind." #deepl:2728802150
 building_gate_dungeon_paha_sapa: "$gate_dungeon_paha_sapa$ $concept_gate_dungeon$" #deepl:4294375650
 gate_dungeon_ville_engloutie: "Die versunkene Stadt" #deepl:2561322453
 gate_dungeon_ville_engloutie_desc: "In den Bayous südlich des Mississippi stehen Zypressen knietief im stillen, braunen Wasser, ihre Äste mit Spanischem Moos behangen. Tief in einem solchen Sumpf ragt das Dach eines Steingebäudes aus dem Wasser empor, ohne dass Land um es herum zu sehen ist; seine oberen Fenster befinden sich knapp über der Wasseroberfläche. Die Trapper, die es entdeckt haben, nennen es „Ville Engloutie“, die versunkene Stadt. Hinter den Fenstern liegt eine versunkene Stadt mit überfluteten Straßen, versunkenen Plätzen und moosbewachsenen Hallen, in der große Alligatoren und noch schlimmere Wesen leben, die unter dem schwarzen Wasser auf Beute lauern." #deepl:1577041779
 building_gate_dungeon_ville_engloutie: "$gate_dungeon_ville_engloutie$ $concept_gate_dungeon$" #deepl:2786524121

 # Atlantic Coast
 gate_dungeon_echo_deep: "Echo Deep" #deepl:257355966
 gate_dungeon_echo_deep_desc: "Unter den grünen Hügeln von Kentucky liegen die längsten bekannten Höhlen der Welt, ein Labyrinth aus Gängen und unterirdischen Flüssen, das noch nie vollständig kartografiert wurde. „Echo Deep“ beginnt in der Nähe des Flusses, der durch sie hindurchfließt, in einer von Platanen verdeckten Doline. Der darunter liegende Dungeon ist ein riesiges Höhlensystem aus unterirdischen Flüssen, mit Gipskruste überzogenen Gängen und gewölbten Hallen, in denen jedes Geräusch noch lange nachhallt, nachdem es eigentlich schon verhallt sein müsste. Manche Echos kehren mit Worten zurück, die nie ausgesprochen wurden." #deepl:2610133049
 building_gate_dungeon_echo_deep: "$gate_dungeon_echo_deep$ $concept_gate_dungeon$" #deepl:2200786166
 gate_dungeon_pahayokee: "Pahayokee" #deepl:3531991831
 gate_dungeon_pahayokee_desc: "Die Everglades im Süden Floridas sind ein langsam fließender Fluss aus Gras, unterbrochen von Hammocks aus Laubbäumen, Mangroveninseln und Alligatorlöchern. Pahayokee, benannt nach dem alten Namen für die grasbewachsenen Gewässer, ist ein Hammock tief im Sägegras, wo die Bäume so dicht wachsen, dass sich ihr Blätterdach zu einem Tunnel schließt. Der Tunnel führt hinab in einen tropischen Kerker aus Sumpfwald, Mangrovengewirr und dampfenden Tümpeln, wo die Luft voller Insekten ist und das Wasser niemals so flach ist, wie es aussieht." #deepl:3755633439
 building_gate_dungeon_pahayokee: "$gate_dungeon_pahayokee$ $concept_gate_dungeon$" #deepl:2945348969

 # Central America
 gate_dungeon_chen_ha: "Ch'en Ha" #deepl:524183836
 gate_dungeon_chen_ha_desc: "Der flache Kalkstein von Yucatán hat keine Flüsse an der Oberfläche; sein Wasser fließt unterirdisch und tritt nur in Cenoten ans Licht, runden Dolinen mit klarem, blauem Wasser, die von Ranken umrankt sind. Ch’en Ha, die Wasserhöhle, ist eine Cenote, deren Steintreppe unterhalb der Wasserlinie hinabführt und trockenen Fußes weiter in eine versunkene Stadt unter dem Dschungel führt. Stufentempel ragen aus überfluteten Plätzen empor, behauene Stelen stehen hüfthoch im Wasser, und der unterirdische Fluss, der die Cenote speist, fließt durch Straßen, die seit Menschengedenken niemand mehr betreten hat." #deepl:1648991414
 building_gate_dungeon_chen_ha: "$gate_dungeon_chen_ha$ $concept_gate_dungeon$" #deepl:2711618012
 gate_dungeon_uxwitz: "Uxwitz" #deepl:3043730104
 gate_dungeon_uxwitz_desc: "In den Tieflandwäldern von Petén verbirgt der Dschungel die Stufenpyramiden von Städten, die schon Jahrhunderte vor der Ankunft der Europäer verlassen wurden; ihre Gipfel ragen wie Inseln über das Blätterdach hinaus. Uxwitz, die „Drei Hügel“, ist eine Gruppe von drei überwucherten Pyramiden, von denen die größte an ihrer Spitze ein Tempeltor aufweist, das nicht nach innen, sondern nach unten führt. Darunter erstreckt sich ein tropisches Labyrinth aus verschütteten Plätzen, von Dschungel überwucherten Höfen und verwilderten Palästen, in dem Jaguare, Schlangen und Kreaturen aus den alten Schnitzereien ihr Zuhause gefunden haben." #deepl:4091535095
 building_gate_dungeon_uxwitz: "$gate_dungeon_uxwitz$ $concept_gate_dungeon$" #deepl:1353317249

 # Brazil
 gate_dungeon_igapo_escuro: "Igapó Escuro" #deepl:2731923193
 gate_dungeon_igapo_escuro_desc: "Wenn die Flüsse des Amazonas jedes Jahr über die Ufer treten, breiten sie sich kilometerweit in den Wald aus, überfluten die Baumstämme und verwandeln den Dschungel in ein düsteres Labyrinth aus schwarzem Wasser. Igapó Escuro, der „dunkle Überschwemmungswald“, ist ein Abschnitt eines solchen Waldes, in dem das Wasser selbst in der Trockenzeit niemals zurückgeht. Mit Kanus kann man vom Fluss aus hineinfahren, und ab einem bestimmten Punkt verwandelt sich der Wald in ein Verlies: Schicht um Schicht aus überschwemmtem Dschungel, verrottendem Holz und riesigen Seerosen, heimgesucht von Kaimanen, Anakondas und Wesen, die im dunklen Wasser unter den Booten auf Beute lauern." #deepl:33343186
 building_gate_dungeon_igapo_escuro: "$gate_dungeon_igapo_escuro$ $concept_gate_dungeon$" #deepl:2904494393
 gate_dungeon_gruta_diamantina: "Gruta Diamantina" #deepl:1012437778
 gate_dungeon_gruta_diamantina_desc: "In der Chapada Diamantina, den Hochebenen im Landesinneren von Bahia, suchen Diamantensucher schon seit langem in den Flüssen und im Kies unterhalb der Klippen nach Edelsteinen. Zu den Höhlen des Plateaus gehört die Gruta Diamantina, deren Eingang zu einem Wasserbecken führt, das so klar und blau ist, dass es zu leuchten scheint, wenn Sonnenlicht darauf fällt. Hinter dem Wasserbecken verwandelt sich die Höhle in ein Labyrinth aus funkelnden Gewölben, mit Kristallen übersäten Gängen und unterirdischen Flüssen, und ihre Schätze sind vor allem für ihre Edelsteine bekannt." #deepl:1958878348
 building_gate_dungeon_gruta_diamantina: "$gate_dungeon_gruta_diamantina$ $concept_gate_dungeon$" #deepl:2008378812

 # Andes
 gate_dungeon_chamak_uta: "Ch'amak Uta" #deepl:979974205
 gate_dungeon_chamak_uta_desc: "Der Titicaca-See liegt so hoch in den Anden, dass die Luft dünn und das Licht grell und hell ist, und die Menschen dort erzählen seit jeher von einer Stadt, die der See verschlungen hat. Ch’amak Uta, das Dunkle Haus, ist vom Ufer aus mit einem Schilfboot zu erreichen: ein Ring aus behauenen Steinen, der im seichten Wasser steht, mit einer Steintreppe, die zwischen ihnen hinab in den See führt. Unter der Oberfläche führt die Treppe zu einer versunkenen Stadt aus massiven, passgenau gefugten Steinen, überfluteten Tempeln und versunkenen Terrassen, kalt wie der See selbst und bewohnt von Kreaturen, die durch die Straßen schwimmen, als wäre das Wasser Luft." #deepl:3986697350
 building_gate_dungeon_chamak_uta: "$gate_dungeon_chamak_uta$ $concept_gate_dungeon$" #deepl:1536922227
 gate_dungeon_nina_uchku: "Nina Uchku" #deepl:3545270842
 gate_dungeon_nina_uchku_desc: "Über der weißen Steinstadt Arequipa erheben sich drei große Vulkane, von denen der vollkommenste einen symmetrischen, schneebedeckten Kegel bildet. In der Hochwüste zu ihren Füßen, inmitten von Lavaströmen und Bimssteinfeldern, haucht eine Spalte namens Nina Uchku, das „Feuerloch“, Hitze in die kalte Bergluft. Darunter liegt ein vulkanischer Kerker aus glühenden Gängen und Magmakammern, und man sagt, seine Bewohner ähnelten den brennenden Geistern alter Berglegenden." #deepl:4040138457
 building_gate_dungeon_nina_uchku: "$gate_dungeon_nina_uchku$ $concept_gate_dungeon$" #deepl:948099002

 # La Plata
 gate_dungeon_glaciar_del_silencio: "Gletscher „Del Silencio“" #deepl:1088691401
 gate_dungeon_glaciar_del_silencio_desc: "Im äußersten Süden Patagoniens lässt das große südliche Eisfeld Gletscher in türkisfarbene Seen hinabfließen, wobei ihre Stirnfronten mit einem Geräusch wie Kanonendonner ins Wasser stürzen. Ein Gletscher jedoch kalbt niemals und gibt niemals einen Laut von sich: der Glaciar del Silencio. Dort, wo er auf den See trifft, öffnet sich in seiner Stirnwand ein Tunnel, der in eine Höhle aus blauem Eis, gefrorenen Kavernen und Gletscherspalten führt, die tiefer reichen, als der Gletscher dick ist. Es ist eine der tiefsten bekannten Eishöhlen, und die Stille im Inneren ist so vollkommen, dass sich die Gruppen durch Handzeichen verständigen, anstatt das Risiko einzugehen, zu sprechen." #deepl:2344302738
 building_gate_dungeon_glaciar_del_silencio: "$gate_dungeon_glaciar_del_silencio$ $concept_gate_dungeon$" #deepl:3980058371
 gate_dungeon_tavarangue: "Tavarangue" #deepl:896395181
 gate_dungeon_tavarangue_desc: "In den Wäldern nahe dem Oberlauf des Paraná ragen zwischen den Bäumen die Ruinen einer alten Missionsstadt aus rotem Sandstein empor: Kirchenmauern, Säulengänge und die Steinhäuser einer längst verlassenen Siedlung. Die Guarani nennen solche Ruinen „Tavarangue“, die Stadt, die einmal war. Unterhalb der Kirchenruine führt eine Kryptentreppe hinab in ein Labyrinth aus Steinhallen, Kreuzgängen und Gewölbekammern, die eher zu einer Burg als zu einer Missionsstation zu gehören scheinen und von gepanzerten Gestalten bewacht werden, die schweigend die tieferen Ebenen hüten." #deepl:441691601
 building_gate_dungeon_tavarangue: "$gate_dungeon_tavarangue$ $concept_gate_dungeon$" #deepl:2706676765

 # Gran Colombia
 gate_dungeon_mawari_sima: "Mawari Sima" #deepl:3603358698
 gate_dungeon_mawari_sima_desc: "Im Süden von Guayana ragen flache Berge, sogenannte Tepuis, steil aus dem Regenwald empor; ihre Gipfel sind abgeschiedene Welten mit seltsamen Pflanzen und ständigem Regen. Auf dem Gipfel eines dieser Berge stürzt sich eine große, runde Doline in den Berg hinein, deren Boden mit Wald bedeckt ist. Die Pemon sagen, dass dort die Mawari, die Berggeister, leben. Mawari Sima ist der Kerker am Grund der Doline: ein tropisches Labyrinth aus unerschlossenem Wald, Wasserfällen und Lebewesen, die es nirgendwo sonst gibt." #deepl:279977156
 building_gate_dungeon_mawari_sima: "$gate_dungeon_mawari_sima$ $concept_gate_dungeon$" #deepl:462756322
 gate_dungeon_guatavita: "Guatavita" #deepl:1311597427
 gate_dungeon_guatavita_desc: "Im Hochland oberhalb von Bogotá liegt der Guatavita-See, ein runder See in einem grünen Krater, in dem die Muisca einst ihre Häuptlinge krönten, indem sie sie mit Goldstaub bedeckten und sie auf das Wasser schickten, um Opfer darzubringen. Schatzsucher haben mehr als einmal versucht, ihn trockenzulegen. Der Zugang zum Verlies von Guatavita erfolgt über eine aus Stein gehauene Plattform am Ufer; seine Treppe führt hinab in eine versunkene Stadt mit goldbeleuchteten Sälen, überfluteten Zeremonienplätzen und unter Wasser liegenden Tempeln, und seine Truhen sollen schwer beladen mit Golderz sein." #deepl:4020230537
 building_gate_dungeon_guatavita: "$gate_dungeon_guatavita$ $concept_gate_dungeon$" #deepl:1095309562

 # Near East
 gate_dungeon_malakopi: "Malakopi" #deepl:2797063239
 gate_dungeon_malakopi_desc: "In den Tuff-Tälern der anatolischen Hochebene haben die Menschen seit Jahrtausenden Häuser, Kirchen und ganze unterirdische Städte in das weiche Vulkangestein gehauen. Malakopi ist eine solche unterirdische Stadt; ihre rollenden Steintüren und Lüftungsschächte ähneln denen ihrer Nachbarstädte, nur dass sie mehr Ebenen hat, als jemals zuvor in den Fels gehauen wurden. Unterhalb der ältesten Kellerräume beginnt der eigentliche Kerker: Hallen, Kapellen, Lagerräume und Wachposten, präzise in den lebenden Fels gehauen und von Garnisonen verteidigt, die jeden Tunnel zu kennen scheinen." #deepl:1880647761
 building_gate_dungeon_malakopi: "$gate_dungeon_malakopi$ $concept_gate_dungeon$" #deepl:2855843058
 gate_dungeon_khaznat_al_layl: "Khaznat al-Layl" #deepl:3035859481
 gate_dungeon_khaznat_al_layl_desc: "In den Bergen östlich des Wadi Araba meißelten die Nabatäer Gräber und Tempel in die rosaroten Felsen ihrer verborgenen Stadt, die nur über eine schmale, gewundene Schlucht zu erreichen ist. Khaznat al-Layl, die Schatzkammer der Nacht, ist eine in eine Seitenschlucht gehauene Fassade, die in keinem Reisebericht erwähnt wird; ihre Säulen und Giebel sind aus dunklem Stein gehauen, der die Sonne zu verschlingen scheint. Dahinter verbirgt sich ein Labyrinth aus in den Fels gehauenen Sälen, Grabkammern und Schatzkammern, in dem Sand durch die Gänge tief unter den Klippen weht und Wächter in alter Rüstung in der Dunkelheit lauern." #deepl:2813340196
 building_gate_dungeon_khaznat_al_layl: "$gate_dungeon_khaznat_al_layl$ $concept_gate_dungeon$" #deepl:111339467

 # Arabia
 gate_dungeon_ubar: "Ubar" #deepl:2065902691
 gate_dungeon_ubar_desc: "Entlang der Weihrauchstraßen von Dhofar erzählt eine Legende von einer Stadt der Türme inmitten der Sandwüste, die hochmütig wurde und schließlich von der Wüste verschlungen wurde. Ubar ist der Dungeon, der ihren Namen trägt: eine eingestürzte Senkgrube am Rande des Leeren Viertels, umgeben von den Stümpfen umgestürzter Türme, mit einer Treppe, die hinab in den Sand führt. Darunter liegt eine verschüttete Stadt mit Säulenhallen, sandgefüllten Straßen und Königsgräbern, in der man selbst in den tiefsten Schichten den Wind heulen hört und der Sand sich wie Wasser um die Füße der Reisenden bewegt." #deepl:2814921195
 building_gate_dungeon_ubar: "$gate_dungeon_ubar$ $concept_gate_dungeon$" #deepl:940335479
 gate_dungeon_bir_barhut: "Bir Barhut" #deepl:3019918405
 gate_dungeon_bir_barhut_desc: "In der Wüste von al-Mahra befindet sich eine riesige runde Grube im Boden, die nach lokaler Überlieferung seit jeher als „Brunnen von Barhut“ bezeichnet und als Gefängnis böser Geister angesehen wird. Nur wenige sind jemals hinabgestiegen. Bir Barhut, der Kerker, beginnt am Grund der Grube, wo sich eine Höhle in ein Labyrinth aus trockenen Kavernen, herabstürzendem Travertin und Kammern öffnet, in denen der Geruch von Schwefel schwer in der Luft liegt. Dort hausten Schlangen, Schwärme und noch seltsamere Wesen, die Gruppen offenbar nach unten treiben, anstatt sie gehen zu lassen." #deepl:1772188491
 building_gate_dungeon_bir_barhut: "$gate_dungeon_bir_barhut$ $concept_gate_dungeon$" #deepl:2037786510

 # Greater Persia
 gate_dungeon_takht_e_tariki: "Takht-e Tariki" #deepl:983947611
 gate_dungeon_takht_e_tariki_desc: "In der Nähe der Ruinen der alten persischen Königshauptstadt sind die Grabstätten der früheren Könige hoch in eine Felswand gehauen, deren Fassaden wie Palastfronten gestaltet sind. Takht-e Tariki, der Thron der Dunkelheit, ist eine Grabfassade, die tiefer in den Felsen gehauen ist als die anderen; ihr Eingang befindet sich auf Bodenhöhe, und ihre Reliefs zeigen einen König, dessen Gesichtszüge weggemeißelt wurden. Im Inneren verbirgt sich ein Labyrinth aus Säulenhallen, königlichen Grabkammern und von Sand verwehten Schatzkammern, bewacht von geflügelten Steinwesen, die sich bewegen, wenn niemand zusieht." #deepl:443077534
 building_gate_dungeon_takht_e_tariki: "$gate_dungeon_takht_e_tariki$ $concept_gate_dungeon$" #deepl:2738862469
 gate_dungeon_zendan_e_damavand: "Zendan-e Damavand" #deepl:4242474242
 gate_dungeon_zendan_e_damavand_desc: "Der Damavand ragt als einsamer Vulkankegel über das Alborz-Gebirge empor – der höchste Berg des Landes, dessen Gipfel aus Schwefelquellen dampft. Im „Schahname“ kettete der Held Fereydun den schlangenschultrigen Tyrannen Zahhak in einer Höhle unter dem Berg an, wo er angeblich bis heute gefangen ist. Zendan-e Damavand, das Gefängnis von Damavand, öffnet sich in einer dampfenden Höhle am Hang des Berges: ein vulkanischer Kerker aus Feuer, Ketten und Schwefel, dessen Ebenen hinabführen zu etwas, das in der Tiefe das Eisen zum Klirren bringt." #deepl:1906854928
 building_gate_dungeon_zendan_e_damavand: "$gate_dungeon_zendan_e_damavand$ $concept_gate_dungeon$" #deepl:1382969325

 # Central Asia
 gate_dungeon_muz_tor: "Muz-Tör" #deepl:1964349998
 gate_dungeon_muz_tor_desc: "Im hohen Tian Shan füllen Gletscher die Täler zwischen den Gipfeln aus, und die kirgisischen Hirten treiben ihre Herden nur im Sommer unter diese Gletscher. Muz-Tör, die „Eishalle“, öffnet sich dort, wo ein Gletscher über eine Klippe in ein Hochtal hinabfließt; ihr Eingang ist ein gefrorener Bogen über den Sommerweiden. Im Inneren verwandelt sich der Gletscher in einen Kerker aus gefrorenen Hallen, Eisbrücken und blauen Kammern, in denen die Kälte von heulenden Winden begleitet wird, die unter der Erde eigentlich nichts zu suchen haben." #deepl:3171877613
 building_gate_dungeon_muz_tor: "$gate_dungeon_muz_tor$ $concept_gate_dungeon$" #deepl:3260048074
 gate_dungeon_kara_kala: "Kara Kala" #deepl:3161947558
 gate_dungeon_kara_kala_desc: "Rund um die Oase von Merv erstrecken sich in der Wüste die Ruinen von Städten, die über Jahrtausende hinweg nebeneinander erbaut wurden: eingestürzte Mauern, Festungen aus Lehmziegeln und Mausoleen, die einsam im Sand stehen. Kara Kala, die Schwarze Festung, ist eine dieser verfallenen Lehmziegelburgen, deren geriffelte Mauern dunkler sind als die ihrer Nachbarn. Im Inneren ihres Innenhofs führt eine Treppe hinab in einen Kerker aus verschütteten Sälen, Mausoleumsgewölben und mit Sand verstopften Gassen, wo die Schätze längst verstorbener Könige unter dem Schutz ihrer ebenso verstorbenen Gefolgsleute ruhen." #deepl:2116268795
 building_gate_dungeon_kara_kala: "$gate_dungeon_kara_kala$ $concept_gate_dungeon$" #deepl:2165035252

 # South India
 gate_dungeon_simhagiri: "Simhagiri" #deepl:3476010703
 gate_dungeon_simhagiri_desc: "In den Wäldern Zentralceylons ragt ein gewaltiger Felsen steil aus dem Dschungel empor, und auf seinem Gipfel liegen die Ruinen eines Palastes, der von einem König erbaut wurde, der einst vom Himmel aus herrschte. Sein altes Tor hatte die Form eines riesigen Löwen, von dem nur noch die steinernen Pranken erhalten sind. Simhagiri, der Löwenfelsen, wird zwischen diesen Pfoten betreten: ein Durchgang in den Felsen, der zu einem Labyrinth aus königlichen Sälen, bemalten Galerien, Terrassengärten und Wachräumen führt, bewacht von einer Garnison aus Steinlöwen und gepanzerten Wächtern." #deepl:697420212
 building_gate_dungeon_simhagiri: "$gate_dungeon_simhagiri$ $concept_gate_dungeon$" #deepl:4061293534
 gate_dungeon_irul_kaavu: "Irul Kaavu" #deepl:1444447066
 gate_dungeon_irul_kaavu_desc: "In ganz Travancore gibt es in den Dörfern heilige Haine, sogenannte „Kaavu“ – unberührte Flecken uralten Waldes rund um Heiligtümer für Schlangen und Waldgeister. Irul Kaavu, der „Dunkle Hain“, ist ein Kaavu hoch oben in den Westghats, wo steinerne Schlangenfiguren zwischen den Wurzeln stehen und das Blätterdach kein Sonnenlicht durchlässt. Hinter dem Schrein verbirgt sich ein tropisches Labyrinth aus Regenwald, moosbewachsenen Terrassen und Wasserfällen, in dem es von Schlangen jeder Größe nur so wimmelt, und Reisegruppen berichten, dass der Wald mit jeder Ebene dichter und dunkler wird." #deepl:433137994
 building_gate_dungeon_irul_kaavu: "$gate_dungeon_irul_kaavu$ $concept_gate_dungeon$" #deepl:1783136410

 # Himalayas
 gate_dungeon_nagpo_dzong: "Nagpo Dzong" #deepl:730909342
 gate_dungeon_nagpo_dzong_desc: "In den kargen Schluchten Westtibets schmiegen sich die Ruinen eines untergegangenen Königreichs an erodierte Lehmfelsen – Festungsmauern und Tempel, die direkt in die Bergrücken eingemauert sind. Nagpo Dzong, die „Schwarze Festung“, ist eine verfallene Zitadelle auf einem solchen Bergrücken, deren Mauern von Höhlenkammern durchzogen sind. Durch eine davon führt ein Tunnel in den Bergrücken hinein und hinab in einen Kerker aus Steinhallen, Tempelkammern und Wachtürmen, die sich durch das Herz des Berges hinauf- und hinabwinden und von Kriegern in lackierten Rüstungen verteidigt werden, die in vollkommener Stille kämpfen." #deepl:1795647749
 building_gate_dungeon_nagpo_dzong: "$gate_dungeon_nagpo_dzong$ $concept_gate_dungeon$" #deepl:2071833542
 gate_dungeon_gangri_phug: "Gangri Phug" #deepl:1766939087
 gate_dungeon_gangri_phug_desc: "In den hohen Tälern unterhalb der höchsten Gipfel der Welt schlängeln sich Gletscher langsam vom Schnee hinab zu den Dörfern der Sherpas und ihren Klöstern. Gangri Phug, die „Schneeberghöhle“, öffnet sich hoch oben auf einem Gletscher unter einem der großen Gipfel – ein blauer Abgrund, den sowohl Bergsteiger als auch Hirten meiden. Es ist der tiefste bekannte Eiskeller, ein Abstieg durch Schicht um Schicht gefrorener Hallen, Gletscherspalten und Eisfälle, wo die Kälte und die dünne Luft ebenso tödlich sind wie alles, was dort lebt." #deepl:574718635
 building_gate_dungeon_gangri_phug: "$gate_dungeon_gangri_phug$ $concept_gate_dungeon$" #deepl:4110322777

 # North India
 gate_dungeon_andheri_baori: "Andheri Baori" #deepl:3212517751
 gate_dungeon_andheri_baori_desc: "Im trockenen Land Rajputana gruben die Dorfbewohner große Stufenbrunnen und hauen Treppen über viele Stockwerke hinab, um das unter der Wüste verborgene Wasser zu erreichen. Andheri Baori, der „dunkle Stufenbrunnen“, ist einer davon: ein riesiger quadratischer Schacht, gesäumt von zickzackförmigen Stufen, die weit unter die normale Grundwasserspitze hinabführen. An seinem Grund endet das Wasser nicht in einem Becken, sondern mündet in eine versunkene Stadt aus Säulenhallen, unter Wasser liegenden Galerien und überfluteten Palästen, wo sich Schatten unter der Wasseroberfläche bewegen und die Stufen immer weiter hinabführen." #deepl:1714488120
 building_gate_dungeon_andheri_baori: "$gate_dungeon_andheri_baori$ $concept_gate_dungeon$" #deepl:2569428448
 gate_dungeon_krem_ksuid: "Krem Ksuid" #deepl:4001011506
 gate_dungeon_krem_ksuid_desc: "In den Khasi-Hügeln, die zu den regenreichsten Orten der Erde zählen, stürzen Flüsse vom Plateau hinab in von Regenwald überwucherte Schluchten, und die Dorfbewohner lenken die Wurzeln von Gummibäumen über Bäche, um lebende Brücken wachsen zu lassen. Krem Ksuid, die „Geisterhöhle“, ist über eine solche Wurzelbrücke zu erreichen, die eine Schlucht überspannt und zu einem Höhleneingang führt, der von Farnen und herabstürzendem Wasser umrahmt wird. Im Inneren geht die Höhle bald in einen tropischen Dungeon aus feuchtem Dschungel, von Wurzeln durchzogenen Kammern und tosenden Bächen über, wo sich lebende Wurzeln von selbst bewegen, um den Weg hinter einer Gruppe zu versperren." #deepl:3388093854
 building_gate_dungeon_krem_ksuid: "$gate_dungeon_krem_ksuid$ $concept_gate_dungeon$" #deepl:379488277
