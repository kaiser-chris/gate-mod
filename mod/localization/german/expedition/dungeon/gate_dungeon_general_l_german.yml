 je_gate_expedition_dungeon_cohesion_tooltip: "#header [concept_gate_dungeon_party_cohesion]#!\nWie gut diese [concept_gate_dungeon_party] zusammenhält. Erreicht der Wert Null, zerfällt die Gruppe und der Dungeon-Einsatz endet mit einem Fehlschlag.\n\nAktuell: [ScriptContainer.MakeScope.ScriptValue('gate_dungeon_party_cohesion_value')|0v] / [ScriptContainer.MakeScope.ScriptValue('gate_dungeon_party_cohesion_max_value')|0]" #deepl:9102788
 je_gate_expedition_dungeon_condition_tooltip: "#header [concept_gate_dungeon_party_condition]#!\nDer Zustand der Vorräte, Ausrüstung und Nachschub dieser [concept_gate_dungeon_party]. Er nimmt im Laufe des Abenteuers ab und führt dazu, dass die Gruppe mit sinkendem Wert schlechter ausgerüstet ist.\n\nAktuell: [ScriptContainer.MakeScope.ScriptValue('gate_dungeon_party_condition_value')|0v] / [ScriptContainer.MakeScope.ScriptValue('gate_dungeon_party_condition_max_value')|0]" #deepl:2867010154
 je_gate_expedition_dungeon_renown_tooltip: "#header [concept_gate_dungeon_party_renown]#!\nDas Können und Ansehen, das sich diese [concept_gate_dungeon_party] erworben hat. Ändert sich während eines Dungeon-Durchlaufs selten, aber ein ausreichend hoher Wert von $concept_gate_dungeon_party_renown_simple$ kann zusätzliche Optionen in den Ereignissen des [concept_gate_dungeon] freischalten.\n" #deepl:3924921469
