 decision_gate_germanic: "皈依[GetReligion('gate_germanic').GetName]教" #deepl:2103356438
 decision_gate_germanic_desc: "随着旧神归来，我们需要决定是否要接纳他们。" #deepl:1553253038
 decision_gate_germanic_conversion_tooltip: "我国约有 #v  20% #! 的人口将皈依 [GetReligion('gate_germanic').GetName] 传统信仰" #deepl:1380263498
 decision_gate_germanic_heretic_tooltip: "欧洲的大多数 #v  $heritage_group_abrahamic$ #! [Concept('concept_country','$concept_countries$')] 都会把我们视为 #v;r  异端 #!" #deepl:1122077269

## Mana Saturation Events
 gate_mana_saturation.1.t: "魔法的世界"
 gate_mana_saturation.1.d: "[concept_gate_mana_saturation] 已达到上限。" #deepl:4252459974
 gate_mana_saturation.1.f: "如今的世界充斥着一种恒定而低沉的震颤，空气因无形力量的微光而凝滞。每一块岩石、每一片树叶、每一次呼吸都在魔能原始而脉动的能量中嗡鸣。海洋泛着诡谲的幽光，天幕流转着人类双眼从未触及的斑斓色彩。大地本身已化作一条涌动的能量长河，连地核深处都浸透了魔法的辉芒。"
 gate_mana_saturation.1.a: "世界已然天翻地覆。"
 gate_mana_saturation.2.t: "邪恶仪式"
 gate_mana_saturation.2.d: "通过仪式性献祭来提升[concept_gate_mana_density]。" #deepl:3486189141
 gate_mana_saturation.2.f: "在巍峨尖塔的阴影下，黑暗仪式的低语在夜风中流转。议会颁布法令：若要令大地浸透魔能，须以被奴役者的鲜血浇灌。月在血月之下，受刑者被押至古老祭坛前，他们的生命换来了奥秘力量的迹象。大地贪婪地饮下鲜血，地脉随着新生的能量搏动，而力量的代价，则以绝望为货币偿清。"
 gate_mana_saturation.2.a: "这个世界需要更多的魔法，无论付出什么代价。"
 gate_mana_saturation.2.a_progress_tt: "在《[SCOPE.sStateRegion('ritual_state_region').GetName]》中，将“[concept_gate_mana_density]”的数值提高50%。" #deepl:2801956465
 gate_mana_saturation.2.b: "我们必须制止这种疯狂行为。"
 gate_mana_saturation.3.t: "魔能绽放"
 gate_mana_saturation.3.d: "随着[concept_gate_mana_density]的增加，[SCOPE.sState('magic_growing_state').GetName]中的植物生长速度加快了。" #deepl:560652977
 gate_mana_saturation.3.f: "当世界间的帷幕渐薄，魔能如呢喃低语渗入大地。一夜之间，种子骤然绽放，藤蔓盘绕着直冲天际，古树舒展的叶片流转着翡翠光晕。整片土地随着新生而震颤，每寸根须与枝桠都跃动着蓬勃的脉搏，自然在这奇境初临的拂晓间恣意盛放。"
 gate_mana_saturation.3.a: "这将改变我们的作物种植方式。" #deepl:3474751687
 gate_mana_saturation.3.b: "派出研究人员"
 gate_mana_saturation.4.t: "巨石阵的苏醒"
 gate_mana_saturation.4.d: "位于 [SCOPE.sState('mana_crystalizing_state').GetName] 的“[concept_gate_mana_density]”已达到关键等级，现在不仅能提升 [Concept('concept_pop_growth', '$concept_pop_growth_mortality$')]，还能增强我们的 [GetBuildingType('building_gate_mana_extractor').GetBuildingGroupName] 输出。" #deepl:137319954
 gate_mana_saturation.4.f: "在英格兰西南诸郡的静谧薄雾中，#v 那些曾被认为亘古沉寂的古老巨石开始发出低鸣#!，随着该地区魔力浓度急剧攀升，巨石阵——这座曾为被遗忘仪式而建的庄严纪念碑——#v 正与地下涌动的奥秘能量共鸣，逐渐苏醒#!。\n\n如今，其斑驳石面上浮现出发光符文，微弱脉动若隐若现，诡异现象如涟漪般在乡野间悄然蔓延：农作物反季节开花，病患以诡异速度康复，动物无声地聚集在巨石周围。\n\n德鲁伊教徒#v 涌向此地#!，宣称那是自然力量的神圣节点。日复一日，这片土地浸润着愈发浓郁的魔力——在剧变的世界中的原始能量灯塔。"
 gate_mana_saturation.4.a: "这真是出人意料。"
 gate_mana_saturation.4.b: "请发送至我们的 [concept_gate_magic_researcher]。" #deepl:2091786985

## Ley Line Events
 gate_ley_line.1.t: "巨石阵掀起波澜" #deepl:445825544
 gate_ley_line.1.d: "当地[concept_gate_mana_density]的增加，导致了巨石阵中古老的[Concept('concept_gate_ley_lines','$concept_gate_ley_line$')]节点被唤醒。" #deepl:1360371605
 gate_ley_line.1.f: "在西郡宁静的薄雾中，#v  那些长期被认为沉默不语的古老石块开始发出低鸣 #!。随着该地区魔力密度激增，巨石阵——这座曾是已然被遗忘的仪式所留下的庄严纪念碑——#v  正与地底的神秘能量产生共鸣而苏醒 #!。\n \n 发光的符文如今在其风化表面上微微跳动，而奇怪的现象已开始在乡间蔓延：农作物反常地开花结果，病人以不可思议的速度康复，动物们则在诡异的寂静中聚集在石阵周围。\n \n 德鲁伊们，#v  纷纷涌向该遗址 #!，将其奉为自然力量的神圣枢纽。随着每一天的流逝，周围土地的魔力日益浓郁——在这个瞬息万变的世界中，它俨然成为原始能量的灯塔。" #deepl:1767941998
 gate_ley_line.1.a: "这真是出乎意料。" #deepl:1647802493
 gate_ley_line.2.t: "伊势的觉醒" #deepl:3766031496
 gate_ley_line.2.d: "当地[concept_gate_mana_density]的增强，导致了位于伊势神宫地下的古老[Concept('concept_gate_ley_lines','$concept_gate_ley_line$')]节点苏醒。" #deepl:1867384725
 gate_ley_line.2.f: "随着关西地区魔力密度不断攀升，伊势神宫地下的灵脉交汇点正涌动着远古之力。在一道耀眼夺目的天光倾泻中，天照大神本人短暂地显现在内殿之中。 在神官与朝圣者们的共同见证下，她宣告神明的沉睡时代已经结束——农业与工业之神丰受姬，将引领工匠与劳动者的双手，迈入魔法与机器的时代。 天照女神来得快，去得也快，转瞬即逝，只留下神圣的静谧——而各行各业已纷纷报告了那些奇异而充满灵感的进步。" #deepl:3491136693
 gate_ley_line.2.a: "太棒了！" #deepl:3289732063
 gate_ley_line.3.t: "《始皇帝之下的低语》" #deepl:2384536619
 gate_ley_line.3.d: "当地[concept_gate_mana_density]的增加，导致了秦始皇陵下那处古老的[Concept('concept_gate_ley_lines','$concept_gate_ley_line$')]节点苏醒。" #deepl:1231881397
 gate_ley_line.3.f: "在古都西安，能量线剧烈涌动——唤醒了秦始皇陵下沉睡已久的能量枢纽。在附近劳作的农民们谈论着空气中一种奇异的压迫感，一种迫使他们不停劳作的冲动，以及从地底深处传来的、遥远而有节奏的行军声。 整个地区的修者都察觉到一股深重的骚动，仿佛有某种庞大而深埋之物正在苏醒，但他们的占卜却未能揭示任何答案。" #deepl:1909395410
 gate_ley_line.3.a: "这令人担忧。" #deepl:2714219379
 gate_ley_line.4.t: "乌鲁鲁的歌唱之心" #deepl:322475842
 gate_ley_line.4.d: "当地[concept_gate_mana_density]的增强，导致了乌鲁鲁（Uluru）地下那座古老的[Concept('concept_gate_ley_lines','$concept_gate_ley_line$')]枢纽的苏醒。" #deepl:792567701
 gate_ley_line.4.f: "当魔力在北方领地的能量线中奔涌时，乌鲁鲁——那座神圣的红色巨岩——以静谧而庄严之姿苏醒。清澈见底的泉水从其基座涌出，在原本荒芜之地形成了一片绿洲。这片土地仿佛在向沙漠发起挑战，绽放出祖先的记忆。 夜幕降临，水面上飘荡着发光的缕缕光影，闪烁着超凡脱俗的色彩——当地人相信，那是“梦境时代”的灵体。这些祖先之光触动了灵魂深处的某种情感，整个地区的艺术家们开始创作作品，其中融入了远见、敬畏以及古老歌谣的回响。这片土地的心脏再次唱响。" #deepl:1325170655
 gate_ley_line.4.a: "太棒了！" #deepl:3289732063
 gate_ley_line.5.t: "《雷霆橡树的归来》" #deepl:3427693426
 gate_ley_line.5.d: "当地[concept_gate_mana_density]的增强，导致了位于多纳雷奇（Donareiche）地底的古老[Concept('concept_gate_ley_lines','$concept_gate_ley_line$')]节点苏醒。" #deepl:55014399
 gate_ley_line.5.f: "在黑森州的心脏地带，昔日古老的“多纳尔橡树林”曾矗立于此，如今大地在震颤——那棵伟大的橡树正重新崛起。 在苏醒的莱线滋养下，它的根系劈开岩石，树冠向四面八方延伸，涌动着原始而古老的力量。尽管周围的空气中回荡着深深的背叛感，这片土地却生机勃勃：庄稼长得更茂盛，动物出生时体格强健，雨水总在恰到好处的时候降下。 当地人肃穆地聚集在此，感受着被遗忘的誓言与远古存在的沉重。关于旧神们的低语悄然涌动，那些曾被数世纪沉默掩埋的祈祷声再次升起。雷声重临——不是愤怒的怒吼，而是审判的宣告。" #deepl:3215896656
 gate_ley_line.5.a: "这令人担忧。" #deepl:2714219379
 gate_ley_line.6.t: "《石与火的低语》" #deepl:2358393724
 gate_ley_line.6.d: "当地的[concept_gate_mana_density]能量增强，导致了位于Rök符文石下方的古老[Concept('concept_gate_ley_lines','$concept_gate_ley_line$')]节点苏醒。" #deepl:935157396
 gate_ley_line.6.f: "随着戈塔兰上空的法力日益浓郁，一股奥术共振的涟漪向北蔓延——唤醒了戈塔兰古“罗克”符文石下方的能量线交汇点。石上雕刻的符文闪烁着璀璨的光芒，将摇曳的光芒投射到整个乡野。 很快，斯堪的纳维亚半岛各地的鲁尼石开始发光，长久沉睡的咒语在其中低声轰鸣。学者们争相破译这些神秘的符文图案，揭开了早已失传的鲁尼魔法原理。 在戈塔兰，当地的符文雕刻师一跃成为炙手可热的工匠，他们赋予能量的符文铭文加速了工业流程，并推动了魔法与现实的融合。古老的石碑再次发声，虽非言语——而是力量。" #deepl:2052796929
 gate_ley_line.6.a: "好。" #deepl:3593588592
 gate_ley_line.7.t: "重燃的追捕" #deepl:2942528049
 gate_ley_line.7.d: "当地[concept_gate_mana_density]的增加，导致了卡纳克石阵（Carnac Stones）下方古老的[Concept('concept_gate_ley_lines','$concept_gate_ley_line$')]节点苏醒。" #deepl:3172764843
 gate_ley_line.7.f: "随着魔力在大地间奔涌，卡纳克石阵下方的能量线骤然苏醒，将这些古老的巨石笼罩在一片幽幽的幽光之中。随之，某种原始而狂野的力量开始苏醒。 当地人谈论着那些充满追逐与阴影的生动梦境，以及一种新生的冲动，驱使他们想要漫游于森林与海岸之间。久已埋藏的本能重新苏醒，随之而来的，还有祖先——那些狩猎采集者——那无声的召唤。“狩猎”已重返布列塔尼。" #deepl:676709762
 gate_ley_line.7.a: "这真出乎意料。" #deepl:1647802493
 gate_ley_line.8.t: "龙之心在跃动" #deepl:554626291
 gate_ley_line.8.d: "当地[concept_gate_mana_density]的增加，导致了圣贝阿图斯洞穴下方古老的[Concept('concept_gate_ley_lines','$concept_gate_ley_line$')]节点苏醒。" #deepl:1186389360
 gate_ley_line.8.f: "在被迷雾笼罩的圣贝阿图斯洞穴深处——这里长期以来一直被视为传说和虔诚民间传说中的圣地——大地因新涌现的魔力而震颤。 在苏醒的灵脉阴影下，探险者们发现了一件嵌在岩石中的、正在脉动的神器——一颗晶体核心，触之温热，蕴含着古老的力量，发出低沉的嗡鸣。 学者们如今认为，这便是“龙之心”，自一个被遗忘的时代起便一直沉睡至今。随着它再次微弱地跳动，原始的奥术能量充盈了整个洞穴，为人们揭示了关于远古魔法的奥秘。一个真相变得清晰：关于龙的传说中，或许不仅有火焰与恐惧——更蕴藏着知识。" #deepl:375314086
 gate_ley_line.8.a: "国宝。" #deepl:3066318378
 gate_ley_line.9.t: "《燃烧的静脉》" #deepl:3153890219
 gate_ley_line.9.d: "当地[concept_gate_mana_density]能量的增强，促使位于巴巴·古尔古尔“永恒之火”下的古老[Concept('concept_gate_ley_lines','$concept_gate_ley_line$')]节点苏醒。" #deepl:3091549453
 gate_ley_line.9.f: "随着美索不达米亚全境的魔力密度骤然飙升，巴巴·古尔古尔那盏古老的“永恒之火”燃烧得愈发炽烈，其蓝金色光芒在奥术能量的加持下闪烁不定。在这永不熄灭的火焰之下，地质学家与神秘学家们都惊愕地发现了一些隐藏的油井，其中不仅蕴藏着“黑色黄金”，还涌动着魔法共振。 产量激增至难以置信的程度，这同样吸引了实业家和元素师们的关注。有人私下议论，大地本身已被唤醒——并且正在流淌着力量。" #deepl:3807472037
 gate_ley_line.9.a: "这将推动我们行业向前发展。" #deepl:648939038
 gate_ley_line.10.t: "七重烈焰" #deepl:1662656748
 gate_ley_line.10.d: "当地“[concept_gate_mana_density]”能量的增强，导致了巴库阿特什加（Ateshgah）地下那座古老的“[Concept('concept_gate_ley_lines','$concept_gate_ley_line$')]”枢纽的苏醒。" #deepl:1851211583
 gate_ley_line.10.f: "在阿特什加（Ateshgah）这座古老的神庙中，神圣之火已在此翩然起舞数个世纪；如今，充盈着魔力的空气正以超自然的活力滋养着火焰。七簇永恒之火熊熊燃烧，其烈度之高已超出任何生者的记忆，将璀璨的光芒洒向巴库的天空。 奇怪的是，整个地区的锻炉和熔炉中的火焰都烧得更加炽热、效率更高，一种近乎神圣的热量正赋予当地的钢铁厂以力量。有人说这是火灵在苏醒，也有人说这是被遗忘的祈祷得到了回应。无论真相如何，锻造之神似乎都很满意。" #deepl:3228369857
 gate_ley_line.10.a: "这令人担忧。" #deepl:2714219379
 gate_ley_line.11.t: "闪耀纯净之水" #deepl:817308417
 gate_ley_line.11.d: "当地[concept_gate_mana_density]的增强，导致了恒河河底那处古老的[Concept('concept_gate_ley_lines','$concept_gate_ley_line$')]节点苏醒。" #deepl:930891478
 gate_ley_line.11.f: "瓦拉纳西这座古老的城市，长久以来因传统与时光的沉淀而神圣，如今正涌动着一种崭新的神秘能量。随着恒河底下的莱线苏醒，这条神圣的河流在月光下泛着微光，河水蕴含着温柔而治愈的魔力。 当地人说，那些在河岸阶梯上沐浴的人们，旧疾正在消退，内心重归深沉的宁静。朝圣者与学者们怀着虔诚与敬畏之心齐聚一堂，共同见证恒河的重生——它不仅是一条精神生命线，如今更成为活力的源泉。" #deepl:3597646721
 gate_ley_line.11.a: "太棒了！" #deepl:3289732063
 gate_ley_line.12.t: "七丘之主的祝福" #deepl:4278179392
 gate_ley_line.12.d: "当地[concept_gate_mana_density]能量的增强，促使位于文卡特什瓦拉神庙（Venkateswara Temple）下方的古老[Concept('concept_gate_ley_lines','$concept_gate_ley_line$')]能量节点苏醒。" #deepl:996572562
 gate_ley_line.12.f: "文卡特什瓦拉神庙下方的莱线苏醒，将古老的神性与现代的玄奥交织在一起。 无论是朝圣者还是学者，都表示在神庙的庇荫下，曾经历过幻象、启示以及难以置信的清明。据说，文卡特什瓦拉神如今正通过莱线低语真理——将洞见赐予那些敢于倾听之人。" #deepl:779027456
 gate_ley_line.12.a: "太棒了！" #deepl:3289732063
