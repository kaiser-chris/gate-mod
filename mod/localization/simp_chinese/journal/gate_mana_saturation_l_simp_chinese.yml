 je_gate_mana_saturation: "全球法力饱和度" #deepl:171745877
 je_gate_mana_saturation_goal: "[concept_gate_mana_saturation] 已达到上限" #deepl:2322385364
 je_gate_mana_saturation_reason: "随着不同维度之间的屏障日渐薄弱，魔力开始渗入我们的世界，其存在感也随着时间的推移日益增强。空气中回荡着崭新的能量，现实的结构似乎也因蕴含的潜力而闪烁生辉。这股源源不断的魔力涌入，必将重塑我们对魔法与力量的认知，预示着一个充满前所未有变革与机遇的新时代的到来。" #deepl:455482982
 je_gate_mana_saturation_low_progress: "全球[concept_gate_mana_density]的平均水平较低。" #deepl:1289296367
 je_gate_mana_saturation_medium_progress: "全球各地的[concept_gate_mana_density]平均值正在上升。" #deepl:1707466708
 je_gate_mana_saturation_high_progress: "全球[concept_gate_mana_density]的平均水平较高。" #deepl:3024880114
 je_gate_mana_saturation_button_slave_ritual: "祭品奴隶" #deepl:2127545356
 je_gate_mana_saturation_button_slave_ritual_desc: "牺牲[GetPopType('slaves').GetName]，以提升我方某一州内的[concept_gate_mana_density]。" #deepl:3207125767
 je_gate_mana_saturation_button_slave_ritual_infamy: "[SCOPE.sCountry('loc_country_scope').GetName]的恶名值低于100。" #deepl:2238047500
