 je_gate_veiled_interior: "《蒙面内室》" #deepl:2486240553
 je_gate_veiled_interior_reason: "在新萨马多尔已开发完好的沿海地区之外，是“面纱内陆”——一片由茂密丛林和耸立的高地组成的广袤区域，迄今为止尚未有任何实质性的探险活动成功进入。 首批[GetCulture('gnomish').GetName]的定居者经由沿海的[GetBuildingType('building_gate_eastern_new_guinea').GetName]抵达，随后定居点沿着可通航的海岸线和河道逐渐向外扩展。然而，更深处的内陆依然笼罩在迷雾之中，其地形尚未被绘制，当地状况也鲜为人知。" #deepl:2120754377
