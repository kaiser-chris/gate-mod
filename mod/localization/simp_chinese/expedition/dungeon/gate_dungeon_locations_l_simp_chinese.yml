l_simp_chinese:
 # Western Europe
 gate_dungeon_dunmorrach: "邓莫拉赫" #deepl:2031928291
 gate_dungeon_dunmorrach_desc: "在一处俯瞰着灰蒙蒙的海湾的岬角上，矗立着一座布罗赫塔的残垣——没有任何氏族记得曾建造过它，其干石砌成的墙壁仅比一个人的身高略高。 然而，一旦穿过那唯一的一扇低矮门扉，墙壁便没有尽头：邓莫拉赫通向拱顶大厅、卫兵室以及螺旋楼梯，这些楼梯层层向下延伸，通往一座远比这座山丘所能容纳的还要宏大的城堡。 探险者们谈论着永不疲倦的铠甲哨兵，谈论着不属于任何氏族的旗帜，还谈论着最底层的那座大厅——那里总摆着一座冰冷的炉灶，却从未生过火。" #deepl:4281529389
 building_gate_dungeon_dunmorrach: "$gate_dungeon_dunmorrach$ $concept_gate_dungeon$" #deepl:2239800222
 gate_dungeon_oldewaard: "奥尔德瓦德" #deepl:3036865142
 gate_dungeon_oldewaard_desc: "在瓦登泥滩上，退潮时从堤坝出发需长途跋涉，一座砖砌教堂塔尖从淤泥中拔地而起，在有生之年，这里从未建过村庄。 退潮时，钟楼的门刚好高出泥滩，穿过那扇门的人发现的并非钟室，而是一条蜿蜒向下的楼梯，通向一座被淹没的城镇——那里有山墙屋、被洪水淹没的小巷，以及长满水草的运河。潮水从未涌入内部的大厅，然而每条街道都浸没在水中，水下还有东西在移动。 若有人错过了横穿滩涂返回的时机，在抵达这座“地牢”本身的危险之前，便早已面临大海的威胁。" #deepl:3116362586
 building_gate_dungeon_oldewaard: "$gate_dungeon_oldewaard$ $concept_gate_dungeon$" #deepl:2752632048

 # Southern Europe
 gate_dungeon_mongibello: "蒙吉贝洛" #deepl:3300345789
 gate_dungeon_mongibello_desc: "在埃特纳火山漆黑的山腰上，在古老的熔岩流之间，有一条本应只向山体内部延伸几十步的熔岩管，却深入山体更深处。 蒙吉贝洛（Mongibello）——其名源自这座山昔日的西西里语名称——是一座由玄武岩隧道和炽热岩浆通道构成的地牢，空气因高温而微微颤动，脚下的岩石也始终在微微震颤。 这里的居民是由火山灰和炉渣构成的生物，据说下层更像是一座锻造工坊而非洞穴，一排排黑曜石砧座整齐排列，仿佛在等待那些永远不会到来的铁匠。" #deepl:928496763
 building_gate_dungeon_mongibello: "$gate_dungeon_mongibello$ $concept_gate_dungeon$" #deepl:775273922
 gate_dungeon_grieta_blanca: "格里塔·布兰卡" #deepl:3435846042
 gate_dungeon_grieta_blanca_desc: "在阿拉贡比利牛斯山脉的高山隘口附近，蒙特佩尔迪多山山麓之下，石灰岩中的一道狭窄裂缝，即使在盛夏时节也仍会吹出寒气。 牧民们一直都知道，这里是雪迹久久不消的地方——即便山隘早已积雪消融，但穿过第一个弯道后，“格里埃塔·布兰卡”（Grieta Blanca，即“白色裂缝”）便豁然展开，形成一个远超这座山应有规模的冰冻迷宫： 冰瀑、蓝冰洞室，以及地面铺满冰层的冰廊——冰层清澈得让探险者能透过冰面，看见靴底下方被冰封的物体轮廓。" #deepl:3994533572
 building_gate_dungeon_grieta_blanca: "$gate_dungeon_grieta_blanca$ $concept_gate_dungeon$" #deepl:679395740

 # Balkans
 gate_dungeon_cetatea_neagra: "黑城堡" #deepl:1396550911
 gate_dungeon_cetatea_neagra_desc: "在喀尔巴阡山脉南麓的一处林木葱郁的山脊上，矗立着一座在任何编年史中都未曾记载的要塞，其墙壁已变得漆黑；城门塔楼完好无损，庭院里却长满了山毛榉幼树。山谷下方的村庄称它为“Cetatea Neagra”（黑堡垒），并让他们的羊群远离此地。 穿过城门塔，便是一座典型的地牢：火把照亮的走廊、兵营、牢房和礼拜堂层层叠叠，由身着盔甲的亡灵守卫和各种低级怪物巡逻，它们服从着活人从未下达过的命令。" #deepl:1351207754
 building_gate_dungeon_cetatea_neagra: "$gate_dungeon_cetatea_neagra$ $concept_gate_dungeon$" #deepl:2608092798
 gate_dungeon_labyrinthos: "Labyrinthos" #deepl:982357348
 gate_dungeon_labyrinthos_desc: "在梅萨拉平原以南的山丘中，隐藏着一些古老的采石场巷道，克里特人长期以来将其称为“迷宫”——这是一片由岩石凿成的通道迷阵，曾被认为是传说中的那个迷宫。其中一条通道在旧地图标注的尽头处依然延伸着。 穿过那段通道，“迷宫”便蜿蜒延伸，穿行于淡色石灰岩构成的天然洞穴、水滴滴落的巷道以及错综复杂的隧道之中——与其他已知的任何地牢相比，这里的隧道布局在每次探访之间更易发生变化。探险者们报告说在更深的层级中发现了长角野兽，并半开玩笑地坚称，这个地方似乎非常清楚自己正在模仿哪一个传说。" #deepl:992872001
 building_gate_dungeon_labyrinthos: "$gate_dungeon_labyrinthos$ $concept_gate_dungeon$" #deepl:2861721661

 # Central Europe
 gate_dungeon_tiefburg: "蒂夫堡" #deepl:1233845556
 gate_dungeon_tiefburg_desc: "#bold  位于 [GetStateRegion('STATE_TYROL').GetName] 的 [GetBuildingType('building_gate_tyrol').GetName] 上方石灰岩洞穴中，据信 #!#bold $gate_dungeon_tiefburg$#! 的形成源于传送门本身带来的 [concept_gate_mana_density] 激增。 当地的牧羊人追着一只走失的山羊进入山坡，他们不仅最先发现了入口，也最先报告了入口彼端的情形：洞口通向石砌大厅、带栅栏的牢房以及蜿蜒的走廊，这些景象在任何古老城堡的主塔中都司空见惯，尽管地表上根本没有城堡的废墟。" #deepl:2659547242
 building_gate_dungeon_tiefburg: "$gate_dungeon_tiefburg$ $concept_gate_dungeon$" #deepl:3655843781
 gate_dungeon_silbergrund: "Silbergrund" #deepl:3109519749
 gate_dungeon_silbergrund_desc: "在厄尔士山脉——这里开采银矿的历史比任何有记载的时期都要久远——一个采矿村上方的一条废弃平巷，沿着矿工们亲手开凿的巷道，通向山体深处。 越过最后的工具痕迹，这条巷道便进入了“银源”（Silbergrund）：这里是一片绵延的天然洞穴群，其中布满闪闪发光的矿脉、地下湖泊，以及通向深渊的竖井——那深渊的黑暗远非任何矿灯所能照及。 老矿工们说，山脉正在偿还被掠夺的矿藏，而地牢里的宝箱里确实蕴藏着丰富的矿石，但守护这些宝箱的生物不仅挖掘技术不输任何矿工，对隧道的了解更是胜过任何人。" #deepl:1787057676
 building_gate_dungeon_silbergrund: "$gate_dungeon_silbergrund$ $concept_gate_dungeon$" #deepl:2817468898

 # Northern Europe
 gate_dungeon_surtsdjup: "苏尔茨迪普" #deepl:2412711665
 gate_dungeon_surtsdjup_desc: "在西部高地的熔岩原上，古老的萨迦传说中提到一位从穆斯佩尔海姆向北而来的火巨人，以及那些藏身于他阴影之下的亡命之徒所栖身的洞穴。苏尔特深渊（Surtsdjúp）就始于这样一座熔岩洞穴，洞顶多处坍塌，露出了灰蒙蒙的天空。 深入其中，这座洞穴展现出普通熔岩管所不具备的特质：温度非但没有降低，反而愈发炽热，直至岩壁泛起红光，本应流淌着水的通道里，竟涌动着熔岩之河。探险者们将其列为北方最危险的地下迷宫之一，而越往深处，那些由火焰孕育的生物似乎体型就越大。" #deepl:959981999
 building_gate_dungeon_surtsdjup: "$gate_dungeon_surtsdjup$ $concept_gate_dungeon$" #deepl:338466721
 gate_dungeon_svartisgapet: "斯瓦蒂斯加佩特" #deepl:2712059456
 gate_dungeon_svartisgapet_desc: "在斯瓦尔蒂森（Svartisen）巨大的冰盖之下——那里的古老冰层如此致密，看起来几乎呈黑色——一条位于峡湾上方的冰川舌裂开了一个漆黑的裂缝，当地人称之为“斯瓦尔蒂斯加佩特”（Svartisgapet）。划船经过的渔民说，这个裂缝会“呼吸”，黄昏时吸入空气，黎明时将其呼出。 洞内是一座蓝黑相间的冰洞，洞壁上嵌着石块、木头，还有一些生物在奔跑中途被冻住的轮廓。其中有些生物，其实并没有表面看起来那么冻僵。" #deepl:2957806218
 building_gate_dungeon_svartisgapet: "$gate_dungeon_svartisgapet$ $concept_gate_dungeon$" #deepl:1048494313

 # Russia
 gate_dungeon_ledyanoy_zev: "莱迪亚诺伊·泽夫" #deepl:693399934
 gate_dungeon_ledyanoy_zev_desc: "在乌拉尔山脉西部的西尔瓦河沿岸，石膏山丘布满了蜂窝状的洞穴，其中终年积冰。莱迪亚诺伊·泽夫（Ledyanoy Zev，意为“冰之巨口”）就位于其中一座山丘内，入口处悬挂着一层冰柱帷幕——这层帷幕一旦被打破，不到一小时便会重新长成。 洞内，每个表面都生长着如人手般大小的霜晶，岩洞中布满冰封的湖泊，而寒气似乎并非仅仅将入侵者包围，而是如影随形地追随其后。这里的居民是些苍白的生物，它们凭借队伍成员身体散发的热量进行狩猎。" #deepl:3842498266
 building_gate_dungeon_ledyanoy_zev: "$gate_dungeon_ledyanoy_zev$ $concept_gate_dungeon$" #deepl:2479745820
 gate_dungeon_kitezh: "基特日" #deepl:3987445434
 gate_dungeon_kitezh_desc: "斯维特洛亚尔湖面积不大，呈圆形，水深见底。据该地区有记忆以来流传的说法，湖底藏着一座圣城，被湖水掩护着免受敌人的侵扰，在寂静的夜晚，那里的钟声依然回荡。 基特日是朝圣者始料未及的地下迷宫：湖岸边有一道白石台阶笔直通向湖中，沿着台阶走下去，一行人便能脚不沾水地走进湖底那座被淹没的城市——那里有教堂、城墙和木制街道。 钟声确实在响。但没有一个归来者能看清究竟是什么在敲响这些钟。" #deepl:1575134297
 building_gate_dungeon_kitezh: "$gate_dungeon_kitezh$ $concept_gate_dungeon$" #deepl:3484290287

 # Eastern Europe
 gate_dungeon_qara_qoba: "卡拉·科巴" #deepl:968467120
 gate_dungeon_qara_qoba_desc: "在克里米亚山脉的高耸喀斯特高原上，亚伊拉牧场遍布着天坑和竖井，其中大多数较浅，当地放牧的牧民们对此都了如指掌。卡拉·科巴（黑洞）是一个自古便存在的天坑，但从未像现在这样深过。 一支探险队从洞口边缘向下深入，进入了一个由大理石般洁白的洞室、帷幕状岩柱以及无尽分支的滴水通道构成的世界。据说，更深的层级里栖息着苍白的蛇类，回声也会以非自身的声音作出回应。" #deepl:2583201247
 building_gate_dungeon_qara_qoba: "$gate_dungeon_qara_qoba$ $concept_gate_dungeon$" #deepl:3751218621
 gate_dungeon_glebia_solna: "格列比亚·索尔纳" #deepl:2214265771
 gate_dungeon_glebia_solna_desc: "在克拉科夫以南，盐矿在地下绵延数英里，其矿室由几代矿工开凿而成，形成由灰绿色岩盐构成的礼拜堂、大厅和楼梯。格莱比亚·索尔纳（Glebia Solna，即“盐之深渊”）就通向这样一座盐矿中一条被遗忘的侧巷。 这里的厅堂看起来更像是人工雕凿而非天然形成，其中矗立着盐柱、雕像和水晶吊灯，然而矿工的工具却从未触碰过它们。更深处的岩层与其说是矿井，不如说更像一座巨大的盐宫，里面驻守着由盐和石头构成的雕像——一旦被击打便会崩解，若无人理会又会重新组合。" #deepl:4231820527
 building_gate_dungeon_glebia_solna: "$gate_dungeon_glebia_solna$ $concept_gate_dungeon$" #deepl:4135015187

 # Nile Basin
 gate_dungeon_ta_djeser: "塔-杰塞尔" #deepl:4200652703
 gate_dungeon_ta_djeser_desc: "在尼罗河西岸的沙漠丘陵中，那里曾是古埃及国王们在岩石中凿出陵墓的地方，有一处墓穴入口，既未被任何测量员记录在案，也未被任何盗墓者洗劫一空。其门楣上雕刻着人们熟悉的神祇与国王形象，但本应刻有他们名字的环形铭文框却一片空白。 塔-杰塞尔（Ta-Djeser，其名源自古埃及对神圣陵园的称谓）蜿蜒而下，穿过绘有星辰图案的走廊和柱廊大厅，经过堆满密封石棺的墓室，以及通向深坑的假通道。这里的守墓人裹着裹尸布，耐心守候，却并未安息在棺椁之中。" #deepl:3216497228
 building_gate_dungeon_ta_djeser: "$gate_dungeon_ta_djeser$ $concept_gate_dungeon$" #deepl:3412278458
 gate_dungeon_deriba: "德里巴" #deepl:941347023
 gate_dungeon_deriba_desc: "杰贝尔·马拉山从达尔富尔的干旱平原中拔地而起，宛如一座绿意盎然的岛屿，山坡清凉宜人，溪流潺潺，梯田层叠；山顶处坐落着德里巴火山口，其中有两座火山口湖。 在火山口的内壁上，一条本应只释放出些许暖风的裂缝，却通向了一个由黑色岩石和冒着烟的喷口构成的地牢。 德里巴的温度远高于周围地区，熔岩河与沸腾的泥浆池纵横交错于其岩层之中，而栖息其中的生物，其躯体由灰烬与血肉同样构成。" #deepl:235246290
 building_gate_dungeon_deriba: "$gate_dungeon_deriba$ $concept_gate_dungeon$" #deepl:1282355718

 # North Africa
 gate_dungeon_qabr_ar_raml: "卡布尔·拉姆尔" #deepl:2955713711
 gate_dungeon_qabr_ar_raml_desc: "在撒哈拉广袤的沙海深处，沙丘随风移动，有时会揭开它们长期掩埋之物。“卡布尔·拉姆尔”（Qabr ar-Raml），即“沙之墓”，是一座位于高耸沙丘脚下的砂岩拱门，两侧矗立着被风蚀得面容尽失的雕像。 途经此处的商队会在别处给骆驼饮水。拱门之后，是一座由埋藏的厅堂构成的地牢，穿过半被沙子填满的柱廊，延伸至墓室和供奉着已被遗忘的神力的神龛，那里有马般大小的蝎子守卫着装满宝石的沉重箱子。" #deepl:2287891589
 building_gate_dungeon_qabr_ar_raml: "$gate_dungeon_qabr_ar_raml$ $concept_gate_dungeon$" #deepl:3934485644
 gate_dungeon_tazrout: "塔兹鲁特" #deepl:3723949154
 gate_dungeon_tazrout_desc: "在阿特拉斯山脉的高处，一座红墙卡斯巴矗立在核桃树与梯田大麦环绕的山谷之上，据村民们说，这座卡斯巴早在他们的曾祖父出生之前就被废弃了。 它的塔楼已然倾颓，庭院空无一人，但中央塔楼里的一道楼梯通向塔兹鲁特——那里是由石制大厅、岗哨室和牢房组成的地下牢狱，比上方的土制堡垒规模更大，看起来也更为古老。 驻守在此的铠甲战士们以正规军般的纪律作战，那些低估了他们实力的队伍，很少能突破第二道防线。" #deepl:1903513982
 building_gate_dungeon_tazrout: "$gate_dungeon_tazrout$ $concept_gate_dungeon$" #deepl:3679621244

 # West Africa
 gate_dungeon_tellemkoro: "泰莱姆科罗" #deepl:1595410917
 gate_dungeon_tellemkoro_desc: "在班迪亚加拉悬崖沿线，一些小型居所和粮仓依偎在崖壁上，它们是由现今村民之前的居民留下的，人们只记得他们被称为“泰莱姆人”。在这些古老的崖居中，有一扇门并非通向浅浅的洞室，而是直通岩石内部。 特莱姆科罗向下延伸，穿过干燥的砂岩洞穴、狭窄的烟囱状通道，以及巨大的回声洞室——这些洞室被本不该照进如此深处的阳光照亮。其中的生物攀爬迅速敏捷，而这座地牢更偏好陡峭的悬崖而非平地。" #deepl:3343970160
 building_gate_dungeon_tellemkoro: "$gate_dungeon_tellemkoro$ $concept_gate_dungeon$" #deepl:4199357389
 gate_dungeon_igbo_ojiji: "伊博语 Ojiji" #deepl:2036664417
 gate_dungeon_igbo_ojiji_desc: "在约鲁巴地区的森林中，人们会划出一些神圣的林地加以保护，任其自然生长，树木永不被砍伐。“伊博·奥吉吉”（Igbo Ojiji），即“阴影之林”，便是其中之一。这里的树冠密不透光，阳光无法穿透至地面；两棵巨大的伊罗科树之间有一条小径，通向林地本身所未及之处。 林中是一座热带地牢，潮湿的丛林、藤蔓缠绕的神龛以及静谧的黑色水潭交织其间，这里的树木仿佛在注视着一切，而动物的体型也远比林外的大得多。" #deepl:3624009545
 building_gate_dungeon_igbo_ojiji: "$gate_dungeon_igbo_ojiji$ $concept_gate_dungeon$" #deepl:979097870

 # Equatorial Africa
 gate_dungeon_mokele: "莫克莱" #deepl:305888647
 gate_dungeon_mokele_desc: "在伊图里森林里，树木生长得如此茂密，以至于旅行者可以连走数日都看不到天空。这里的森林居民常提起一个河水倒流的地方。莫克莱就是那个地方：一条缓慢流淌的褐色河流在某处转弯，河水并非流向远方，而是汇入一棵巨树根部下方的一个凹陷处。 那片深处的密林，是热气腾腾的丛林层叠、被洪水淹没的森林和杂草丛生的梯田交织而成的迷宫，栖息着巨大的爬行动物、成群的昆虫，以及在树冠层中移动却隐隐若现的未知生物。" #deepl:1052680998
 building_gate_dungeon_mokele: "$gate_dungeon_mokele$ $concept_gate_dungeon$" #deepl:1270369155
 gate_dungeon_shimo_la_shaba: "希莫·拉·沙巴" #deepl:2537917738
 gate_dungeon_shimo_la_shaba_desc: "卡坦加的山丘蕴藏着如此丰富的铜矿，以至于有些地方裸露的地面都染上了绿色；早在外来者前来探矿之前，当地人就已经将这种金属冶炼成铜锭了。 “希莫·拉·沙巴”（铜坑）是一处山坡竖井，井壁上结着孔雀石的结壳，向深处延伸的洞穴中布满了绿蓝相间的矿脉。 这里的居民拥有如板甲般能挡住刀刃的皮肤，而地牢中的宝箱之所以备受珍视，正是因为其中蕴藏的铜以及伴生出的稀有金属。" #deepl:2227666926
 building_gate_dungeon_shimo_la_shaba: "$gate_dungeon_shimo_la_shaba$ $concept_gate_dungeon$" #deepl:2023524341

 # Southern Africa
 gate_dungeon_diepkloof: "迪普克洛夫" #deepl:2379273050
 gate_dungeon_diepkloof_desc: "在高地（Highveld）的白云岩山丘上，地面布满了天坑和洞穴，其中许多都堆满了很久以前坠入其中的动物骨骸。“深谷”（Diepkloof）始于一片树木茂密的沟壑，那里有一个洞口被野无花果树半掩着，树根向下延伸至幽暗之中。 洞内是布满脆裂石笋的干燥洞穴、堆满骨骸的洞室，以及深不可测、任何绳索都无法触及的竖井。这座地牢格外擅长设下埋伏，探险队们常谈论那些在黑暗中耐心等待的野兽——它们总要等到灯火最微弱时才现身。" #deepl:676433498
 building_gate_dungeon_diepkloof: "$gate_dungeon_diepkloof$ $concept_gate_dungeon$" #deepl:3241779130
 gate_dungeon_bone_shoal: "骨礁" #deepl:2122321929
 gate_dungeon_bone_shoal_desc: "在雾气弥漫的“骷髅海岸”——这里是纳米布沙漠与寒冷的大西洋交汇之处——海滩上散落着鲸骨和沉船的残骸。一艘沉船深埋在内陆的沙丘之中，船体半埋在沙中，货舱则延伸至“骨礁”之下。 令人难以置信的是，沙漠之下竟沉睡着一座水没之城：被洪水淹没的街道、下沉的大厅，以及潮汐池中，布满藤壶的石柱从幽暗的水面拔地而起。学者们将其视为最有力的证据，证明地牢的主题与周围的土地毫无关联。" #deepl:746469498
 building_gate_dungeon_bone_shoal: "$gate_dungeon_bone_shoal$ $concept_gate_dungeon$" #deepl:2728653656

 # East Africa
 gate_dungeon_suswa: "苏斯瓦" #deepl:1121828613
 gate_dungeon_suswa_desc: "苏斯瓦山从大裂谷谷底拔地而起，是一座双环火山，其外环火山口内环绕着一片草地，内环火山口则是一座被深壕沟环绕的岩石岛。 山体两侧布满了熔岩管，狒狒们常在其中避暑；其中一条熔岩管蜿蜒向下，越往深处越热，熔岩滚动的轰鸣声也愈发响亮。 苏斯瓦地牢处处尽是漆黑的玄武岩与烈火，其通道由熔岩瀑布照亮，巡逻其中的生物仿佛是由山体本身塑成。" #deepl:3025099889
 building_gate_dungeon_suswa: "$gate_dungeon_suswa$ $concept_gate_dungeon$" #deepl:3314654564
 gate_dungeon_debre_sela: "德布雷·塞拉" #deepl:104059016
 gate_dungeon_debre_sela_desc: "在拉斯塔高地，教堂是从坚实的红色岩石中向下凿刻而成的，屋顶与地面齐平，墙壁矗立在深邃的沟壑之中。“岩石山”（德布雷·塞拉）便是其中一条沟壑底部的一道凿刻而成的门洞，这绝非任何石匠所能打造。 其下方延伸着一座由岩石凿成的地牢，其中有凿刻的厅堂、立柱的房间以及以难以置信的精确度开凿出的狭窄通道，由沉默的石像卫兵守卫着。越往深处，这些凿刻就越像一座宫殿，而非一座礼拜场所。" #deepl:3118331721
 building_gate_dungeon_debre_sela: "$gate_dungeon_debre_sela$ $concept_gate_dungeon$" #deepl:2088913079

 # Indochina
 gate_dungeon_prasat_khmoch: "普拉萨特·克莫奇" #deepl:3101704102
 gate_dungeon_prasat_khmoch_desc: "在大湖以北的森林里，古老神庙城市的废墟半被丛林吞噬，塔身上雕刻着宁静的面容，庭院则被榕树缠绕得支离破碎。普拉萨特·克莫奇（Prasat Khmoch），即“幽灵神庙”，是一座圣所，其内殿通向一条通往树根深处的阶梯。 下方是一座热带地牢，里面布满杂草丛生的回廊、丛林庭院和被水淹没的露台，每面墙上都有石雕面孔在注视着。内部的丛林比外部的更加生机勃勃，它正重新覆盖着队伍身后开辟出的路径。" #deepl:531780270
 building_gate_dungeon_prasat_khmoch: "$gate_dungeon_prasat_khmoch$ $concept_gate_dungeon$" #deepl:1091091520
 gate_dungeon_hang_may: "Hang May" #deepl:2920479820
 gate_dungeon_hang_may_desc: "在安南与老挝之间的石灰岩山脉中，河流消失在地下，汇入世界上规模最大的洞穴之中。“云洞”（Hang May）是一座极为广阔的河流洞穴，其洞顶下方会形成云层，而在坍塌的天窗透入的光线下，甚至生长着一片丛林。 穿过最后一道天窗，洞穴便变成了一座由巨大洞厅、地下河流以及层层叠叠如梯田般的方解石台地构成的地下迷宫。这是该地区最深的地下迷宫，进入其中的探险队通常需要提前数周制定地下探险计划。" #deepl:2677258461
 building_gate_dungeon_hang_may: "$gate_dungeon_hang_may$ $concept_gate_dungeon$" #deepl:1971472896

 # Indonesia
 gate_dungeon_kawah_biru: "卡瓦比鲁" #deepl:2341330508
 gate_dungeon_kawah_biru_desc: "在爪哇岛东部的伊真高地，硫磺矿工们钻进烟雾缭绕的火山口，从酸绿色湖畔的喷气孔上凿下黄色岩壳。夜幕降临时，这些喷气孔会燃起诡异的蓝色火焰，其中有一处名为“卡瓦·比鲁”（Kawah Biru，即“蓝火山口”）的裂缝，那里的火焰永不熄灭。 蓝焰之外，是一片由火山岩、硫磺池和令人窒息的烟雾构成的地牢，这里的酷热与空气中的毒气相映成趣。幸存下来的矿工坚称，每当有人进入时，蓝火就会燃烧得更加明亮。" #deepl:3351373770
 building_gate_dungeon_kawah_biru: "$gate_dungeon_kawah_biru$ $concept_gate_dungeon$" #deepl:739126202
 gate_dungeon_rimba_sunyi: "林巴·苏尼" #deepl:1410927264
 gate_dungeon_rimba_sunyi_desc: "在婆罗洲的深处，雨林从未静默：昆虫、鸟类和猿猴日夜不息地喧嚣着。唯有“寂静之林”（Rimba Sunyi）是它们唯一静默的地方——一圈古老的双翅果树环绕着一片下沉的空地，那里既无声响，也无动静。 一条通往空地的路径延伸至下方，通向一座热带地牢——那里生长着巨型蕨类植物，有如酒桶般巨大的瓶子草，还有粗得足以让人行走的藤蔓。这份寂静如影随形，一路伴随探险队向下延伸。" #deepl:1962332652
 building_gate_dungeon_rimba_sunyi: "$gate_dungeon_rimba_sunyi$ $concept_gate_dungeon$" #deepl:4045363020

 # South China
 gate_dungeon_jiulong_dong: "九龙洞" #deepl:2357239086
 gate_dungeon_jiulong_dong_desc: "在广西的河流沿岸，石灰岩峰如利齿般从稻田中拔地而起，几乎每一座都是中空的。九龙洞就开在其中一座山峰的水线处，只能乘船抵达。 洞穴的前几处洞室悬挂着钟乳石，船夫们说这些石笋形似盘踞的巨龙；穿过这些洞室，便是一片由巨大洞窟、石林和地下湖泊组成的迷宫，九条分岔的通道纵横交错，每次穿行都别有风景。" #deepl:255988436
 building_gate_dungeon_jiulong_dong: "$gate_dungeon_jiulong_dong$ $concept_gate_dungeon$" #deepl:3983717192
 gate_dungeon_wuliang_lin: "林五良" #deepl:1368735261
 gate_dungeon_wuliang_lin_desc: "在云南最南端，热带森林沿山势向上延伸，直抵老挝和缅甸边境，为野生大象和无数鸟类提供了庇护所。要进入这片名为“无量林”的无垠森林，需从一棵巨大的榕树下穿过——它的气生根已生长成一道活生生的门户。 步入其中，森林向四面八方绵延不绝，至今尚无任何探险队发现其尽头，层层叠叠的潮湿丛林、竹林与湍急的溪流交织其间。猴群在树冠层中尾随探险者穿行，而其中并非全是猴子。" #deepl:932280328
 building_gate_dungeon_wuliang_lin: "$gate_dungeon_wuliang_lin$ $concept_gate_dungeon$" #deepl:1477959205

 # North China
 gate_dungeon_khara_khoto: "哈拉-霍托" #deepl:2406890691
 gate_dungeon_khara_khoto_desc: "在戈壁边缘，“黑城”哈拉和托的土墙孤零零地矗立在沙漠中，当滋养这座城市的河流改道后，这里便早已被废弃。在这座废墟之城中，西墙附近的一座佛塔有一扇门，它通往的并非佛塔内部，而是沙地下方。 地下是一座由埋藏的厅堂、宝库和陵墓组成的迷宫，里面布满了被沙子侵蚀的雕像。旅行者们说，在风平浪静的夜晚，沙丘之下还能听见古城集市的喧嚣。" #deepl:1097299249
 building_gate_dungeon_khara_khoto: "$gate_dungeon_khara_khoto$ $concept_gate_dungeon$" #deepl:24012338
 gate_dungeon_dixia_gong: "迪夏宫" #deepl:86106098
 gate_dungeon_dixia_gong_desc: "在古都西安周边的平原上，散布着许多草木葱茏的冢丘，这些是皇帝和王公的陵墓，其中大多数从未被开启过。位于其中一座较小冢丘下方的“地下宫”（Dixia Gong），可通过冢丘侧面镌刻的一扇门进入。 门后延伸着布局宛如皇宫般的殿堂：庭院、御座厅、兵器库，以及两侧排列着成排陶俑和青铜兵俑的长廊——这些兵俑并不总是保持着队列。据说在最深处，还流淌着汞河。" #deepl:536929319
 building_gate_dungeon_dixia_gong: "$gate_dungeon_dixia_gong$ $concept_gate_dungeon$" #deepl:3617567429

 # Northeast Asia
 gate_dungeon_ognennaya_past: "奥格涅纳亚的过去" #deepl:2773138320
 gate_dungeon_ognennaya_past_desc: "堪察加是一片烟雾缭绕的火山、间歇泉群和蒸腾的河流交织之地，这里的熊比其他任何地方都更为庞大。《烈焰之口》（Ognennaya Past）位于一座活火山锥脚下、间歇泉环绕的山谷中：那里有一个喷口，没有蒸汽升腾，唯有熠熠生辉的热浪。 下方是已知最深的火山地穴之一，下行途中要穿越灼热的隧道、岩浆湖以及由晶体状黑曜石构成的洞室。就连向来无所畏惧的当地猎人，也不敢在能望见它的地方扎营。" #deepl:3939716489
 building_gate_dungeon_ognennaya_past: "$gate_dungeon_ognennaya_past$ $concept_gate_dungeon$" #deepl:818426959
 gate_dungeon_hyoketsu: "Hyoketsu" #deepl:127812062
 gate_dungeon_hyoketsu_desc: "在富士山北麓，一片茂密的森林覆盖着古老的熔岩流，地面上布满洞穴，其中的冰层甚至在夏季也能存留。冰穴（Hyoketsu）最初也是这些熔岩洞穴之一，但它的冰层却不像其他洞穴那样止步于此。 洞内，冰柱从地面拔地而起，宛如神社的柱子；冰封的湖面映着灯火，光影延伸至无尽的远方；探险者们描述说，这里的寒冷足以刺穿任何厚度的羊毛或皮毛。洞口上方的森林一片寂静，当地人告诫游客切勿偏离小径。" #deepl:2591675358
 building_gate_dungeon_hyoketsu: "$gate_dungeon_hyoketsu$ $concept_gate_dungeon$" #deepl:1507204179

 # Siberia
 gate_dungeon_buus_khaya: "布斯·卡亚" #deepl:848832724
 gate_dungeon_buus_khaya_desc: "在西伯利亚最北端，地表深层都已冻结，河岸上偶尔会露出猛犸象的象牙和早已灭绝的野兽尸体。“冰岩”（Buus Khaya）是一处位于河阶上的冰冻峭壁，那里有一座洞穴直通永久冻土层。 洞内，岩壁由远古冰层和黑土构成，镶嵌着骨骼、象牙以及被冻在原地的完整生物，其中一些在受到温暖时会苏醒。更深处的温度比西伯利亚任何一个冬天都要寒冷。" #deepl:188674913
 building_gate_dungeon_buus_khaya: "$gate_dungeon_buus_khaya$ $concept_gate_dungeon$" #deepl:1876216868
 gate_dungeon_shamanka: "萨曼卡" #deepl:279338067
 gate_dungeon_shamanka_desc: "在贝加尔湖的奥尔洪岛上，有一座名为“沙曼卡”的双峰岩峭壁直插湖中，几代以来一直被布里亚特人视为神圣之地。岩壁脚下，水线稍上方有一处洞穴，从那里延伸出一条通道，通向世界最深湖泊的水面之下。 水下沉睡着一座由石头和木材构成的沉没之城，街道浸没在清澈冰冷的水中，探险者能清晰地看到脚下的深处，而更深处的塔楼则隐没在黑暗之中。贝加尔湖深处的生物似乎也找到了通往这座城市的路。" #deepl:4084631959
 building_gate_dungeon_shamanka: "$gate_dungeon_shamanka$ $concept_gate_dungeon$" #deepl:2125098252

 # Oceania
 gate_dungeon_grose_hollow: "格罗斯霍洛" #deepl:3286345539
 gate_dungeon_grose_hollow_desc: "在悉尼以西，蓝山是一片由砂岩峭壁和深谷交织而成的迷宫，桉树林让这里笼罩在朦胧的蓝光中，许多峡谷中都隐藏着洞穴。格罗斯霍洛（Grose Hollow）位于最偏远的山谷之一，在瀑布脚下，隐藏在飞泻而下的水帘之后。 洞穴内部宛如一座地底迷宫，布满悬挂着水晶的洞室、地下河流以及狭窄的通道，这些通道会突然豁然开朗，通向闪闪发光的石灰岩大厅。就地牢的标准而言，这里的居民也显得格外诡异——它们虽具有有袋类动物的外形，却已扭曲变形，变成了远比普通有袋类动物更危险的生物。" #deepl:1094261557
 building_gate_dungeon_grose_hollow: "$gate_dungeon_grose_hollow$ $concept_gate_dungeon$" #deepl:96398301
 gate_dungeon_ketetahi: "凯泰塔希" #deepl:1590309770
 gate_dungeon_ketetahi_desc: "在北岛的火山腹地，三座雄伟的山峰从一片由火山灰和丛生草构成的荒漠高原上拔地而起，山坡上热泉喷涌，裂缝中蒸汽袅袅。凯泰塔希（Ketetahi）便是其中一个位于冒烟锥体侧面的裂缝，那里热泉沸腾奔流，地面裂开形成一道发光的裂缝。 地底的幽深洞穴中，熔岩河流蜿蜒，硫磺水池星罗棋布，灰烬堵塞的洞穴错落有致；当探险队经过时，这里的居民仿佛直接从岩石中升起一般。" #deepl:2193902739
 building_gate_dungeon_ketetahi: "$gate_dungeon_ketetahi$ $concept_gate_dungeon$" #deepl:1126126978

 # Canada
 gate_dungeon_nunataq: "努纳塔克" #deepl:3167975985
 gate_dungeon_nunataq_desc: "在遥远的北极高耸的冰盖上，黑色的岩峰有时会像埋藏在冰下的山峰顶端一样，从冰层中破冰而出。其中一座岩峰的底部隐藏着一个入口，那里冰层已从岩石上剥离，通往努纳塔克。 这座地牢是岩石与冰层之间的一座迷宫：冰封的深渊、被冰封锁的通道，以及那些透过湛蓝的冰壁仍能窥见冰下古老山体的洞室。鲜有地牢像这里一样远离救援，也鲜有探险队能在抵达此地时不因旅途而痛失同伴。" #deepl:1462753696
 building_gate_dungeon_nunataq: "$gate_dungeon_nunataq$ $concept_gate_dungeon$" #deepl:990057393
 gate_dungeon_red_deer_hollow: "红鹿谷" #deepl:2232841744
 gate_dungeon_red_deer_hollow_desc: "沿着红鹿河，草原突然过渡为恶地，这是一片崎岖不平的土地，遍布条纹状的山丘、石柱和干涸的沟壑，巨兽的骨骼从岩石中风化显露出来。 红鹿洞是一处位于一丛石柱脚下的洞穴，其洞口被化石骨骼环绕，宛如巨兽的肋骨。洞内是层层带状岩石构成的干燥洞窟、坍塌的通道以及堆满骨骼的洞室，探险者们报告说，里面的骨架并不总是静止不动。" #deepl:2419040958
 building_gate_dungeon_red_deer_hollow: "$gate_dungeon_red_deer_hollow$ $concept_gate_dungeon$" #deepl:2264227238

 # Pacific Coast
 gate_dungeon_tahoma_vent: "Tahoma Vent" #deepl:1426624704
 gate_dungeon_tahoma_vent_desc: "塔霍马山是喀斯喀特山脉中一座雄伟的白雪皑皑的山峰，耸立在茂密的冷杉和雪松森林之上，山顶覆盖着冰川。然而，在冰层之下，这座山却生机勃勃。塔霍马喷口位于山腰高处一条冒着热气的裂缝中，一条熔岩管从那里延伸至冰川下方的火山内部。 地底深处的迷宫并非冰封，而是烈火之境：玄武岩洞廊、熔岩河流与岩浆房，通道中蒸气缭绕，那是来自上方冰川的融水渗入所致。" #deepl:9148477
 building_gate_dungeon_tahoma_vent: "$gate_dungeon_tahoma_vent$ $concept_gate_dungeon$" #deepl:1698568113
 gate_dungeon_kaibab_vault: "凯巴布金库" #deepl:2191790283
 gate_dungeon_kaibab_vault_desc: "在凯巴布高原下方，科罗拉多河切割出一条深达一英里的峡谷，峡谷壁上呈现出红色、赭色和灰色的条带状纹理。在其中一条支流峡谷的中段，一道雕刻着陌生图案的门洞矗立在陡峭的岩壁上，两侧是直接从峡谷壁上凿出的石柱。 凯巴布地窖是一座由砂岩大厅、石棺和宝库组成的地下迷宫，其中既有被沙土填满的密封房间，也有布满陷阱的守卫走廊。其建筑风格与该地区任何民族的建筑都截然不同，这在很大程度上加剧了关于地下迷宫主题来源的争论。" #deepl:3893723199
 building_gate_dungeon_kaibab_vault: "$gate_dungeon_kaibab_vault$ $concept_gate_dungeon$" #deepl:1409315727

 # Great Plains
 gate_dungeon_paha_sapa: "帕哈·萨帕" #deepl:714600479
 gate_dungeon_paha_sapa_desc: "黑山从大平原上拔地而起，宛如一片幽暗的松林之岛，对拉科塔人而言是神圣之地，其地下遍布洞穴，风在地下进进出出。帕哈·萨帕洞穴位于花岗岩露头间的一处小裂缝中，洞内气息温暖，带着一股铁锈味。 洞内蜿蜒延伸，形成由水晶镶边的通道、箱状岩架以及闪烁着方解石光芒的洞室构成的迷宫，结构之复杂，以至于探险队用粉笔标记路线，却发现回程时标记已然消失。" #deepl:2728802150
 building_gate_dungeon_paha_sapa: "$gate_dungeon_paha_sapa$ $concept_gate_dungeon$" #deepl:4294375650
 gate_dungeon_ville_engloutie: "沉没之城" #deepl:2561322453
 gate_dungeon_ville_engloutie_desc: "在密西西比河以南的沼泽地带，柏树深陷在齐膝深的浊水中，枝头垂挂着西班牙苔藓。在其中一片沼泽的深处，一座石砌建筑的屋顶从水面探出，四周不见陆地，顶层的窗户刚好位于水面之上。 发现它的捕兽者们称之为“Ville Engloutie”，即“被吞噬的城镇”。透过窗户望去，是一座被淹没的城市：街道被洪水淹没，广场沉入水底，大厅里垂挂着青苔，这里栖息着巨大的鳄鱼，以及在黑水之下猎食的更可怕的生物。" #deepl:1577041779
 building_gate_dungeon_ville_engloutie: "$gate_dungeon_ville_engloutie$ $concept_gate_dungeon$" #deepl:2786524121

 # Atlantic Coast
 gate_dungeon_echo_deep: "《深渊回响》" #deepl:257355966
 gate_dungeon_echo_deep_desc: "在肯塔基州青翠的山丘之下，隐藏着已知世界上最长的洞穴群——这是一片由通道和地下河流构成的迷宫，至今尚未被完全测绘。“回声深渊”就位于流经洞穴群的河流附近，藏身于一处被梧桐树掩映的天坑之中。 地下的迷宫是一片广阔的洞穴系统，由地下河、覆盖着石膏结壳的通道以及穹顶大厅构成，在这里，每一个声音在理应消逝许久之后仍会回荡不息。有些回声中，甚至传来了从未被说出口的话语。" #deepl:2610133049
 building_gate_dungeon_echo_deep: "$gate_dungeon_echo_deep$ $concept_gate_dungeon$" #deepl:2200786166
 gate_dungeon_pahayokee: "帕哈约基" #deepl:3531991831
 gate_dungeon_pahayokee_desc: "佛罗里达州南部的埃弗格莱兹，是一条由硬木树丛、红树林岛屿和鳄鱼洞穿插其间的“草河”。帕哈约基（Pahayokee）——这个名字源自这片草水区的古称——是一片深藏在锯齿草丛中的树丛，树木生长得如此茂密，树冠交织成一道隧道。 这条隧道通向下方，通往一片由沼泽森林、错综复杂的红树林和蒸腾着热气的水潭构成的热带地牢，那里空气中充斥着昆虫，水深也绝非表面所见那般浅。" #deepl:3755633439
 building_gate_dungeon_pahayokee: "$gate_dungeon_pahayokee$ $concept_gate_dungeon$" #deepl:2945348969

 # Central America
 gate_dungeon_chen_ha: "陈哈" #deepl:524183836
 gate_dungeon_chen_ha_desc: "尤卡坦半岛平坦的石灰岩地表上没有河流；水流在地下奔涌，只有在塞诺特中才会显露出来——这些圆形天坑里盛着清澈湛蓝的水，藤蔓垂挂其间。 “Ch'en Ha”（水洞）是一处天然井，其石阶从水面以下延伸，让人无需涉水，便能一路走入丛林深处的沉没古城。 阶梯式神庙从被水淹没的广场中拔地而起，雕刻精美的石碑浸没在齐腰深的水中，而滋养着这处天然井的地下河流，正流经着自有人类记忆以来便无人踏足的街道。" #deepl:1648991414
 building_gate_dungeon_chen_ha: "$gate_dungeon_chen_ha$ $concept_gate_dungeon$" #deepl:2711618012
 gate_dungeon_uxwitz: "乌克斯维茨" #deepl:3043730104
 gate_dungeon_uxwitz_desc: "在佩滕的低地森林中，丛林掩藏着那些在欧洲人抵达前几个世纪就被废弃的城市的阶梯金字塔，它们的顶端如岛屿般耸立在树冠之上。乌克斯维茨（Uxwitz），即“三座山”，是由三座被藤蔓覆盖的金字塔组成的群落，其中最大的一座顶端有一座神庙门廊，但门廊并非通向内部，而是向下延伸。 下方是一座热带地牢，埋藏着广场、被丛林窒息的庭院和杂草丛生的宫殿，这里栖息着美洲豹、蛇类以及那些古老雕刻中出现的生物。" #deepl:4091535095
 building_gate_dungeon_uxwitz: "$gate_dungeon_uxwitz$ $concept_gate_dungeon$" #deepl:1353317249

 # Brazil
 gate_dungeon_igapo_escuro: "伊加波·埃斯库罗" #deepl:2731923193
 gate_dungeon_igapo_escuro_desc: "每年亚马逊河泛滥时，河水会向森林内蔓延数英里，淹没树干，将丛林变成一片昏暗的黑色水域迷宫。“伊加波·埃斯库罗”（Igapó Escuro，即“黑暗洪涝森林”）便是这样一片森林，即使在旱季，水也不曾退去。 独木舟可以从河上划入其中，但越过某个点后，森林便化作一座地牢：层层叠叠的淹没丛林、腐朽的木头和巨型睡莲，凯门鳄、森蚺以及那些在船底黑暗的水中猎食的生物在此出没。" #deepl:33343186
 building_gate_dungeon_igapo_escuro: "$gate_dungeon_igapo_escuro$ $concept_gate_dungeon$" #deepl:2904494393
 gate_dungeon_gruta_diamantina: "迪亚曼蒂纳岩洞" #deepl:1012437778
 gate_dungeon_gruta_diamantina_desc: "在巴伊亚州内陆的查帕达·迪亚曼蒂纳高原上，寻钻者们长期以来一直在悬崖下的河流和砾石中淘洗。高原上的洞穴中有一处名为“迪亚曼蒂纳洞穴”（Gruta Diamantina），其入口通向一处水池，池水清澈湛蓝，当阳光洒入其中时，仿佛会发出光芒。 穿过水潭，洞穴便化作一座由闪烁的洞室、镶满水晶的通道和地下河流构成的迷宫，而其宝藏中最负盛名的，莫过于那些宝石。" #deepl:1958878348
 building_gate_dungeon_gruta_diamantina: "$gate_dungeon_gruta_diamantina$ $concept_gate_dungeon$" #deepl:2008378812

 # Andes
 gate_dungeon_chamak_uta: "查马克·乌塔" #deepl:979974205
 gate_dungeon_chamak_uta_desc: "蒂蒂卡卡湖位于安第斯山脉的高处，那里空气稀薄，光线刺眼而明亮，当地人自古以来就流传着一个被湖水吞噬的城市的故事。 从岸边乘芦苇船可抵达“黑暗之屋”（Ch'amak Uta）：浅水区矗立着一圈雕刻精美的石块，石阶从石块间盘旋而下，通向湖底。 在水面之下，这道石阶通向一座被淹没的城市：那里有巨石砌成的建筑、被水淹没的庙宇和沉入水底的梯田，寒冷如湖水本身，栖息着各种生物，它们在街道间游弋，仿佛水就是空气一般。" #deepl:3986697350
 building_gate_dungeon_chamak_uta: "$gate_dungeon_chamak_uta$ $concept_gate_dungeon$" #deepl:1536922227
 gate_dungeon_nina_uchku: "妮娜·乌奇库" #deepl:3545270842
 gate_dungeon_nina_uchku_desc: "在阿雷基帕这座白石之城上方，耸立着三座雄伟的火山，其中最完美的一座呈对称的雪顶锥形。在它们脚下的高海拔沙漠中，夹杂着熔岩流和浮石原，有一道名为“妮娜·乌奇库”（Nina Uchku，意为“火洞”）的裂缝，正向寒冷的山间空气中吐出热气。 其下方是一座由炽热隧道和岩浆房构成的火山地牢，据说栖息于此的生物酷似古老山间传说中那些燃烧的幽灵。" #deepl:4040138457
 building_gate_dungeon_nina_uchku: "$gate_dungeon_nina_uchku$ $concept_gate_dungeon$" #deepl:948099002

 # La Plata
 gate_dungeon_glaciar_del_silencio: "寂静冰川" #deepl:1088691401
 gate_dungeon_glaciar_del_silencio_desc: "在巴塔哥尼亚的最南端，广袤的南部冰原将冰川倾泻入碧绿的湖泊，冰川前缘崩塌入水时，发出如同炮火般的轰鸣。然而，有一座冰川却从未崩解，也从未发出声响：那就是“寂静冰川”（Glaciar del Silencio）。 在冰川与湖泊交汇处，冰壁上开了一个隧道，通向一个由蓝冰、冰窟和冰裂缝构成的地下迷宫，其深度甚至超过了冰川本身的厚度。这是已知最深的冰窟之一，内部的寂静如此彻底，以至于探险队成员们宁可冒着风险用手势交流，也不愿开口说话。" #deepl:2344302738
 building_gate_dungeon_glaciar_del_silencio: "$gate_dungeon_glaciar_del_silencio$ $concept_gate_dungeon$" #deepl:3980058371
 gate_dungeon_tavarangue: "塔瓦朗格" #deepl:896395181
 gate_dungeon_tavarangue_desc: "在巴拉那河上游附近的森林里，一座古老传教站小镇的红色砂岩废墟矗立在树丛之中：教堂的墙壁、柱廊，以及这个早已被废弃的定居点里的石屋。 瓜拉尼人将此类废墟称为“塔瓦朗格”（tavarangue），意为“曾经的城镇”。在废墟教堂下方，一条通往地下墓室的台阶延伸至由石厅、回廊和拱顶房间组成的地牢，这些建筑更像是城堡而非传教站，里面驻守着身着盔甲的守卫，他们沉默地守护着更深处的区域。" #deepl:441691601
 building_gate_dungeon_tavarangue: "$gate_dungeon_tavarangue$ $concept_gate_dungeon$" #deepl:2706676765

 # Gran Colombia
 gate_dungeon_mawari_sima: "马瓦里岛" #deepl:3603358698
 gate_dungeon_mawari_sima_desc: "在瓜亚纳南部，一种被称为“特普伊”的平顶山从雨林中陡峭地拔地而起，山顶宛如与世隔绝的世界，生长着奇异的植物，且终年雨水不断。 在其中一座山顶上，一个巨大的圆形天坑直插山体，坑底覆盖着森林。佩蒙人说，山神“马瓦里”就居住在那里。“马瓦里·西马”便是深坑底部的地牢：一个由迷失的森林、瀑布以及其他地方绝无仅有的生物构成的热带迷宫。" #deepl:279977156
 building_gate_dungeon_mawari_sima: "$gate_dungeon_mawari_sima$ $concept_gate_dungeon$" #deepl:462756322
 gate_dungeon_guatavita: "瓜塔维塔" #deepl:1311597427
 gate_dungeon_guatavita_desc: "在波哥大上方的山地中，坐落着瓜塔维塔湖。这是一个位于翠绿火山口内的圆形湖泊，穆伊斯卡人曾在此为酋长加冕：先将他们全身涂满金粉，再送他们泛舟湖上进行祭祀。寻宝者曾不止一次试图将湖水抽干。 进入瓜塔维塔地牢的入口位于岸边一座雕刻精美的石台之上；其阶梯通向一座被淹没的城市，那里有金光闪闪的大厅、被水淹没的仪式广场以及沉入水底的庙宇，据说地牢里的箱子都装满了沉甸甸的金矿石。" #deepl:4020230537
 building_gate_dungeon_guatavita: "$gate_dungeon_guatavita$ $concept_gate_dungeon$" #deepl:1095309562

 # Near East
 gate_dungeon_malakopi: "马拉科皮" #deepl:2797063239
 gate_dungeon_malakopi_desc: "在安纳托利亚高原的凝灰岩山谷中，数千年来，人们一直在柔软的火山岩中开凿住宅、教堂乃至整座地下城镇。马拉科皮就是这样一座地下城镇，其滚动式石门和通风井与邻近的地下城镇大同小异，唯一不同的是，它的层数比任何人开凿过的都要多。 在最古老的地窖下方，真正的地下城才真正开始：大厅、小教堂、储藏室和岗哨都精准地凿刻在天然岩壁中，由似乎对每条隧道都了如指掌的驻军守卫着。" #deepl:1880647761
 building_gate_dungeon_malakopi: "$gate_dungeon_malakopi$ $concept_gate_dungeon$" #deepl:2855843058
 gate_dungeon_khaznat_al_layl: "《卡兹纳特·阿尔-莱尔》" #deepl:3035859481
 gate_dungeon_khaznat_al_layl_desc: "在瓦迪·阿拉巴以东的山脉中，纳巴泰人将陵墓和神庙凿刻在他们那座隐秘之城的玫瑰红峭壁上，唯有穿过一条狭窄蜿蜒的峡谷才能抵达那里。 “卡兹纳特·阿尔-莱尔”（Khaznat al-Layl，意为“夜之宝库”）是一处位于侧谷中的凿刻立面，在任何旅行者的记述中都未曾出现，其柱子和山花由深色石材凿成，仿佛要将太阳吞噬一般。 其后是一座由岩凿大厅、墓室和宝库构成的地下迷宫，在悬崖深处，沙粒在走廊中飘荡，身着古代盔甲的守卫在黑暗中静候。" #deepl:2813340196
 building_gate_dungeon_khaznat_al_layl: "$gate_dungeon_khaznat_al_layl$ $concept_gate_dungeon$" #deepl:111339467

 # Arabia
 gate_dungeon_ubar: "乌巴尔" #deepl:2065902691
 gate_dungeon_ubar_desc: "在多法尔的乳香之路沿线，传说中有一座耸立于沙海之中的高塔之城，因过于骄傲而被沙漠吞噬。 乌巴尔就是那座以其名字命名的地牢：位于“空旷之地”边缘的一处坍塌的洼地，四周环绕着倒塌塔楼的残垣，一条阶梯通向沙下。 地下埋藏着一座古城，其中有柱廊大厅、被沙子填满的街道以及皇家陵墓，即使在最深的沙层中也能听到风的呼啸，沙子在探险队脚下流动，宛如流水。" #deepl:2814921195
 building_gate_dungeon_ubar: "$gate_dungeon_ubar$ $concept_gate_dungeon$" #deepl:940335479
 gate_dungeon_bir_barhut: "比尔·巴尔胡特" #deepl:3019918405
 gate_dungeon_bir_barhut_desc: "在马赫拉沙漠中，地面上有一处巨大的圆形深坑，当地传说中一直将其称为“巴尔胡特之井”，并认为这是恶灵的囚笼。 几乎没有人曾下到过那里。这座名为“比尔·巴尔胡特”的地牢始于坑底，那里有一处洞穴通向由干涸洞穴、层层叠叠的石灰华以及弥漫着浓重硫磺气味的洞室组成的迷宫。 那里栖息着蛇类、虫群以及更诡异的生物，它们似乎会将探险队驱赶向更深处，而非放他们离开。" #deepl:1772188491
 building_gate_dungeon_bir_barhut: "$gate_dungeon_bir_barhut$ $concept_gate_dungeon$" #deepl:2037786510

 # Greater Persia
 gate_dungeon_takht_e_tariki: "塔赫特-塔里基" #deepl:983947611
 gate_dungeon_takht_e_tariki_desc: "在古波斯王都遗址附近，历代国王的陵墓高耸地凿刻在悬崖峭壁上，其立面形似宫殿正门。 “塔赫特-塔里基”（Takht-e Tariki），即“黑暗王座”，是一座位于悬崖较低处的陵墓立面，其入口与地面齐平，浮雕上刻着一位国王的形象，但其面部特征已被凿去。 内部是一座由柱厅、皇家陵寝和被沙尘覆盖的宝库组成的地牢，由石雕的翼兽守卫着，这些翼兽在无人注视时会悄然移动。" #deepl:443077534
 building_gate_dungeon_takht_e_tariki: "$gate_dungeon_takht_e_tariki$ $concept_gate_dungeon$" #deepl:2738862469
 gate_dungeon_zendan_e_damavand: "达马万德禅院" #deepl:4242474242
 gate_dungeon_zendan_e_damavand_desc: "达马万德山作为一座孤立的火山锥耸立在阿尔博兹山脉之上，是这片土地上的最高峰，山顶的硫磺喷口不断冒着热气。在《列王纪》中，英雄费雷敦将那条肩生巨蛇的暴君扎哈克锁在山下的洞穴里，据说他至今仍被囚禁于此。 达马万德监狱（Zendan-e Damavand）位于山腰一处蒸腾着热气的洞穴之中：这是一座充满火焰、铁链和硫磺的火山地牢，层层向下延伸，通向深处那令铁链叮当作响的未知之境。" #deepl:1906854928
 building_gate_dungeon_zendan_e_damavand: "$gate_dungeon_zendan_e_damavand$ $concept_gate_dungeon$" #deepl:1382969325

 # Central Asia
 gate_dungeon_muz_tor: "Muz-Tör" #deepl:1964349998
 gate_dungeon_muz_tor_desc: "在天山高处，冰川填满了山峰之间的山谷，吉尔吉斯牧民只有在夏季才会带着羊群来到冰川脚下。 “穆兹-托尔”（Muz-Tör，意为“冰殿”）位于一条冰川从悬崖倾泻而入高谷之处，其入口是一座高悬于夏牧场之上的冰拱门。进入其中，冰川化作一座由冰厅、冰桥和蓝色冰室构成的冰牢，这里的严寒与呼啸的狂风相映成趣——而这狂风本不该在地下吹拂。" #deepl:3171877613
 building_gate_dungeon_muz_tor: "$gate_dungeon_muz_tor$ $concept_gate_dungeon$" #deepl:3260048074
 gate_dungeon_kara_kala: "卡拉·卡拉" #deepl:3161947558
 gate_dungeon_kara_kala_desc: "在马尔维绿洲周围，数千年来一座接一座建起的城市遗迹散布在沙漠之中：倒塌的城墙、泥砖堡垒，以及孤零零矗立在沙中的陵墓。 卡拉卡拉（黑堡垒）便是其中一座泥砖废墟，其凹槽状的城墙比邻近建筑的更显黝黑。 庭院内，一条阶梯通向地下的牢狱，那里埋藏着被沙掩埋的厅堂、陵墓拱顶和被沙子堵塞的街道，早已逝去的国王们的珍宝，正由同样已逝的随从们守卫着。" #deepl:2116268795
 building_gate_dungeon_kara_kala: "$gate_dungeon_kara_kala$ $concept_gate_dungeon$" #deepl:2165035252

 # South India
 gate_dungeon_simhagiri: "西姆哈吉里" #deepl:3476010703
 gate_dungeon_simhagiri_desc: "在锡兰中部的森林里，一块巨岩从丛林中陡然耸立，岩顶上矗立着一座宫殿的废墟，这座宫殿由一位曾从天而降统治世界的国王所建。宫殿古老的大门曾雕成一只巨大的狮子，如今仅剩石制的狮爪。 穿过那两只石爪，便可进入西姆哈吉里——即“狮子岩”：这条通往岩心的通道，通向由皇家大厅、彩绘回廊、梯田式花园和卫兵室组成的地下宫殿，那里由石狮和身着盔甲的守卫把守。" #deepl:697420212
 building_gate_dungeon_simhagiri: "$gate_dungeon_simhagiri$ $concept_gate_dungeon$" #deepl:4061293534
 gate_dungeon_irul_kaavu: "伊鲁尔·卡武" #deepl:1444447066
 gate_dungeon_irul_kaavu_desc: "在特拉凡科尔各地，村庄里都保留着被称为“卡武”（kaavu）的神圣林地，这些古老的森林地块环绕着供奉蛇神和森林精灵的圣坛，至今未被人类触碰。伊鲁尔·卡武（Irul Kaavu），即“黑暗林地”，是位于西高止山脉高处的卡武，石制蛇神像矗立在树根之间，树冠密不透光，阳光无法穿透。 神庙后方是一片热带雨林构成的幽暗迷宫，其中遍布着苔藓覆盖的台地和飞瀑，各种大小的蛇类在此爬行；探险队报告称，森林随着每一层的深入，愈发茂密幽暗。" #deepl:433137994
 building_gate_dungeon_irul_kaavu: "$gate_dungeon_irul_kaavu$ $concept_gate_dungeon$" #deepl:1783136410

 # Himalayas
 gate_dungeon_nagpo_dzong: "纳格波宗" #deepl:730909342
 gate_dungeon_nagpo_dzong_desc: "在西藏西部干旱的峡谷中，一个已消逝王国的遗迹依附在风化严重的黏土悬崖上，堡垒城墙和寺庙就建在山脊之上。“纳格波宗”（黑堡）便是坐落于其中一条山脊顶端的废墟城堡，其城墙上布满了洞室。 穿过其中一处洞室，一条隧道通向山脊内部，向下延伸至由石厅、寺庙殿堂和瞭望塔组成的地牢——这些建筑在山体深处起伏蜿蜒，由身着漆甲的战士守卫，他们战斗时静默无声。" #deepl:1795647749
 building_gate_dungeon_nagpo_dzong: "$gate_dungeon_nagpo_dzong$ $concept_gate_dungeon$" #deepl:2071833542
 gate_dungeon_gangri_phug: "甘里·普格" #deepl:1766939087
 gate_dungeon_gangri_phug_desc: "在世界最高峰脚下的高海拔山谷中，冰川从积雪处缓缓向下延伸，直抵夏尔巴人的村庄和他们的寺院。甘格里·普格（Gangri Phug），即“雪山洞穴”，位于其中一座巨峰下方的冰川高处，是一道蓝色的深渊，登山者和牧民都避之不及。 这是已知最深的冰之地牢，向下穿行需穿越一层又一层的冰冻大厅、冰裂缝和冰瀑，那里刺骨的寒冷与稀薄的空气，其致命性丝毫不亚于栖息其中的任何生物。" #deepl:574718635
 building_gate_dungeon_gangri_phug: "$gate_dungeon_gangri_phug$ $concept_gate_dungeon$" #deepl:4110322777

 # North India
 gate_dungeon_andheri_baori: "安德里·巴奥里" #deepl:3212517751
 gate_dungeon_andheri_baori_desc: "在干旱的拉杰普特纳地区，村庄里挖了巨大的阶梯井，沿阶梯层层向下，直达沙漠深处隐藏的水源。“安德里·巴奥里”（Andheri Baori，即“黑暗阶梯井”）便是其中之一：这是一座巨大的方形井筒，内壁镶嵌着曲折蜿蜒的台阶，向下延伸至远超任何地下水位应有的深度。 井底的水并未汇成水池，而是通向一座被淹没的城市——那里有柱廊、沉没的回廊和被水淹没的宫殿，水底游移着影子，而台阶仍在不断向下延伸。" #deepl:1714488120
 building_gate_dungeon_andheri_baori: "$gate_dungeon_andheri_baori$ $concept_gate_dungeon$" #deepl:2569428448
 gate_dungeon_krem_ksuid: "克雷姆·克苏伊德" #deepl:4001011506
 gate_dungeon_krem_ksuid_desc: "在卡西山地——地球上最潮湿的地方之一——河流从高原倾泻而下，流入被雨林密布的峡谷；村民们则引导橡胶树的根系横跨溪流，培育出“活桥”。 要到达“灵洞”（Krem Ksuid），必须穿越这样一座树根桥——它横跨峡谷，通向一个被蕨类植物和飞瀑遮蔽的洞口。进入洞内，眼前很快便是一片热带密林构成的幽暗迷宫：潮湿的丛林、根系交错的洞室以及汹涌的溪流，活根会自行移动，在探险队身后封堵去路。" #deepl:3388093854
 building_gate_dungeon_krem_ksuid: "$gate_dungeon_krem_ksuid$ $concept_gate_dungeon$" #deepl:379488277
